c/span\u003e药物避免在胃、十二指肠、空肠和回肠前端释放，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e运送到\u003c/span\u003e人体回盲部后释放而发挥局部或全身治疗作用的一种给药系统，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e是一种\u003c/span\u003e定位在结肠释药的制剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e​\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e因此可根据\u003c/span\u003e结肠部位的生理结构特点\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e设计\u003c/span\u003e各种制剂类型：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 时间控制型OCDDS：药物经口服后到达结肠的时间\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e约为\u003c/span\u003e6小时，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e用\u003c/span\u003e适当方法制备具有一定时滞的时间控制型制剂，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003c/span\u003e药物在胃、小肠不释放，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e而\u003c/span\u003e到达结肠开始释放达到结肠定位给药的目的。大多数此类OCDDS\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e由\u003c/span\u003e药物贮库和外面包衣层\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e组成\u003c/span\u003e，此包衣层\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e可\u003c/span\u003e在一定时间后溶解、溶蚀或破裂，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003c/span\u003e药物从贮库内芯中迅速释放发挥疗效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② pH依赖型OCDDS：结肠的pH\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e约\u003c/span\u003e7.0\\~7.5，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e比\u003c/span\u003e胃和小肠的pH略高，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e所以采用\u003c/span\u003e在结肠pH环境下溶解的pH依赖性高分子聚合物，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e如\u003c/span\u003e丙烯酸树脂等，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003c/span\u003e药物在结肠部位释放发挥疗效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 时控和pH依赖结合型OCDDS：药物在胃中排空时间在不同情况下有很大差异，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e另外\u003c/span\u003e胃肠的pH\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e除\u003c/span\u003e在胃中pH较低\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e外\u003c/span\u003e，在小肠和结肠的pH差异较小，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e由于\u003c/span\u003e结肠细菌的作用\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e以及\u003c/span\u003e在病理情况下\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e可能出现\u003c/span\u003e结肠pH比小肠低的情况，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e所以\u003c/span\u003e单纯采用时控型和pH依赖型都很难达到OCDDS设计的目的。为此，综合时控型和pH依赖型设计可以实现较好的结肠定位释药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 压力控制型OCDDS：\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e由于\u003c/span\u003e在结肠内大量的水分和电解质被肠壁吸收，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e导致\u003c/span\u003e肠内容物的黏度增大，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e当\u003c/span\u003e肠道蠕动时对物体产生较大的直接压力，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003c/span\u003e物体破裂。\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e依此原理\u003c/span\u003e设计压力控制型胶囊。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 酶解或细菌降解型OCDDS：结肠内存有大量的细菌及独特的酶系，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e如\u003c/span\u003e偶氮降解酶、糖苷酶等，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e由\u003c/span\u003e酶降解性材料制成的制剂到达结肠后\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e被\u003c/span\u003e降解而释放药物，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e达到\u003c/span\u003e定位给药的目的。\u003c/div\u003e","pt":"口服结肠定位给药系统 是指 用适当方法， 使 药物避免在胃、十二指肠、空肠和回肠前端释放， 运送到 人体回盲部后释放而发挥局部或全身治疗作用的一种给药系统， 是一种 定位在结肠释药的制剂。 ​ 因此可根据 结肠部位的生理结构特点 设计 各种制剂类型： ① 时间控制型OCDDS：药物经口服后到达结肠的时间 约为 6小时， 用 适当方法制备具有一定时滞的时间控制型制剂， 使 药物在胃、小肠不释放， 而 到达结肠开始释放达到结肠定位给药的目的。大多数此类OCDDS 由 药物贮库和外面包衣层 组成 ，此包衣层 可 在一定时间后溶解、溶蚀或破裂， 使 药物从贮库内芯中迅速释放发挥疗效。 ② pH依赖型OCDDS：结肠的pH 约 7.0\\~7.5， 比 胃和小肠的pH略高， 所以采用 在结肠pH环境下溶解的pH依赖性高分子聚合物， 如 丙烯酸树脂等， 使 药物在结肠部位释放发挥疗效。 ③ 时控和pH依赖结合型OCDDS：药物在胃中排空时间在不同情况下有很大差异， 另外 胃肠的pH 除 在胃中pH较低 外 ，在小肠和结肠的pH差异较小， 由于 结肠细菌的作用 以及 在病理情况下 可能出现 结肠pH比小肠低的情况， 所以 单纯采用时控型和pH依赖型都很难达到OCDDS设计的目的。为此，综合时控型和pH依赖型设计可以实现较好的结肠定位释药。 ④ 压力控制型OCDDS： 由于 在结肠内大量的水分和电解质被肠壁吸收， 导致 肠内容物的黏度增大， 当 肠道蠕动时对物体产生较大的直接压力， 使 物体破裂。 依此原理 设计压力控制型胶囊。 ⑤ 酶解或细菌降解型OCDDS：结肠内存有大量的细菌及独特的酶系， 如 偶氮降解酶、糖苷酶等， 由 酶降解性材料制成的制剂到达结肠后 被 降解而释放药物， 达到 定位给药的目的。","ok":true,"an":["回肠前端释放","定位释药","组成","口服","适当方法","依赖性"]},{"id":"e8dc06b8f5","no":15,"q":"将药物制成微囊有何作用目的？","a":"\u003cdiv class=\"q-ln\"\u003e① 靶向性：通过被动分布、主动靶向性结合或磁性吸引，提高药物在体内局部有效浓度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 缓释与长效性：可减少给药次数，降低血药浓度峰谷波动等，生物降解微球具有长效性能。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 栓塞性：微粒直接经动脉导入，可阻塞肿瘤血管，阻断肿瘤给养，同时载药微粒释放的药物可抑杀癌细胞，起双重抗肿瘤作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 掩盖药物的不良气味、降低局部刺激性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 提高药物的稳定性：如包裹易氧化的胡萝卜素、挥发油类药物，可提高药物的稳定性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 液态药物固态化：将油类、脂溶性维生素包裹成微粒使之固态化。\u003c/div\u003e","pt":"① 靶向性：通过被动分布、主动靶向性结合或磁性吸引，提高药物在体内局部有效浓度。 ② 缓释与长效性：可减少给药次数，降低血药浓度峰谷波动等，生物降解微球具有长效性能。 ③ 栓塞性：微粒直接经动脉导入，可阻塞肿瘤血管，阻断肿瘤给养，同时载药微粒释放的药物可抑杀癌细胞，起双重抗肿瘤作用。 ④ 掩盖药物的不良气味、降低局部刺激性。 ⑤ 提高药物的稳定性：如包裹易氧化的胡萝卜素、挥发油类药物，可提高药物的稳定性。 ⑥ 液态药物固态化：将油类、脂溶性维生素包裹成微粒使之固态化。","ok":true,"an":["液态药物固态化","栓塞性","分布","癌细胞","维生素","抗肿瘤"]},{"id":"fbb95c6ea9","no":16,"q":"聚合物胶束形成的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e两亲性嵌段共聚物为材料制得聚合物胶束的机制与表面活性剂形成胶束相似。在水相中加入两亲性的聚合物后，聚合物分子分布在水的表面，疏水嵌段向外、亲水性向内。当两亲性的聚合物分子在水表面的浓度达到饱和后，如果继续向水相中添加聚合物分子，其分子就会转入溶液内部，其疏水嵌段聚集，形成亲水嵌段向外、疏水嵌段向内的聚合物分子缔合体，即聚合物胶束。\u003c/div\u003e","pt":"两亲性嵌段共聚物为材料制得聚合物胶束的机制与表面活性剂形成胶束相似。在水相中加入两亲性的聚合物后，聚合物分子分布在水的表面，疏水嵌段向外、亲水性向内。当两亲性的聚合物分子在水表面的浓度达到饱和后，如果继续向水相中添加聚合物分子，其分子就会转入溶液内部，其疏水嵌段聚集，形成亲水嵌段向外、疏水嵌段向内的聚合物分子缔合体，即聚合物胶束。","ok":true,"an":["表面活性剂","分布","亲水性"]},{"id":"748c141cb4","no":17,"q":"以明胶为囊材，说明单凝聚法制备微囊的工艺过程。","a":"\u003cdiv class=\"q-ln\"\u003e① 将固体粉末或液体药物分散在已配好的3%\\~5%的明胶溶液中(50℃)，搅拌均匀，如果药物是固体粉末，将形成混悬剂，如果是油性药物，将形成乳剂，这时明胶起乳化作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 将混悬液或乳状液用10%的醋酸调节pH至3.5\\~3.8，加入60%硫酸钠溶液，使明胶凝聚成囊，此时明胶为囊材。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 另加入硫酸钠稀释液，在15℃条件下将上述体系稀释至其体积的3倍。这里应当注意，稀释液硫酸钠的浓度要高于凝聚成囊体系中的硫酸钠浓度的1.5%。如成囊时系统中所用的硫酸钠为a%，则作为稀释液的硫酸钠浓度应当为(a+1.5)%，以防止稀释液中盐的浓度过高或过低导致成囊粘连成团或溶解。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 加入37%甲醛水溶液作为交联剂固化微囊。交联剂反应的最佳pH为8\\~9。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 水洗、过滤、干燥后，可得明胶微囊。\u003c/div\u003e","pt":"① 将固体粉末或液体药物分散在已配好的3%\\~5%的明胶溶液中(50℃)，搅拌均匀，如果药物是固体粉末，将形成混悬剂，如果是油性药物，将形成乳剂，这时明胶起乳化作用。 ② 将混悬液或乳状液用10%的醋酸调节pH至3.5\\~3.8，加入60%硫酸钠溶液，使明胶凝聚成囊，此时明胶为囊材。 ③ 另加入硫酸钠稀释液，在15℃条件下将上述体系稀释至其体积的3倍。这里应当注意，稀释液硫酸钠的浓度要高于凝聚成囊体系中的硫酸钠浓度的1.5%。如成囊时系统中所用的硫酸钠为a%，则作为稀释液的硫酸钠浓度应当为(a+1.5)%，以防止稀释液中盐的浓度过高或过低导致成囊粘连成团或溶解。 ④ 加入37%甲醛水溶液作为交联剂固化微囊。交联剂反应的最佳pH为8\\~9。 ⑤ 水洗、过滤、干燥后，可得明胶微囊。","ok":true,"an":["硫酸钠","混悬剂","明胶溶液","甲醛","乳剂","乳状液"]},{"id":"0d281c0ecc","no":18,"q":"复凝聚法制备微囊的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 原理: 复凝聚法制备微囊的原理是利用两种具有相反电荷的高分子材料作囊材，将药物分散在囊材的水溶液中，在一定条件下，相反电荷的高分子材料互相凝聚形成复合物，溶解度降低，自溶液中析出成囊。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 机制: 以明胶-阿拉伯胶为例，其成囊机制是: 明胶是一种蛋白质，其结构中的氨基酸在水溶液中可以解离成—NH\u003csub\u003e3\u003c/sub\u003e\u003csup\u003e+\u003c/sup\u003e和—COO\u003csup\u003e-\u003c/sup\u003e。介质pH值低时，—NH\u003csub\u003e3\u003c/sub\u003e\u003csup\u003e+\u003c/sup\u003e数目多于—COO\u003csup\u003e-\u003c/sup\u003e；相反，pH值高时，—COO\u003csup\u003e-\u003c/sup\u003e的数目多于—NH\u003csub\u003e3\u003c/sub\u003e\u003csup\u003e+\u003c/sup\u003e；两种电荷相等时的pH即为等电点。pH在等电点以上明胶分子带负电荷，等电点以下带正电荷；而水溶液中阿拉伯胶分子仅解离成—COO\u003csup\u003e-\u003c/sup\u003e。将明胶溶液和阿拉伯胶溶液混合后，调节pH至4\\~4.5，明胶正电荷达到最高量，与带负电荷的阿拉伯胶结合成不溶性复合物，凝聚形成微囊，且生成量最大。\u003c/div\u003e","pt":"① 原理: 复凝聚法制备微囊的原理是利用两种具有相反电荷的高分子材料作囊材，将药物分散在囊材的水溶液中，在一定条件下，相反电荷的高分子材料互相凝聚形成复合物，溶解度降低，自溶液中析出成囊。 ② 机制: 以明胶-阿拉伯胶为例，其成囊机制是: 明胶是一种蛋白质，其结构中的氨基酸在水溶液中可以解离成—NH 3 + 和—COO - 。介质pH值低时，—NH 3 + 数目多于—COO - ；相反，pH值高时，—COO - 的数目多于—NH 3 + ；两种电荷相等时的pH即为等电点。pH在等电点以上明胶分子带负电荷，等电点以下带正电荷；而水溶液中阿拉伯胶分子仅解离成—COO - 。将明胶溶液和阿拉伯胶溶液混合后，调节pH至4\\~4.5，明胶正电荷达到最高量，与带负电荷的阿拉伯胶结合成不溶性复合物，凝聚形成微囊，且生成量最大。","ok":true,"an":["带负电荷","阿拉伯胶","明胶溶液","氨基酸","蛋白质","水溶液"]},{"id":"5afca9c5e0","no":19,"q":"微囊有哪几大类制备方法？每一类又包括哪些方法？","a":"\u003cdiv class=\"q-ln\"\u003e微囊的制备方法可归纳为物理化学法、物理机械法和化学法三大类。可根据药物、载体材料和微囊的粒径、释放和靶向要求，选择不同的制备方法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e物理化学法包括：单凝聚法、复凝聚法、溶剂-非溶剂法、改变温度法和液中干燥法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e物理机械法包括：喷雾干燥法、喷雾冷凝法、空气悬浮法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e化学法包括：界面缩聚法、化学辐射法。\u003c/div\u003e","pt":"微囊的制备方法可归纳为物理化学法、物理机械法和化学法三大类。可根据药物、载体材料和微囊的粒径、释放和靶向要求，选择不同的制备方法。 物理化学法包括：单凝聚法、复凝聚法、溶剂-非溶剂法、改变温度法和液中干燥法。 物理机械法包括：喷雾干燥法、喷雾冷凝法、空气悬浮法。 化学法包括：界面缩聚法、化学辐射法。","ok":true,"an":["喷雾干燥","载体材料","复凝聚法","凝聚法"]},{"id":"5b174ab394","no":20,"q":"微球制备方法、微球的目的，微球的质量评价试验。","a":"\u003cdiv class=\"q-ln\"\u003e制备方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 乳化分散法: 加热固化法、交联剂固化法、溶剂蒸发法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 凝聚法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 聚合法: 乳化/增溶聚合法、盐析固化法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e微球的目的: （见T15，微粒的共同特点）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e微球的质量评价试验:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 形态、粒径及其分布的检查: 外观和形态可采用光学显微镜观察，粒径小于2μm的可采用扫描电镜等观察，均应提供照片。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 载药百分量与包封率的检查:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e载药百分量是指微囊或微球中所包载药物的重量百分数。一般采用溶剂提取法测定载药百分量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e包封率是指被实际包载于微囊或微球中的药物重量于制备时投入药物重量的比值百分数。微粒制剂的包封率一般不得低于80%。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 释药速度的检查: 为掌握微囊、微球中药物的释放规律、释放时间，必须进行释药速率的测定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 有机溶剂的限度检查: 在生产过程中引入有害溶剂时，残留有害溶剂应符合《中国药典》规定的限度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 突释效应或渗漏率的检查: 药物在微粒制剂中一般有三种情况，即吸附、包入或嵌入，在体外释放试验时，表面吸附的药物会快速释放，称为突释效应 (burst effect)。开始0.5小时内的释放量要求低于40%。\u003c/div\u003e","pt":"制备方法: ① 乳化分散法: 加热固化法、交联剂固化法、溶剂蒸发法 ② 凝聚法 ③ 聚合法: 乳化/增溶聚合法、盐析固化法 微球的目的: （见T15，微粒的共同特点） 微球的质量评价试验: ① 形态、粒径及其分布的检查: 外观和形态可采用光学显微镜观察，粒径小于2μm的可采用扫描电镜等观察，均应提供照片。 ② 载药百分量与包封率的检查: 载药百分量是指微囊或微球中所包载药物的重量百分数。一般采用溶剂提取法测定载药百分量。 包封率是指被实际包载于微囊或微球中的药物重量于制备时投入药物重量的比值百分数。微粒制剂的包封率一般不得低于80%。 ③ 释药速度的检查: 为掌握微囊、微球中药物的释放规律、释放时间，必须进行释药速率的测定。 ④ 有机溶剂的限度检查: 在生产过程中引入有害溶剂时，残留有害溶剂应符合《中国药典》规定的限度。 ⑤ 突释效应或渗漏率的检查: 药物在微粒制剂中一般有三种情况，即吸附、包入或嵌入，在体外释放试验时，表面吸附的药物会快速释放，称为突释效应 (burst effect)。开始0.5小时内的释放量要求低于40%。","ok":true,"an":["effect","生产过程","乳化分散法","分布","聚合法","限度检查"]}],"count":20,"done":20},{"label":"第十五章","questions":[{"id":"623d00bcf4","no":1,"q":"靶向给药系统 (targeted drug delivery system)","a":"\u003cdiv class=\"q-ln\"\u003e是指载体将药物通过局部给药或全身血液循环而选择性地浓集定位于靶组织、靶器官、靶细胞或细胞内结构的给药系统。\u003c/div\u003e","pt":"是指载体将药物通过局部给药或全身血液循环而选择性地浓集定位于靶组织、靶器官、靶细胞或细胞内结构的给药系统。","ok":true,"an":["靶细胞","选择性","靶组织"]},{"id":"71e273dcb1","no":2,"q":"纳米粒 (nanoparticles)","a":"\u003cdiv class=\"q-ln\"\u003e是指药物与载体辅料经纳米化技术分散形成的粒径\u003c500nm的固体粒子。药物纳米粒主要包括药物纳米晶和载药纳米粒两类。\u003c/div\u003e","pt":"是指药物与载体辅料经纳米化技术分散形成的粒径","ok":true,"an":[]},{"id":"3c15e8cc4f","no":3,"q":"药物纳米晶 (drug nanocrystals)","a":"\u003cdiv class=\"q-ln\"\u003e（纳米粒的定义），是仅由药物分子组成的纳米粒。\u003c/div\u003e","pt":"（纳米粒的定义），是仅由药物分子组成的纳米粒。","ok":true,"an":["组成","纳米粒"]},{"id":"23f8dd4ce1","no":4,"q":"载药纳米粒 (drug carrier nanoparticles)","a":"\u003cdiv class=\"q-ln\"\u003e（纳米粒的定义），是将药物以溶解、分散、吸附或包裹于适宜的载体或高分子材料中形成的纳米粒。\u003c/div\u003e","pt":"（纳米粒的定义），是将药物以溶解、分散、吸附或包裹于适宜的载体或高分子材料中形成的纳米粒。","ok":true,"an":[]},{"id":"b8512e92ff","no":5,"q":"脂质体 (liposomes)","a":"\u003cdiv class=\"q-ln\"\u003e是指药物被类脂双分子层包封成的微小囊泡。一般而言，水溶性药物常包含在水性隔室中，亲脂性药物则包含在脂质体的脂质双分子层中。脂质体有单室与多室之分。\u003c/div\u003e","pt":"是指药物被类脂双分子层包封成的微小囊泡。一般而言，水溶性药物常包含在水性隔室中，亲脂性药物则包含在脂质体的脂质双分子层中。脂质体有单室与多室之分。","ok":true,"an":["水溶性"]},{"id":"37c64009b7","no":6,"q":"何谓脂质体？脂质体具有哪些特点？","a":"\u003cdiv class=\"q-ln\"\u003e脂质体: 同上。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e特点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 细胞亲和性和靶向性: 与组织相容，可和细胞发生吸附、脂质交换、内吞、融合等。载药脂质体可选择性地浓集于单核吞噬细胞系统。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 缓释性: 药物被脂质体包裹后可减少肾排泄和代谢而延长药物在血液中的滞留时间，并缓慢释放而延长药物的作用时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 降低药物毒性: 药物被脂质体包裹后在心、肾中积累量明显降低从而降低毒性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 提高药物稳定性: 脂质体双层膜起保护作用，提高药物稳定性。\u003c/div\u003e","pt":"脂质体: 同上。 特点: ① 细胞亲和性和靶向性: 与组织相容，可和细胞发生吸附、脂质交换、内吞、融合等。载药脂质体可选择性地浓集于单核吞噬细胞系统。 ② 缓释性: 药物被脂质体包裹后可减少肾排泄和代谢而延长药物在血液中的滞留时间，并缓慢释放而延长药物的作用时间。 ③ 降低药物毒性: 药物被脂质体包裹后在心、肾中积累量明显降低从而降低毒性。 ④ 提高药物稳定性: 脂质体双层膜起保护作用，提高药物稳定性。","ok":true,"an":["提高药物稳定性","降低药物毒性","缓释性","排泄","代谢","靶向性"]},{"id":"c408e9c86c","no":7,"q":"脂质体有哪些制备方法？","a":"\u003cdiv class=\"q-ln\"\u003e包括: 薄膜分散法、过膜挤压法、逆相蒸发法、化学梯度法、注入法、冷冻干燥法、钙融合法等。\u003c/div\u003e","pt":"包括: 薄膜分散法、过膜挤压法、逆相蒸发法、化学梯度法、注入法、冷冻干燥法、钙融合法等。","ok":true,"an":["逆相蒸发法","梯度法"]},{"id":"e451862e3c","no":8,"q":"脂质体、类脂囊泡与聚合物囊泡三者组成上的主要区别是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 脂质体一定含有磷脂、类脂囊泡、聚合物囊泡都不一定含磷脂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 类脂囊泡由非离子型表面活性剂组成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 聚合物囊泡由合成的两亲嵌段共聚物组成。\u003c/div\u003e","pt":"① 脂质体一定含有磷脂、类脂囊泡、聚合物囊泡都不一定含磷脂。 ② 类脂囊泡由非离子型表面活性剂组成。 ③ 聚合物囊泡由合成的两亲嵌段共聚物组成。","ok":true,"an":["表面活性剂"]},{"id":"dd0b61759e","no":9,"q":"pH梯度法制备高包封率载药脂质体的原理和方法？","a":"\u003cdiv class=\"q-ln\"\u003e以pH梯度法包封阿霉素为例，操作过程如下:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 空白脂质体的制备：以pH为4的300mmol/L枸橼酸水溶液为介质，采用逆相蒸发法或薄膜法制备空白脂质体（脂质体囊泡内部pH为4）。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 用1mol/L的氢氧化钠溶液或碳酸钠溶液调节上述空白脂质体混悬液的pH至7.8，使脂质体膜内外形成质子的梯度，即得到脂质体膜的内部为酸性（pH4.0），外部为碱性（pH7.8）的脂质体。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 将阿霉素用pH7.8的Hepes缓冲液溶解，60℃孵育。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 在60℃孵育条件下，将脂质体混悬液与阿霉素溶液混合并轻摇，孵育10~15分钟即可。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e其获得高包封率的机理如下：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e在脂质体膜内部的pH为4，脂质体膜外部的pH为7.8的条件下，弱碱性药物阿霉素在脂质体膜外呈分子型，可穿透脂质体膜，进入脂质体膜后即在酸性条件下质子化，而质子化的阿霉素不易穿透膜，因而阿霉素被包封于脂质体内。pH梯度法制备的阿霉素脂质体的包封率可达90%以上。\u003c/div\u003e","pt":"以pH梯度法包封阿霉素为例，操作过程如下: ① 空白脂质体的制备：以pH为4的300mmol/L枸橼酸水溶液为介质，采用逆相蒸发法或薄膜法制备空白脂质体（脂质体囊泡内部pH为4）。 ② 用1mol/L的氢氧化钠溶液或碳酸钠溶液调节上述空白脂质体混悬液的pH至7.8，使脂质体膜内外形成质子的梯度，即得到脂质体膜的内部为酸性（pH4.0），外部为碱性（pH7.8）的脂质体。 ③ 将阿霉素用pH7.8的Hepes缓冲液溶解，60℃孵育。 ④ 在60℃孵育条件下，将脂质体混悬液与阿霉素溶液混合并轻摇，孵育10~15分钟即可。 其获得高包封率的机理如下： 在脂质体膜内部的pH为4，脂质体膜外部的pH为7.8的条件下，弱碱性药物阿霉素在脂质体膜外呈分子型，可穿透脂质体膜，进入脂质体膜后即在酸性条件下质子化，而质子化的阿霉素不易穿透膜，因而阿霉素被包封于脂质体内。pH梯度法制备的阿霉素脂质体的包封率可达90%以上。","ok":true,"an":["氢氧化钠溶液","逆相蒸发法","碳酸钠","弱碱性","操作过程","Hepes"]}],"count":9,"done":9},{"label":"第十九章","questions":[{"id":"5ca9e20cea","no":1,"q":"阐述外界因素对制剂中药物稳定性的影响及提高药物稳定性的方法。","a":"\u003cdiv class=\"q-ln\"\u003e① 温度的影响: 增加温度通常能显著增加药物的降解速率。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e提高稳定性的方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1\\. 降低灭菌温度，缩短灭菌时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2\\. 采取特殊工艺，如冷冻干燥，无菌操作。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3\\. 产品低温贮存。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 光线的影响: 有些药物分子受辐射（光线）作用使分子活化而产生分解，此种反应称为光化降解。光线还可以引起药物发生光氧化反应和还原反应，产生多种降解产物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e提高稳定性的方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1\\. 避光操作。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2\\. 采用棕色玻璃瓶包装或容器内衬垫黑纸，避光储存。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3\\. 固体制剂可采用含遮光剂的衣料进行包衣。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 空气（氧）的影响: 大气中的氧是引起药物制剂氧化的主要因素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e提高稳定性的方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1\\. 通入惰性气体如氮气置换里面的空气。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2\\. 采用真空包装。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3\\. 加入抗氧剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 金属离子的影响: 微量金属离子对自动氧化反应具有显著的催化作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e提高稳定性的方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1\\. 使用纯度较高的原辅料。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2\\. 操作过程中不使用金属器具。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3\\. 加入金属离子螯合剂，如EDTA-2Na\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 湿度和水分的影响: 水是化学反应的媒介，对于一些化学稳定性较差的固体药物，吸附了水分后，在表面形成一层液膜，使药物产生降解反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e提高稳定性的方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1\\. 降低湿度\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2\\. 选择正确包装\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3\\. 用有机溶剂代替水为溶剂\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 包装材料的影响: 药物或辅料可能与药包材发生相互作用影响稳定性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e提高稳定性的方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1\\. 进行药品与包装材料的相容性研究，以证实包装材料与制剂具有良好的相容性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2\\. 选用适当的包装材料。\u003c/div\u003e","pt":"① 温度的影响: 增加温度通常能显著增加药物的降解速率。 提高稳定性的方法: 1\\. 降低灭菌温度，缩短灭菌时间。 2\\. 采取特殊工艺，如冷冻干燥，无菌操作。 3\\. 产品低温贮存。 ② 光线的影响: 有些药物分子受辐射（光线）作用使分子活化而产生分解，此种反应称为光化降解。光线还可以引起药物发生光氧化反应和还原反应，产生多种降解产物。 提高稳定性的方法: 1\\. 避光操作。 2\\. 采用棕色玻璃瓶包装或容器内衬垫黑纸，避光储存。 3\\. 固体制剂可采用含遮光剂的衣料进行包衣。 ③ 空气（氧）的影响: 大气中的氧是引起药物制剂氧化的主要因素。 提高稳定性的方法: 1\\. 通入惰性气体如氮气置换里面的空气。 2\\. 采用真空包装。 3\\. 加入抗氧剂。 ④ 金属离子的影响: 微量金属离子对自动氧化反应具有显著的催化作用。 提高稳定性的方法: 1\\. 使用纯度较高的原辅料。 2\\. 操作过程中不使用金属器具。 3\\. 加入金属离子螯合剂，如EDTA-2Na ⑤ 湿度和水分的影响: 水是化学反应的媒介，对于一些化学稳定性较差的固体药物，吸附了水分后，在表面形成一层液膜，使药物产生降解反应。 提高稳定性的方法: 1\\. 降低湿度 2\\. 选择正确包装 3\\. 用有机溶剂代替水为溶剂 ⑥ 包装材料的影响: 药物或辅料可能与药包材发生相互作用影响稳定性。 提高稳定性的方法: 1\\. 进行药品与包装材料的相容性研究，以证实包装材料与制剂具有良好的相容性。 2\\. 选用适当的包装材料。","ok":true,"an":["金属离子螯合剂","通入惰性气体","原辅料","化学稳定性","金属离子","固体制剂"]}],"count":1,"done":1}],"count":137,"done":115},{"subject":"药物化学","chapters":[{"label":"第一章","questions":[{"id":"9b1aab353b","no":1,"q":"药物 (drug)","a":"","pt":"（见药分）","ok":false,"an":[]},{"id":"2f514787b2","no":2,"q":"药物化学 (medicinal chemistry)","a":"\u003cdiv class=\"q-ln\"\u003e涉及药物的发现、设计、开发以及药理学与分析表征，是建立在化学学科的基础上，涉及生理学、医学、药学、计算科学等各个学科的内容，是连接化学与生命科学并使其融为一体的交叉学科，是药学领域中重要的带头学科。\u003c/div\u003e","pt":"涉及药物的发现、设计、开发以及药理学与分析表征，是建立在化学学科的基础上，涉及生理学、医学、药学、计算科学等各个学科的内容，是连接化学与生命科学并使其融为一体的交叉学科，是药学领域中重要的带头学科。","ok":true,"an":["生命科学","药理学"]},{"id":"0a7e0fd84c","no":3,"q":"药物作用靶点的类型。","a":"\u003cdiv class=\"q-ln\"\u003e① 以受体为作用靶点: 如M受体激动剂: 毛果芸香碱\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 以离子通道为作用靶点: 如钙通道阻滞剂: 硝苯地平\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 以酶为作用靶点: 如胆碱受体抑制剂: 新斯的明\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 以核酸为作用靶点: 如氮芥类药物: 环磷酰胺\u003c/div\u003e","pt":"① 以受体为作用靶点: 如M受体激动剂: 毛果芸香碱 ② 以离子通道为作用靶点: 如钙通道阻滞剂: 硝苯地平 ③ 以酶为作用靶点: 如胆碱受体抑制剂: 新斯的明 ④ 以核酸为作用靶点: 如氮芥类药物: 环磷酰胺","ok":true,"an":["受体激动剂","环磷酰胺","离子通道","胆碱受体","核酸"]}],"count":3,"done":2},{"label":"第二章","questions":[{"id":"77d34f4bc0","no":1,"q":"脂水分配系数 (lipid-water partition coefficient)","a":"\u003cdiv class=\"q-ln\"\u003e是指化合物在有机相和水相中分配达到平衡时的浓度之比值，即 P=C\u003csub\u003eo\u003c/sub\u003e/C\u003csub\u003ew\u003c/sub\u003e, 常用 lgP 表示，lgP=lg(C\u003csub\u003eo\u003c/sub\u003e/C\u003csub\u003ew\u003c/sub\u003e)。\u003c/div\u003e","pt":"是指化合物在有机相和水相中分配达到平衡时的浓度之比值，即 P=C o /C w , 常用 lgP 表示，lgP=lg(C o /C w )。","ok":true,"an":["达到平衡"]},{"id":"0b38b9cf3d","no":2,"q":"结构特异性药物","a":"\u003cdiv class=\"q-ln\"\u003e大多数药物通过与酶或受体的相互作用而发挥药理作用，药物结构上细微的改变将会影响药效，这种药物称为“结构特异性药物”。结构特异性药物即使在很低的浓度时也能产生生物效应，其原因之一是该类药物能利用某些效能扩增机制，例如它们能激活受体，产生第二信使，从而发挥作用。\u003c/div\u003e","pt":"大多数药物通过与酶或受体的相互作用而发挥药理作用，药物结构上细微的改变将会影响药效，这种药物称为“结构特异性药物”。结构特异性药物即使在很低的浓度时也能产生生物效应，其原因之一是该类药物能利用某些效能扩增机制，例如它们能激活受体，产生第二信使，从而发挥作用。","ok":true,"an":["生物效应"]},{"id":"787747c20c","no":3,"q":"结构非特异性药物","a":"\u003cdiv class=\"q-ln\"\u003e结构上微小的改变不影响生物活性的药物称为“结构非特异性药物”，例如吸入型麻醉药，其药理活性主要与药物在周围空气中的局部蒸气压与药物本身的蒸气压之比率有关。典型的结构非特异性药物只有在高浓度时才有活性。\u003c/div\u003e","pt":"结构上微小的改变不影响生物活性的药物称为“结构非特异性药物”，例如吸入型麻醉药，其药理活性主要与药物在周围空气中的局部蒸气压与药物本身的蒸气压之比率有关。典型的结构非特异性药物只有在高浓度时才有活性。","ok":true,"an":["药理活性","生物活性","蒸气压"]},{"id":"44ae9c3771","no":4,"q":"手性药物","a":"\u003cdiv class=\"q-ln\"\u003e是指药物分子结构中引入手性中心后得到的一对实物和镜像的对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。\u003c/div\u003e","pt":"是指药物分子结构中引入手性中心后得到的一对实物和镜像的对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。","ok":true,"an":["异构体","化学性质","分子结构"]},{"id":"bec5704f4a","no":5,"q":"对映异构体","a":"\u003cdiv class=\"q-ln\"\u003e光学异构分子中存在手性中心，两个对映体互为实物和镜像，称为对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。\u003c/div\u003e","pt":"光学异构分子中存在手性中心，两个对映体互为实物和镜像，称为对映异构体。对映异构体有着相同的物理性质和化学性质，但它们能使偏振光等量地向相反方向旋转。","ok":true,"an":["化学性质","偏振光"]},{"id":"17be279802","no":6,"q":"举例说明为什么不同的几何异构会影响药物活性?","a":"\u003cdiv class=\"q-ln\"\u003e药物分子中含有双键，或有刚性或半刚性的环状结构时，可产生几何异构体。几何异构体的理化性质和生物活性都有较大差异，如顺式己烯雌酚、反式己烯雌酚。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e在己烯雌酚的构效关系研究中，发现两个含氧官能团及氧原子间的距离对生物活性是必需的，而甾体母核对雌激素并非必需结构。人工合成的反式己烯雌酚中，两个羟基得到距离是1.45nm，这与雌二醇两个羟基的距离近似，表现出较强的生物活性。顺式己烯雌酚两个羟基间的距离为0.72nm，生物活性大大减弱。\u003c/div\u003e","pt":"药物分子中含有双键，或有刚性或半刚性的环状结构时，可产生几何异构体。几何异构体的理化性质和生物活性都有较大差异，如顺式己烯雌酚、反式己烯雌酚。 在己烯雌酚的构效关系研究中，发现两个含氧官能团及氧原子间的距离对生物活性是必需的，而甾体母核对雌激素并非必需结构。人工合成的反式己烯雌酚中，两个羟基得到距离是1.45nm，这与雌二醇两个羟基的距离近似，表现出较强的生物活性。顺式己烯雌酚两个羟基间的距离为0.72nm，生物活性大大减弱。","ok":true,"an":["理化性质","生物活性","雌二醇","官能团","雌激素","氧原子"]},{"id":"0c13f1b9f0","no":7,"q":"先导化合物 (lead compound)","a":"\u003cdiv class=\"q-ln\"\u003e简称先导物，又称原型物 (prototype compound)，具有所期望的生物或药理活性，但会存在一些其他所不合适的性质，如较高毒性、较差的溶解度或药物代谢问题等。一般而言，先导化合物的发现是新药研究的起始点。\u003c/div\u003e","pt":"简称先导物，又称原型物 (prototype compound)，具有所期望的生物或药理活性，但会存在一些其他所不合适的性质，如较高毒性、较差的溶解度或药物代谢问题等。一般而言，先导化合物的发现是新药研究的起始点。","ok":true,"an":["代谢","药理活性","prototype"]},{"id":"5f6297b614","no":8,"q":"先导化合物的发现","a":"\u003cdiv class=\"q-ln\"\u003e① 从天然产物中得到先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 以现有药物作为先导化合物: 1. 由药物副作用发现先导化合物；2.通过药物的代谢发现先导化合物；3.以现有突破性药物作为先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 用活性内源性物质作为先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 通过组合化学与高通量筛选得到先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 通过靶向虚拟筛选得到先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 利用人工智能快速发现先导化合物\u003c/div\u003e","pt":"① 从天然产物中得到先导化合物 ② 以现有药物作为先导化合物: 1. 由药物副作用发现先导化合物；2.通过药物的代谢发现先导化合物；3.以现有突破性药物作为先导化合物 ③ 用活性内源性物质作为先导化合物 ④ 通过组合化学与高通量筛选得到先导化合物 ⑤ 通过靶向虚拟筛选得到先导化合物 ⑥ 利用人工智能快速发现先导化合物","ok":true,"an":["代谢"]},{"id":"f4275f2866","no":9,"q":"\"me-too\"药物","a":"\u003cdiv class=\"q-ln\"\u003e是指化学结构与已有药物非常相似，但生物活性稍有差别的药物。有时可能得到比原突破性药物活性更好或有药代动力学特色药物。例如兰索拉唑就是以奥美拉唑为先导化合物经结构改造得到的，其活性比奥美拉唑更强。\u003c/div\u003e","pt":"是指化学结构与已有药物非常相似，但生物活性稍有差别的药物。有时可能得到比原突破性药物活性更好或有药代动力学特色药物。例如兰索拉唑就是以奥美拉唑为先导化合物经结构改造得到的，其活性比奥美拉唑更强。","ok":true,"an":["奥美拉唑","生物活性","动力学","化学结构"]},{"id":"3a3a74ee1d","no":10,"q":"合理药物设计 (rational drug design)","a":"\u003cdiv class=\"q-ln\"\u003e针对与生理活性有关的酶或受体来设计药物，称为合理药物设计。内源性的神经递质、酶或受体的底物就是初始的先导化合物。例如以炎症介质5-羟色胺为先导化合物研发了抗炎药吲哚美辛。\u003c/div\u003e","pt":"针对与生理活性有关的酶或受体来设计药物，称为合理药物设计。内源性的神经递质、酶或受体的底物就是初始的先导化合物。例如以炎症介质5-羟色胺为先导化合物研发了抗炎药吲哚美辛。","ok":true,"an":["羟色胺","抗炎","吲哚美辛","神经递质"]},{"id":"c08783c61b","no":11,"q":"组合化学 (combinatorial chemistry)","a":"\u003cdiv class=\"q-ln\"\u003e是将一些基本小分子，如氨基酸、核苷酸、单糖等通过化学或生物合成的手段装配成不同的组合，由此得到大量具有结构多样性的化合物分子，配合高通量筛选寻找先导化合物的一种新的合成技术与方法。\u003c/div\u003e","pt":"是将一些基本小分子，如氨基酸、核苷酸、单糖等通过化学或生物合成的手段装配成不同的组合，由此得到大量具有结构多样性的化合物分子，配合高通量筛选寻找先导化合物的一种新的合成技术与方法。","ok":true,"an":["多样性","氨基酸"]},{"id":"21069a1a29","no":12,"q":"先导化合物的优化","a":"\u003cdiv class=\"q-ln\"\u003e① 生物电子等排替换\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 前药设计\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 软药设计\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 骨架跃迁策略药物设计\u003c/div\u003e","pt":"① 生物电子等排替换 ② 前药设计 ③ 软药设计 ④ 骨架跃迁策略药物设计","ok":true,"an":["生物电子"]},{"id":"594aee42e6","no":13,"q":"生物电子等排体 (bioisosteres)","a":"\u003cdiv class=\"q-ln\"\u003e具有相似的分子形状和体积、相似的电荷分布，并由此表现出相似的物理性质（如疏水性），对同一靶标产生相似或拮抗的生物活性的分子或基团。\u003c/div\u003e","pt":"具有相似的分子形状和体积、相似的电荷分布，并由此表现出相似的物理性质（如疏水性），对同一靶标产生相似或拮抗的生物活性的分子或基团。","ok":true,"an":["分布","生物活性","疏水性"]},{"id":"489cbcafae","no":14,"q":"前药设计的目的","a":"\u003cdiv class=\"q-ln\"\u003e① 提高生物利用度和生物膜通透性: 氨苄西林口服吸收较差，将其羧基酯化形成易被酶裂解的酯如匹氨西林，口服时几乎定量吸收，且给药剂量较氨苄西林低，安全有效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 提高药物的靶向性：将苯丁酸氮芥结合到修饰后的胆汁酸上使其具有肝靶向性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 延长药物的作用时间：雌二醇在体内代谢快，作用短暂，将其与长链脂肪酸酯化后得到如戊酸雌二醇，延长作用时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 改善药物的水溶性和稳定性：如将依托泊苷转变为依托泊苷磷酸酯，可在较短时间内以更高浓度在体内转运。\u003c/div\u003e","pt":"① 提高生物利用度和生物膜通透性: 氨苄西林口服吸收较差，将其羧基酯化形成易被酶裂解的酯如匹氨西林，口服时几乎定量吸收，且给药剂量较氨苄西林低，安全有效。 ② 提高药物的靶向性：将苯丁酸氮芥结合到修饰后的胆汁酸上使其具有肝靶向性。 ③ 延长药物的作用时间：雌二醇在体内代谢快，作用短暂，将其与长链脂肪酸酯化后得到如戊酸雌二醇，延长作用时间。 ④ 改善药物的水溶性和稳定性：如将依托泊苷转变为依托泊苷磷酸酯，可在较短时间内以更高浓度在体内转运。","ok":true,"an":["代谢","雌二醇","磷酸酯","口服","安全有效","通透性"]},{"id":"dd215331cb","no":15,"q":"药物潜伏化 (drug latentiation)","a":"\u003cdiv class=\"q-ln\"\u003e是通过对生物活性化合物的化学修饰形成新的化合物，该新化合物在体内酶的作用下释放出母体药物而发挥作用。\u003c/div\u003e","pt":"是通过对生物活性化合物的化学修饰形成新的化合物，该新化合物在体内酶的作用下释放出母体药物而发挥作用。","ok":true,"an":["生物活性"]},{"id":"31ee9b5569","no":16,"q":"前体药物 (prodrug)","a":"\u003cdiv class=\"q-ln\"\u003e是指经生物转化后才显示药理作用的化合物。可分为载体前药和生物前体。载体前药 (carrier prodrug) 是指活性药物与载体部分连接构成的在体外无活性或活性较小，在体内经酶或其他生物转化释放出活性药物而发挥药效的化合物。生物前体 (bioprecursor) 是通过对有活性的化合物进行结构修饰得到的新化合物，该新化合物是代谢酶的底物，经过酶的代谢产生的活性代谢物是预期的活性分子。\u003c/div\u003e","pt":"是指经生物转化后才显示药理作用的化合物。可分为载体前药和生物前体。载体前药 (carrier prodrug) 是指活性药物与载体部分连接构成的在体外无活性或活性较小，在体内经酶或其他生物转化释放出活性药物而发挥药效的化合物。生物前体 (bioprecursor) 是通过对有活性的化合物进行结构修饰得到的新化合物，该新化合物是代谢酶的底物，经过酶的代谢产生的活性代谢物是预期的活性分子。","ok":true,"an":["carrier","代谢","生物前体","活性分子","发挥药效","结构修饰"]},{"id":"ec651256bf","no":17,"q":"软药 (soft drug)","a":"\u003cdiv class=\"q-ln\"\u003e设计出容易代谢失活的药物，使药物在完成治疗作用后，按预先规定的代谢途径和可以控制的速率分解、失活并迅速排除体外，从而避免药物的蓄积毒性，这类药物被称为软药。\u003c/div\u003e","pt":"设计出容易代谢失活的药物，使药物在完成治疗作用后，按预先规定的代谢途径和可以控制的速率分解、失活并迅速排除体外，从而避免药物的蓄积毒性，这类药物被称为软药。","ok":true,"an":["代谢","蓄积"]},{"id":"75d85f57cc","no":18,"q":"定量构效关系 (quantitative structure-activity relationship, QSAR)","a":"\u003cdiv class=\"q-ln\"\u003e是对药物分子的化学结构与其生物活性之间的关系进行定量分析，找出药物的化学结构与生物活性之间的量变规律，或得到构效关系的数学方程，为进一步的结构优化提供理论依据。\u003c/div\u003e","pt":"是对药物分子的化学结构与其生物活性之间的关系进行定量分析，找出药物的化学结构与生物活性之间的量变规律，或得到构效关系的数学方程，为进一步的结构优化提供理论依据。","ok":true,"an":["生物活性","理论依据","定量分析"]},{"id":"665b61beca","no":19,"q":"计算机辅助药物设计 (computer-aided drug design, CADD)","a":"\u003cdiv class=\"q-ln\"\u003e是利用计算机的快速计算功能、全方位的逻辑判断功能、一目了然的图形显示功能，将量子化学、分子力学、药物化学、生命科学、计算机图形学和信息科学等学科交叉融合，从药物分子的作用机制入手进行药物设计。\u003c/div\u003e","pt":"是利用计算机的快速计算功能、全方位的逻辑判断功能、一目了然的图形显示功能，将量子化学、分子力学、药物化学、生命科学、计算机图形学和信息科学等学科交叉融合，从药物分子的作用机制入手进行药物设计。","ok":true,"an":["生命科学"]},{"id":"dd9f99b552","no":20,"q":"药效团 (pharmacophore)","a":"\u003cdiv class=\"q-ln\"\u003e对于一个药物分子，分子中的不同基团对活性的影响不同，有些基团改变对分子活性的影响甚小，而有一些则对药物分子与靶点的结合至关重要。这些药物活性分子中对活性起重要作用的“药效特征元素”及其空间排列形式即为药效团。\u003c/div\u003e","pt":"对于一个药物分子，分子中的不同基团对活性的影响不同，有些基团改变对分子活性的影响甚小，而有一些则对药物分子与靶点的结合至关重要。这些药物活性分子中对活性起重要作用的“药效特征元素”及其空间排列形式即为药效团。","ok":true,"an":["活性分子","元素"]},{"id":"7a5e406271","no":21,"q":"构效关系 (structure-activity relationship, SAR)","a":"\u003cdiv class=\"q-ln\"\u003e在同一基本结构的系列药物中，药物结构变化引起药物活性变化的规律，称为该类药物的构效关系。其研究对揭示该类药物的作用机制、研究新药等有重要意义。\u003c/div\u003e","pt":"在同一基本结构的系列药物中，药物结构变化引起药物活性变化的规律，称为该类药物的构效关系。其研究对揭示该类药物的作用机制、研究新药等有重要意义。","ok":true,"an":["基本结构"]},{"id":"3b467b3071","no":22,"q":"药物代谢在药物研究中的作用。","a":"\u003cdiv class=\"q-ln\"\u003e一、设计和发现新药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 寻找和发现新的先导化合物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 先导化合物的结构修饰\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 对新药研究的指导作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e二、优化药物的药动学性质:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 通过修饰缩短药物的作用时间\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 通过修饰延长药物的作用时间\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 通过修饰提高药物的生物利用度\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 指导设计适当的剂型\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e三、解释药物的作用机制\u003c/div\u003e","pt":"一、设计和发现新药: ① 寻找和发现新的先导化合物 ② 先导化合物的结构修饰 ③ 对新药研究的指导作用 二、优化药物的药动学性质: ① 通过修饰缩短药物的作用时间 ② 通过修饰延长药物的作用时间 ③ 通过修饰提高药物的生物利用度 ④ 指导设计适当的剂型 三、解释药物的作用机制","ok":true,"an":["药动学性质","结构修饰"]},{"id":"5ed7af3f00","no":23,"q":"第Ⅰ相生物转化","a":"\u003cdiv class=\"q-ln\"\u003e主要是官能团化反应，在酶的催化下对药物分子进行氧化、还原、水解等反应，在药物分子中引入或使药物分子暴露出极性基团，如羟基、羧基、巯基和氨基等。\u003c/div\u003e","pt":"主要是官能团化反应，在酶的催化下对药物分子进行氧化、还原、水解等反应，在药物分子中引入或使药物分子暴露出极性基团，如羟基、羧基、巯基和氨基等。","ok":true,"an":["极性基团","官能团"]},{"id":"5349868ce9","no":24,"q":"第Ⅱ相生物转化","a":"\u003cdiv class=\"q-ln\"\u003e又称为“结合反应”，是指药物中原有的或者经第Ⅱ相转化后产生的极性基团与体内内源性成分，如葡糖醛酸、硫酸、甘氨酸或谷胱甘肽，经共价键结合，生成极性大、易溶于水和易排出体外的结合物。\u003c/div\u003e","pt":"又称为“结合反应”，是指药物中原有的或者经第Ⅱ相转化后产生的极性基团与体内内源性成分，如葡糖醛酸、硫酸、甘氨酸或谷胱甘肽，经共价键结合，生成极性大、易溶于水和易排出体外的结合物。","ok":true,"an":["谷胱甘肽","极性基团","共价键结合"]}],"count":24,"done":24},{"label":"第三章","questions":[{"id":"5d31336019","no":1,"q":"巴比妥类药物的一般合成方法中，用卤烃取代丙二酸二乙酯的α-氢时，当两个取代基大小不同时，一般应先引入大基团，还是小基团？为什么？","a":"\u003cdiv class=\"q-ln\"\u003e当引入的两个烃基不同时，一般先引入较大的烃基到次甲基上。经分馏纯化后，再引入小基团。这是因为，当引入一个大基团后，因空间位阻较大，不易再接连上第二个基团，成为反应副产物。同时当引入一个大基团后，原料、一取代产物和二取代副产物的理化性质差异较大，也便于分离纯化。\u003c/div\u003e","pt":"当引入的两个烃基不同时，一般先引入较大的烃基到次甲基上。经分馏纯化后，再引入小基团。这是因为，当引入一个大基团后，因空间位阻较大，不易再接连上第二个基团，成为反应副产物。同时当引入一个大基团后，原料、一取代产物和二取代副产物的理化性质差异较大，也便于分离纯化。","ok":true,"an":["理化性质","空间位阻","第二个"]},{"id":"cef0b586b3","no":2,"q":"巴比妥类药物具有哪些共同的化学性质？","a":"\u003cdiv class=\"q-ln\"\u003e① 呈弱酸性，巴比妥类药物因能形成内酰胺醇-内酰胺互变异构，故呈弱酸性；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 水解性，巴比妥类药物因含环酰脲结构，其钠盐水溶液不够稳定，甚至在吸湿情况下也能水解；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 与银盐的反应，这类药物在碳酸钠的碱性溶液中与硝酸银溶液作用，先生成可溶性的一银盐，继而则生成不溶性的二银盐白色沉淀；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 与铜吡啶试液的反应，这类药物分子中含有一CONHCONHCO一结构，能与重金属形成不溶性的络合物，可供鉴别。\u003c/div\u003e","pt":"① 呈弱酸性，巴比妥类药物因能形成内酰胺醇-内酰胺互变异构，故呈弱酸性； ② 水解性，巴比妥类药物因含环酰脲结构，其钠盐水溶液不够稳定，甚至在吸湿情况下也能水解； ③ 与银盐的反应，这类药物在碳酸钠的碱性溶液中与硝酸银溶液作用，先生成可溶性的一银盐，继而则生成不溶性的二银盐白色沉淀； ④ 与铜吡啶试液的反应，这类药物分子中含有一CONHCONHCO一结构，能与重金属形成不溶性的络合物，可供鉴别。","ok":true,"an":["呈弱酸性","CONHCONHCO","碳酸钠","银盐","重金属","钠盐"]},{"id":"854b68953a","no":3,"q":"为什么巴比妥C5位次甲基上的两个氢原子必须全被取代，才有镇静催眠作用？","a":"\u003cdiv class=\"q-ln\"\u003e未解离的巴比妥类药物分子较其离子易于透过细胞膜而发挥作用。巴比妥酸和一取代巴比妥酸的 pKa 值较小，酸性较强，在生理 pH 时几乎全部解离，均无疗效。如 5 位上引入两个基团，生成的 5,5 位双取代物则酸性大大降低，在生理 pH 时未解离药物分子的比例较大。这些分子态药物能透过血-脑脊液屏障，进入中枢神经系统而发挥作用。\u003c/div\u003e","pt":"未解离的巴比妥类药物分子较其离子易于透过细胞膜而发挥作用。巴比妥酸和一取代巴比妥酸的 pKa 值较小，酸性较强，在生理 pH 时几乎全部解离，均无疗效。如 5 位上引入两个基团，生成的 5,5 位双取代物则酸性大大降低，在生理 pH 时未解离药物分子的比例较大。这些分子态药物能透过血-脑脊液屏障，进入中枢神经系统而发挥作用。","ok":true,"an":["中枢神经系统","脑脊液屏障","细胞膜","巴比妥类","酸性较强","pKa"]},{"id":"2be8f0cb8c","no":4,"q":"合成类镇痛药按结构可以分成几类？这些药物的化学结构类型不同，但为什么都具有类似吗啡的作用？","a":"\u003cdiv class=\"q-ln\"\u003e按结构可分为：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 吗啡喃类: 左啡诺\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 苯并吗喃类: 喷他佐辛\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 哌啶类: 哌替啶、芬太尼\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 氨基酮类: 美沙酮\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 其他类: 曲马多\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e它们化学结构类型不同但均具有类似吗啡的作用，是因为它们都含有以下共同的结构特征:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 有一个平坦的芳环结构；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 有一个叔氮原子碱性中心，且在生理pH条件下大部分电离成阳离子，碱性中心应和平坦结构在同一平面上。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 含有哌啶或类似哌啶的空间结构，哌啶或类似哌啶的烃基部分应该突出于芳环构成的平面上方。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e这些共同的结构特征使得它们都能作用于阿片受体发挥类似吗啡的作用。\u003c/div\u003e","pt":"按结构可分为： ① 吗啡喃类: 左啡诺 ② 苯并吗喃类: 喷他佐辛 ③ 哌啶类: 哌替啶、芬太尼 ④ 氨基酮类: 美沙酮 ⑤ 其他类: 曲马多 它们化学结构类型不同但均具有类似吗啡的作用，是因为它们都含有以下共同的结构特征: ① 有一个平坦的芳环结构； ② 有一个叔氮原子碱性中心，且在生理pH条件下大部分电离成阳离子，碱性中心应和平坦结构在同一平面上。 ③ 含有哌啶或类似哌啶的空间结构，哌啶或类似哌啶的烃基部分应该突出于芳环构成的平面上方。 这些共同的结构特征使得它们都能作用于阿片受体发挥类似吗啡的作用。","ok":true,"an":["氨基酮类","苯并吗喃类","吗啡喃类","哌啶类","其他类","哌替啶"]},{"id":"eec773151a","no":5,"q":"试分析酒石酸唑吡坦上市后使用人群迅速增大的原因。","a":"\u003cdiv class=\"q-ln\"\u003e镇静催眠药在上个世纪 60 年代前主要使用巴比妥类药物，因其有成瘾性、耐受性和蓄积中毒。在 60 年代苯并氮䓬类药物问世后，使用开始减少。苯并氮䓬类药物比巴比妥类的选择性高、安全范围大，对呼吸抑制小，在 60 年代后西泮类药物逐渐占主导。唑吡坦的作用类似苯二氮䓬，但可选择性地与苯二氮䓬 ω1 型受体结合，有强镇静作用，没有肌肉松弛和抗惊厥作用，不会引起反弹和戒断综合症，被滥用的可能性比苯二氮䓬小，故问世后使用人群迅速增大。\u003c/div\u003e","pt":"镇静催眠药在上个世纪 60 年代前主要使用巴比妥类药物，因其有成瘾性、耐受性和蓄积中毒。在 60 年代苯并氮䓬类药物问世后，使用开始减少。苯并氮䓬类药物比巴比妥类的选择性高、安全范围大，对呼吸抑制小，在 60 年代后西泮类药物逐渐占主导。唑吡坦的作用类似苯二氮䓬，但可选择性地与苯二氮䓬 ω1 型受体结合，有强镇静作用，没有肌肉松弛和抗惊厥作用，不会引起反弹和戒断综合症，被滥用的可能性比苯二氮䓬小，故问世后使用人群迅速增大。","ok":true,"an":["呼吸抑制","范围","蓄积中毒","耐受性","巴比妥类","选择性"]},{"id":"0929183dc1","no":6,"q":"请叙述卤加比作为前药的意义。","a":"\u003cdiv class=\"q-ln\"\u003e卤加比在体内转化成 γ-氨基丁酰胺，是 GABA 受体的激动剂，对癫痫、痉挛状态和运动失调有良好的治疗效果。由于 γ-氨基丁酰胺的极性太大，如直接使用，因不能透过血脑屏障进入中枢，即不能达到作用部位，起到药物的作用。为此作成希夫氏碱的前药，使极性减小，可以进入血脑屏障，转化后起作用。\u003c/div\u003e","pt":"卤加比在体内转化成 γ-氨基丁酰胺，是 GABA 受体的激动剂，对癫痫、痉挛状态和运动失调有良好的治疗效果。由于 γ-氨基丁酰胺的极性太大，如直接使用，因不能透过血脑屏障进入中枢，即不能达到作用部位，起到药物的作用。为此作成希夫氏碱的前药，使极性减小，可以进入血脑屏障，转化后起作用。","ok":true,"an":["治疗效果","血脑屏障","激动剂","GABA"]},{"id":"d265fdb298","no":7,"q":"试分析选择性的5-HT再摄取抑制剂类药物并无相似结构的原因。","a":"\u003cdiv class=\"q-ln\"\u003e一般和特定的受体结合（受体激动剂或拮抗剂），或与酶结合（酶抑制剂）的药物，因需与受体和酶在空间上适应，在电性效应上互补，同类药物大都有一些相同的结构，一般称为药效团（pharmacophore）。但重摄取抑制剂不需与受体或酶结合，有多个作用环节的可能：如阻碍吸收的路径，或与 5-羟色胺复合，影响吸收……。这在药物结构上无特异性的要求。故该类药物无相似的结构。\u003c/div\u003e","pt":"一般和特定的受体结合（受体激动剂或拮抗剂），或与酶结合（酶抑制剂）的药物，因需与受体和酶在空间上适应，在电性效应上互补，同类药物大都有一些相同的结构，一般称为药效团（pharmacophore）。但重摄取抑制剂不需与受体或酶结合，有多个作用环节的可能：如阻碍吸收的路径，或与 5-羟色胺复合，影响吸收……。这在药物结构上无特异性的要求。故该类药物无相似的结构。","ok":true,"an":["特异性","受体激动剂","羟色胺","药效团","拮抗剂","受体结合"]},{"id":"8b917102ef","no":8,"q":"巴比妥类药物的构效关系","a":"","pt":"","ok":false,"an":[]},{"id":"c00b861fd9","no":9,"q":"苯二氮䓬类构效关系","a":"","pt":"","ok":false,"an":[]},{"id":"24e7fcce25","no":10,"q":"吗啡类药物的构效关系","a":"","pt":"","ok":false,"an":[]},{"id":"97a5979edc","no":11,"q":"为什么说吩噻嗪类抗精神病药物中2位氯的取代对活性至关重要。","a":"","pt":"","ok":false,"an":[]},{"id":"3f39671128","no":12,"q":"噻吨类","a":"\u003cdiv class=\"q-ln\"\u003e为抗精神失常药的一种，其基本结构与吩噻嗪类相似，根据生物电子等排原理，将吩噻嗪母核中的10位N替换成-C-，并用双键连接侧链碱性基团仍具有抗精神失常活性，得到噻吨类抗精神病药，又称为硫杂蒽类抗精神病药，其许多化合物的侧链结构都与吩噻嗪药物相同。\u003c/div\u003e","pt":"为抗精神失常药的一种，其基本结构与吩噻嗪类相似，根据生物电子等排原理，将吩噻嗪母核中的10位N替换成-C-，并用双键连接侧链碱性基团仍具有抗精神失常活性，得到噻吨类抗精神病药，又称为硫杂蒽类抗精神病药，其许多化合物的侧链结构都与吩噻嗪药物相同。","ok":true,"an":["生物电子","基本结构","排原理"]},{"id":"e4fd8017ab","no":13,"q":"抗抑郁药的分类及代表药","a":"\u003cdiv class=\"q-ln\"\u003e① 三环类抗抑郁药: 丙米嗪\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 选择性5-HT再摄取抑制药: 氟西汀、舍曲林\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 5-HT与NE再摄取抑制药: 文拉法辛\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ NE再摄取抑制药: 安非他酮\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 单胺受体拮抗药: 米氮平\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 单胺氧化酶抑制药: 吗氯贝胺\u003c/div\u003e","pt":"① 三环类抗抑郁药: 丙米嗪 ② 选择性5-HT再摄取抑制药: 氟西汀、舍曲林 ③ 5-HT与NE再摄取抑制药: 文拉法辛 ④ NE再摄取抑制药: 安非他酮 ⑤ 单胺受体拮抗药: 米氮平 ⑥ 单胺氧化酶抑制药: 吗氯贝胺","ok":true,"an":["NE再摄取抑制药","单胺氧化酶抑制药","选择性"]}],"count":13,"done":9},{"label":"第四章","questions":[{"id":"92d6ef76e0","no":1,"q":"拟胆碱药(cholinergic drugs)","a":"","pt":"","ok":false,"an":[]},{"id":"39eab5e963","no":2,"q":"抗胆碱药(anticholinergic drugs)","a":"","pt":"","ok":false,"an":[]},{"id":"f1345332f3","no":3,"q":"合成M受体激动剂和拮抗剂的化学结构有哪些异同点？","a":"\u003cdiv class=\"q-ln\"\u003e相同点：①合成M胆碱受体激动剂与大部分合成M胆碱受体拮抗剂都具有与乙酰胆碱相似的氨基部分和酯基部分；②这两部分相隔2个碳的长度为最好。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e不同点：①在这个乙基桥上，激动剂可有甲基取代，拮抗剂通常无取代；②酯基的酰基部分，激动剂应为较小的乙酰基或氨甲酰基，而拮抗剂则为较大的碳环、芳环或杂环；③氨基部分，激动剂为季铵离子，拮抗剂可为季铵离子或叔胺；④大部分合成M胆碱受体拮抗剂的酯基的酰基α-碳上带有羟基，激动剂没有；⑤一部分合成M胆碱受体拮抗剂的酯键可被—O—代替或去掉，激动剂不行。总之，合成M胆碱受体激动剂的结构专属性要大大高于拮抗剂。\u003c/div\u003e","pt":"相同点：①合成M胆碱受体激动剂与大部分合成M胆碱受体拮抗剂都具有与乙酰胆碱相似的氨基部分和酯基部分；②这两部分相隔2个碳的长度为最好。 不同点：①在这个乙基桥上，激动剂可有甲基取代，拮抗剂通常无取代；②酯基的酰基部分，激动剂应为较小的乙酰基或氨甲酰基，而拮抗剂则为较大的碳环、芳环或杂环；③氨基部分，激动剂为季铵离子，拮抗剂可为季铵离子或叔胺；④大部分合成M胆碱受体拮抗剂的酯基的酰基α-碳上带有羟基，激动剂没有；⑤一部分合成M胆碱受体拮抗剂的酯键可被—O—代替或去掉，激动剂不行。总之，合成M胆碱受体激动剂的结构专属性要大大高于拮抗剂。","ok":true,"an":["专属性","受体拮抗剂","相同点","不同点","乙酰胆碱","胆碱受体"]},{"id":"12739edc93","no":4,"q":"苯乙醇胺类拟肾上腺素受体激动剂的β-碳是手性碳原子，其R构型异构体的活性大大高于S构型体，试解释之。","a":"\u003cdiv class=\"q-ln\"\u003e苯乙醇胺类与肾上腺素受体相互结合时，通过其分子中的氨基、苯环及其上酚羟基、β-羟基三个部分与受体发生三点结合。这三个部分的空间相对位置能否与受体匹配，对药物作用强度影响很大。只有β-碳是R构型的异构体可满足受体的空间要求，实现上述三点结合，而其S构型异构体因其β-羟基的位置发生改变，与受体只能有两点结合，即氨基、苯环及其上酚羟基，因而对受体的激动作用较弱。\u003c/div\u003e","pt":"苯乙醇胺类与肾上腺素受体相互结合时，通过其分子中的氨基、苯环及其上酚羟基、β-羟基三个部分与受体发生三点结合。这三个部分的空间相对位置能否与受体匹配，对药物作用强度影响很大。只有β-碳是R构型的异构体可满足受体的空间要求，实现上述三点结合，而其S构型异构体因其β-羟基的位置发生改变，与受体只能有两点结合，即氨基、苯环及其上酚羟基，因而对受体的激动作用较弱。","ok":true,"an":["上酚羟基"]},{"id":"d1e3bed04f","no":5,"q":"经典H1受体拮抗剂有何突出的不良反应？为什么？第二代H1受体拮抗剂如何克服这一缺点？","a":"\u003cdiv class=\"q-ln\"\u003e经典H₁受体拮抗剂最突出的毒副作用是中枢抑制作用，可引起明显的镇静、嗜睡。产生这种作用的机制尚不十分清楚，有人认为这些药物易通过血-脑脊液屏障，并与脑内H₁受体有高度亲和力，由此拮抗脑内的内源性组胺引起的觉醒反应而致中枢抑制。第二代H₁受体拮抗剂通过限制药物进入中枢和提高药物对外周H₁受体的选择性来发展新型非镇静性抗组胺药。如 acrivastine 和 cetirizine 就是通过引入极性或易电离基团使药物难以通过血-脑脊液屏障进入中枢，克服镇静作用的。而 mizolastine、clemastine 和 loratadine 则是对外周H₁受体有较高的选择性，避免中枢副作用。\u003c/div\u003e","pt":"经典H₁受体拮抗剂最突出的毒副作用是中枢抑制作用，可引起明显的镇静、嗜睡。产生这种作用的机制尚不十分清楚，有人认为这些药物易通过血-脑脊液屏障，并与脑内H₁受体有高度亲和力，由此拮抗脑内的内源性组胺引起的觉醒反应而致中枢抑制。第二代H₁受体拮抗剂通过限制药物进入中枢和提高药物对外周H₁受体的选择性来发展新型非镇静性抗组胺药。如 acrivastine 和 cetirizine 就是通过引入极性或易电离基团使药物难以通过血-脑脊液屏障进入中枢，克服镇静作用的。而 mizolastine、clemastine 和 loratadine 则是对外周H₁受体有较高的选择性，避免中枢副作用。","ok":true,"an":["脑脊液屏障","抗组胺药","中枢抑制","cetirizine","clemastine","loratadine"]},{"id":"af7dc3c3bd","no":6,"q":"从 procaine 的结构分析其化学稳定性，说明配制注射液时的注意事项及药典规定杂质检查的原因。","a":"\u003cdiv class=\"q-ln\"\u003eProcaine 的化学稳定性较低，原因有二：其一，结构中含有酯基，易被水解失活，酸、碱和体内酯酶均能促使其水解，温度升高也加速水解；其二，结构中含有芳伯氨基，易被氧化变色，pH 及温度升高、紫外线、氧、重金属离子等均可加速氧化。所以注射剂制备中要控制最稳定的 pH 范围 3.5~5.0，低温灭菌(100℃，30min)，通入惰性气体，加入抗氧剂及金属离子掩蔽剂等稳定剂。Procaine 水解生成对氨基苯甲酸和二乙氨基乙醇，所以中国药典规定要检查对氨基苯甲酸的含量。\u003c/div\u003e","pt":"Procaine 的化学稳定性较低，原因有二：其一，结构中含有酯基，易被水解失活，酸、碱和体内酯酶均能促使其水解，温度升高也加速水解；其二，结构中含有芳伯氨基，易被氧化变色，pH 及温度升高、紫外线、氧、重金属离子等均可加速氧化。所以注射剂制备中要控制最稳定的 pH 范围 3.5~5.0，低温灭菌(100℃，30min)，通入惰性气体，加入抗氧剂及金属离子掩蔽剂等稳定剂。Procaine 水解生成对氨基苯甲酸和二乙氨基乙醇，所以中国药典规定要检查对氨基苯甲酸的含量。","ok":true,"an":["通入惰性气体","重金属离子","金属离子","Procaine","范围","苯甲酸"]},{"id":"f79cca08ff","no":7,"q":"肾上腺素类药物相比，麻黄碱的特点。","a":"\u003cdiv class=\"q-ln\"\u003e① 一是苯环上不带有酚羟基。苯环上酚羟基的存在一般使作用增强，尤以3, 4-二羟基化合物的活性最强。但具有此而儿茶酚结构的化合物极易被COMT代谢失活，不宜口服。麻黄碱没有酚羟基，不受COMT的影响，虽作用强度较肾上腺素低，但作用时间比肾上腺素长，且可口服。苯环上没有酚羟基也使得化合物极性大为降低，易通过血脑屏障进入中枢神经系统，所以麻黄碱具有较强的中枢兴奋作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 二是氨基的α-碳上带有一个甲基。因甲基的空间位阻，使麻黄碱不易被MAO代谢脱胺，稳定性增加，作用时间延长。但α-碳上烷基亦使活性降低，中枢毒性增大。若甲基换以更大的取代基，则活性更弱，毒性更大。\u003c/div\u003e","pt":"① 一是苯环上不带有酚羟基。苯环上酚羟基的存在一般使作用增强，尤以3, 4-二羟基化合物的活性最强。但具有此而儿茶酚结构的化合物极易被COMT代谢失活，不宜口服。麻黄碱没有酚羟基，不受COMT的影响，虽作用强度较肾上腺素低，但作用时间比肾上腺素长，且可口服。苯环上没有酚羟基也使得化合物极性大为降低，易通过血脑屏障进入中枢神经系统，所以麻黄碱具有较强的中枢兴奋作用。 ② 二是氨基的α-碳上带有一个甲基。因甲基的空间位阻，使麻黄碱不易被MAO代谢脱胺，稳定性增加，作用时间延长。但α-碳上烷基亦使活性降低，中枢毒性增大。若甲基换以更大的取代基，则活性更弱，毒性更大。","ok":true,"an":["中枢神经系统","易通过血脑屏障","代谢","口服","空间位阻","活性最强"]},{"id":"7a13c307ab","no":8,"q":"氨贝胆碱如何设计而来？","a":"\u003cdiv class=\"q-ln\"\u003e乙酰胆碱作用短暂和不稳定是由于其结构中的酯基的快速水解。氨甲酰基由于氮上孤对电子的参与，使得羰基碳的亲电性较乙酰基低，因而不易被化学和酶促反应水解。将乙酰胆碱结构中的乙酰基用氨甲酰基替代，得到卡巴胆碱，可以口服，作用强而较持久，但兼具M样和N样作用。在卡巴胆碱的亚乙基桥的酯基一侧引入甲基，得到氯贝胆碱，对M受体具有选择性，并且可以口服给药。\u003c/div\u003e","pt":"乙酰胆碱作用短暂和不稳定是由于其结构中的酯基的快速水解。氨甲酰基由于氮上孤对电子的参与，使得羰基碳的亲电性较乙酰基低，因而不易被化学和酶促反应水解。将乙酰胆碱结构中的乙酰基用氨甲酰基替代，得到卡巴胆碱，可以口服，作用强而较持久，但兼具M样和N样作用。在卡巴胆碱的亚乙基桥的酯基一侧引入甲基，得到氯贝胆碱，对M受体具有选择性，并且可以口服给药。","ok":true,"an":["卡巴胆碱","乙酰胆碱","孤对电子","口服给药","口服","氨甲酰基"]},{"id":"23c7c05a53","no":9,"q":"如何从天然生物碱类的结构出发，设计得到四氢异喹啉类神经肌肉阻滞药？","a":"","pt":"","ok":false,"an":[]},{"id":"d3ceafbcbc","no":10,"q":"局麻药的分类","a":"\u003cdiv class=\"q-ln\"\u003e① 苯甲酸酯类: 普鲁卡因\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 酰胺类: 利多卡因\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 氨基酮类: 达克罗宁\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 氨基醚类: 普莫卡因\u003c/div\u003e\u003cdiv class=\"q-ln\"\ class=\"q-ln\"\u003eNO供体药物如硝酸甘油进入血管平滑肌细胞后，经代谢释放出NO，NO与可溶性GC中的血红蛋白Fe\u003csup\u003e2+\u003c/sup\u003e结合，激活GC，催化GTP转化成cGMP，cGMP激活cGMP依赖蛋白激酶，从而抑制胞外Ca\u003csup\u003e2+\u003c/sup\u003e内流，以及胞内Ca\u003csup\u003e2+\u003c/sup\u003e释放，使得胞内游离Ca\u003csup\u003e2+\u003c/sup\u003e浓度减小，从而使肌球蛋白轻链去磷酸化，导致血管平滑肌舒张，扩张血管。\u003c/div\u003e","pt":"NO供体药物如硝酸甘油进入血管平滑肌细胞后，经代谢释放出NO，NO与可溶性GC中的血红蛋白Fe 2+ 结合，激活GC，催化GTP转化成cGMP，cGMP激活cGMP依赖蛋白激酶，从而抑制胞外Ca 2+ 内流，以及胞内Ca 2+ 释放，使得胞内游离Ca 2+ 浓度减小，从而使肌球蛋白轻链去磷酸化，导致血管平滑肌舒张，扩张血管。","ok":true,"an":["代谢","蛋白激酶","血红蛋白","血管平滑肌","扩张血管","cGMP"]},{"id":"23cd6a92bd","no":7,"q":"洛伐他汀为何称为前药？说明其代谢物的结构特点。","a":"\u003cdiv class=\"q-ln\"\u003e洛伐他汀为前药，只有在体内将内酯环水解成开链的β-羟基酸衍生物后才能抑制HMG-CoA还原酶活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e因为该开链的β-羟基酸结构部分，恰好与HMG-CoA还原酶的底物HMG-CoA的戊二酰部分相似，HMG-CoA还原酶与其结合后失去催化活性，抑制胆固醇的合成，从而有效降低血浆中的胆固醇。\u003c/div\u003e","pt":"洛伐他汀为前药，只有在体内将内酯环水解成开链的β-羟基酸衍生物后才能抑制HMG-CoA还原酶活性。 因为该开链的β-羟基酸结构部分，恰好与HMG-CoA还原酶的底物HMG-CoA的戊二酰部分相似，HMG-CoA还原酶与其结合后失去催化活性，抑制胆固醇的合成，从而有效降低血浆中的胆固醇。","ok":true,"an":["HMG-CoA","胆固醇"]},{"id":"ef91fa86d4","no":8,"q":"根据高脂血症的定义，简述调血脂药物的分类，并说明每类药物的作用、机制","a":"\u003cdiv class=\"q-ln\"\u003e血脂是指血浆或血清中的脂质，包括胆固醇、胆固醇酯、甘油三酯、磷脂以及它们与载脂蛋白形成的各种可溶性的脂蛋白。血浆中的脂蛋白有乳糜微粒、极低密度脂蛋白、低密度脂蛋白和高密度脂蛋白。人体高脂血症主要是极低密度脂蛋白和低密度脂蛋白增多，临床上血浆胆固醇高于230mg/100ml和甘油三酯高于140mg/100ml统称为高血脂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e目前临床上使用的调血脂药物，一方面是通过减少极低密度脂蛋白和低密度脂蛋白，来调节高血脂；另一方面通过影响胆固醇和甘油三酯的代谢，来治疗高血脂。按照治疗效果分为羟甲戊二酰辅酶A还原酶抑制剂和影响胆固醇和甘油三酯代谢的药物。其中前者是通过抑制羟甲戊二酰辅酶A还原酶，使胆固醇合成受阻，并能减少极低密度脂蛋白和低密度脂蛋白，提高高密度脂蛋白水平。后者通过促进胆固醇和甘油三酯代谢，使其转化为其他物质。\u003c/div\u003e","pt":"血脂是指血浆或血清中的脂质，包括胆固醇、胆固醇酯、甘油三酯、磷脂以及它们与载脂蛋白形成的各种可溶性的脂蛋白。血浆中的脂蛋白有乳糜微粒、极低密度脂蛋白、低密度脂蛋白和高密度脂蛋白。人体高脂血症主要是极低密度脂蛋白和低密度脂蛋白增多，临床上血浆胆固醇高于230mg/100ml和甘油三酯高于140mg/100ml统称为高血脂。 目前临床上使用的调血脂药物，一方面是通过减少极低密度脂蛋白和低密度脂蛋白，来调节高血脂；另一方面通过影响胆固醇和甘油三酯的代谢，来治疗高血脂。按照治疗效果分为羟甲戊二酰辅酶A还原酶抑制剂和影响胆固醇和甘油三酯代谢的药物。其中前者是通过抑制羟甲戊二酰辅酶A还原酶，使胆固醇合成受阻，并能减少极低密度脂蛋白和低密度脂蛋白，提高高密度脂蛋白水平。后者通过促进胆固醇和甘油三酯代谢，使其转化为其他物质。","ok":true,"an":["代谢","胆固醇","脂蛋白","治疗效果","辅酶","抑制剂"]}],"count":8,"done":6},{"label":"第六章","questions":[{"id":"41a2c50231","no":1,"q":"质子泵抑制剂(proton pump inhibitors)","a":"\u003cdiv class=\"q-ln\"\u003e即H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶抑制剂，抑制H\u003csup\u003e+\u003c/sup\u003e与K\u003csup\u003e+\u003c/sup\u003e的交换，从而阻止胃酸形成。作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。另一方面，H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶仅存在于胃壁细胞膜表面，而H\u003csub\u003e2\u003c/sub\u003e受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H\u003csub\u003e2\u003c/sub\u003e受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。\u003c/div\u003e","pt":"即H + , K + ATP酶抑制剂，抑制H + 与K + 的交换，从而阻止胃酸形成。作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。另一方面，H + , K + ATP酶仅存在于胃壁细胞膜表面，而H 2 受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H 2 受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。","ok":true,"an":["受体拮抗剂相比","胃酸分泌","胃壁细胞","选择性","ATP"]},{"id":"cd6100499f","no":2,"q":"为什么质子泵抑制剂抑制胃酸分泌的作用强，选择性好？","a":"\u003cdiv class=\"q-ln\"\u003e① 质子泵抑制剂作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 另一方面，H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶仅存在于胃壁细胞膜表面，而H\u003csub\u003e2\u003c/sub\u003e受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H\u003csub\u003e2\u003c/sub\u003e受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。\u003c/div\u003e","pt":"① 质子泵抑制剂作用于胃壁细胞泌酸的最后一个环节，对各种刺激引起的胃酸分泌都有较好的抑制作用。 ② 另一方面，H + , K + ATP酶仅存在于胃壁细胞膜表面，而H 2 受体不仅存在于胃壁细胞，而且存在于其他组织中。因此，与H 2 受体拮抗剂相比，质子泵抑制剂具有作用专一、选择性高、副作用较小等优点。","ok":true,"an":["受体拮抗剂相比","胃壁细胞","ATP"]},{"id":"5394d60e80","no":3,"q":"试解释，奥美拉唑的活性形式并无光学活性，为什么艾司奥美拉唑的使用效果较奥美拉唑好。","a":"\u003cdiv class=\"q-ln\"\u003e奥美拉唑因亚砜上的硫具有手性而具有光学活性，但药用为其外消旋体，故无光学活性。其S(-)型异构体称为艾司奥美拉唑，因体内清除率大大低于R(+)型异构体，生物利用度较高，作用时间更长。同时，由于S型异构体受肝中代谢酶的影响较小，故个体差异也较小。现以单独成药用于临床。\u003c/div\u003e","pt":"奥美拉唑因亚砜上的硫具有手性而具有光学活性，但药用为其外消旋体，故无光学活性。其S(-)型异构体称为艾司奥美拉唑，因体内清除率大大低于R(+)型异构体，生物利用度较高，作用时间更长。同时，由于S型异构体受肝中代谢酶的影响较小，故个体差异也较小。现以单独成药用于临床。","ok":true,"an":["代谢","型异构体","个体差异","亚砜"]},{"id":"653b2fb7c0","no":4,"q":"为什么奥美拉唑是前药？","a":"\u003cdiv class=\"q-ln\"\u003e奥美拉唑为生物前体型前药，在体外无活性，在体内经生物转化后发挥作用。奥美拉唑具有弱碱性，口服后在十二指肠吸收，可选择性的聚集于胃壁细胞的酸性环境中，在氢离子的影响下，转换成活性形式。首先经smiles重排转换成螺环中间体，很快形成两种活性形式次磺酸和次磺酰胺。活性转化物与H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶上的4~6跨膜区的Cys813和7~8跨膜区的Cys892的巯基通过二硫键共价结合，形成酶-抑制剂复合物。次磺酸和次磺酰胺极性大，不易被吸收进入血液循环，有利于其在胃壁细胞聚集发挥作用，是奥美拉唑的理想活性形式。形成的酶-抑制剂复合物在酸性条件下稳定，虽可被谷胱甘肽和半胱氨酸等内源性巯基化合物竞争而复活，但胃壁细胞的酸性环境中谷胱甘肽极少，故奥美拉唑对H\u003csup\u003e+\u003c/sup\u003e, K\u003csup\u003e+\u003c/sup\u003eATP酶表现出持久、不可逆的抑制作用。\u003c/div\u003e","pt":"奥美拉唑为生物前体型前药，在体外无活性，在体内经生物转化后发挥作用。奥美拉唑具有弱碱性，口服后在十二指肠吸收，可选择性的聚集于胃壁细胞的酸性环境中，在氢离子的影响下，转换成活性形式。首先经smiles重排转换成螺环中间体，很快形成两种活性形式次磺酸和次磺酰胺。活性转化物与H + , K + ATP酶上的4~6跨膜区的Cys813和7~8跨膜区的Cys892的巯基通过二硫键共价结合，形成酶-抑制剂复合物。次磺酸和次磺酰胺极性大，不易被吸收进入血液循环，有利于其在胃壁细胞聚集发挥作用，是奥美拉唑的理想活性形式。形成的酶-抑制剂复合物在酸性条件下稳定，虽可被谷胱甘肽和半胱氨酸等内源性巯基化合物竞争而复活，但胃壁细胞的酸性环境中谷胱甘肽极少，故奥美拉唑对H + , K + ATP酶表现出持久、不可逆的抑制作用。","ok":true,"an":["谷胱甘肽","胃壁细胞","生物前体","smiles","Cys813","Cys892"]},{"id":"b495788770","no":5,"q":"请简述镇吐药的分类和作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e镇吐药物可阻断呕吐神经反射环的传导，达到镇吐的临床治疗效果。该反射环受多种神经递质影响，如组胺、乙酰胆碱、多巴胺和5-羟色胺。镇吐药，现以其作用靶点和作用机制（即拮抗的受体）分为抗组胺受体镇吐药、抗乙酰胆碱受体镇吐药、抗多巴胺受体镇吐药和5-HT₃受体拮抗剂。\u003c/div\u003e","pt":"镇吐药物可阻断呕吐神经反射环的传导，达到镇吐的临床治疗效果。该反射环受多种神经递质影响，如组胺、乙酰胆碱、多巴胺和5-羟色胺。镇吐药，现以其作用靶点和作用机制（即拮抗的受体）分为抗组胺受体镇吐药、抗乙酰胆碱受体镇吐药、抗多巴胺受体镇吐药和5-HT₃受体拮抗剂。","ok":true,"an":["多巴胺","受体拮抗剂","乙酰胆碱","组胺受体","羟色胺","治疗效果"]},{"id":"df1c13c647","no":6,"q":"试从化学结构上分析多潘立酮比甲氧氯普胺较少中枢副作用的原因。","a":"\u003cdiv class=\"q-ln\"\u003e作为促动力药物的多潘立酮和甲氧氯普胺，作用于消化系统的多巴胺D₂受体，促进胃肠道的蠕动。但这两个药物都能进入中枢，影响中枢的多巴胺D₂受体，导致中枢神经的副作用。从结构上看多潘立酮比甲氧氯普胺含有较多的极性基团，极性较甲氧氯普胺大，不易透过血-脑脊液屏障。相比之下，进入中枢的多潘立酮的量较少，故多潘立酮比甲氧氯普胺较少中枢的副作用。\u003c/div\u003e","pt":"作为促动力药物的多潘立酮和甲氧氯普胺，作用于消化系统的多巴胺D₂受体，促进胃肠道的蠕动。但这两个药物都能进入中枢，影响中枢的多巴胺D₂受体，导致中枢神经的副作用。从结构上看多潘立酮比甲氧氯普胺含有较多的极性基团，极性较甲氧氯普胺大，不易透过血-脑脊液屏障。相比之下，进入中枢的多潘立酮的量较少，故多潘立酮比甲氧氯普胺较少中枢的副作用。","ok":true,"an":["胃肠道","多巴胺","极性基团","脑脊液屏障"]}],"count":6,"done":6},{"label":"第七章","questions":[{"id":"4b138aad6c","no":1,"q":"解热镇痛药","a":"\u003cdiv class=\"q-ln\"\u003e是指能降低超过正常体温温度的药物。该类药物在治疗剂量内对正常体温没有影响，并且能够升高痛觉的阈值，使痛觉神经对疼痛的感觉变得迟钝，因此该类药物在降体温的同时，通常也有止痛的效果。\u003c/div\u003e","pt":"是指能降低超过正常体温温度的药物。该类药物在治疗剂量内对正常体温没有影响，并且能够升高痛觉的阈值，使痛觉神经对疼痛的感觉变得迟钝，因此该类药物在降体温的同时，通常也有止痛的效果。","ok":true,"an":[]},{"id":"5633474820","no":2,"q":"非甾体抗炎药","a":"\u003cdiv class=\"q-ln\"\u003e该类药物抑制环氧合酶的活性，减少体内花生四烯酸合成前列腺素和血栓素前体的一大类具有不同化学结构的药物。这些药物都具有解热、镇痛和抗炎的作用。其抗炎作用的机制与甾类抗炎药如可的松不同。广义的非甾体抗炎药也包括解热镇痛药、抗痛风药。\u003c/div\u003e","pt":"该类药物抑制环氧合酶的活性，减少体内花生四烯酸合成前列腺素和血栓素前体的一大类具有不同化学结构的药物。这些药物都具有解热、镇痛和抗炎的作用。其抗炎作用的机制与甾类抗炎药如可的松不同。广义的非甾体抗炎药也包括解热镇痛药、抗痛风药。","ok":true,"an":["环氧合酶","镇痛药","化学结构"]},{"id":"e9762f4c54","no":3,"q":"为什么临床上使用的布洛芬为消旋体？","a":"\u003cdiv class=\"q-ln\"\u003e非甾体抗炎药布洛芬其S-(+)-异构体有效，R-(-)-异构体无活性。在体内，辅酶A立体选择性地与R-(-)-异构体结合形成酰化辅酶A，不和S-(+)-异构体结合。生成的酰化辅酶A在体内酶的催化下发生差向异构化，生成R-酰化物和S-酰化物，S-酰化物很快水解生成S-(+)-布洛芬。通过这种方式手性药物实现了在体内异构体的转化，因此临床上布洛芬可以使用消旋体。\u003c/div\u003e","pt":"非甾体抗炎药布洛芬其S-(+)-异构体有效，R-(-)-异构体无活性。在体内，辅酶A立体选择性地与R-(-)-异构体结合形成酰化辅酶A，不和S-(+)-异构体结合。生成的酰化辅酶A在体内酶的催化下发生差向异构化，生成R-酰化物和S-酰化物，S-酰化物很快水解生成S-(+)-布洛芬。通过这种方式手性药物实现了在体内异构体的转化，因此临床上布洛芬可以使用消旋体。","ok":true,"an":["非甾体抗炎药","异构体","选择性","辅酶","异构化"]},{"id":"910cb8156e","no":4,"q":"从现代科学的角度分析，将阿司匹林制成钙盐是否能降低胃肠道的副作用。","a":"\u003cdiv class=\"q-ln\"\u003e阿司匹林的作用靶点为环氧合酶，其钙盐不改变其作用靶点，只能改变其溶解度。而胃肠道副作用产生的机制是抑制胃壁的前列腺素合成。故其钙盐不能降低该药物的胃肠道副作用。\u003c/div\u003e","pt":"阿司匹林的作用靶点为环氧合酶，其钙盐不改变其作用靶点，只能改变其溶解度。而胃肠道副作用产生的机制是抑制胃壁的前列腺素合成。故其钙盐不能降低该药物的胃肠道副作用。","ok":true,"an":["环氧合酶"]},{"id":"60c0564446","no":5,"q":"为什么将含苯胺类的非那西丁淘汰，而保留了对乙酰氨基酚？","a":"\u003cdiv class=\"q-ln\"\u003e为苯胺类药物代谢规律所决定。非那西丁的代谢物不易被排除而产生毒性，对乙酰氨基酚的代谢物较非那西丁易于排出体外，按药物说明书使用，正常剂量下没有毒性。同时对乙酰氨基酚是非那西丁的活性代谢物，两者的活性相当。\u003c/div\u003e","pt":"为苯胺类药物代谢规律所决定。非那西丁的代谢物不易被排除而产生毒性，对乙酰氨基酚的代谢物较非那西丁易于排出体外，按药物说明书使用，正常剂量下没有毒性。同时对乙酰氨基酚是非那西丁的活性代谢物，两者的活性相当。","ok":true,"an":["代谢","产生毒性","说明书"]},{"id":"910d00c056","no":6,"q":"如何从吲哚美辛改造得到舒林酸?舒林酸特点如何?","a":"\u003cdiv class=\"q-ln\"\u003e利用电子等排原理，将吲哚环上的一N一换成一CH=，获得了舒林酸（sulindac）。舒林酸有几何异构，药用顺式体（Z），这可保证亚磺酰苯基与茚的苯环在同侧，舒林酸属前药，它在体外无效。在体内经肝代谢，甲基亚砜基被还原为甲硫基化合物而显示生物活性。舒林酸自肾脏排泄较慢，半衰期长，故起效慢，作用持久。具有副作用较轻、耐受性好、长期服用不易引起肾坏死等特点。\u003c/div\u003e","pt":"利用电子等排原理，将吲哚环上的一N一换成一CH=，获得了舒林酸（sulindac）。舒林酸有几何异构，药用顺式体（Z），这可保证亚磺酰苯基与茚的苯环在同侧，舒林酸属前药，它在体外无效。在体内经肝代谢，甲基亚砜基被还原为甲硫基化合物而显示生物活性。舒林酸自肾脏排泄较慢，半衰期长，故起效慢，作用持久。具有副作用较轻、耐受性好、长期服用不易引起肾坏死等特点。","ok":true,"an":["排泄","代谢","生物活性","sulindac","几何异构","耐受性"]},{"id":"ded510fbb8","no":7,"q":"从双氯芬酸钠的合成工艺研究结果，分析药物合成工艺的进展应向哪个方向发展?","a":"\u003cdiv class=\"q-ln\"\u003e双氯芬酸钠的合成有许多种方法，其中以苯胺与2,6-二氯苯酚缩合，再与氯乙酰氯进行缩合、水解的方法成本最低。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e从双氯芬酸钠的合成路线改进看，取得合成工艺的突破在于合成路线的巧妙设计和新试剂、新反应的使用及对反应机制的深刻理解。\u003c/div\u003e","pt":"双氯芬酸钠的合成有许多种方法，其中以苯胺与2,6-二氯苯酚缩合，再与氯乙酰氯进行缩合、水解的方法成本最低。 从双氯芬酸钠的合成路线改进看，取得合成工艺的突破在于合成路线的巧妙设计和新试剂、新反应的使用及对反应机制的深刻理解。","ok":true,"an":["合成路线","苯胺"]}],"count":7,"done":7},{"label":"第八章","questions":[{"id":"496ec30385","no":1,"q":"生物烷化剂 (bioalkylating agents)","a":"\u003cdiv class=\"q-ln\"\u003e也称”烷化剂“，是抗肿瘤药中使用最早，也很重要的一类药物。这类药物能在体内形成缺电子的活泼中间体或其他具有活泼亲电性的化合物，进而与生物大分子（如DNA、RNA以及某些重要的酶类）中的富电子基团（如羟基、巯基、氨基、羧基、磷酸基等）等发生共价结合，从而使其丧失活性或使DNA分子发生断裂。\u003c/div\u003e","pt":"也称”烷化剂“，是抗肿瘤药中使用最早，也很重要的一类药物。这类药物能在体内形成缺电子的活泼中间体或其他具有活泼亲电性的化合物，进而与生物大分子（如DNA、RNA以及某些重要的酶类）中的富电子基团（如羟基、巯基、氨基、羧基、磷酸基等）等发生共价结合，从而使其丧失活性或使DNA分子发生断裂。","ok":true,"an":["生物大分子","抗肿瘤药","中间体","亲电性","DNA"]},{"id":"560cd245d2","no":2,"q":"抗代谢药物 (antimetabolites)","a":"\u003cdiv class=\"q-ln\"\u003e在肿瘤化学治疗上具有重要地位，是肿瘤化疗常用药物。其作用机制为通过抑制DNA合成中所需的叶酸、嘌呤、嘧啶及嘧啶核苷途径，从而抑制肿瘤细胞的生存和复制所必需的代谢途径，导致肿瘤细胞死亡。\u003c/div\u003e","pt":"在肿瘤化学治疗上具有重要地位，是肿瘤化疗常用药物。其作用机制为通过抑制DNA合成中所需的叶酸、嘌呤、嘧啶及嘧啶核苷途径，从而抑制肿瘤细胞的生存和复制所必需的代谢途径，导致肿瘤细胞死亡。","ok":true,"an":["肿瘤细胞","代谢途径","嘧啶","化学治疗","叶酸"]},{"id":"4819460d22","no":3,"q":"氮芥类抗肿瘤药物是如何发展而来的？其结构是由哪两部分组成？并简述各部分的主要作用。","a":"\u003cdiv class=\"q-ln\"\u003e① 氮芥类药物的发现源于芥子气，一战期间用芥子气作为毒气，实际上是一种烷化剂毒剂。后来发现芥子气对淋巴癌有治疗作用，但对人体的毒性太大，不能直接作为药用，经结构改造发展出了一系列的氮芥类抗肿瘤药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 氮芥类药物由载体和烷基化部分组成。烷基化部分是发挥抗肿瘤活性的功能基团。载体部分用于改善药物在体内的吸收、分布等药动学性质，提高药物的选择性和活性，降低药物的毒性等。\u003c/div\u003e","pt":"① 氮芥类药物的发现源于芥子气，一战期间用芥子气作为毒气，实际上是一种烷化剂毒剂。后来发现芥子气对淋巴癌有治疗作用，但对人体的毒性太大，不能直接作为药用，经结构改造发展出了一系列的氮芥类抗肿瘤药。 ② 氮芥类药物由载体和烷基化部分组成。烷基化部分是发挥抗肿瘤活性的功能基团。载体部分用于改善药物在体内的吸收、分布等药动学性质，提高药物的选择性和活性，降低药物的毒性等。","ok":true,"an":["抗肿瘤活性","分布","药动学性质","烷化剂","选择性"]},{"id":"30abedff75","no":4,"q":"试从作用机制解释脂肪氮芥和芳香氮芥类抗肿瘤药物的活性和毒性的差异。","a":"\u003cdiv class=\"q-ln\"\u003e① 脂肪氮芥的烷基化历程是S\u003csub\u003eN\u003c/sub\u003e2反应，其反应速率取决于烷化剂和亲核中心的浓度。脂肪氮芥属于强烷化剂，对肿瘤的杀伤能力较大，抗瘤谱较广，但选择性差，毒性大。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 将氮原子上的R基用芳环取代，得到芳香氮芥，由于苯环和氮原子上的孤对电子的共轭，从而使氮原子碱性变小，因而抗肿瘤活性降低，毒性也降低。其作用机制也发生了变化，不像脂肪氮芥那样很快形成乙撑亚胺离子，而是失去氯原子得到碳正离子中间体，再与亲核中心作用。其烷化历程一般是S\u003csub\u003eN\u003c/sub\u003e1反应，反应速率取决于烷化剂的浓度。\u003c/div\u003e","pt":"① 脂肪氮芥的烷基化历程是S N 2反应，其反应速率取决于烷化剂和亲核中心的浓度。脂肪氮芥属于强烷化剂，对肿瘤的杀伤能力较大，抗瘤谱较广，但选择性差，毒性大。 ③ 将氮原子上的R基用芳环取代，得到芳香氮芥，由于苯环和氮原子上的孤对电子的共轭，从而使氮原子碱性变小，因而抗肿瘤活性降低，毒性也降低。其作用机制也发生了变化，不像脂肪氮芥那样很快形成乙撑亚胺离子，而是失去氯原子得到碳正离子中间体，再与亲核中心作用。其烷化历程一般是S N 1反应，反应速率取决于烷化剂的浓度。","ok":true,"an":["抗肿瘤活性","孤对电子","氮原子","中间体","烷化剂","选择性"]},{"id":"c8bd2afaf7","no":5,"q":"为什么环磷酰胺的毒性比其他氮芥类抗肿瘤药物的毒性小?","a":"\u003cdiv class=\"q-ln\"\u003e① 在氮芥的氮原子上连接环状磷酰胺内酯，得到环磷酰胺。其中的磷酰基作为吸电子基团可使氮原子上的电子云密度下降，使氯不易解离，从而毒性降低。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 环磷酰胺是前药。由于连有吸电子的磷酰基，氮原子的亲核性降低，因此在体外对肿瘤细胞无效，不表现烷化活性。进入体内后，正常组织与肿瘤组织所含的酶不同，代谢途径和产物也不同。在正常组织中代谢生成无毒的4-酮基环磷酰胺和羧酸化合物；而肿瘤组织缺乏正常组织所具有的酶，经非酶促的β-消除反应，生成丙烯醛和磷酰氮芥，磷酰氮芥又可水解为去甲氮芥，这三个代谢物都是较强的烷化剂。因此环磷酰胺在正常组织中被解毒、而在肿瘤组织中被活化发挥烷化作用，对正常组织影响较小，选择性较高，毒性比其他氮芥类抗肿瘤药物小。\u003c/div\u003e","pt":"① 在氮芥的氮原子上连接环状磷酰胺内酯，得到环磷酰胺。其中的磷酰基作为吸电子基团可使氮原子上的电子云密度下降，使氯不易解离，从而毒性降低。 ② 环磷酰胺是前药。由于连有吸电子的磷酰基，氮原子的亲核性降低，因此在体外对肿瘤细胞无效，不表现烷化活性。进入体内后，正常组织与肿瘤组织所含的酶不同，代谢途径和产物也不同。在正常组织中代谢生成无毒的4-酮基环磷酰胺和羧酸化合物；而肿瘤组织缺乏正常组织所具有的酶，经非酶促的β-消除反应，生成丙烯醛和磷酰氮芥，磷酰氮芥又可水解为去甲氮芥，这三个代谢物都是较强的烷化剂。因此环磷酰胺在正常组织中被解毒、而在肿瘤组织中被活化发挥烷化作用，对正常组织影响较小，选择性较高，毒性比其他氮芥类抗肿瘤药物小。","ok":true,"an":["吸电子基团","代谢","肿瘤细胞","氮原子","吸电子","烷化剂"]},{"id":"5f8f20cd74","no":6,"q":"试说明顺铂的注射剂中加入氯化钠的作用。","a":"\u003cdiv class=\"q-ln\"\u003e顺铂的水溶液不稳定，能逐渐水解和转化成反式，生成一水合物和二水合物，进一步水解生成无抗肿瘤活性且有剧毒的低聚物-1与低聚物-2。但低聚物-1与低聚物-2在0.9%的氯化钠溶液中不稳定，可以迅速完全转化为顺铂，因此临床上不会有导致中毒的危险。\u003c/div\u003e","pt":"顺铂的水溶液不稳定，能逐渐水解和转化成反式，生成一水合物和二水合物，进一步水解生成无抗肿瘤活性且有剧毒的低聚物-1与低聚物-2。但低聚物-1与低聚物-2在0.9%的氯化钠溶液中不稳定，可以迅速完全转化为顺铂，因此临床上不会有导致中毒的危险。","ok":true,"an":["抗肿瘤活性","进一步","致中毒","水溶液"]},{"id":"b9391ccf46","no":7,"q":"抗代谢抗肿瘤药物是如何设计出来的？试举一例药物说明。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗代谢抗肿瘤药物是根据代谢拮抗原理设计出来的。其结构与体内正常代谢物很相似，多是将正常代谢物的结构作细微改变而得。设计时常利用生物电子等排原理，例如以 F 或 CH\u003csub\u003e3\u003c/sub\u003e 代替 H，以 S 或 CH\u003csub\u003e2\u003c/sub\u003e 代替 O，以 NH\u003csub\u003e2\u003c/sub\u003e 或 SH 代替 OH 等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 以氟尿嘧啶为例：用 F 原子取代尿嘧啶中的 H 原子得到氟尿嘧啶。由于 F 原子半径与 H 原子半径相近，氟尿嘧啶的体积与尿嘧啶几乎相等，容易被相关酶识别并参与代谢；同时 C-F 键特别稳定，在代谢过程中不易分解，因此氟尿嘧啶能在分子水平代替正常代谢物尿嘧啶，从而抑制 DNA 的合成，最终导致肿瘤细胞死亡。\u003c/div\u003e","pt":"① 抗代谢抗肿瘤药物是根据代谢拮抗原理设计出来的。其结构与体内正常代谢物很相似，多是将正常代谢物的结构作细微改变而得。设计时常利用生物电子等排原理，例如以 F 或 CH 3 代替 H，以 S 或 CH 2 代替 O，以 NH 2 或 SH 代替 OH 等。 ③ 以氟尿嘧啶为例：用 F 原子取代尿嘧啶中的 H 原子得到氟尿嘧啶。由于 F 原子半径与 H 原子半径相近，氟尿嘧啶的体积与尿嘧啶几乎相等，容易被相关酶识别并参与代谢；同时 C-F 键特别稳定，在代谢过程中不易分解，因此氟尿嘧啶能在分子水平代替正常代谢物尿嘧啶，从而抑制 DNA 的合成，最终导致肿瘤细胞死亡。","ok":true,"an":["生物电子","肿瘤细胞","嘧啶","排原理","DNA","CH"]}],"count":7,"done":7},{"label":"第九章","questions":[{"id":"79c21b15ad","no":1,"q":"抗生素 (antibiotics)","a":"\u003cdiv class=\"q-ln\"\u003e是微生物（细菌、放线菌、真菌等）的次级代谢产物或化学合成的类似物，在低浓度下就能对各种病原性微生物或肿瘤细胞有选择性抑制或杀灭作用，而不会引起宿主产生严重的不良反应。\u003c/div\u003e","pt":"是微生物（细菌、放线菌、真菌等）的次级代谢产物或化学合成的类似物，在低浓度下就能对各种病原性微生物或肿瘤细胞有选择性抑制或杀灭作用，而不会引起宿主产生严重的不良反应。","ok":true,"an":["选择性抑制","代谢","肿瘤细胞","放线菌"]},{"id":"526eee0af4","no":2,"q":"半合成抗生素","a":"\u003cdiv class=\"q-ln\"\u003e是在生物合成抗生素的基础上发展起来的，针对生物合成抗生素在化学稳定性、不良反应、抗菌谱等方面存在的问题，通过结构改造，旨在增加稳定性，降低不良反应，扩大抗菌谱，减少耐药性，改善生物利用度和提高治疗效力以及改变用药途径 (//注射-\u003e口服)。\u003c/div\u003e","pt":"是在生物合成抗生素的基础上发展起来的，针对生物合成抗生素在化学稳定性、不良反应、抗菌谱等方面存在的问题，通过结构改造，旨在增加稳定性，降低不良反应，扩大抗菌谱，减少耐药性，改善生物利用度和提高治疗效力以及改变用药途径 (//注射-\u003e口服)。","ok":true,"an":["化学稳定性","扩大抗菌谱","良反应","口服","耐药性","稳定性"]},{"id":"b05df3dd1e","no":3,"q":"抗菌活性","a":"\u003cdiv class=\"q-ln\"\u003e是指药物抑制或杀灭微生物的能力，可用体外抗菌试验来测定。能够抑制培养基内细菌生长的最低浓度称为最低抑菌浓度，能够杀灭培养基内细菌或使菌数减少99.9%的最低浓度称为最低杀菌浓度。\u003c/div\u003e","pt":"是指药物抑制或杀灭微生物的能力，可用体外抗菌试验来测定。能够抑制培养基内细菌生长的最低浓度称为最低抑菌浓度，能够杀灭培养基内细菌或使菌数减少99.9%的最低浓度称为最低杀菌浓度。","ok":true,"an":["细菌生长","抑菌"]},{"id":"08a74e1643","no":4,"q":"天然青霉素G有哪些缺点？试述半合成青霉素的结构改造方法。","a":"\u003cdiv class=\"q-ln\"\u003e天然青霉素G的缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 对酸不稳定，只能皮下注射，不能口服。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗菌谱比较窄，对G\u003csup\u003e+\u003c/sup\u003e菌效果比对G\u003csup\u003e-\u003c/sup\u003e菌的效果好。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 细菌易对其产生耐药性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 有严重的过敏反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e改造方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 在青霉素的侧链上引入吸电子基团，阻止侧链羰基电子向 β-内酰胺环的转移，增加了对酸的稳定性，得到一系列耐酸青霉素，如青霉素V。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 在青霉素的侧链上引入较大体积的基团，阻止化合物与酶活性中心的结合。又由于空间阻碍限制酰胺侧链 R 与羧基间的单键旋转，从而降低青霉素分子与酶活性中心作用的适应性，提高药物对酶的稳定性，得到耐酶青霉素，如甲氧西林。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 在青霉素的侧链上引入亲水性的基团（如氨基、羧基或磺酸基等），扩大抗菌谱，不仅对革兰阳性菌有效，对多数革兰阴性菌也有效，得到广谱青霉素，如氨苄西林、阿莫西林。\u003c/div\u003e","pt":"天然青霉素G的缺点: ① 对酸不稳定，只能皮下注射，不能口服。 ② 抗菌谱比较窄，对G + 菌效果比对G - 菌的效果好。 ③ 细菌易对其产生耐药性。 ④ 有严重的过敏反应。 改造方法: ① 在青霉素的侧链上引入吸电子基团，阻止侧链羰基电子向 β-内酰胺环的转移，增加了对酸的稳定性，得到一系列耐酸青霉素，如青霉素V。 ② 在青霉素的侧链上引入较大体积的基团，阻止化合物与酶活性中心的结合。又由于空间阻碍限制酰胺侧链 R 与羧基间的单键旋转，从而降低青霉素分子与酶活性中心作用的适应性，提高药物对酶的稳定性，得到耐酶青霉素，如甲氧西林。 ③ 在青霉素的侧链上引入亲水性的基团（如氨基、羧基或磺酸基等），扩大抗菌谱，不仅对革兰阳性菌有效，对多数革兰阴性菌也有效，得到广谱青霉素，如氨苄西林、阿莫西林。","ok":true,"an":["耐酸青霉素","广谱青霉素","过敏反应","吸电子基团","耐酶青霉素","产生耐药性"]},{"id":"398ef668e4","no":5,"q":"试说明耐酸、耐酶、广谱青霉素的结构特点，并举例。","a":"\u003cdiv class=\"q-ln\"\u003e① 耐酸青霉素的侧链上大都具有吸电子基团，如青霉素V等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 耐酶青霉素的侧链上都有较大体积的基团取代，如甲氧西林、苯唑西林等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 广谱青霉素的侧链中都具有亲水性的基团（如氨基、羧基或磺酸基等），如氨苄西林、阿莫西林等。\u003c/div\u003e","pt":"① 耐酸青霉素的侧链上大都具有吸电子基团，如青霉素V等。 ② 耐酶青霉素的侧链上都有较大体积的基团取代，如甲氧西林、苯唑西林等。 ③ 广谱青霉素的侧链中都具有亲水性的基团（如氨基、羧基或磺酸基等），如氨苄西林、阿莫西林等。","ok":true,"an":["耐酸青霉素","吸电子基团","耐酶青霉素","甲氧西林"]},{"id":"a5656c955c","no":6,"q":"为什么青霉素G不能口服？为什么其钠盐或钾盐必须做成粉针剂型？","a":"\u003cdiv class=\"q-ln\"\u003e① 青霉素G在酸性条件下不稳定，易发生重排而失活，因此不能口服。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 青霉素G通常制成钠盐或钾盐注射使用，但其钠盐或钾盐的水溶液碱性较强，β-内酰胺环会发生开环生成青霉酸，失去抗菌活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 因此青霉素G的钠盐或钾盐必须做成粉针剂，临用前配成水溶液，以保证稳定性。\u003c/div\u003e","pt":"① 青霉素G在酸性条件下不稳定，易发生重排而失活，因此不能口服。 ② 青霉素G通常制成钠盐或钾盐注射使用，但其钠盐或钾盐的水溶液碱性较强，β-内酰胺环会发生开环生成青霉酸，失去抗菌活性。 ③ 因此青霉素G的钠盐或钾盐必须做成粉针剂，临用前配成水溶液，以保证稳定性。","ok":true,"an":["失去抗菌活性","稳定性","水溶液"]},{"id":"a600aaf53e","no":7,"q":"为什么头孢菌素类比青霉素类更稳定？","a":"\u003cdiv class=\"q-ln\"\u003e① 头孢菌素类的母核是四元的β-内酰胺环并六元的氢化噻嗪环。而青霉素的母核是四元的β-内酰胺环并五元的氢化噻唑环，头孢菌素中的“四元环并六元环”的环张力比青霉素的“四元环并五元环”的环张力小，因而更稳定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 头孢菌素中C-2与C-3间的双键能与N-1上的孤对电子共轭，而青霉素则无，因而头孢菌素类更稳定。\u003c/div\u003e","pt":"① 头孢菌素类的母核是四元的β-内酰胺环并六元的氢化噻嗪环。而青霉素的母核是四元的β-内酰胺环并五元的氢化噻唑环，头孢菌素中的“四元环并六元环”的环张力比青霉素的“四元环并五元环”的环张力小，因而更稳定。 ② 头孢菌素中C-2与C-3间的双键能与N-1上的孤对电子共轭，而青霉素则无，因而头孢菌素类更稳定。","ok":true,"an":["孤对电子","C-2","C-3"]},{"id":"9679e15d09","no":8,"q":"奥格门汀由哪两种药物组成？试说明两者合用起增效作用的机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 奥格门汀是由克拉维酸钾和阿莫西林所组成的复方制剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 阿莫西林为半合成的广谱青霉素，通过抑制细菌细胞壁的合成而发挥抗菌作用，但会被细菌所产生的β-内酰胺酶水解而失活。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 克拉维酸钾是有效的β-内酰胺酶抑制剂，可与多数β-内酰胺酶牢固结合，可使阿莫西林免受β-内酰胺酶的水解。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 两者合用用于治疗耐阿莫西林细菌所引起的感染。\u003c/div\u003e","pt":"① 奥格门汀是由克拉维酸钾和阿莫西林所组成的复方制剂。 ② 阿莫西林为半合成的广谱青霉素，通过抑制细菌细胞壁的合成而发挥抗菌作用，但会被细菌所产生的β-内酰胺酶水解而失活。 ③ 克拉维酸钾是有效的β-内酰胺酶抑制剂，可与多数β-内酰胺酶牢固结合，可使阿莫西林免受β-内酰胺酶的水解。 ④ 两者合用用于治疗耐阿莫西林细菌所引起的感染。","ok":true,"an":["广谱青霉素","抑制细菌细胞壁","复方制剂","阿莫西林","抑制剂"]},{"id":"08c6198a5c","no":9,"q":"为什么四环素类抗生素不能和牛奶等富含金属离子的食物一起使用？","a":"\u003cdiv class=\"q-ln\"\u003e四环素类抗生素分子结构中含有许多的羟基、烯醇羟基及羰基。在近中性条件下，能与多种金属离子形成不溶性的螯合物，如与钙离子或镁离子形成难溶性的钙盐或镁盐，与铁离子形成红色络合物，与铝离子形成黄色络合物等。这不仅给临床使用制备成合适的溶液带来不便，还会干扰口服时的血药浓度，因此不应与牛奶等富含金属离子的食物一起使用。\u003c/div\u003e","pt":"四环素类抗生素分子结构中含有许多的羟基、烯醇羟基及羰基。在近中性条件下，能与多种金属离子形成不溶性的螯合物，如与钙离子或镁离子形成难溶性的钙盐或镁盐，与铁离子形成红色络合物，与铝离子形成黄色络合物等。这不仅给临床使用制备成合适的溶液带来不便，还会干扰口服时的血药浓度，因此不应与牛奶等富含金属离子的食物一起使用。","ok":true,"an":["钙离子","口服","难溶性","烯醇羟基","形成黄色","分子结构"]},{"id":"8f0f6b5a9f","no":10,"q":"试述红霉素对酸的不稳定性，举例说明半合成红霉素的结构改造方法。","a":"\u003cdiv class=\"q-ln\"\u003e① 由于红霉素分子中多个羟基及9位上羰基的存在，因此在酸性条件下不稳定，先发生C-9羰基和C-6羟基脱水环合，进一步反应而失活。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 近年来在研究红霉素半合成衍生物时，均考虑将C-6羟基和C-9羰基进行保护，开发出一系列药物：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1.将9位的羰基做成甲氧乙氧甲基肟后，得到罗红霉素；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2.将C-9上的肟还原后，再和2-(2-甲氧基乙氧基)乙醛进行反应，形成𫫇嗪环，得到地红霉素；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3.将红霉素肟经贝克曼重排后得到扩环产物，再经还原、N-甲基化等反应，将氮原子引入到大环内酯骨架中制得第一个环内含氮的15元环的阿奇霉素；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e4.在9位羰基的α位即8位引入电负性较强的氟原子，即得氟红霉素；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e5.将C-6位羟基甲基化，得到克拉霉素。\u003c/div\u003e","pt":"① 由于红霉素分子中多个羟基及9位上羰基的存在，因此在酸性条件下不稳定，先发生C-9羰基和C-6羟基脱水环合，进一步反应而失活。 ② 近年来在研究红霉素半合成衍生物时，均考虑将C-6羟基和C-9羰基进行保护，开发出一系列药物： 1.将9位的羰基做成甲氧乙氧甲基肟后，得到罗红霉素； 2.将C-9上的肟还原后，再和2-(2-甲氧基乙氧基)乙醛进行反应，形成𫫇嗪环，得到地红霉素； 3.将红霉素肟经贝克曼重排后得到扩环产物，再经还原、N-甲基化等反应，将氮原子引入到大环内酯骨架中制得第一个环内含氮的15元环的阿奇霉素； 4.在9位羰基的α位即8位引入电负性较强的氟原子，即得氟红霉素； 5.将C-6位羟基甲基化，得到克拉霉素。","ok":true,"an":["氮原子","乙醛","第一个","进一步","负性","C-6"]},{"id":"63b837e7e7","no":11,"q":"氯霉素的结构中有两个手性碳原子，临床使用的是哪一种光学异构体？在全合成过程中，如何得到这种异构体？","a":"\u003cdiv class=\"q-ln\"\u003e① 氯霉素的结构中含有两个手性碳原子，有四个旋光异构体。其中仅1R, 2R(-)或D(-)苏阿糖型有抗菌活性，为临床使用的氯霉素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 在氯霉素的全合成过程中，还原一步（//还原的这一步）选择立体选择性还原剂异丙醇铝得到(±)苏阿糖型-1-对硝基苯基-2-氨基丙二醇（氨基物），再采用诱导结晶法进行拆分，得到D(-)-苏阿糖型氨基物，最后得到的氯霉素的构型为1R, 2R(-)或D(-)苏阿糖型。\u003c/div\u003e","pt":"① 氯霉素的结构中含有两个手性碳原子，有四个旋光异构体。其中仅1R, 2R(-)或D(-)苏阿糖型有抗菌活性，为临床使用的氯霉素。 ② 在氯霉素的全合成过程中，还原一步（//还原的这一步）选择立体选择性还原剂异丙醇铝得到(±)苏阿糖型-1-对硝基苯基-2-氨基丙二醇（氨基物），再采用诱导结晶法进行拆分，得到D(-)-苏阿糖型氨基物，最后得到的氯霉素的构型为1R, 2R(-)或D(-)苏阿糖型。","ok":true,"an":["抗菌活性","选择性"]}],"count":11,"done":11},{"label":"第十章","questions":[{"id":"ac6af6afa6","no":1,"q":"化学治疗药","a":"\u003cdiv class=\"q-ln\"\u003e用化学品治疗各种疾病，它包括微生物感染、抗肿瘤化学治疗药，糖尿病化学治疗药等。\u003c/div\u003e","pt":"用化学品治疗各种疾病，它包括微生物感染、抗肿瘤化学治疗药，糖尿病化学治疗药等。","ok":true,"an":["糖尿病","抗肿瘤"]},{"id":"d5a69f859a","no":2,"q":"代谢拮抗 (metabolic antagonism)/致死合成 (lethalsynthesis)","a":"\u003cdiv class=\"q-ln\"\u003e就是设计与生物体内基本代谢物的结构有某种程度相似的化合物，使之竞争性地与特定的酶相互作用，干扰基本代谢物的利用，从而干扰生物大分子的合成；或以伪代谢物的身份掺人生物大分子的合成中，形成伪生物大分子，导致致死合成，从而影响细胞的生长。抗代谢物的设计多采用生物电子等排原理。代谢拮抗概念已广泛应用于抗菌、抗肿瘤及抗疟等药物设计中。\u003c/div\u003e","pt":"就是设计与生物体内基本代谢物的结构有某种程度相似的化合物，使之竞争性地与特定的酶相互作用，干扰基本代谢物的利用，从而干扰生物大分子的合成；或以伪代谢物的身份掺人生物大分子的合成中，形成伪生物大分子，导致致死合成，从而影响细胞的生长。抗代谢物的设计多采用生物电子等排原理。代谢拮抗概念已广泛应用于抗菌、抗肿瘤及抗疟等药物设计中。","ok":true,"an":["生物大分子","生物电子","影响细胞","抗肿瘤","竞争性","排原理"]},{"id":"3bd94abbb0","no":3,"q":"伍德菲尔德学说","a":"\u003cdiv class=\"q-ln\"\u003e该学说认为磺胺类药物能与细菌生长所必需的对氨基苯甲酸 (PABA) 产生竞争性拮抗，干扰了细菌的酶系统对PABA的利用。PABA是叶酸的组成部分，叶酸为微生物生长中必要物质，也是构成体内叶酸辅酶的基本原料。PABA在二氢叶酸合成酶的催化下，与二氢蝶啶焦磷酸酯及谷氨酸或二氢蝶啶焦磷酸酯与对氨基苯甲酰谷氨酸合成二氢叶酸（FAH2）。再在二氢叶酸还原酶的作用下还原成四氢叶酸（FAH4），为细菌合成核酸提供叶酸辅酶。\u003c/div\u003e","pt":"该学说认为磺胺类药物能与细菌生长所必需的对氨基苯甲酸 (PABA) 产生竞争性拮抗，干扰了细菌的酶系统对PABA的利用。PABA是叶酸的组成部分，叶酸为微生物生长中必要物质，也是构成体内叶酸辅酶的基本原料。PABA在二氢叶酸合成酶的催化下，与二氢蝶啶焦磷酸酯及谷氨酸或二氢蝶啶焦磷酸酯与对氨基苯甲酰谷氨酸合成二氢叶酸（FAH2）。再在二氢叶酸还原酶的作用下还原成四氢叶酸（FAH4），为细菌合成核酸提供叶酸辅酶。","ok":true,"an":["磷酸酯","组成","谷氨酸","苯甲酸","竞争性","细菌生长"]},{"id":"7e1a8aa1c5","no":4,"q":"喹诺酮类药物是否可以干扰骨骼的生长？","a":"\u003cdiv class=\"q-ln\"\u003e喹诺酮3位的羧基和4位的羰基可与金属离子形成络合物，影响钙离子的吸收，因而造成对骨骼生长的影响，所以在此类药物的说明书注明16岁以下儿童不宜服用喹诺酮类抗菌药物。\u003c/div\u003e","pt":"喹诺酮3位的羧基和4位的羰基可与金属离子形成络合物，影响钙离子的吸收，因而造成对骨骼生长的影响，所以在此类药物的说明书注明16岁以下儿童不宜服用喹诺酮类抗菌药物。","ok":true,"an":["金属离子","钙离子","抗菌药","说明书"]},{"id":"1767f23314","no":5,"q":"怎样才能解决喹诺酮类药物对中枢的毒副作用？","a":"\u003cdiv class=\"q-ln\"\u003e喹诺酮类抗菌药物的中枢毒性主要是由哌嗪基团与GABA受体结合所致，因此应对此部分结构进行修饰，使极性增大，使药物不进入血脑屏障。\u003c/div\u003e","pt":"喹诺酮类抗菌药物的中枢毒性主要是由哌嗪基团与GABA受体结合所致，因此应对此部分结构进行修饰，使极性增大，使药物不进入血脑屏障。","ok":true,"an":["血脑屏障","抗菌药","受体结合"]},{"id":"c541feffc3","no":6,"q":"查找诺氟沙星的合成路线与环丙沙星比较，能得出哪些有意义的思考？","a":"\u003cdiv class=\"q-ln\"\u003e诺氟沙星与环丙沙星在结构上区别仅是1位上的取代基不同，但却完全是采用不同的合成路线，其原因为硫酸二甲酯可提供乙基正离子，但却难以得到环丙基正离子，所以采用不同的合成路线，若以溴代环丙烷作为亲电试剂，则由于在SN2亲核反应中形成的过渡状态不稳定导致环丙烷开环。\u003c/div\u003e","pt":"诺氟沙星与环丙沙星在结构上区别仅是1位上的取代基不同，但却完全是采用不同的合成路线，其原因为硫酸二甲酯可提供乙基正离子，但却难以得到环丙基正离子，所以采用不同的合成路线，若以溴代环丙烷作为亲电试剂，则由于在SN2亲核反应中形成的过渡状态不稳定导致环丙烷开环。","ok":true,"an":["取代基"]},{"id":"6839a1658e","no":7,"q":"磺胺类抗菌药物作用机制的研究对药物化学的发展有何贡献？","a":"\u003cdiv class=\"q-ln\"\u003e磺胺类抗菌药物的作用机制的研究，建立抗代谢学说，为化学治疗药物的发展奠定坚实的基础，创建药物化学的基础理论，其代谢学说至今仍是药物设计的重要理论之一。\u003c/div\u003e","pt":"磺胺类抗菌药物的作用机制的研究，建立抗代谢学说，为化学治疗药物的发展奠定坚实的基础，创建药物化学的基础理论，其代谢学说至今仍是药物设计的重要理论之一。","ok":true,"an":["化学治疗药","代谢"]},{"id":"01037682f5","no":8,"q":"从抗代谢角度叙述磺胺类药物的结构与活性的关系。","a":"\u003cdiv class=\"q-ln\"\u003e主要考虑磺胺类药物作为抗代谢物替代对氨基苯甲酸参与细菌的四氢叶酸的合成，磺胺类药物在结构和电性与对氨基苯甲酸相似。如果改变其相似性则抗菌活性降低，反之保持其相似性则保持抗菌活性。\u003c/div\u003e","pt":"主要考虑磺胺类药物作为抗代谢物替代对氨基苯甲酸参与细菌的四氢叶酸的合成，磺胺类药物在结构和电性与对氨基苯甲酸相似。如果改变其相似性则抗菌活性降低，反之保持其相似性则保持抗菌活性。","ok":true,"an":["磺胺类药物作","抗菌活性","苯甲酸","叶酸"]},{"id":"5d6cefd190","no":9,"q":"磺胺类药物的构效关系。","a":"","pt":"","ok":false,"an":[]},{"id":"62a7fed6d6","no":10,"q":"试以抗疟药物的研究概况，阐述从天然药物进行结构改造得到新药的途径与方法。","a":"\u003cdiv class=\"q-ln\"\u003e抗疟药物源于天然产物奎宁，通过对其研究改造得到一系列抗疟药物，特别是发现其易代谢部位，对此部位进行封闭得到更好的抗疟药物，另外简化天然产物结构也得到较好抗疟药物。另一个例子是青蒿素。\u003c/div\u003e","pt":"抗疟药物源于天然产物奎宁，通过对其研究改造得到一系列抗疟药物，特别是发现其易代谢部位，对此部位进行封闭得到更好的抗疟药物，另外简化天然产物结构也得到较好抗疟药物。另一个例子是青蒿素。","ok":true,"an":["代谢"]},{"id":"7be7372d63","no":11,"q":"为何在化学治疗药物中，对细菌及真菌的药物研究领先于对病毒药物的研究？如何进一步提高抗病毒药物研究的速度？","a":"\u003cdiv class=\"q-ln\"\u003e抗菌药物和抗真菌药物的作用靶点都选择细菌与人体细胞的不同之处，因此对人体的毒性相对较小，而病毒是利用人体的宿主细胞，自身没有其代谢途径，因而发展速度较慢。抗病毒药物的发展依赖于找到病毒与人体细胞的差异。\u003c/div\u003e","pt":"抗菌药物和抗真菌药物的作用靶点都选择细菌与人体细胞的不同之处，因此对人体的毒性相对较小，而病毒是利用人体的宿主细胞，自身没有其代谢途径，因而发展速度较慢。抗病毒药物的发展依赖于找到病毒与人体细胞的差异。","ok":true,"an":["代谢","抗菌药"]}],"count":11,"done":10},{"label":"第十一章","questions":[{"id":"10e690af1b","no":1,"q":"比较第一代和第二代磺酰脲类口服降糖药的体内代谢过程。","a":"\u003cdiv class=\"q-ln\"\u003e① 第一代磺酰脲类降血糖药在体内代谢部位主要是磺酰基芳环上的对位取代基R，蛋白结合率和代谢速率的不同导致它们作用时间的差异。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1. 如甲苯磺丁脲的分子中R为甲基，在体内易发生氧化生成对羟甲基苯磺丁脲。虽然此代谢物仍保留一定的降血糖活性，但它迅速被进一步氧化成酸而失活，其半衰期仅为4.5~6.5小时。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2. 当以卤素代替甲基，得到氯磺丙脲，由于氯原子不易代谢失活，丙基链上的羟化作用相对缓慢，因此氯磺丙脲是一种长效药物，其半衰期长达36小时，作用持续时间可达60小时。只需每日给药一次，同时，由于氯原子不易被氧化，故常以原型从肾脏排出。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 对位如引人体积较大的取代基如β-芳酰氨基乙基时，活性更强，此即第二代口服降血糖药。其特点是吸收迅速，与血浆蛋白的结合率高，作用强且长效、低毒。其在体内主要经脂环的羟基化而失活。\u003c/div\u003e","pt":"① 第一代磺酰脲类降血糖药在体内代谢部位主要是磺酰基芳环上的对位取代基R，蛋白结合率和代谢速率的不同导致它们作用时间的差异。 1. 如甲苯磺丁脲的分子中R为甲基，在体内易发生氧化生成对羟甲基苯磺丁脲。虽然此代谢物仍保留一定的降血糖活性，但它迅速被进一步氧化成酸而失活，其半衰期仅为4.5~6.5小时。 2. 当以卤素代替甲基，得到氯磺丙脲，由于氯原子不易代谢失活，丙基链上的羟化作用相对缓慢，因此氯磺丙脲是一种长效药物，其半衰期长达36小时，作用持续时间可达60小时。只需每日给药一次，同时，由于氯原子不易被氧化，故常以原型从肾脏排出。 ② 对位如引人体积较大的取代基如β-芳酰氨基乙基时，活性更强，此即第二代口服降血糖药。其特点是吸收迅速，与血浆蛋白的结合率高，作用强且长效、低毒。其在体内主要经脂环的羟基化而失活。","ok":true,"an":["血浆蛋白","易代谢失活","位取代基","吸收迅速","卤素","蛋白结合"]},{"id":"ada8c0c7f6","no":2,"q":"简述呋塞米、氢氯噻嗪、乙酰唑胺、螺内酯的利尿机制，并简要说明为什么长期使用利尿药一般都要求联合用药？","a":"\u003cdiv class=\"q-ln\"\u003e(药理)\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e利尿药主要通过影响体内电解质的代谢来发挥作用，这样就会引起体内电解质的流失或潴留。有些药物是排钠排钾药，有些属于排钠保钾药，采取联合用药，可产生协同作用。一方面增加利尿强度，另一方面可以降低副作用。\u003c/div\u003e","pt":"(药理) 利尿药主要通过影响体内电解质的代谢来发挥作用，这样就会引起体内电解质的流失或潴留。有些药物是排钠排钾药，有些属于排钠保钾药，采取联合用药，可产生协同作用。一方面增加利尿强度，另一方面可以降低副作用。","ok":true,"an":["代谢","保钾","排钾","电解质"]}],"count":2,"done":2},{"label":"第十二章","questions":[{"id":"7dcfdc5c2f","no":1,"q":"雌激素活性结构要求什么基团？","a":"\u003cdiv class=\"q-ln\"\u003e经研究发现雌激素和受体的结合，需要分子 C-3 和 C-17 两端均有一OH基。曾设想当分子中可以形成氢键的基团如酮、酚羟基及醇羟基等，氢键的基团之间距离为0.855nm时，具有最适宜的雌激素活性结构要求。\u003c/div\u003e","pt":"经研究发现雌激素和受体的结合，需要分子 C-3 和 C-17 两端均有一OH基。曾设想当分子中可以形成氢键的基团如酮、酚羟基及醇羟基等，氢键的基团之间距离为0.855nm时，具有最适宜的雌激素活性结构要求。","ok":true,"an":["形成氢键","酚羟基","C-17","醇羟基","C-3","OH"]},{"id":"6d3c405d4e","no":2,"q":"在雄甾烷母核中不同的部位，引入不同的基团可以增强或减弱雄激素的活性，请举例说明结构对性质的影响。","a":"\u003cdiv class=\"q-ln\"\u003e在雄甾烷母核中引入 3-酮基或 3α-羟基均能增强雄激素活性。在雌甾烷的 17β-羟基是已知取代基中活性最强的。17β-羟基化合物的长效酯类在体内水解成为游离醇而产生药效。17α-氧原子对与受体部位的连接是很重要的。17α-烃基可以阻止在这个部位的代谢变化，并且因此而使所得化合物具有口服的活性。在 16 位引入乙炔基则显示孕激素的活性，如妊娠素。当雄甾烷环扩大或缩小时，一般都使雄激素活性及同化作用减弱或破坏。在 A 环上引入一个 sp² 杂化碳原子，使环在一个平面上，从而可以得到更强的同化作用，如康力龙与康复龙。通过以上例子说明，物质的性质决定于它的结构。\u003c/div\u003e","pt":"在雄甾烷母核中引入 3-酮基或 3α-羟基均能增强雄激素活性。在雌甾烷的 17β-羟基是已知取代基中活性最强的。17β-羟基化合物的长效酯类在体内水解成为游离醇而产生药效。17α-氧原子对与受体部位的连接是很重要的。17α-烃基可以阻止在这个部位的代谢变化，并且因此而使所得化合物具有口服的活性。在 16 位引入乙炔基则显示孕激素的活性，如妊娠素。当雄甾烷环扩大或缩小时，一般都使雄激素活性及同化作用减弱或破坏。在 A 环上引入一个 sp² 杂化碳原子，使环在一个平面上，从而可以得到更强的同化作用，如康力龙与康复龙。通过以上例子说明，物质的性质决定于它的结构。","ok":true,"an":["代谢","孕激素","口服","氧原子","活性最强","取代基"]},{"id":"47b368b568","no":3,"q":"利用改造结构的办法，如何得到效果最好的抗雄激素药物？","a":"\u003cdiv class=\"q-ln\"\u003e根据雄激素结构作用的药物在结构上要求有 17-羟基的特点，模仿雌分子的适当位置接上一个大基团，则产生空间位阻，能影响雄激素作用。根据这样的设计思想，成功地合成了一类新的副作用少的抗雄激素药物，如 TSAA-291 就是其中抗雄激素作用最好的一个，可用于治疗前列腺肥大、多毛症和痤疮等。\u003c/div\u003e","pt":"根据雄激素结构作用的药物在结构上要求有 17-羟基的特点，模仿雌分子的适当位置接上一个大基团，则产生空间位阻，能影响雄激素作用。根据这样的设计思想，成功地合成了一类新的副作用少的抗雄激素药物，如 TSAA-291 就是其中抗雄激素作用最好的一个，可用于治疗前列腺肥大、多毛症和痤疮等。","ok":true,"an":["TSAA-291","空间位阻"]},{"id":"8639e1eda8","no":4,"q":"科学工作者如何发现强力口服避孕药？","a":"\u003cdiv class=\"q-ln\"\u003e由于天然黄体酮在胃肠道中易被破坏而失效，口服无效，临床上为了获得长效孕激素而对甾体酮做了大量构效关系的研究。在黄体酮 17α-位引入羟基使活性降低，但是将羟基酯化则作用强而持久。继而在 6-位上引入双键、氯素或甲基均可增强作用，如 6α-甲基-17α-羟基黄体酮肌注注射效力为黄体酮的 50~60 倍，且可口服，又如甲羟孕酮、甲地孕酮和己酸孕酮都是强力口服孕激素。临床上常和雌激素配合使用作为口服避孕药。\u003c/div\u003e","pt":"由于天然黄体酮在胃肠道中易被破坏而失效，口服无效，临床上为了获得长效孕激素而对甾体酮做了大量构效关系的研究。在黄体酮 17α-位引入羟基使活性降低，但是将羟基酯化则作用强而持久。继而在 6-位上引入双键、氯素或甲基均可增强作用，如 6α-甲基-17α-羟基黄体酮肌注注射效力为黄体酮的 50~60 倍，且可口服，又如甲羟孕酮、甲地孕酮和己酸孕酮都是强力口服孕激素。临床上常和雌激素配合使用作为口服避孕药。","ok":true,"an":["胃肠道","黄体酮","孕激素","雌激素","引入双键","构效关系"]},{"id":"d068fd2954","no":5,"q":"雌激素与孕激素合并用药为什么可以避孕？","a":"\u003cdiv class=\"q-ln\"\u003e正常妇女腺垂体分泌促卵泡成熟激素（FSH）刺激卵巢泡生长发育，并促进卵泡细胞雌激素。当卵泡成熟，体内雌激素增加到一定水平时，雌激素则转而反馈地抑制 FSH 的分泌，并促使腺垂体释放黄体生成激素（LH），来干扰雌激素的作用。这样在 LH 和 FSH 的共同作用下，成熟卵泡发生排卵和形成黄体并分泌黄体酮。黄体酮具有对 LH 分泌的反馈性抑制作用。因此如果外源性给妇女用黄体酮，则使排卵期血中 LH 高峰消失；如果用雌激素则能抑制 FSH 分泌，使卵泡的生长成熟过程受抑制，因而没有成熟卵泡可提供排卵。因此，雌激素与孕激素（黄体酮）合并用药可以避孕。\u003c/div\u003e","pt":"正常妇女腺垂体分泌促卵泡成熟激素（FSH）刺激卵巢泡生长发育，并促进卵泡细胞雌激素。当卵泡成熟，体内雌激素增加到一定水平时，雌激素则转而反馈地抑制 FSH 的分泌，并促使腺垂体释放黄体生成激素（LH），来干扰雌激素的作用。这样在 LH 和 FSH 的共同作用下，成熟卵泡发生排卵和形成黄体并分泌黄体酮。黄体酮具有对 LH 分泌的反馈性抑制作用。因此如果外源性给妇女用黄体酮，则使排卵期血中 LH 高峰消失；如果用雌激素则能抑制 FSH 分泌，使卵泡的生长成熟过程受抑制，因而没有成熟卵泡可提供排卵。因此，雌激素与孕激素（黄体酮）合并用药可以避孕。","ok":true,"an":["黄体酮","黄体"]},{"id":"1789b8c254","no":6,"q":"可的松和氢化可的松有哪些副作用？改进情况如何？","a":"\u003cdiv class=\"q-ln\"\u003e两者都有抗炎作用，都能产生钠潴留和排钾的副作用，并能引起水肿、虚胖，这是蛋白质分解作用而导致的体内负氮平衡和肾上腺萎缩。这些严重的副作用影响了临床应用。因此希望通过结构改造除去或减轻副作用，并增强抗炎作用。科学工作者进行了大量的研究，在可的松和氢化可的松分子上的 C-1 或 C-2 引入双键，分别得到泼尼松和氢化泼尼松。两者的抗炎作用较母体相应提高了 3~4 倍，副作用减少。以后相继发现在 C-6 引入甲基或卤素，C-9α 引入卤素，C-16α 引入羟基或甲基均可增强抗炎作用和去除钠潴留作用。例如 6α-甲基泼尼松龙，抗炎和增强肝糖元的作用较泼尼松龙增加 3 倍；6α-氟泼尼松龙的作用增加 3~4 倍，且没有钠潴留作用，适宜长期应用。氟羟泼尼松龙对风湿性关节炎及过敏症的疗效均优于氢化可的松，亦无钠潴留作用。其缩丙酮醋酸酯称为醋酸曲安西龙，抗炎作用较氢化可的松强 20~40 倍，几乎无钠潴留作用。适用于类风湿关节炎、急性扭伤等症。总之通过结构改造提高抗炎作用，消除副作用的工作仍在继续研究中。\u003c/div\u003e","pt":"两者都有抗炎作用，都能产生钠潴留和排钾的副作用，并能引起水肿、虚胖，这是蛋白质分解作用而导致的体内负氮平衡和肾上腺萎缩。这些严重的副作用影响了临床应用。因此希望通过结构改造除去或减轻副作用，并增强抗炎作用。科学工作者进行了大量的研究，在可的松和氢化可的松分子上的 C-1 或 C-2 引入双键，分别得到泼尼松和氢化泼尼松。两者的抗炎作用较母体相应提高了 3~4 倍，副作用减少。以后相继发现在 C-6 引入甲基或卤素，C-9α 引入卤素，C-16α 引入羟基或甲基均可增强抗炎作用和去除钠潴留作用。例如 6α-甲基泼尼松龙，抗炎和增强肝糖元的作用较泼尼松龙增加 3 倍；6α-氟泼尼松龙的作用增加 3~4 倍，且没有钠潴留作用，适宜长期应用。氟羟泼尼松龙对风湿性关节炎及过敏症的疗效均优于氢化可的松，亦无钠潴留作用。其缩丙酮醋酸酯称为醋酸曲安西龙，抗炎作用较氢化可的松强 20~40 倍，几乎无钠潴留作用。适用于类风湿关节炎、急性扭伤等症。总之通过结构改造提高抗炎作用，消除副作用的工作仍在继续研究中。","ok":true,"an":["氢化泼尼松","蛋白质分解","抗炎","引入双键","引入甲基","引入羟基"]},{"id":"8f11a6675f","no":7,"q":"从构效关系来说明肾上腺皮质激素在糖代谢和电解质代谢中所起的作用。","a":"\u003cdiv class=\"q-ln\"\u003e肾上腺皮质激素的生理作用有较高的结构专属性，骨架全反式对活性是必需的。结构特点一般 17-位均有一个羟甲基酮，并在环 A 上具有 Δ⁴-3-酮基。电解质皮质激素如醛甾酮一般在 11-位上没有氧原子或氧原子团，但包括在酯环内；如可的松及氢化可的松在 17 位上有 α-羟基和 11-位有含氧原子的基团（酮基或 β-羟基）。两类作用并非绝对的，由于对受体结合有最适和次适之分，因此在代谢调节上常具有广泛的生理作用，可通过某些基团的影响，加强或减弱。因而通过构效关系的研究可设计出选择性的新药，以减少副作用。将 C-9 和 C-16 位分别引入氟和甲基即地塞米松，不仅数十倍增加糖代谢皮质激素作用，而且几乎完全消除了盐皮质激素的副作用。引入双键，只有 Δ¹ 增强活性，减低副作用，如泼尼松及氢化泼尼松的活性为氢化可的松的 3~5 倍，可能由于 Δ¹ 双键使 A 环几何形状发生变化所致。据报道在血浆中含 Δ⁴ 的化合物比氢化可的松具有更长的半衰期，因其代谢物排泄比较缓慢。通过以上分析可知在肾上腺皮质激素的骨架中引入不同的基团，对活性有影响，因而影响对其代谢的调节作用。\u003c/div\u003e","pt":"肾上腺皮质激素的生理作用有较高的结构专属性，骨架全反式对活性是必需的。结构特点一般 17-位均有一个羟甲基酮，并在环 A 上具有 Δ⁴-3-酮基。电解质皮质激素如醛甾酮一般在 11-位上没有氧原子或氧原子团，但包括在酯环内；如可的松及氢化可的松在 17 位上有 α-羟基和 11-位有含氧原子的基团（酮基或 β-羟基）。两类作用并非绝对的，由于对受体结合有最适和次适之分，因此在代谢调节上常具有广泛的生理作用，可通过某些基团的影响，加强或减弱。因而通过构效关系的研究可设计出选择性的新药，以减少副作用。将 C-9 和 C-16 位分别引入氟和甲基即地塞米松，不仅数十倍增加糖代谢皮质激素作用，而且几乎完全消除了盐皮质激素的副作用。引入双键，只有 Δ¹ 增强活性，减低副作用，如泼尼松及氢化泼尼松的活性为氢化可的松的 3~5 倍，可能由于 Δ¹ 双键使 A 环几何形状发生变化所致。据报道在血浆中含 Δ⁴ 的化合物比氢化可的松具有更长的半衰期，因其代谢物排泄比较缓慢。通过以上分析可知在肾上腺皮质激素的骨架中引入不同的基团，对活性有影响，因而影响对其代谢的调节作用。","ok":true,"an":["专属性","排泄","氢化泼尼松","氧原子","引入双键","选择性"]},{"id":"142ded6a72","no":8,"q":"地塞米松的构效关系？","a":"","pt":"","ok":false,"an":[]}],"count":8,"done":7},{"label":"第十三章","questions":[{"id":"5eede8b20b","no":1,"q":"维生素 (vitamin)","a":"\u003cdiv class=\"q-ln\"\u003e是一类维持生命正常代谢功能所必须的微量营养物质。绝大多数维生素是酶的辅酶或辅酶的组成部分，参与机体各种酶促反应，作用于机体的能量转移和代谢调节。\u003c/div\u003e","pt":"是一类维持生命正常代谢功能所必须的微量营养物质。绝大多数维生素是酶的辅酶或辅酶的组成部分，参与机体各种酶促反应，作用于机体的能量转移和代谢调节。","ok":true,"an":["代谢","组成","营养物质","辅酶"]},{"id":"62a1f18126","no":2,"q":"为使维生素A制剂不被破坏，可以采取什么方法（至少举出三种）？采取方法","a":"\u003cdiv class=\"q-ln\"\u003e① 溶于含维生素E的油中。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 加入叔丁基对羟基茴香醚。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 加入稳定剂。\u003c/div\u003e","pt":"① 溶于含维生素E的油中。 ② 加入叔丁基对羟基茴香醚。 ③ 加入稳定剂。","ok":true,"an":["稳定剂"]},{"id":"71808e9d2c","no":3,"q":"为何维生素C具有酸性？","a":"\u003cdiv class=\"q-ln\"\u003e分子中含有连二烯醇结构，由于两个烯醇羟基极易游离，释放出H⁺，虽不含羧基，水溶液仍显酸性。但C-2上的羟基可以与C-1的羰基形成分子内氢键，故酸性较C-3上的羟基弱。\u003c/div\u003e","pt":"分子中含有连二烯醇结构，由于两个烯醇羟基极易游离，释放出H⁺，虽不含羧基，水溶液仍显酸性。但C-2上的羟基可以与C-1的羰基形成分子内氢键，故酸性较C-3上的羟基弱。","ok":true,"an":["烯醇羟基","烯醇","水溶液","酸性较","C-2"]},{"id":"d223a2c1da","no":4,"q":"维生素C在贮存中变色的主要原因是什么？","a":"\u003cdiv class=\"q-ln\"\u003e主要原因是维生素C被氧化成去氢抗坏血酸后，去氢抗坏血酸在无氧条件下易发生脱水和水解反应。在酸性介质中受质子催化，反应速度比在碱性介质中快，进而脱羧生成呋喃甲醛，呋喃甲醛易于聚合而呈现黄色斑点。\u003c/div\u003e","pt":"主要原因是维生素C被氧化成去氢抗坏血酸后，去氢抗坏血酸在无氧条件下易发生脱水和水解反应。在酸性介质中受质子催化，反应速度比在碱性介质中快，进而脱羧生成呋喃甲醛，呋喃甲醛易于聚合而呈现黄色斑点。","ok":true,"an":["水解反应","呋喃","甲醛"]}],"count":4,"done":4}],"count":114,"done":102},{"subject":"药物分析","chapters":[{"label":"第一 & 二章","questions":[{"id":"e29ba57772","no":1,"q":"药物分析 (pharmaceutical analysis)","a":"\u003cdiv class=\"q-ln\"\u003e是指利用分析测定手段，发展药物的分析方法，研究药物的质量规律，对药物进行全面的分析、检测与控制的科学。\u003c/div\u003e","pt":"是指利用分析测定手段，发展药物的分析方法，研究药物的质量规律，对药物进行全面的分析、检测与控制的科学。","ok":true,"an":["分析方法"]},{"id":"fd39dd8b38","no":2,"q":"药品标准","a":"\u003cdiv class=\"q-ln\"\u003e是指根据药物自身的理化与生物学特性，按照批准的处方来源、生产工艺、贮藏运输等所制定的，用以检测药品质量是否达到用药要求，并衡量其质量是否均一稳定的技术规定。\u003c/div\u003e","pt":"是指根据药物自身的理化与生物学特性，按照批准的处方来源、生产工艺、贮藏运输等所制定的，用以检测药品质量是否达到用药要求，并衡量其质量是否均一稳定的技术规定。","ok":true,"an":["生物学","生产工艺"]},{"id":"f688ddc067","no":3,"q":"什么叫恒重，什么叫空白试验，什么叫标准品、对照品？","a":"\u003cdiv class=\"q-ln\"\u003e恒重: 除另有规定外，指供试品连续两次干燥或炽灼后称重的差异在0.3mg以下的质量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e空白试验: 是不加供试品或以等量溶剂代替供试液的情况下，同法操作所得的结果。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e标准品、对照品是用于鉴别、检查、含量测定的物质。\u003c/div\u003e","pt":"恒重: 除另有规定外，指供试品连续两次干燥或炽灼后称重的差异在0.3mg以下的质量。 空白试验: 是不加供试品或以等量溶剂代替供试液的情况下，同法操作所得的结果。 标准品、对照品是用于鉴别、检查、含量测定的物质。","ok":true,"an":["炽灼后称重","含量测定","供试品"]},{"id":"349c6b1c1d","no":4,"q":"药品检验工作的基本程序是什么？","a":"\u003cdiv class=\"q-ln\"\u003e取样、检验（鉴别、检查、含量测定）、记录和报告。\u003c/div\u003e","pt":"取样、检验（鉴别、检查、含量测定）、记录和报告。","ok":true,"an":["含量测定"]},{"id":"a85d5c0b78","no":5,"q":"药物 (drugs)","a":"\u003cdiv class=\"q-ln\"\u003e是指用于预防、治疗、诊断人的疾病，有目的地调节人的生理功能，并规定有适应症或功能主治、用法和用量的物质。\u003c/div\u003e","pt":"是指用于预防、治疗、诊断人的疾病，有目的地调节人的生理功能，并规定有适应症或功能主治、用法和用量的物质。","ok":true,"an":["调节人"]},{"id":"c3328dcd3f","no":6,"q":"药品 (medicinal products)","a":"\u003cdiv class=\"q-ln\"\u003e是指药物和辅料经一定的处方和工艺制备而成的、可供临床使用的商品。包括中药、化学药和生物制品等。\u003c/div\u003e","pt":"是指药物和辅料经一定的处方和工艺制备而成的、可供临床使用的商品。包括中药、化学药和生物制品等。","ok":true,"an":["工艺制备"]},{"id":"830dd1c8ce","no":7,"q":"药物分析的任务？","a":"\u003cdiv class=\"q-ln\"\u003e① 药物研究与开发中的分析和监测。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药物质量源于设计的生产工艺过程（关键工艺过程、关键工艺参数和关键质量属性）的全面分析控制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 基于药物全面药学研究工作基础上的药品质量标准的研究与制定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 保障药品安全有效质量可控的分析检验与监督管理。\u003c/div\u003e","pt":"① 药物研究与开发中的分析和监测。 ② 药物质量源于设计的生产工艺过程（关键工艺过程、关键工艺参数和关键质量属性）的全面分析控制。 ③ 基于药物全面药学研究工作基础上的药品质量标准的研究与制定。 ④ 保障药品安全有效质量可控的分析检验与监督管理。","ok":true,"an":["安全有效","生产工艺","质量标准","药学研究"]},{"id":"de48226019","no":8,"q":"药品质量研究的目的？","a":"\u003cdiv class=\"q-ln\"\u003e针对药品的质量进行全面的研究，制定适宜的质量控制项目与指标要求，保障药品质量稳定均一可控，达到用药安全、有效和合理的目标。\u003c/div\u003e","pt":"针对药品的质量进行全面的研究，制定适宜的质量控制项目与指标要求，保障药品质量稳定均一可控，达到用药安全、有效和合理的目标。","ok":true,"an":["质量控制"]},{"id":"be17e9e312","no":9,"q":"原料药物稳定性试验的内容？","a":"","pt":"","ok":false,"an":[]},{"id":"5a0b351723","no":10,"q":"标准物质 (reference substance)","a":"\u003cdiv class=\"q-ln\"\u003e是指供药品检验（鉴别、检查、含量或效价测定）中使用的，具有确定特性或量值，用于校准设备、评价测量方法、给供试品赋值或鉴别用的物质。\u003c/div\u003e","pt":"是指供药品检验（鉴别、检查、含量或效价测定）中使用的，具有确定特性或量值，用于校准设备、评价测量方法、给供试品赋值或鉴别用的物质。","ok":true,"an":["效价测定","供试品"]},{"id":"77332fdff5","no":11,"q":"恒重","a":"\u003cdiv class=\"q-ln\"\u003e除另有规定外，指供试品连续两次干燥或炽灼后称重的差异在0.3mg以下的质量。干燥至恒重的第二次及以后各次称重均应在规定条件下继续干燥1小时后进行，炽灼至恒重的第二次称重应在继续炽灼30分钟后进行。\u003c/div\u003e","pt":"除另有规定外，指供试品连续两次干燥或炽灼后称重的差异在0.3mg以下的质量。干燥至恒重的第二次及以后各次称重均应在规定条件下继续干燥1小时后进行，炽灼至恒重的第二次称重应在继续炽灼30分钟后进行。","ok":true,"an":["炽灼后称重","供试品"]}],"count":11,"done":10},{"label":"第三章","questions":[{"id":"b7cd871512","no":1,"q":"药物的鉴别试验","a":"\u003cdiv class=\"q-ln\"\u003e是根据药物的分子结构、理化性质，采用物理、化学或生物学方法来判断药物的真伪。\u003c/div\u003e","pt":"是根据药物的分子结构、理化性质，采用物理、化学或生物学方法来判断药物的真伪。","ok":true,"an":["理化性质","生物学"]},{"id":"95edd099ed","no":2,"q":"一般鉴别试验","a":"\u003cdiv class=\"q-ln\"\u003e是依据某一类药物的化学结构或理化性质的特征，通过化学反应来鉴别药物的真伪。对无机药物是根据其组成的阴离子和阳离子的特殊反应；对有机药物则大都采用典型的官能团反应。因此一般鉴别试验只能证实是某一类药物，而不能证实是哪一种药物。\u003c/div\u003e","pt":"是依据某一类药物的化学结构或理化性质的特征，通过化学反应来鉴别药物的真伪。对无机药物是根据其组成的阴离子和阳离子的特殊反应；对有机药物则大都采用典型的官能团反应。因此一般鉴别试验只能证实是某一类药物，而不能证实是哪一种药物。","ok":true,"an":["理化性质","化学反应","官能团","阳离子","阴离子","组成"]},{"id":"d7d2488642","no":3,"q":"专属鉴别试验","a":"\u003cdiv class=\"q-ln\"\u003e是根据每一种药物化学结构的差异及其物理化学特性不同，选用某些特有的灵敏的定性反应，证实被鉴别物是某一种药物，以鉴别药物的真伪。\u003c/div\u003e","pt":"是根据每一种药物化学结构的差异及其物理化学特性不同，选用某些特有的灵敏的定性反应，证实被鉴别物是某一种药物，以鉴别药物的真伪。","ok":true,"an":["化学结构"]},{"id":"efe3faf8db","no":4,"q":"色谱鉴别法","a":"\u003cdiv class=\"q-ln\"\u003e色谱鉴别法是利用不同物质在不同色谱条件下，产生各自的特征色谱行为（R\u003csub\u003ef\u003c/sub\u003e值或t\u003csub\u003eR\u003c/sub\u003e值）进行的鉴别试验。\u003c/div\u003e","pt":"色谱鉴别法是利用不同物质在不同色谱条件下，产生各自的特征色谱行为（R f 值或t R 值）进行的鉴别试验。","ok":true,"an":["特征色谱行","产生各自"]},{"id":"689983ab47","no":5,"q":"简述药物分析中常用的鉴别方法。","a":"\u003cdiv class=\"q-ln\"\u003e药物分析中常用的鉴别试验方法有化学、光谱、色谱、显微、生物学、指纹图谱与特征图谱鉴别法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 化学鉴别法：包括测定生成物的熔点，在适当条件下产生颜色、荧光或使试剂褪色，发生沉淀反应或产生气体。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 光谱鉴别法：包括紫外光谱鉴别法、红外光谱鉴别法、近红外光谱法、原子吸收法、核磁共振法、质谱鉴别法、粉末X射线衍射法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 色谱鉴别法：色谱鉴别法是利用不同物质在不同色谱条件下，产生各自的特征色谱行为（R\u003csub\u003ef\u003c/sub\u003e值或t\u003csub\u003eR\u003c/sub\u003e值）进行的鉴别试验。采用与对照品（或经确证的已知药品）在相同的条件下进行色谱分离，并进行比较，根据两者保留行为和检测结果是否一致来验证药品的真伪。包括薄层色谱、高效液相色谱、气相色谱法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 显微鉴别法：主要用于中药及其制剂的鉴别，通常采用显微镜对药材的（饮片）切片、粉末、解离组织或表面制片，以及含饮片粉末的制剂中饮片的组织、细胞或内含物等特征进行鉴别的一种方法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 生物学法：利用药效学和分子生物学等有关技术来鉴定药物品质的一种方法，主要用于抗生素、生化药物以及中药的鉴别，通常分为生物效应鉴别法和基因鉴别法两大类。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 指纹图谱与特征图谱鉴别法：建立中药指纹图谱的目的是通过对所得到的能够体现中药整体特性的图谱识别，提供一种能够比较全面的控制中药质量的方法，从化学物质基础的角度保证中药制剂质量的稳定和可靠。\u003c/div\u003e","pt":"药物分析中常用的鉴别试验方法有化学、光谱、色谱、显微、生物学、指纹图谱与特征图谱鉴别法。 ① 化学鉴别法：包括测定生成物的熔点，在适当条件下产生颜色、荧光或使试剂褪色，发生沉淀反应或产生气体。 ② 光谱鉴别法：包括紫外光谱鉴别法、红外光谱鉴别法、近红外光谱法、原子吸收法、核磁共振法、质谱鉴别法、粉末X射线衍射法。 ③ 色谱鉴别法：色谱鉴别法是利用不同物质在不同色谱条件下，产生各自的特征色谱行为（R f 值或t R 值）进行的鉴别试验。采用与对照品（或经确证的已知药品）在相同的条件下进行色谱分离，并进行比较，根据两者保留行为和检测结果是否一致来验证药品的真伪。包括薄层色谱、高效液相色谱、气相色谱法。 ④ 显微鉴别法：主要用于中药及其制剂的鉴别，通常采用显微镜对药材的（饮片）切片、粉末、解离组织或表面制片，以及含饮片粉末的制剂中饮片的组织、细胞或内含物等特征进行鉴别的一种方法。 ⑤ 生物学法：利用药效学和分子生物学等有关技术来鉴定药物品质的一种方法，主要用于抗生素、生化药物以及中药的鉴别，通常分为生物效应鉴别法和基因鉴别法两大类。 ⑥ 指纹图谱与特征图谱鉴别法：建立中药指纹图谱的目的是通过对所得到的能够体现中药整体特性的图谱识别，提供一种能够比较全面的控制中药质量的方法，从化学物质基础的角度保证中药制剂质量的稳定和可靠。","ok":true,"an":["色谱鉴别法","化学鉴别法","光谱鉴别法","显微鉴别法","发生沉淀反应","生物学法"]},{"id":"bc74bb1108","no":6,"q":"什么是化学鉴别法","a":"\u003cdiv class=\"q-ln\"\u003e是依据某一类药物的化学结构或理化性质的特征，通过化学反应来鉴别药物的真伪。\u003c/div\u003e","pt":"是依据某一类药物的化学结构或理化性质的特征，通过化学反应来鉴别药物的真伪。","ok":true,"an":["理化性质","化学反应"]},{"id":"b032a67b8c","no":7,"q":"简述影响鉴别试验的条件。","a":"\u003cdiv class=\"q-ln\"\u003e鉴别试验的目的是判断药物的真伪，它以所采用的化学反应或物理特性产生的明显的易于觉察的特征变化为依据，因此，鉴别试验必须在规定条件下完成，否则将会影响结果的判断。影响鉴别反应的因素主要有被测物浓度、试剂的用量、溶液的温度、pH、反应时间和干扰物质等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 溶液的浓度：在鉴别试验中加入的各种试剂一般是过量的，溶液的浓度主要是指被鉴别药物的浓度。鉴别试验多采用观察沉淀、颜色或测定各种光学参数（λmax、λmin、A）的变化来判定结果，药物的浓度直接影响上述参数的变化，必须严格规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 溶液的温度：温度对化学反应的影响很大，一般温度每升高 10℃，可使反应速度增加 2~4 倍。但温度的升高也可使某些生成物分解，导致颜色变浅，甚至观察不到阳性结果。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 溶液的酸碱度：许多鉴别反应都需要在一定酸碱度的条件下才能进行。溶液酸碱度的作用，在于能使各反应物有足够的浓度处于反应活化状态，使反应生成物处于稳定和易于观测的状态。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 试验时间：有机化合物的化学反应和无机化合物不同，一般反应速度较慢，达到预期试验结果需要较长的时间。这是因为有机化合物是以共价键相结合，化学反应能否进行，依赖于共价键的断裂和新价键形成的难易，这些价键的更替需要一定的反应时间和条件。同时在化学反应过程中，有时存在着许多中间阶段，甚至需加入催化剂才能启动反应。因此，使鉴别反应完成，需要一定时间。\u003c/div\u003e","pt":"鉴别试验的目的是判断药物的真伪，它以所采用的化学反应或物理特性产生的明显的易于觉察的特征变化为依据，因此，鉴别试验必须在规定条件下完成，否则将会影响结果的判断。影响鉴别反应的因素主要有被测物浓度、试剂的用量、溶液的温度、pH、反应时间和干扰物质等。 ① 溶液的浓度：在鉴别试验中加入的各种试剂一般是过量的，溶液的浓度主要是指被鉴别药物的浓度。鉴别试验多采用观察沉淀、颜色或测定各种光学参数（λmax、λmin、A）的变化来判定结果，药物的浓度直接影响上述参数的变化，必须严格规定。 ② 溶液的温度：温度对化学反应的影响很大，一般温度每升高 10℃，可使反应速度增加 2~4 倍。但温度的升高也可使某些生成物分解，导致颜色变浅，甚至观察不到阳性结果。 ③ 溶液的酸碱度：许多鉴别反应都需要在一定酸碱度的条件下才能进行。溶液酸碱度的作用，在于能使各反应物有足够的浓度处于反应活化状态，使反应生成物处于稳定和易于观测的状态。 ④ 试验时间：有机化合物的化学反应和无机化合物不同，一般反应速度较慢，达到预期试验结果需要较长的时间。这是因为有机化合物是以共价键相结合，化学反应能否进行，依赖于共价键的断裂和新价键形成的难易，这些价键的更替需要一定的反应时间和条件。同时在化学反应过程中，有时存在着许多中间阶段，甚至需加入催化剂才能启动反应。因此，使鉴别反应完成，需要一定时间。","ok":true,"an":["鉴别反应","化学反应","催化剂","预期","共价键","max"]},{"id":"e72e18c2a9","no":8,"q":"简述薄层色谱法鉴别药物的方法","a":"\u003cdiv class=\"q-ln\"\u003e将浓度相同的对照品溶液和供试品溶液在同一块薄层板上点样、展开与检视，供试品溶液所显主斑点的位置（Rf）与颜色（或荧光）应与对照品溶液的主斑点一致，而且两斑点的大小、颜色的深浅也应大致相同。有时化学药品可采用供试品溶液与标准溶液混合点样、展开，与标准物质相应斑点应为单一、紧密斑点。选用与供试品化学结构相似的药物对照品或者杂质对照品，两者的比移值应不同，将上述两种溶液等体积混合，应显示两个清晰分离的斑点。\u003c/div\u003e","pt":"将浓度相同的对照品溶液和供试品溶液在同一块薄层板上点样、展开与检视，供试品溶液所显主斑点的位置（Rf）与颜色（或荧光）应与对照品溶液的主斑点一致，而且两斑点的大小、颜色的深浅也应大致相同。有时化学药品可采用供试品溶液与标准溶液混合点样、展开，与标准物质相应斑点应为单一、紧密斑点。选用与供试品化学结构相似的药物对照品或者杂质对照品，两者的比移值应不同，将上述两种溶液等体积混合，应显示两个清晰分离的斑点。","ok":true,"an":["采用供试品溶液","杂质对照品","供试品溶液","两种溶液","化学结构","供试品"]}],"count":8,"done":8},{"label":"第四章","questions":[{"id":"f6b8b692a9","no":1,"q":"一般杂质","a":"\u003cdiv class=\"q-ln\"\u003e是指在自然界中分布较广泛，在多种药物生产和贮存过程中容易引入的杂质。如水分、氯化物、硫酸盐等。\u003c/div\u003e","pt":"是指在自然界中分布较广泛，在多种药物生产和贮存过程中容易引入的杂质。如水分、氯化物、硫酸盐等。","ok":true,"an":["硫酸盐","分布"]},{"id":"67d5dcbefc","no":2,"q":"特殊杂质","a":"\u003cdiv class=\"q-ln\"\u003e是指特定药物在生产和贮存过程中引入的杂质。这类杂质随着药物合成工艺路线和结构的不同而不同，即有关物质。例如阿司匹林生产和贮存过程中引入的水杨酸，硝苯地平中引入的亚硝基吡啶杂质等。\u003c/div\u003e","pt":"是指特定药物在生产和贮存过程中引入的杂质。这类杂质随着药物合成工艺路线和结构的不同而不同，即有关物质。例如阿司匹林生产和贮存过程中引入的水杨酸，硝苯地平中引入的亚硝基吡啶杂质等。","ok":true,"an":["合成工艺路线","水杨酸","硝苯地平"]},{"id":"62070151b1","no":3,"q":"杂质限度","a":"\u003cdiv class=\"q-ln\"\u003e药物中所含杂质的最大允许量，通常用百分之几或百万分之几表示。杂质限度=杂质最大允许量 / 供试品量 × 100% 。\u003c/div\u003e","pt":"药物中所含杂质的最大允许量，通常用百分之几或百万分之几表示。杂质限度=杂质最大允许量 / 供试品量 × 100% 。","ok":true,"an":["通常用百分之几","供试品"]},{"id":"41db6557c5","no":4,"q":"药物纯度","a":"","pt":"药物的纯洁程度。","ok":false,"an":[]},{"id":"9d5792316a","no":5,"q":"试述药物的杂质检查的内容 (包括杂质的来源，杂质的限量检查，什么是一般杂质和特殊杂质。)","a":"\u003cdiv class=\"q-ln\"\u003e① 杂质的来源: 生产过程中引入；贮存过程中产生。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 杂质的限量检查: 药物中所含杂质的最大允许量叫做杂质限量。通常用百分之几或百万分之几表示。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 一般杂质和特殊杂质:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e药品中的杂质按照其来源可以分为一般杂质和特殊杂质：一般杂质是指在自然界中分布较广泛，在多种药物的生产和贮藏过程中容易引入的杂质。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e特殊杂质是指在特定药物的生产和贮藏过程中引入的杂质，这类杂质随药物的合成工艺路线和结构的不同而不同。\u003c/div\u003e","pt":"① 杂质的来源: 生产过程中引入；贮存过程中产生。 ② 杂质的限量检查: 药物中所含杂质的最大允许量叫做杂质限量。通常用百分之几或百万分之几表示。 ③ 一般杂质和特殊杂质: 药品中的杂质按照其来源可以分为一般杂质和特殊杂质：一般杂质是指在自然界中分布较广泛，在多种药物的生产和贮藏过程中容易引入的杂质。 特殊杂质是指在特定药物的生产和贮藏过程中引入的杂质，这类杂质随药物的合成工艺路线和结构的不同而不同。","ok":true,"an":["生产过程","通常用百分之几","百万分之几表示","分布","合成工艺路线","贮藏过程"]},{"id":"90a5a9cd9a","no":6,"q":"杂质的检查方法及举例？","a":"","pt":"","ok":false,"an":[]},{"id":"ce8ec51cb1","no":7,"q":"请举例说明信号杂质及此杂质的存在对药物有什么影响？","a":"","pt":"","ok":false,"an":[]},{"id":"d042949568","no":8,"q":"药用规格与化学试剂规格有何不同？","a":"\u003cdiv class=\"q-ln\"\u003e① 化学试剂不考虑杂质的生理作用，其杂质限量只是从可能引起的化学变化对使用的影响来限定的，对试剂的使用范围和使用目的加以规定，它不考虑杂质对生物体的生理作用及毒副作用；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药物纯度主要从用药安全、有效和对药物稳定性等方面考虑。化学试剂是不能代替药品来使用的。\u003c/di
