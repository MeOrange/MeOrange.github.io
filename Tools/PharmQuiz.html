<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="药学考研刷题：按章节练习、记忆锚点遮盖、记忆曲线复习。">
<title>药学考研刷题</title>
<style>
/* ==========================================================================
   药学考研刷题 · 样式
   ========================================================================== */

:root {
  /* 深色（默认） */
  --bg: #0b0f16;
  --bg2: #0f1520;
  --card: #141b26;
  --card2: #1a2231;
  --line: #253044;
  --line2: #2e3b52;
  --txt: #e6edf7;
  --dim: #8b98ad;
  --accent: #5b8cff;
  --accent-soft: rgba(91, 140, 255, .14);
  --accent2: #37d39b;
  --warn: #f5b544;
  --bad: #ff6b81;
  --mask: #2b3549;
  --shadow: 0 16px 40px rgba(0, 0, 0, .42);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, .26);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --tb: 56px;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
}
html[data-theme="light"] {
  --bg: #f4f6fb;
  --bg2: #e9eef7;
  --card: #ffffff;
  --card2: #f6f8fc;
  --line: #e2e8f2;
  --line2: #d3dceb;
  --txt: #1b2430;
  --dim: #6b7889;
  --accent-soft: rgba(91, 140, 255, .12);
  --mask: #dbe2ee;
  --shadow: 0 14px 34px rgba(23, 37, 58, .10);
  --shadow-sm: 0 2px 10px rgba(23, 37, 58, .07);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  background-image: radial-gradient(1200px 620px at 50% -12%, var(--bg2), var(--bg));
  background-attachment: fixed;
  color: var(--txt);
  font: 15px/1.7 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
button, input, select { font-family: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .3px; }
a { color: var(--accent); }
.muted { color: var(--dim); }
.tiny { font-size: 12px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ===== 顶栏 ===== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  height: var(--tb); padding: 0 max(14px, env(safe-area-inset-left)) 0 max(18px, env(safe-area-inset-left));
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  transition: opacity .3s;
}
.topbar.hide { opacity: 0; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: .4px; white-space: nowrap; min-width: 0; }
.brand .bt { overflow: hidden; text-overflow: ellipsis; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex: none; }
.brand .home { font-size: 12px; font-weight: 400; color: var(--dim); text-decoration: none; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; transition: .15s; }
.brand .home:hover { color: var(--accent); border-color: var(--accent); }

.tabs { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); }
.tab {
  border: 0; background: transparent; color: var(--dim);
  padding: 6px 15px; border-radius: 999px; cursor: pointer; font-size: 13.5px; transition: .15s;
}
.tab:hover { color: var(--txt); }
.tab.is-on { background: var(--accent); color: #fff; box-shadow: 0 2px 10px var(--accent-soft); }
.acts { display: flex; align-items: center; gap: 8px; }
.ver { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.icon-btn {
  border: 1px solid var(--line); background: var(--card2); color: var(--dim);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px; transition: .15s; white-space: nowrap;
}
.icon-btn:hover { color: var(--txt); border-color: var(--accent); }

/* ===== 屏幕 ===== */
.screen { display: none; }
.screen.is-on { display: block; animation: fade .28s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1020px; margin: 0 auto; padding: 22px 20px calc(72px + env(safe-area-inset-bottom)); }
.wrap.narrow { max-width: 560px; }

/* ===== 学科卡片 ===== */
.subj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px; margin-bottom: 18px; }
.subj {
  position: relative; text-align: left; cursor: pointer; overflow: hidden;
  border: 1px solid var(--line); background: var(--card);
  border-radius: var(--r-lg); padding: 15px 16px 13px; transition: .18s;
  box-shadow: var(--shadow-sm);
}
.subj:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.subj.is-on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-sm); }
.subj.is-on::after { content: ""; position: absolute; inset: 0; background: var(--accent-soft); pointer-events: none; }
.subj > * { position: relative; z-index: 1; }
.subj .nm { font-size: 16.5px; font-weight: 650; letter-spacing: .5px; }
.subj .sub { font-size: 12px; color: var(--dim); margin-top: 3px; }
.subj .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 11px; overflow: hidden; }
.subj .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .4s; }

/* ===== 面板 ===== */
.panel { border: 1px solid var(--line); background: var(--card); border-radius: var(--r-lg); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
.panel-hd {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
  background: var(--card2);
}
.panel-hd .hd-acts { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mini {
  border: 1px solid var(--line); background: var(--card); color: var(--dim);
  padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; transition: .15s; white-space: nowrap;
}
.mini:hover { color: var(--txt); border-color: var(--accent); }
.mini.danger:hover { color: #fff; background: var(--bad); border-color: var(--bad); }
.mini.is-on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* ===== 章节 ===== */
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; padding: 14px 16px; }
.chap {
  display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0;
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 11px;
  background: var(--card2); font-size: 13px; transition: .15s;
}
.chap:hover { border-color: var(--accent); }
.chap.is-on { border-color: var(--accent); background: var(--accent-soft); }
.chap > span:not(.cnt) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chap .cbox {
  width: 15px; height: 15px; border-radius: 5px; border: 1px solid var(--line2);
  flex: none; display: grid; place-items: center; font-size: 10px; color: transparent; transition: .15s;
}
.chap.is-on .cbox { background: var(--accent); border-color: var(--accent); color: #fff; }
.chap .cnt { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; flex: none; }
.chap .cnt b { color: var(--warn); font-weight: 600; margin-right: 3px; }
.chap .cnt i.w { font-style: normal; margin-right: 5px; }

/* ===== 设置项 ===== */
.opts { padding: 15px 16px; display: grid; gap: 13px; }
.opt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.opt > label { flex: none; width: 68px; color: var(--dim); font-size: 13px; }
.segbar { display: flex; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--card2); max-width: 100%; }
.segbar button {
  border: 0; background: transparent; color: var(--dim);
  padding: 8px 14px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); transition: .15s; white-space: nowrap;
}
.segbar button:last-child { border-right: 0; }
.segbar button:hover { color: var(--txt); background: var(--bg2); }
.segbar button.is-on { background: var(--accent); color: #fff; }
.checks { display: flex; gap: 8px 22px; flex-wrap: wrap; }
.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; color: var(--dim); }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.chk input:checked + span { color: var(--txt); }

.start-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-top: 1px solid var(--line); background: var(--card2); }
.start-info { font-size: 12.5px; color: var(--dim); flex: 1 1 200px; }
.start-info b { color: var(--txt); }
.btn-primary {
  border: 0; cursor: pointer; flex: none;
  background: linear-gradient(135deg, var(--accent), #7d6bff);
  color: #fff; padding: 11px 26px; border-radius: var(--r-md); font-size: 14.5px; font-weight: 600;
  box-shadow: 0 8px 22px var(--accent-soft); transition: .15s;
}
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-primary:active { transform: none; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-ghost {
  border: 1px solid var(--line); background: transparent; color: var(--dim);
  padding: 9px 20px; border-radius: var(--r-md); cursor: pointer; font-size: 14px; transition: .15s;
}
.btn-ghost:hover { color: var(--txt); border-color: var(--accent); }
.build-note { margin: 4px 2px 0; font-size: 11.5px; color: var(--dim); line-height: 1.7; }
.build-note code { font-size: 11px; background: var(--card2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

/* ===== 刷题 ===== */
.qz { height: calc(100vh - var(--tb)); height: calc(100dvh - var(--tb)); display: flex; flex-direction: column; }
.qz-top {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 9px 18px; font-size: 12.5px; color: var(--dim);
  transition: opacity .3s;
}
.qz-top.hide { opacity: 0; pointer-events: none; }
.qz-meta { margin: 0 auto; letter-spacing: .4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qz-right { display: flex; align-items: center; gap: 8px; flex: none; }
.pill { border: 1px solid var(--line); background: var(--card2); padding: 4px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.link-btn { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 12.5px; padding: 4px 2px; flex: none; }
.link-btn:hover { color: var(--txt); }
.qz-bar { flex: none; height: 3px; background: var(--line); }
.qz-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .35s; }
.qz-body { flex: 1; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 20px 18px 40px; }
.card {
  max-width: 800px; margin: 0 auto;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-xl); padding: 28px 30px 26px; box-shadow: var(--shadow);
}
.q-tag { font-size: 11.5px; color: var(--dim); letter-spacing: .6px; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.q-tag .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.q-text {
  font-family: var(--serif); font-size: 21px; line-height: 1.8;
  letter-spacing: .4px; margin-bottom: 6px; overflow-wrap: anywhere;
}
.ans { margin-top: 20px; display: none; }
.ans.show { display: block; animation: fade .3s ease; }
.ans-inner {
  font-family: var(--serif); font-size: 16.5px; line-height: 2;
  padding: 18px 20px; border-radius: var(--r-md); background: var(--card2);
  border: 1px solid var(--line); overflow-wrap: anywhere;
}
.ans-inner .q-ln { padding: 1px 0; }
.ans-empty { padding: 24px 0 6px; text-align: center; color: var(--dim); }
.ans-empty p { margin: 0 0 12px; }
.ans-inner.reveal-all .mask { background: transparent; color: var(--txt); box-shadow: none; }
.mask {
  background: var(--mask); color: transparent;
  border-radius: 5px; padding: 0 .18em; margin: 0 .04em;
  cursor: pointer; user-select: none;
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--txt) 14%, transparent);
  transition: background .15s, color .15s, box-shadow .15s;
}
.mask:hover { background: color-mix(in srgb, var(--accent) 45%, var(--mask)); }
.mask.on { background: var(--accent-soft); color: var(--accent2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent2) 35%, transparent); }
.ans.blur .ans-inner { filter: blur(7px); user-select: none; }
.ans.blur { position: relative; }
.ans.blur::after {
  content: "点击任意处揭晓全部答案"; position: absolute; inset: 0;
  display: grid; place-items: center; font-size: 13px; color: var(--dim);
  border-radius: var(--r-md); cursor: pointer;
}
.ans-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ans-tools .tiny { flex: 1 1 140px; }
.reveal-hint { margin-top: 22px; }
.btn-primary.wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; }
.kbd {
  font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: rgba(255, 255, 255, .18); letter-spacing: .5px;
}
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; animation: fade .25s; }
.rate-btn {
  border: 1px solid var(--line); background: var(--card2); color: var(--dim);
  padding: 14px 0; border-radius: var(--r-md); cursor: pointer; font-size: 15px; position: relative; transition: .15s;
}
.rate-btn b { position: absolute; right: 10px; top: 7px; font-size: 10px; opacity: .5; font-weight: 400; }
.rate-btn.bad:hover, .rate-btn.bad:active { border-color: var(--bad); color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card2)); }
.rate-btn.warn:hover, .rate-btn.warn:active { border-color: var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--card2)); }
.rate-btn.ok:hover, .rate-btn.ok:active { border-color: var(--accent2); color: var(--accent2); background: color-mix(in srgb, var(--accent2) 10%, var(--card2)); }
.qz-foot {
  flex: none; display: flex; gap: 8px 18px; justify-content: center; flex-wrap: wrap;
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line);
  transition: opacity .3s;
}
.qz-foot b { color: var(--txt); font-weight: 600; }
.qz-foot.hide { opacity: 0; pointer-events: none; }

/* 表格 */
.q-tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); }
.q-tbl table { border-collapse: collapse; min-width: 100%; }
.q-tbl th, .q-tbl td, .ans-inner table th, .ans-inner table td {
  border-color: var(--line) !important; color: var(--txt); padding: 7px 9px !important;
  font-size: 13px; line-height: 1.7; overflow-wrap: anywhere;
}
.q-tbl tr[style*="background"], .q-tbl td[style*="background"], .q-tbl th[style*="background"] { background: var(--card2) !important; }
.ans-inner table { max-width: 100%; }
.ans-inner img { max-width: 100%; height: auto; }

/* ===== 浏览 ===== */
.search {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 7px 14px; width: 240px; max-width: 100%; font-size: 13px; outline: none; transition: .15s;
}
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.list { padding: 0 16px 16px; display: grid; gap: 9px; }
.item { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card2); overflow: hidden; }
.item-hd { display: flex; align-items: flex-start; gap: 9px; padding: 12px 14px; cursor: pointer; }
.item-hd:hover { background: var(--card); }
.item-no { color: var(--dim); font-size: 12px; flex: none; padding-top: 3px; min-width: 22px; }
.item-q { font-family: var(--serif); font-size: 15.5px; line-height: 1.75; min-width: 0; }
.item-badge { margin-left: auto; flex: none; font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.item-badge.no { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.item-badge.ok { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 40%, transparent); }
.item-badge.weak { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.item-a { display: none; padding: 0 14px 14px 36px; }
.item.open .item-a { display: block; }
.item-a .ans-inner { font-size: 15px; line-height: 1.95; }

/* ===== 统计 / 结算 ===== */
.stats { padding: 16px; display: grid; gap: 14px; }
.stat-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stat-row .nm { flex: none; width: 84px; font-weight: 600; font-size: 14px; }
.stat-bar { flex: 1 1 160px; min-width: 120px; height: 9px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
.stat-bar i { display: block; height: 100%; }
.stat-bar .i-ok { background: var(--accent2); }
.stat-bar .i-warn { background: var(--warn); }
.stat-bar .i-bad { background: var(--bad); }
.stat-row .num { flex: 1 1 100%; font-size: 12px; color: var(--dim); text-align: right; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
.done { padding: 30px 24px; text-align: center; }
.done h2 { font-size: 20px; margin-bottom: 20px; }
.done-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.done-cell { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 8px; background: var(--card2); }
.done-cell b { display: block; font-size: 28px; font-weight: 650; line-height: 1.3; }
.done-cell span { font-size: 12px; color: var(--dim); }
.done-acts { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
.done-acts .btn-primary { flex: none; }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px);
  background: var(--card2); border: 1px solid var(--line); color: var(--txt);
  padding: 10px 20px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: .28s; z-index: 99; max-width: 86vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width: 720px) {
  :root { --tb: 52px; }
  .wrap { padding: 16px 14px calc(56px + env(safe-area-inset-bottom)); }
  .topbar { gap: 10px; }
  .brand .home { display: none; }
  .ver { display: none; }
  .tab { padding: 6px 12px; font-size: 13px; }
  .card { padding: 20px 16px; border-radius: var(--r-lg); }
  .q-text { font-size: 18px; line-height: 1.75; }
  .ans-inner { font-size: 15.5px; line-height: 1.95; padding: 14px 14px; }
  .qz-body { padding: 14px 12px 32px; }
  .qz-top { padding: 8px 12px; }
  .qz-meta { font-size: 11.5px; }
  .qz-foot { display: none; }
  .subj-grid { grid-template-columns: 1fr; gap: 10px; }
  .subj { padding: 13px 14px 12px; }
  .chap-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; padding: 12px; }
  .chap { font-size: 12.5px; padding: 8px 9px; gap: 6px; }
  .chap .cbox { width: 14px; height: 14px; }
  .chap .cnt i.w { display: none; }
  .opt { gap: 8px; }
  .opt > label { width: 100%; font-size: 12.5px; }
  .segbar { width: 100%; }
  .segbar button { flex: 1 1 0; padding: 8px 6px; font-size: 12.5px; }
  .checks { flex-direction: column; gap: 8px; }
  .start-row { padding: 13px 14px; }
  .start-info { flex-basis: 100%; }
  .btn-primary { flex: 1 1 100%; padding: 13px 20px; }
  .btn-primary.wide { flex: 1 1 auto; }
  .panel-hd { padding: 12px 14px; }
  .search { width: 100%; }

window.QUIZ_DATA = {"generatedAt":"2026-09-15","anchors":1144,"sources":[{"subject":"药理学","file":"20260728-ky1.md"},{"subject":"药剂学","file":"20260729-ky1.md"},{"subject":"药物化学","file":"20260729-ky2.md"},{"subject":"药物分析","file":"20260729-ky3.md"}],"subjects":[{"subject":"药理学","chapters":[{"label":"第一章","questions":[{"id":"2911bf7270","no":1,"q":"药理学 (pharmacology)","a":"\u003cdiv class=\"q-ln\"\u003e是研究药物与机体（含病原体）之间相互作用及作用规律的学科。\u003c/div\u003e","pt":"是研究药物与机体（含病原体）之间相互作用及作用规律的学科。","ok":true,"an":[]},{"id":"dc91ba0e73","no":2,"q":"药动学 (pharmacokinetics)","a":"\u003cdiv class=\"q-ln\"\u003e是研究机体对药物的吸收、分布、代谢和排泄过程及规律的学科，并运用数学原理和动力学模型研究体内药物浓度随时间变化的规律。\u003c/div\u003e","pt":"是研究机体对药物的吸收、分布、代谢和排泄过程及规律的学科，并运用数学原理和动力学模型研究体内药物浓度随时间变化的规律。","ok":true,"an":["排泄","分布","代谢","动力学"]},{"id":"a8d5d6c014","no":3,"q":"药效学 (pharmacodynamics)","a":"\u003cdiv class=\"q-ln\"\u003e是研究药物对机体的作用及其规律的学科。主要研究内容包括药物如何发挥作用，机体对药物产生的反应，药物作用的定义和定量方法，影响机体对药物反应的因素等。药效学是指导临床合理用药、防治疾病的理论依据。\u003c/div\u003e","pt":"是研究药物对机体的作用及其规律的学科。主要研究内容包括药物如何发挥作用，机体对药物产生的反应，药物作用的定义和定量方法，影响机体对药物反应的因素等。药效学是指导临床合理用药、防治疾病的理论依据。","ok":true,"an":["合理用药","理论依据"]},{"id":"a6bc3a16b2","no":4,"q":"安慰剂 (placebo)","a":"\u003cdiv class=\"q-ln\"\u003e是不含活性药物但又暗示某种效应的制剂，在颜色、形态、外观等方面与某种活性药物或受试药物相同。（在受试药物对照试验中作为对照，以消除受试药物安慰剂效应对实验结果的影响。）\u003c/div\u003e","pt":"是不含活性药物但又暗示某种效应的制剂，在颜色、形态、外观等方面与某种活性药物或受试药物相同。（在受试药物对照试验中作为对照，以消除受试药物安慰剂效应对实验结果的影响。）","ok":true,"an":[]},{"id":"4ff147fc0c","no":5,"q":"举例说明药物、食物与毒物的关系","a":"\u003cdiv class=\"q-ln\"\u003e① 药物、食物和毒物间并无绝对界限。如食盐、葡萄糖、维生素都是食物中的成分，但在人体缺乏上述物质时，生理盐水、葡萄糖注射液、维生素等就成了药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 任何药物摄入过量都会引起毒性反应，如对于充血性心力衰竭的患者，过量摄入食盐或生理盐水都可能会加重病情，甚至危及生命。因此药物、食物和毒物之间只有剂量的区别。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e（③ 食物摄入过量也可能引起毒性反应，如前面提到的食盐，以及对于糖尿病患者，若过量摄入葡萄糖也可能加重病情。）\u003c/div\u003e","pt":"① 药物、食物和毒物间并无绝对界限。如食盐、葡萄糖、维生素都是食物中的成分，但在人体缺乏上述物质时，生理盐水、葡萄糖注射液、维生素等就成了药物。 ② 任何药物摄入过量都会引起毒性反应，如对于充血性心力衰竭的患者，过量摄入食盐或生理盐水都可能会加重病情，甚至危及生命。因此药物、食物和毒物之间只有剂量的区别。 （③ 食物摄入过量也可能引起毒性反应，如前面提到的食盐，以及对于糖尿病患者，若过量摄入葡萄糖也可能加重病情。）","ok":true,"an":["糖尿病","葡萄糖注射液","心力衰竭","毒性反应","维生素","葡萄糖"]},{"id":"b4a67b030d","no":6,"q":"简述药理学在新药研究与开发中的作用","a":"\u003cdiv class=\"q-ln\"\u003e① 新药*先导化合物*的确定有赖于药理学*活性筛选*。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药理学研究可阐明药物的*构效关系*，后者可指导新药的合成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 新药的*临床前*药理研究的结果（包括药效学、药动学、一般药理学、毒理学资料等）是新药申请临床试验时的*重要审批依据*。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ Ⅰ至Ⅳ期临床试验是*临床药理学*的重要任务，决定新药能否*上市销售*，并*指导*上市后的*合理用药*。\u003c/div\u003e","pt":"① 新药*先导化合物*的确定有赖于药理学*活性筛选*。 ② 药理学研究可阐明药物的*构效关系*，后者可指导新药的合成。 ③ 新药的*临床前*药理研究的结果（包括药效学、药动学、一般药理学、毒理学资料等）是新药申请临床试验时的*重要审批依据*。 ④ Ⅰ至Ⅳ期临床试验是*临床药理学*的重要任务，决定新药能否*上市销售*，并*指导*上市后的*合理用药*。","ok":true,"an":["合理用药","构效关系","药效学","药动学"]}],"count":6,"done":6},{"label":"第二章","questions":[{"id":"156c66c850","no":1,"q":"离子障 (ion trapping)","a":"\u003cdiv class=\"q-ln\"\u003e通常只有非解离型的分子能以简单扩散的方式透过生物膜，而解离型的分子一般较难通过，被限制在膜的一侧，称为离子障现象。\u003c/div\u003e","pt":"通常只有非解离型的分子能以简单扩散的方式透过生物膜，而解离型的分子一般较难通过，被限制在膜的一侧，称为离子障现象。","ok":true,"an":["简单扩散","生物膜"]},{"id":"9d54a29e89","no":2,"q":"药物的跨膜转运方式有哪些？主动转运和被动转运各有哪些特点？在药物转运中，哪种方式的转运最多见？","a":"\u003cdiv class=\"q-ln\"\u003e① 药物的转运方式包括: 被动转运、主动转运、膜动转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 被动转运包括: 简单扩散、易化扩散。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e简单扩散的特点: 1.不需要消耗能量；2.不需要载体；3.无饱和现象；4.无竞争性抑制现象。（5.顺浓度梯度）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e易化扩散的特点: 1.不需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.顺浓度梯度）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 主动转运包括：原发性主动转运、继发性主动转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e主动转运的特点: 1.需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.逆浓度梯度）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 膜动转运包括：胞饮、胞吐。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e膜动转运的特点：1.需要消耗能量；2.有膜变形。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 药物转运中最常见的方式是简单扩散中的脂溶扩散。\u003c/div\u003e","pt":"① 药物的转运方式包括: 被动转运、主动转运、膜动转运。 ② 被动转运包括: 简单扩散、易化扩散。 简单扩散的特点: 1.不需要消耗能量；2.不需要载体；3.无饱和现象；4.无竞争性抑制现象。（5.顺浓度梯度） 易化扩散的特点: 1.不需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.顺浓度梯度） ③ 主动转运包括：原发性主动转运、继发性主动转运。 主动转运的特点: 1.需要消耗能量；2.需要载体；3.有饱和现象；4.有竞争性抑制现象。（5.逆浓度梯度） ④ 膜动转运包括：胞饮、胞吐。 膜动转运的特点：1.需要消耗能量；2.有膜变形。 ⑤ 药物转运中最常见的方式是简单扩散中的脂溶扩散。","ok":true,"an":["竞争性抑制现象","简单扩散"]},{"id":"1e0d5f5460","no":3,"q":"首过效应 (first pass effect)","a":"\u003cdiv class=\"q-ln\"\u003e是指某些药物口服后首次通过肠壁或肝脏时被代谢酶代谢，使进入体循环的有效药量减少的现象。\u003c/div\u003e","pt":"是指某些药物口服后首次通过肠壁或肝脏时被代谢酶代谢，使进入体循环的有效药量减少的现象。","ok":true,"an":["代谢","口服"]},{"id":"53e194300c","no":4,"q":"血脑屏障 (blood-brain barrier)","a":"\u003cdiv class=\"q-ln\"\u003e是指血管壁与神经胶质细胞形成的*血浆与脑细胞外液*间的屏障和由脉络丛形成的*血浆与脑脊液*间的屏障。血脑屏障能阻止许多大分子、水溶性或解离型药物进入脑组织，只有脂溶性较高的药物才能以简单扩散的方式穿过血脑屏障转运至脑内。\u003c/div\u003e","pt":"是指血管壁与神经胶质细胞形成的*血浆与脑细胞外液*间的屏障和由脉络丛形成的*血浆与脑脊液*间的屏障。血脑屏障能阻止许多大分子、水溶性或解离型药物进入脑组织，只有脂溶性较高的药物才能以简单扩散的方式穿过血脑屏障转运至脑内。","ok":true,"an":["简单扩散","脂溶性","水溶性","脑脊液"]},{"id":"c1efd2367e","no":5,"q":"什么是一级和零级动力学？各有哪些特点？为什么会发生零级动力学？","a":"\u003cdiv class=\"q-ln\"\u003e① 一级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的一次方成正比，即单位时间内药物按一定比例转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 一级动力学过程特点: 1.药物转运浓度呈指数衰减，每单位时间内转运的百分比不变，即等比转运，但单位时间内药物的转运量随时间而下降；2.半衰期、总体清除率恒定，与药物剂量或浓度无关；3.AUC与给药的单一剂量成正比。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 零级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的零次方成正比，即单位时间内转运的药物量不变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 零级动力学过程的特点: 1.转运速率与剂量或浓度无关，按恒量转运，即等量转运，但每单位时间内转运的百分比是可变的；2.半衰期、总体清除率不恒定，剂量加大，半衰期可超比例延长，总体清除率可超比例减少；3.AUC与给药的单一剂量不成正比，给药剂量增加，其面积可超比例增加。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 发生零级动力学过程的原因是药物转运体、药物代谢酶、血浆蛋白与药物的结合等的饱和。\u003c/div\u003e","pt":"① 一级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的一次方成正比，即单位时间内药物按一定比例转运。 ② 一级动力学过程特点: 1.药物转运浓度呈指数衰减，每单位时间内转运的百分比不变，即等比转运，但单位时间内药物的转运量随时间而下降；2.半衰期、总体清除率恒定，与药物剂量或浓度无关；3.AUC与给药的单一剂量成正比。 ③ 零级动力学过程: 在体内某部位药物的转运速率与该部位药物量或浓度的零次方成正比，即单位时间内转运的药物量不变。 ④ 零级动力学过程的特点: 1.转运速率与剂量或浓度无关，按恒量转运，即等量转运，但每单位时间内转运的百分比是可变的；2.半衰期、总体清除率不恒定，剂量加大，半衰期可超比例延长，总体清除率可超比例减少；3.AUC与给药的单一剂量不成正比，给药剂量增加，其面积可超比例增加。 ⑤ 发生零级动力学过程的原因是药物转运体、药物代谢酶、血浆蛋白与药物的结合等的饱和。","ok":true,"an":["一级动力学过程","零级动力学过程","代谢","血浆蛋白","AUC"]},{"id":"e7ebe72906","no":6,"q":"药物经代谢后会产生哪些结果，有什么临床意义？","a":"\u003cdiv class=\"q-ln\"\u003e① 有些药物代谢后，代谢产物活性减弱或消失，称为失活。如局麻药普鲁卡因在体内因酯键水解而失活；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 有些药物代谢后，代谢产物才具有活性或活性增强，称为活化。如镇痛药可待因，在体内去甲基后生成镇痛作用更强的吗啡；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 很多药物经代谢后，代谢产物水溶性增强，更容易从胆汁或肾脏排泄，且代谢产物常失去药理活性，起到了消除和解毒的作用；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 有些药物本身无毒性或毒性很小，但在体内经代谢后，生成的有毒性的代谢产物。如乙醇在体内代谢为毒性更强的乙醛，对乙酰氨基酚在细胞色素P450催化下代谢为有肝毒性的对乙酰苯醌亚胺。因此代谢所产生的结果是复杂的，不能简单的理解为解毒过程。\u003c/div\u003e","pt":"① 有些药物代谢后，代谢产物活性减弱或消失，称为失活。如局麻药普鲁卡因在体内因酯键水解而失活； ② 有些药物代谢后，代谢产物才具有活性或活性增强，称为活化。如镇痛药可待因，在体内去甲基后生成镇痛作用更强的吗啡； ③ 很多药物经代谢后，代谢产物水溶性增强，更容易从胆汁或肾脏排泄，且代谢产物常失去药理活性，起到了消除和解毒的作用； ④ 有些药物本身无毒性或毒性很小，但在体内经代谢后，生成的有毒性的代谢产物。如乙醇在体内代谢为毒性更强的乙醛，对乙酰氨基酚在细胞色素P450催化下代谢为有肝毒性的对乙酰苯醌亚胺。因此代谢所产生的结果是复杂的，不能简单的理解为解毒过程。","ok":true,"an":["排泄","药理活性","肝毒性","局麻药","镇痛药","水溶性"]},{"id":"39b28c707d","no":7,"q":"何谓酶的诱导和酶的抑制？药物经酶的诱导和酶的抑制后分别会产生什么后果？","a":"\u003cdiv class=\"q-ln\"\u003e① 有些化学物质能提高肝药酶的活性，从而提到代谢速率，这种现象称为酶的诱导。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 酶的诱导可产生两种临床后果:1.使治疗效果减弱: 由于肝药酶诱导后代谢速率增强，药物代谢速率加快，血药浓度降低，从而使得治疗效果减弱。如苯巴比妥是一种酶诱导剂，能加速华法林的代谢，降低抗凝效果；2.使治疗效果增强，甚至产生毒性反应，主要是那些在体内活化或代谢物有毒性的药物。如乙醇是肝CYP2E1的酶诱导剂，长期饮酒可增加对乙酰氨基酚的肝毒性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 有些化学物质能抑制肝药酶的活性，从而降低代谢速率，这种现象称为酶的抑制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 酶的抑制也可产生两种临床后果:1. 使治疗效果减弱: 主要是对那些在体内活化的药物，这些药物在酶被抑制后，活性代谢产物生成速率降低，疗效降低。如可待因在酶抑制后其产生活性代谢产物吗啡的速率降低，活性减小；2.使治疗效果增强：指那些在体内代谢后失活的药物，在酶抑制后，代谢速率降低，作用增强，甚至产生毒性反应。如酮康唑是CYP3A4的竞争性抑制剂，当被同酶催化的特非那定合用时，可导致特非那定代谢速率明显减慢，血药浓度明显增加，可诱发致命的心律失常。\u003c/div\u003e","pt":"① 有些化学物质能提高肝药酶的活性，从而提到代谢速率，这种现象称为酶的诱导。 ② 酶的诱导可产生两种临床后果:1.使治疗效果减弱: 由于肝药酶诱导后代谢速率增强，药物代谢速率加快，血药浓度降低，从而使得治疗效果减弱。如苯巴比妥是一种酶诱导剂，能加速华法林的代谢，降低抗凝效果；2.使治疗效果增强，甚至产生毒性反应，主要是那些在体内活化或代谢物有毒性的药物。如乙醇是肝CYP2E1的酶诱导剂，长期饮酒可增加对乙酰氨基酚的肝毒性。 ③ 有些化学物质能抑制肝药酶的活性，从而降低代谢速率，这种现象称为酶的抑制。 ④ 酶的抑制也可产生两种临床后果:1. 使治疗效果减弱: 主要是对那些在体内活化的药物，这些药物在酶被抑制后，活性代谢产物生成速率降低，疗效降低。如可待因在酶抑制后其产生活性代谢产物吗啡的速率降低，活性减小；2.使治疗效果增强：指那些在体内代谢后失活的药物，在酶抑制后，代谢速率降低，作用增强，甚至产生毒性反应。如酮康唑是CYP3A4的竞争性抑制剂，当被同酶催化的特非那定合用时，可导致特非那定代谢速率明显减慢，血药浓度明显增加，可诱发致命的心律失常。","ok":true,"an":["竞争性抑制","代谢","心律失常","产生毒性","CYP2E1","CYP3A4"]},{"id":"78cfffee05","no":8,"q":"肝肠循环 (hepato-enteral circulation)","a":"\u003cdiv class=\"q-ln\"\u003e由胆汁排入十二指肠的药物通过粪便排出体外，但也有些药物再经肠黏膜上皮细胞吸收，通过门静脉入肝，重新进入体循环，这个反复循环的过程称为肝肠循环。\u003c/div\u003e","pt":"由胆汁排入十二指肠的药物通过粪便排出体外，但也有些药物再经肠黏膜上皮细胞吸收，通过门静脉入肝，重新进入体循环，这个反复循环的过程称为肝肠循环。","ok":true,"an":[]},{"id":"4376c134ff","no":9,"q":"吸收、分布、代谢、排泄过程中药物相互作用？","a":"\u003cdiv class=\"q-ln\"\u003e① 吸收: 1.胃肠pH；2.吸收功能 3.胃排空速度及肠蠕动；4.离子作用；5.间接作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 分布: 药物与血浆蛋白结合的竞争性抑制现象: 联合用药时，不同药物与血浆蛋白的结合可能发生相互竞争，使某些药物游离型增加，药理作用增强，出现中毒反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 代谢: 见酶的诱导和酶的抑制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 排泄: 肾小管分泌: 肾小管分泌具有主动转运的特点。分泌机制相同的两药合用，可发生竞争性抑制，丙磺舒与青霉素合用时，青霉素血浆浓度升高、疗效增强的原因是因为丙磺舒竞争性的抑制了肾小管上皮细胞有机阴离子转运体，从而抑制了青霉素的分泌，提高了青霉素的血药浓度，使其疗效增强。\u003c/div\u003e","pt":"① 吸收: 1.胃肠pH；2.吸收功能 3.胃排空速度及肠蠕动；4.离子作用；5.间接作用。 ② 分布: 药物与血浆蛋白结合的竞争性抑制现象: 联合用药时，不同药物与血浆蛋白的结合可能发生相互竞争，使某些药物游离型增加，药理作用增强，出现中毒反应。 ③ 代谢: 见酶的诱导和酶的抑制。 ④ 排泄: 肾小管分泌: 肾小管分泌具有主动转运的特点。分泌机制相同的两药合用，可发生竞争性抑制，丙磺舒与青霉素合用时，青霉素血浆浓度升高、疗效增强的原因是因为丙磺舒竞争性的抑制了肾小管上皮细胞有机阴离子转运体，从而抑制了青霉素的分泌，提高了青霉素的血药浓度，使其疗效增强。","ok":true,"an":["竞争性抑制现象","竞争性抑制","血浆蛋白","联合用药","阴离子","动转运"]},{"id":"54f7f29e2b","no":10,"q":"半衰期的临床意义？","a":"\u003cdiv class=\"q-ln\"\u003e① 可反映药物消除的快慢，作为临床制定给药方案的主要依据，有助于设计最佳给药间隔；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 可预计停药后药物从体内的消除时间；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 可预计连续给药到达稳态血药浓度的时间。\u003c/div\u003e","pt":"① 可反映药物消除的快慢，作为临床制定给药方案的主要依据，有助于设计最佳给药间隔； ② 可预计停药后药物从体内的消除时间； ③ 可预计连续给药到达稳态血药浓度的时间。","ok":true,"an":["停药"]},{"id":"4e835b010b","no":11,"q":"稳态血药浓度Css","a":"\u003cdiv class=\"q-ln\"\u003e在临床药物治疗中，很多药物都是通过重复给药以达到有效治疗浓度。若按固定时间间隔给予固定的药物剂量，每次给药时都有前次给药的存留量，多次给药将形成多次蓄积。随着给药次数的增加，体内总药量的蓄积率逐渐减慢，直至在给药间隔内消除的药量等于给药量时，达到平衡，此时的血药浓度称为稳态血药浓度。\u003c/div\u003e","pt":"在临床药物治疗中，很多药物都是通过重复给药以达到有效治疗浓度。若按固定时间间隔给予固定的药物剂量，每次给药时都有前次给药的存留量，多次给药将形成多次蓄积。随着给药次数的增加，体内总药量的蓄积率逐渐减慢，直至在给药间隔内消除的药量等于给药量时，达到平衡，此时的血药浓度称为稳态血药浓度。","ok":true,"an":["达到平衡","蓄积"]}],"count":11,"done":11},{"label":"第三章","questions":[{"id":"2f3bef82f9","no":1,"q":"副作用","a":"\u003cdiv class=\"q-ln\"\u003e是指应用治疗量药物后出现的与用药目的无关的药理作用。一般较轻微并可以预料，是可逆性的功能变化。例如，阿托品用于缓解胃肠道平滑肌痉挛时，其抑制腺体分泌产生的口干即是副作用，停药后消失。\u003c/div\u003e","pt":"是指应用治疗量药物后出现的与用药目的无关的药理作用。一般较轻微并可以预料，是可逆性的功能变化。例如，阿托品用于缓解胃肠道平滑肌痉挛时，其抑制腺体分泌产生的口干即是副作用，停药后消失。","ok":true,"an":["阿托品","胃肠道","停药","逆性"]},{"id":"3457b7836d","no":2,"q":"二重感染","a":"\u003cdiv class=\"q-ln\"\u003e长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。\u003c/div\u003e","pt":"长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。","ok":true,"an":["称作二重感染","口服","敏感菌"]},{"id":"4a1fc3f9c7","no":3,"q":"后遗效应","a":"\u003cdiv class=\"q-ln\"\u003e是指停药后血药浓度已降至最小有效浓度以下时残存的药理效应，例如服用巴比妥类镇静催眠药后，次晨出现的乏力、困倦等现象。\u003c/div\u003e","pt":"是指停药后血药浓度已降至最小有效浓度以下时残存的药理效应，例如服用巴比妥类镇静催眠药后，次晨出现的乏力、困倦等现象。","ok":true,"an":["药理效应","巴比妥类","停药"]},{"id":"196617a3b1","no":4,"q":"受体","a":"\u003cdiv class=\"q-ln\"\u003e是一类介导细胞信号转导的功能蛋白或蛋白与多糖等形成的复合物。\u003c/div\u003e","pt":"是一类介导细胞信号转导的功能蛋白或蛋白与多糖等形成的复合物。","ok":true,"an":[]},{"id":"1308b8536c","no":5,"q":"简述受体的基本特性。","a":"\u003cdiv class=\"q-ln\"\u003e① 特异性：即一种特定受体只与它的特定配体结合，产生特定的生理效应，而不被其他生理信号干扰。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 灵敏性：受体只需与很低浓度的配体结合就能产生显著的效应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 饱和性：在每一细胞或每一定量组织内，受体的数量是有限的。当配体达到某一浓度时，配体与受体的结合不再随配体浓度增加而加大。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 可逆性：配体与受体的结合是可逆的。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 多样性：同一受体可广泛分布到不同的细胞产生不同的效应，受体多样性是受体亚型分类的基础。\u003c/div\u003e","pt":"① 特异性：即一种特定受体只与它的特定配体结合，产生特定的生理效应，而不被其他生理信号干扰。 ② 灵敏性：受体只需与很低浓度的配体结合就能产生显著的效应。 ③ 饱和性：在每一细胞或每一定量组织内，受体的数量是有限的。当配体达到某一浓度时，配体与受体的结合不再随配体浓度增加而加大。 ④ 可逆性：配体与受体的结合是可逆的。 ⑤ 多样性：同一受体可广泛分布到不同的细胞产生不同的效应，受体多样性是受体亚型分类的基础。","ok":true,"an":["特异性","灵敏性","多样性","分布","配体","逆性"]},{"id":"c4219a7abf","no":6,"q":"试述药物作用的主要机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 改变细胞周围的理化条件。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 对受体的激动或拮抗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 影响递质、激素、自身活性物质的合成与释放。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 影响酶的活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 影响离子通道的开闭。\u003c/div\u003e","pt":"① 改变细胞周围的理化条件。 ② 对受体的激动或拮抗。 ③ 影响递质、激素、自身活性物质的合成与释放。 ④ 影响酶的活性。 ⑤ 影响离子通道的开闭。","ok":true,"an":["影响递质","离子通道"]},{"id":"ed721ff08e","no":7,"q":"效价 (potency)","a":"\u003cdiv class=\"q-ln\"\u003e能引起等效反应 (一般采用50%最大效应量) 的相对浓度或剂量，也称效价强度，其数值越小强度越大。 药物的效价取决于药物与受体结合的亲和力 (K\u003csub\u003eb\u003c/sub\u003e)，以及药物与受体相互作用的反应效率。效价用于药物之间的比较时，引起等效反应的相对剂量（如10g、2g、10mg）大小反映药物的效价强度，此时10mg就能引起同样效应，表明该药物效价强度高。\u003c/div\u003e","pt":"能引起等效反应 (一般采用50%最大效应量) 的相对浓度或剂量，也称效价强度，其数值越小强度越大。 药物的效价取决于药物与受体结合的亲和力 (K b )，以及药物与受体相互作用的反应效率。效价用于药物之间的比较时，引起等效反应的相对剂量（如10g、2g、10mg）大小反映药物的效价强度，此时10mg就能引起同样效应，表明该药物效价强度高。","ok":true,"an":["受体结合"]},{"id":"190e4e1b23","no":8,"q":"效能 (efficacy)","a":"\u003cdiv class=\"q-ln\"\u003e药物产生的最大效应，即该药物药理效应的极限。它可能由药物与受体的反应模式或受体-效应器体系的特性决定。例如，利尿药环戊噻嗪1mg就能引起呋塞米100mg的排钠利尿效应，表明前者的效价比后者强约100倍，但前者最大排钠利尿效能远不如后者。临床上环戊噻嗪无效的患者改用呋塞米后常能继续排钠利尿，消退水肿，改善循环。因此，在安全剂量范围内，临床上药物作用的效能比效价更重要。\u003c/div\u003e","pt":"药物产生的最大效应，即该药物药理效应的极限。它可能由药物与受体的反应模式或受体-效应器体系的特性决定。例如，利尿药环戊噻嗪1mg就能引起呋塞米100mg的排钠利尿效应，表明前者的效价比后者强约100倍，但前者最大排钠利尿效能远不如后者。临床上环戊噻嗪无效的患者改用呋塞米后常能继续排钠利尿，消退水肿，改善循环。因此，在安全剂量范围内，临床上药物作用的效能比效价更重要。","ok":true,"an":["利尿药","药理效应","范围","呋塞米"]},{"id":"f5acf10528","no":9,"q":"激动药 (agonist)","a":"\u003cdiv class=\"q-ln\"\u003e既有亲和力又有内在活性的药物，它们能与受体结合并激动受体而产生效应。\u003c/div\u003e","pt":"既有亲和力又有内在活性的药物，它们能与受体结合并激动受体而产生效应。","ok":true,"an":["激动受体","受体结合"]},{"id":"6ddd27e095","no":10,"q":"部分激动药 (partial agonist)","a":"\u003cdiv class=\"q-ln\"\u003e在受体全部占领时仅能产生较小的反应，这是由于部分激动药有较强亲和力，但其内在活性较低。部分微动药可在不同情况下表现出完全不同的反应，亦可竞争性抑制完全激动药产生的效应，例如,沙拉新是一种弱的AngⅡ受体的部分激动药，可使AngⅡ分泌增加的高血压患者的血压降低，却使其分泌正常的高血压患者的血压升高。\u003c/div\u003e","pt":"在受体全部占领时仅能产生较小的反应，这是由于部分激动药有较强亲和力，但其内在活性较低。部分微动药可在不同情况下表现出完全不同的反应，亦可竞争性抑制完全激动药产生的效应，例如,沙拉新是一种弱的AngⅡ受体的部分激动药，可使AngⅡ分泌增加的高血压患者的血压降低，却使其分泌正常的高血压患者的血压升高。","ok":true,"an":["竞争性抑制","Ang"]},{"id":"e0e96a5b0e","no":11,"q":"反向激动药 (inverse agonist)","a":"\u003cdiv class=\"q-ln\"\u003e与激动药结合到相同的受体，能够逆转受体固有活性的药物，表现出与激动药相反的药理效应。固有活性是指受体在没有激动药作用时，本身存在一定的活性。\u003c/div\u003e","pt":"与激动药结合到相同的受体，能够逆转受体固有活性的药物，表现出与激动药相反的药理效应。固有活性是指受体在没有激动药作用时，本身存在一定的活性。","ok":true,"an":["药理效应"]},{"id":"41a68f8d36","no":12,"q":"竞争性拮抗药 (competitive antagonist)","a":"\u003cdiv class=\"q-ln\"\u003e与受体结合后本身不引起生物学效应，但阻断该受体激动药介导的作用，即对受体有较高亲和力但无内在活性的药物，且能与激动药竞争相同受体，其结合是可逆的。\u003c/div\u003e","pt":"与受体结合后本身不引起生物学效应，但阻断该受体激动药介导的作用，即对受体有较高亲和力但无内在活性的药物，且能与激动药竞争相同受体，其结合是可逆的。","ok":true,"an":["引起生物学效应","受体激动药"]},{"id":"3930542468","no":13,"q":"非竞争性拮抗药 (non-competitive antagonist)","a":"\u003cdiv class=\"q-ln\"\u003e与受体结合后本身不引起生物学效应，但阻断该受体激动药介导的作用，且分别与激动药结合到受体蛋白上不同的结合位点，阻止激动药引起的效应。非竞争性拮抗药通常降低激动药量-效曲线的E\u003csub\u003emax\u003c/sub\u003e，也一定程度地使激动药量-效曲线右移。\u003c/div\u003e","pt":"与受体结合后本身不引起生物学效应，但阻断该受体激动药介导的作用，且分别与激动药结合到受体蛋白上不同的结合位点，阻止激动药引起的效应。非竞争性拮抗药通常降低激动药量-效曲线的E max ，也一定程度地使激动药量-效曲线右移。","ok":true,"an":["引起生物学效应","受体结合后本身","受体激动药"]}],"count":13,"done":13},{"label":"第四章","questions":[{"id":"9503a4680d","no":1,"q":"乙酰胆碱是如何从胆碱能神经末梢释放的？","a":"\u003cdiv class=\"q-ln\"\u003e① 神经冲动传达到胆碱能神经末梢，神经末梢去极化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 细胞膜上的电压依赖性钙通道开放，钙离子内流。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 胞质内钙离子浓度升高，众多囊泡向突触前膜移动，与突触前膜融合。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 最终使得乙酰胆碱释放到突触间隙。\u003c/div\u003e","pt":"① 神经冲动传达到胆碱能神经末梢，神经末梢去极化。 ② 细胞膜上的电压依赖性钙通道开放，钙离子内流。 ③ 胞质内钙离子浓度升高，众多囊泡向突触前膜移动，与突触前膜融合。 ④ 最终使得乙酰胆碱释放到突触间隙。","ok":true,"an":["电压依赖性","突触前膜","钙离子","突触间隙","细胞膜"]},{"id":"c1e39b7d63","no":2,"q":"胆碱受体有几种亚型，主要分布在何处？","a":"\u003cdiv class=\"q-ln\"\u003e① 胆碱受体分为M和N两种亚型，各亚型又可再细分。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② M受体主要分布于副交感神经节后纤维支配的效应器细胞膜。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ N受体有两种亚型，在神经节细胞上的称为N\u003csub\u003eN\u003c/sub\u003e受体，在骨骼肌细胞上的称为 N\u003csub\u003eM\u003c/sub\u003e受体。\u003c/div\u003e","pt":"① 胆碱受体分为M和N两种亚型，各亚型又可再细分。 ② M受体主要分布于副交感神经节后纤维支配的效应器细胞膜。 ③ N受体有两种亚型，在神经节细胞上的称为N N 受体，在骨骼肌细胞上的称为 N M 受体。","ok":true,"an":["细胞膜","骨骼肌"]},{"id":"dbcbd8629d","no":3,"q":"肾上腺素受体有几种亚型，主要分布在何处？","a":"\u003cdiv class=\"q-ln\"\u003e① 肾上腺素受体有α和β两种亚型。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② α受体可分为α\u003csub\u003e1\u003c/sub\u003e和α\u003csub\u003e2\u003c/sub\u003e两种亚型，分别分布于突触后膜和突触前膜上。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② β受体可分为β\u003csub\u003e1\u003c/sub\u003e（主要分布于心脏、肾小球旁细胞）、β\u003csub\u003e2\u003c/sub\u003e（主要分布于平滑肌和肝脏以及突触前膜）、β\u003csub\u003e3\u003c/sub\u003e（主要分布于脂肪细胞）。\u003c/div\u003e","pt":"① 肾上腺素受体有α和β两种亚型。 ② α受体可分为α 1 和α 2 两种亚型，分别分布于突触后膜和突触前膜上。 ② β受体可分为β 1 （主要分布于心脏、肾小球旁细胞）、β 2 （主要分布于平滑肌和肝脏以及突触前膜）、β 3 （主要分布于脂肪细胞）。","ok":true,"an":["于突触后膜","突触前膜","心脏"]},{"id":"bf6cb0c40e","no":4,"q":"传出神经系统药物的作用方式有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e① 直接与受体结合：药物与受体结合，激动受体产生与递质相似的作用，称为激动药或拟似药，如异丙肾上腺素是β受体激动药。药物与受体结合后不激动受体，反而阻断递质与受体结合，拮抗其作用，称为拮抗药，如阿托品是M受体拮抗药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 影响递质：1.影响递质合成，如抑制ACh合成的密胆碱、抑制去甲肾上腺素合成的α-甲基酪氨酸。2.影响递质储存，如利血平抑制合成的多巴胺和NA进入囊泡，导致囊泡中递质耗竭，使去甲肾上腺素能神经功能下降。3.影响递质释放，有些药物可促进递质释放，如麻黄碱、间羟胺等可促进NA的释放，卡巴胆碱可促进ACh释放。还有些药物抑制递质释放，如胍乙定抑制NA释放。4.影响递质消除，如新斯的明可抑制胆碱酯酶活性，妨碍ACh水解，使突触间隙ACh浓度增加，产生拟胆碱作用。\u003c/div\u003e","pt":"① 直接与受体结合：药物与受体结合，激动受体产生与递质相似的作用，称为激动药或拟似药，如异丙肾上腺素是β受体激动药。药物与受体结合后不激动受体，反而阻断递质与受体结合，拮抗其作用，称为拮抗药，如阿托品是M受体拮抗药。 ② 影响递质：1.影响递质合成，如抑制ACh合成的密胆碱、抑制去甲肾上腺素合成的α-甲基酪氨酸。2.影响递质储存，如利血平抑制合成的多巴胺和NA进入囊泡，导致囊泡中递质耗竭，使去甲肾上腺素能神经功能下降。3.影响递质释放，有些药物可促进递质释放，如麻黄碱、间羟胺等可促进NA的释放，卡巴胆碱可促进ACh释放。还有些药物抑制递质释放，如胍乙定抑制NA释放。4.影响递质消除，如新斯的明可抑制胆碱酯酶活性，妨碍ACh水解，使突触间隙ACh浓度增加，产生拟胆碱作用。","ok":true,"an":["去甲肾上腺素","β受体激动药","M受体拮抗药","肾上腺素","影响递质","阿托品"]}],"count":4,"done":4},{"label":"第五章","questions":[{"id":"7afe23a5f4","no":1,"q":"毛果芸香碱治疗青光眼的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e激动瞳孔括约肌M受体，使得瞳孔缩小，虹膜向中心拉动使得虹膜根部变薄，从而使处于虹膜周围的前房角间隙扩大，房水易通过滤帘进入巩膜静脉窦，使眼压下降。\u003c/div\u003e","pt":"激动瞳孔括约肌M受体，使得瞳孔缩小，虹膜向中心拉动使得虹膜根部变薄，从而使处于虹膜周围的前房角间隙扩大，房水易通过滤帘进入巩膜静脉窦，使眼压下降。","ok":true,"an":["括约肌"]},{"id":"d30cf9596b","no":2,"q":"胆碱酯酶复活药解救有机磷中毒的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e例如碘解磷定，本品进入体内后，其分子中带正电的季铵氮与磷酰化胆碱酯酶的阴离子部分以静电引力相结合，结合后使其肟基趋向磷酰化胆碱酯酶的磷原子，进而与磷酰化进行共价结合，生成磷酰化乙酰胆碱酯酶和碘解磷定的复合物，后者经裂解产生磷酰化碘解磷定，同时使乙酰胆碱酯酶游离出来，恢复其水解乙酰胆碱的能力。此外本品也能与体内游离的有机磷酸酯类直接结合，形成无毒的磷酰化碘解磷定，随尿液排出，从而阻止游离的有机磷酸酯类与乙酰胆碱酯酶继续结合，故对其解毒作用也有一定意义。\u003c/div\u003e","pt":"例如碘解磷定，本品进入体内后，其分子中带正电的季铵氮与磷酰化胆碱酯酶的阴离子部分以静电引力相结合，结合后使其肟基趋向磷酰化胆碱酯酶的磷原子，进而与磷酰化进行共价结合，生成磷酰化乙酰胆碱酯酶和碘解磷定的复合物，后者经裂解产生磷酰化碘解磷定，同时使乙酰胆碱酯酶游离出来，恢复其水解乙酰胆碱的能力。此外本品也能与体内游离的有机磷酸酯类直接结合，形成无毒的磷酰化碘解磷定，随尿液排出，从而阻止游离的有机磷酸酯类与乙酰胆碱酯酶继续结合，故对其解毒作用也有一定意义。","ok":true,"an":["乙酰胆碱酯酶","乙酰胆碱","磷酸酯","阴离子"]},{"id":"5947f346b3","no":3,"q":"在解救有机磷中毒时，阿托品如何使用？","a":"\u003cdiv class=\"q-ln\"\u003e在消除毒物的同时，必须及早、足量、反复注射阿托品以达到“阿托品化”。然后减量维持，逐渐延长给药间隔时间，直至临床症状和体征基本消失后，方可停药。危重中毒患者，阿托品的用量还可酌情增加。如与乙酰胆碱酯酶复活药合用，应减少阿托品用量，以防止过量中毒。\u003c/div\u003e","pt":"在消除毒物的同时，必须及早、足量、反复注射阿托品以达到“阿托品化”。然后减量维持，逐渐延长给药间隔时间，直至临床症状和体征基本消失后，方可停药。危重中毒患者，阿托品的用量还可酌情增加。如与乙酰胆碱酯酶复活药合用，应减少阿托品用量，以防止过量中毒。","ok":true,"an":["乙酰胆碱酯酶","停药"]},{"id":"8f55f71128","no":4,"q":"哪几个环节导致肌松？","a":"\u003cdiv class=\"q-ln\"\u003e去极化型肌松药首先引起与N\u003csub\u003eM\u003c/sub\u003e受体有关的钠离子通道开放，后者导致肌肉的去极化，这将引起短暂的肌肉颤动（肌束震颤）。去极化型肌松药与其受体的持续结合使得受体不能传递更多的神经冲动。随着时间的进展，由于钠离子通道关闭或被阻断，持续的去极化转变为稳定的复极化，从而产生去极化反转，以致不再对其后所到达的动作电位发生反应，神经肌肉的传递受阻，表现为骨骼肌松弛。(//p69)\u003c/div\u003e","pt":"去极化型肌松药首先引起与N M 受体有关的钠离子通道开放，后者导致肌肉的去极化，这将引起短暂的肌肉颤动（肌束震颤）。去极化型肌松药与其受体的持续结合使得受体不能传递更多的神经冲动。随着时间的进展，由于钠离子通道关闭或被阻断，持续的去极化转变为稳定的复极化，从而产生去极化反转，以致不再对其后所到达的动作电位发生反应，神经肌肉的传递受阻，表现为骨骼肌松弛。(//p69)","ok":true,"an":["离子通道","发生反应","神经冲动","动作电位","神经肌肉","受体有关"]}],"count":4,"done":4},{"label":"第六章","questions":[{"id":"97d3924859","no":1,"q":"异丙肾上腺素为什么能治疗支气管哮喘？在治疗支气管哮喘时应注意什么？","a":"\u003cdiv class=\"q-ln\"\u003e异丙肾上腺素可激动支气管平滑肌β\u003csub\u003e2\u003c/sub\u003e受体使之松弛，而治疗支气管哮喘。还可抑制组胺等过敏介质的释放，解除支气管平滑肌痉挛，扩张支气管。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e注意事项：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1.久用可产生耐受性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2.大剂量气雾剂治疗支气管哮喘时，可使已处于缺氧状态患者的心肌耗氧量增加，易致心律失常，严重者出现心室颤动而死亡。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3.哮喘患者长期滥用可能引起猝死。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e4.因此，使用时一定要控制剂量。\u003c/div\u003e","pt":"异丙肾上腺素可激动支气管平滑肌β 2 受体使之松弛，而治疗支气管哮喘。还可抑制组胺等过敏介质的释放，解除支气管平滑肌痉挛，扩张支气管。 注意事项： 1.久用可产生耐受性。 2.大剂量气雾剂治疗支气管哮喘时，可使已处于缺氧状态患者的心肌耗氧量增加，易致心律失常，严重者出现心室颤动而死亡。 3.哮喘患者长期滥用可能引起猝死。 4.因此，使用时一定要控制剂量。","ok":true,"an":["产生耐受性","支气管平滑肌","心律失常","气雾剂","哮喘患者","组胺"]},{"id":"555c719c50","no":2,"q":"试述去甲肾上腺素、肾上腺素、多巴胺对血压影响的特点。","a":"\u003cdiv class=\"q-ln\"\u003e① 去甲肾上腺素: 小剂量滴注时，心肌兴奋，收缩压升高，脉压差加大；大剂量时，外周血管强烈收缩，外周阻力明显增高，收缩压与舒张压均显著升高，脉压差变小。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 肾上腺素: 对血压的影响与用药剂量和给药速度有关。极小剂量下，收缩压和舒张压均下降；皮下注射治疗量或缓慢静脉滴注时，心肌收缩力增强、心输出量增加，故收缩压升高，而骨骼肌血管的扩张作用可抵消或超过皮肤、黏膜和腹腔内脏血管的收缩作用，故舒张压不变或下降，脉压差加大，有利于血液对各组织器官的灌注；典型的血压改变是肾上腺素导致的双向反应，即给药后迅速出现明显的升压作用，而后出现微弱的降压反应，后者持续时间较长；较大剂量或快速滴注时，由于激动α受体引起的血管收缩效应占优势，外周阻力增大，收缩压与舒张压均升高。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 多巴胺: 增强心肌收缩性，增加心输出量，收缩压升高，对舒张压不变或使之略有增加，故脉压增大；高浓度多巴胺可激动血管的α受体，导致血管收缩，引起总的外周阻力增加，使血压升高，这一作用可被α受体拮抗药（如酚妥拉明）所拮抗。\u003c/div\u003e","pt":"① 去甲肾上腺素: 小剂量滴注时，心肌兴奋，收缩压升高，脉压差加大；大剂量时，外周血管强烈收缩，外周阻力明显增高，收缩压与舒张压均显著升高，脉压差变小。 ② 肾上腺素: 对血压的影响与用药剂量和给药速度有关。极小剂量下，收缩压和舒张压均下降；皮下注射治疗量或缓慢静脉滴注时，心肌收缩力增强、心输出量增加，故收缩压升高，而骨骼肌血管的扩张作用可抵消或超过皮肤、黏膜和腹腔内脏血管的收缩作用，故舒张压不变或下降，脉压差加大，有利于血液对各组织器官的灌注；典型的血压改变是肾上腺素导致的双向反应，即给药后迅速出现明显的升压作用，而后出现微弱的降压反应，后者持续时间较长；较大剂量或快速滴注时，由于激动α受体引起的血管收缩效应占优势，外周阻力增大，收缩压与舒张压均升高。 ③ 多巴胺: 增强心肌收缩性，增加心输出量，收缩压升高，对舒张压不变或使之略有增加，故脉压增大；高浓度多巴胺可激动血管的α受体，导致血管收缩，引起总的外周阻力增加，使血压升高，这一作用可被α受体拮抗药（如酚妥拉明）所拮抗。","ok":true,"an":["α受体拮抗药","心肌收缩力增强","皮下注射","静脉滴注","血管收缩","骨骼肌"]},{"id":"2a900c9dc4","no":3,"q":"何为肾上腺素升压作用的翻转？","a":"\u003cdiv class=\"q-ln\"\u003eα受体拮抗药可使肾上腺素的升压作用翻转为降压作用，即肾上腺素升压作用的翻转。该翻转作用的产生原因是α受体拮抗药选择性地拮抗了收缩血管的α\u003csub\u003e1\u003c/sub\u003e受体而不影响舒张血管的β\u003csub\u003e2\u003c/sub\u003e受体，因此取消了肾上腺素激动α受体的缩血管作用，使其舒张血管的效应充分表现出来。\u003c/div\u003e","pt":"α受体拮抗药可使肾上腺素的升压作用翻转为降压作用，即肾上腺素升压作用的翻转。该翻转作用的产生原因是α受体拮抗药选择性地拮抗了收缩血管的α 1 受体而不影响舒张血管的β 2 受体，因此取消了肾上腺素激动α受体的缩血管作用，使其舒张血管的效应充分表现出来。","ok":true,"an":["α受体拮抗药","升压作用翻转","舒张血管","选择性","收缩血管"]},{"id":"e76b4a3371","no":4,"q":"何为内在拟交感活性？有内在拟交感活性的药物有什么特点？","a":"\u003cdiv class=\"q-ln\"\u003e① 某些β受体拮抗药除能拮抗β受体外，还对β受体具有部分激动作用，称为内在拟交感活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 此种作用一般较弱，常被其β受体拮抗作用所掩盖，不易表现出来。如预先给予利血平使实验动物体内的儿茶酚胺耗竭，再用具有内在拟交感活性的β受体拮抗药，其β受体拮抗作用则消失，只表现出心脏兴奋、支气管平滑肌扩张等β受体激动作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 有内在拟交感活性的药物特点是: 1.引起心脏抑制和支气管收缩的作用较弱；2.在增加药物剂量或体内儿茶酚胺处于低水平时，可使心率加快和心输出量增加。\u003c/div\u003e","pt":"① 某些β受体拮抗药除能拮抗β受体外，还对β受体具有部分激动作用，称为内在拟交感活性。 ② 此种作用一般较弱，常被其β受体拮抗作用所掩盖，不易表现出来。如预先给予利血平使实验动物体内的儿茶酚胺耗竭，再用具有内在拟交感活性的β受体拮抗药，其β受体拮抗作用则消失，只表现出心脏兴奋、支气管平滑肌扩张等β受体激动作用。 ③ 有内在拟交感活性的药物特点是: 1.引起心脏抑制和支气管收缩的作用较弱；2.在增加药物剂量或体内儿茶酚胺处于低水平时，可使心率加快和心输出量增加。","ok":true,"an":["β受体拮抗药","支气管","儿茶酚胺","心脏抑制","心脏","心率加快"]},{"id":"f82614dcde","no":5,"q":"试述β受体拮抗药对心血管系统的作用。","a":"\u003cdiv class=\"q-ln\"\u003e① 心脏: 是β受体拮抗药的主要作用部位。在交感神经张力较高（如情绪激动、运动，以及高血压、心绞痛）时的心脏抑制作用显著，但对于休息时的正常人心脏几乎无影响。由于拮抗心脏β\u003csub\u003e1\u003c/sub\u003e受体使心率减慢，心肌收缩力减弱，心输出量减少，心肌耗氧量降低，除减慢窦性心律外，也能降低异位起搏点的自动去极化速度，并减慢心房和房室结的传导，延长房室结的有效不应期。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 血管和血压: 通过拮抗血管平滑肌的β\u003csub\u003e2\u003c/sub\u003e受体，使血管平滑肌α\u003csub\u003e1\u003c/sub\u003e受体兴奋性相对增高，加之心输出量减少而反射性引起交感神经兴奋，使血管收缩，外周阻力增加，骨骼肌和肝、肾等器官血流量减少，冠脉血流量也减少。β受体拮抗药对正常人血压没有影响，但对高血压患者有降压作用，表现为收缩压和舒张压均显著下降。\u003c/div\u003e","pt":"① 心脏: 是β受体拮抗药的主要作用部位。在交感神经张力较高（如情绪激动、运动，以及高血压、心绞痛）时的心脏抑制作用显著，但对于休息时的正常人心脏几乎无影响。由于拮抗心脏β 1 受体使心率减慢，心肌收缩力减弱，心输出量减少，心肌耗氧量降低，除减慢窦性心律外，也能降低异位起搏点的自动去极化速度，并减慢心房和房室结的传导，延长房室结的有效不应期。 ② 血管和血压: 通过拮抗血管平滑肌的β 2 受体，使血管平滑肌α 1 受体兴奋性相对增高，加之心输出量减少而反射性引起交感神经兴奋，使血管收缩，外周阻力增加，骨骼肌和肝、肾等器官血流量减少，冠脉血流量也减少。β受体拮抗药对正常人血压没有影响，但对高血压患者有降压作用，表现为收缩压和舒张压均显著下降。","ok":true,"an":["交感神经兴奋","情绪激动","血管平滑肌","心脏抑制","心绞痛","心脏"]}],"count":5,"done":5},{"label":"第七章","questions":[{"id":"bbf81ba2e6","no":1,"q":"局麻药使用时添加肾上腺素的目的及其注意事项。","a":"\u003cdiv class=\"q-ln\"\u003e局麻药使用时添加肾上腺素的目的:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 收缩血管，减少局麻药的吸收，使局部神经细胞膜药量增加，从而延长麻醉时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 由于吸收速度减慢，使单位时间内进入血液循环的药物减少，而减轻全身不良反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 还可减少术区的出血，保证术野清晰，有利于手术操作。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e注意事项:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 在手指及足趾等末梢部位禁用肾上腺素，否则可能引起局部组织坏死。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 使用肾上腺素后，局部神经血供减少加上局麻药作用时间延长，有可能引起神经毒性反应，应予以注意。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 本身具有缩血管作用的局麻药使用时不必加入肾上腺素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 伴有高血压、心律失常、甲亢等患者禁用。\u003c/div\u003e","pt":"局麻药使用时添加肾上腺素的目的: ① 收缩血管，减少局麻药的吸收，使局部神经细胞膜药量增加，从而延长麻醉时间。 ② 由于吸收速度减慢，使单位时间内进入血液循环的药物减少，而减轻全身不良反应。 ③ 还可减少术区的出血，保证术野清晰，有利于手术操作。 注意事项: ① 在手指及足趾等末梢部位禁用肾上腺素，否则可能引起局部组织坏死。 ② 使用肾上腺素后，局部神经血供减少加上局麻药作用时间延长，有可能引起神经毒性反应，应予以注意。 ③ 本身具有缩血管作用的局麻药使用时不必加入肾上腺素。 ④ 伴有高血压、心律失常、甲亢等患者禁用。","ok":true,"an":["心律失常","毒性反应","良反应","细胞膜","收缩血管","缩血管"]},{"id":"9cda942593","no":2,"q":"简述局部麻醉药的作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e局麻药通过阻滞给药局部及其支配区域的神经细胞膜电压门控钠通道，发挥局麻作用。在生理 pH（7.4）条件下，非解离型局麻药跨膜进入神经细胞内，在胞内较低的 pH（7.08）条件下，转变成解离型（RNH\u003csup\u003e+\u003c/sup\u003e），作用于钠通道 α 亚基第Ⅳ结构域 S\u003csub\u003e6\u003c/sub\u003e 片段内侧的氨基酸残基，阻滞钠通道，抑制 Na\u003csup\u003e+\u003c/sup\u003e 内流，抑制动作电位的发生，阻断神经冲动传导，发挥局部麻醉作用。因此，局麻药的脂溶性、解离速率及程度与局麻药作用密切相关。\u003c/div\u003e","pt":"局麻药通过阻滞给药局部及其支配区域的神经细胞膜电压门控钠通道，发挥局麻作用。在生理 pH（7.4）条件下，非解离型局麻药跨膜进入神经细胞内，在胞内较低的 pH（7.08）条件下，转变成解离型（RNH + ），作用于钠通道 α 亚基第Ⅳ结构域 S 6 片段内侧的氨基酸残基，阻滞钠通道，抑制 Na + 内流，抑制动作电位的发生，阻断神经冲动传导，发挥局部麻醉作用。因此，局麻药的脂溶性、解离速率及程度与局麻药作用密切相关。","ok":true,"an":["阻滞钠通道","钠通道","神经冲动","动作电位","细胞膜","脂溶性"]}],"count":2,"done":2},{"label":"第十章","questions":[{"id":"ce2011110f","no":1,"q":"简述苯二氮䓬类药物的作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 增强GABA与GABA\u003csub\u003eA\u003c/sub\u003e受体的结合效应，使Cl\u003csup\u003e-\u003c/sup\u003e通道开放频率增加。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 增强GABA能神经的传递功能和突触抑制效应。\u003c/div\u003e","pt":"① 增强GABA与GABA A 受体的结合效应，使Cl - 通道开放频率增加。 ② 增强GABA能神经的传递功能和突触抑制效应。","ok":true,"an":["通道开放","GABA","Cl"]},{"id":"6104882b0c","no":2,"q":"巴比妥类药物可分几类？各类列举一代表药物。","a":"\u003cdiv class=\"q-ln\"\u003e① 长效类: 苯巴比妥\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 中效类: 异戊巴比妥\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 短效类: 司可巴比妥\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 超短效类: 硫喷妥钠\u003c/div\u003e","pt":"① 长效类: 苯巴比妥 ② 中效类: 异戊巴比妥 ③ 短效类: 司可巴比妥 ④ 超短效类: 硫喷妥钠","ok":true,"an":["长效类","超短效类"]},{"id":"5ff1c8e737","no":3,"q":"试述苯巴比妥产生耐受性的原因。","a":"\u003cdiv class=\"q-ln\"\u003e苯巴比妥是肝药酶诱导剂，长期应用苯巴比妥可以诱导肝药酶生成，增加肝药酶活性，加速巴比妥类药物的代谢，产生耐受性和依赖性。\u003c/div\u003e","pt":"苯巴比妥是肝药酶诱导剂，长期应用苯巴比妥可以诱导肝药酶生成，增加肝药酶活性，加速巴比妥类药物的代谢，产生耐受性和依赖性。","ok":true,"an":["诱导肝药酶","代谢","肝药酶"]},{"id":"3817b3c8af","no":4,"q":"地西泮的药理作用和作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e作用机制: 同上\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e药理作用:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 抗焦虑作用: 焦虑症患者常表现出紧张、忧虑、恐惧等。地西泮为长效类药物，适用于持续性焦虑状态。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 镇静和催眠作用: 小剂量表现镇静作用，较大剂量产生催眠作用，缩短入睡时间，延长睡眠持续时间，减少觉醒次数。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗惊厥和抗癫痫作用: 通过抑制病灶的放电向周围皮质及皮质下扩散，终止或减轻发作。地西泮是目前治疗癫痫持续状态的首选药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 中枢性肌肉松弛作用: 临床表现具有较强的肌松作用和降低肌张力的作用，对大脑麻痹患者的肌肉强直有缓解作用，但大剂量时会阻断神经肌肉接头，使用时应把握好剂量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 治疗癔病: 极度兴奋躁动者，可肌内注射地西泮或氯丙嗪。\u003c/div\u003e","pt":"作用机制: 同上 药理作用: ① 抗焦虑作用: 焦虑症患者常表现出紧张、忧虑、恐惧等。地西泮为长效类药物，适用于持续性焦虑状态。 ② 镇静和催眠作用: 小剂量表现镇静作用，较大剂量产生催眠作用，缩短入睡时间，延长睡眠持续时间，减少觉醒次数。 ③ 抗惊厥和抗癫痫作用: 通过抑制病灶的放电向周围皮质及皮质下扩散，终止或减轻发作。地西泮是目前治疗癫痫持续状态的首选药。 ④ 中枢性肌肉松弛作用: 临床表现具有较强的肌松作用和降低肌张力的作用，对大脑麻痹患者的肌肉强直有缓解作用，但大剂量时会阻断神经肌肉接头，使用时应把握好剂量。 ⑤ 治疗癔病: 极度兴奋躁动者，可肌内注射地西泮或氯丙嗪。","ok":true,"an":["抗癫痫","长效类","治疗癔病","氯丙嗪","抑制病灶","肌内注射"]}],"count":4,"done":4},{"label":"第十一章","questions":[{"id":"f92a0a768a","no":1,"q":"简述抗癫痫药物的作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 调控Na\u003csup\u003e+\u003c/sup\u003e、K\u003csup\u003e+\u003c/sup\u003e、Ca\u003csup\u003e2+\u003c/sup\u003e等电压门控离子通道。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 增强GABA介导的抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 减弱谷氨酸介导的兴奋作用。\u003c/div\u003e","pt":"① 调控Na + 、K + 、Ca 2+ 等电压门控离子通道。 ② 增强GABA介导的抑制作用。 ③ 减弱谷氨酸介导的兴奋作用。","ok":true,"an":["离子通道","谷氨酸","GABA"]},{"id":"6c40844c4a","no":2,"q":"简述苯妥英钠作用的分子机制和临床用途。","a":"\u003cdiv class=\"q-ln\"\u003e分子机制:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 对高频异常放电神经元的Na\u003csup\u003e+\u003c/sup\u003e通道有显著的阻滞作用，降低细胞膜的兴奋性，从而抑制病灶神经元的高频异常放电和放电的扩散。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 能阻滞神经元的各型Ca\u003csup\u003e2+\u003c/sup\u003e通道，抑制Ca\u003csup\u003e2+\u003c/sup\u003e内流。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 高浓度苯妥英钠能抑制K\u003csup\u003e+\u003c/sup\u003e外流，从而延迟动作电位时程和不应期，此外还可抑制神经末梢对GABA的再摄取，并诱导GABA\u003csub\u003eA\u003c/sub\u003e受体增多，增强GABA介导的突触后抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e临床用途:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 抗癫痫: 对癫痫全面性发作、局灶性发作疗效较好，但对失神发作无效甚至加重。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 治疗外周神经痛: 用于治疗三叉神经、舌咽神经、坐骨神经等神经性疼痛。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗心律失常。\u003c/div\u003e","pt":"分子机制: ① 对高频异常放电神经元的Na + 通道有显著的阻滞作用，降低细胞膜的兴奋性，从而抑制病灶神经元的高频异常放电和放电的扩散。 ② 能阻滞神经元的各型Ca 2+ 通道，抑制Ca 2+ 内流。 ③ 高浓度苯妥英钠能抑制K + 外流，从而延迟动作电位时程和不应期，此外还可抑制神经末梢对GABA的再摄取，并诱导GABA A 受体增多，增强GABA介导的突触后抑制作用。 临床用途: ① 抗癫痫: 对癫痫全面性发作、局灶性发作疗效较好，但对失神发作无效甚至加重。 ② 治疗外周神经痛: 用于治疗三叉神经、舌咽神经、坐骨神经等神经性疼痛。 ③ 抗心律失常。","ok":true,"an":["抗癫痫","治疗外周神经痛","抗心律失常","抑制病灶","动作电位","细胞膜"]},{"id":"6ba6be2240","no":3,"q":"试述久服苯妥英钠引起钙和叶酸缺乏的原因。","a":"\u003cdiv class=\"q-ln\"\u003e① 抑制叶酸的吸收并加速其代谢，抑制二氢叶酸还原酶的活性，长期用药可导致巨幼细胞贫血，宜采用甲酰四氢叶酸防治。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 诱导肝药酶而加速维生素D的代谢，使小肠对钙和磷的吸收减少，长期应用可导致低钙血症、佝偻病样改变和骨软化症。\u003c/div\u003e","pt":"① 抑制叶酸的吸收并加速其代谢，抑制二氢叶酸还原酶的活性，长期用药可导致巨幼细胞贫血，宜采用甲酰四氢叶酸防治。 ② 诱导肝药酶而加速维生素D的代谢，使小肠对钙和磷的吸收减少，长期应用可导致低钙血症、佝偻病样改变和骨软化症。","ok":true,"an":["诱导肝药酶","代谢","长期用药","维生素"]},{"id":"13959bb515","no":4,"q":"简述硫酸镁不同用药途径的适应证及其抗惊厥作用的机制。","a":"\u003cdiv class=\"q-ln\"\u003e适应证:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 口服: 利胆和泻下\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 注射给药: 抗惊厥和降血压\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e抗惊厥的机制: 阻断神经肌肉接头的神经传递。因为Mg\u003csup\u003e2+\u003c/sup\u003e和Ca\u003csup\u003e2+\u003c/sup\u003e化学性质相似，能与Ca\u003csup\u003e2+\u003c/sup\u003e受点竞争性结合，抑制Ca\u003csup\u003e2+\u003c/sup\u003e内流，从而使运动神经末梢ACh释放减少，产生肌肉松弛作用。\u003c/div\u003e","pt":"适应证: ① 口服: 利胆和泻下 ② 注射给药: 抗惊厥和降血压 抗惊厥的机制: 阻断神经肌肉接头的神经传递。因为Mg 2+ 和Ca 2+ 化学性质相似，能与Ca 2+ 受点竞争性结合，抑制Ca 2+ 内流，从而使运动神经末梢ACh释放减少，产生肌肉松弛作用。","ok":true,"an":["注射给药","化学性质相似","口服","神经肌肉","神经末梢","竞争性"]}],"count":4,"done":4},{"label":"第十二章","questions":[{"id":"63b0a0529a","no":1,"q":"试述氯丙嗪阻断脑内四条DA能神经通路的DA受体所产生的药理作用或副作用。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗精神病作用: 阻断中脑-边缘系统和中脑-皮质通路的D\u003csub\u003e2\u003c/sub\u003e样受体发挥抗精神病作用，精神病患者用药后，可迅速控制兴奋躁动，如继续用药可使幻觉、妄想等逐渐消失，理智恢复，情绪安定，生活自理。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 对内分泌的影响: 阻断结节-漏斗多巴胺通路的D\u003csub\u003e2\u003c/sub\u003e样受体，影响下丘脑多种激素的分泌，如抑制ACh释放，使糖皮质激素减少，以及抑制垂体生长激素分泌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 锥体外系反应: 阻断黑质-纹状体通路D\u003csub\u003e2\u003c/sub\u003e样受体，使纹状体多巴胺功能减弱，而引起药源性帕金森综合征、静坐不能、急性肌张力障碍。\u003c/div\u003e","pt":"① 抗精神病作用: 阻断中脑-边缘系统和中脑-皮质通路的D 2 样受体发挥抗精神病作用，精神病患者用药后，可迅速控制兴奋躁动，如继续用药可使幻觉、妄想等逐渐消失，理智恢复，情绪安定，生活自理。 ② 对内分泌的影响: 阻断结节-漏斗多巴胺通路的D 2 样受体，影响下丘脑多种激素的分泌，如抑制ACh释放，使糖皮质激素减少，以及抑制垂体生长激素分泌。 ③ 锥体外系反应: 阻断黑质-纹状体通路D 2 样受体，使纹状体多巴胺功能减弱，而引起药源性帕金森综合征、静坐不能、急性肌张力障碍。","ok":true,"an":["锥体外系反应","多巴胺","糖皮质激素","急性肌张力障碍","边缘系统","生长激素"]},{"id":"66ded27fb7","no":2,"q":"简述氯丙嗪抗精神病作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e氯丙嗪抗精神分裂症作用机制与该药阻断中脑-边缘系统和中脑-皮质通路的D\u003csub\u003e2\u003c/sub\u003e样受体有关。此外，氯丙嗪对中枢胆碱受体、肾上腺素受体、组胺受体和5-HT受体也有一定的阻断作用，从而产生较强的抗精神病作用。\u003c/div\u003e","pt":"氯丙嗪抗精神分裂症作用机制与该药阻断中脑-边缘系统和中脑-皮质通路的D 2 样受体有关。此外，氯丙嗪对中枢胆碱受体、肾上腺素受体、组胺受体和5-HT受体也有一定的阻断作用，从而产生较强的抗精神病作用。","ok":true,"an":["肾上腺素","精神分裂症","边缘系统","组胺受体"]},{"id":"9eb9888322","no":3,"q":"试述氯丙嗪药理作用与临床应用。","a":"\u003cdiv class=\"q-ln\"\u003e\u003cspan style=color:red;\u003e药理作用:\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e对中枢神经系统的影响:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 抗精神分裂症作用: 患者用药后可迅速控制兴奋躁动状态，大剂量连续用药后幻觉、妄想、躁动及精神运动性兴奋逐渐消失，理智恢复，生活自理。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 镇吐作用: 小剂量选择性阻断延髓催吐化学感受区的D\u003csub\u003e2\u003c/sub\u003e受体，大剂量直接抑制呕吐中枢。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 对体温调节的作用: 抑制下丘脑体温调节中枢，使体温调节失灵，不仅降低发热患者的体温，也可降低正常人的体温。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e对自主神经系统的影响:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 阻断α受体致血管扩张和血压下降，但由于连续用药产生耐受性，且副作用较多，不宜用于高血压的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 阻断M受体，引起口干、便秘、尿潴留和视力模糊等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e对内分泌的影响:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 阻断结节-漏斗多巴胺通路D\u003csub\u003e2\u003c/sub\u003e样受体，影响下丘脑多种激素分泌，如: 抑制ACh释放，使糖皮质激素减少；抑制垂体生长激素的分泌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e\u003cspan style=color:red;\u003e临床应用:\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e精神分裂症: 主要治疗精神分裂症阳性症状，对阴性症状无效甚至加重病情。也可用于治疗双相障碍的狂躁症状及其他精神病伴有的兴奋躁动、紧张和妄想等症状。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e呕吐和顽固性呃逆: 对多种药物和疾病（除晕动症外）引起的呕吐都有效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e人工冬眠: 与哌替啶、异丙嗪等中枢抑制药组成冬眠合剂，使患者处于深睡状态。\u003c/div\u003e","pt":"药理作用: 对中枢神经系统的影响: ① 抗精神分裂症作用: 患者用药后可迅速控制兴奋躁动状态，大剂量连续用药后幻觉、妄想、躁动及精神运动性兴奋逐渐消失，理智恢复，生活自理。 ② 镇吐作用: 小剂量选择性阻断延髓催吐化学感受区的D 2 受体，大剂量直接抑制呕吐中枢。 ③ 对体温调节的作用: 抑制下丘脑体温调节中枢，使体温调节失灵，不仅降低发热患者的体温，也可降低正常人的体温。 对自主神经系统的影响: ① 阻断α受体致血管扩张和血压下降，但由于连续用药产生耐受性，且副作用较多，不宜用于高血压的治疗。 ② 阻断M受体，引起口干、便秘、尿潴留和视力模糊等。 对内分泌的影响: ① 阻断结节-漏斗多巴胺通路D 2 样受体，影响下丘脑多种激素分泌，如: 抑制ACh释放，使糖皮质激素减少；抑制垂体生长激素的分泌。 临床应用: 精神分裂症: 主要治疗精神分裂症阳性症状，对阴性症状无效甚至加重病情。也可用于治疗双相障碍的狂躁症状及其他精神病伴有的兴奋躁动、紧张和妄想等症状。 呕吐和顽固性呃逆: 对多种药物和疾病（除晕动症外）引起的呕吐都有效。 人工冬眠: 与哌替啶、异丙嗪等中枢抑制药组成冬眠合剂，使患者处于深睡状态。","ok":true,"an":["精神分裂症","人工冬眠","中枢神经系统","多巴胺","糖皮质激素","产生耐受性"]},{"id":"0330ac3f11","no":4,"q":"锥体外系反应的主要表现是什么？为何氯丙嗪长期大量用药会出现锥体外系反应？","a":"\u003cdiv class=\"q-ln\"\u003e① 主要表现: 1.药源性帕金森综合征；2.静坐不能；3.急性肌张力障碍；4.迟发性运动障碍。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 原因: 前三种是由于氯丙嗪阻断黑质-纹状体通路D\u003csub\u003e2\u003c/sub\u003e样受体，使纹状体多巴胺功能减弱所致。第四种是由于突触后膜多巴胺受体长期被阻断，多巴胺受体数目增加，即向上调节，从而使黑质-纹状体多巴胺功能相对增强。\u003c/div\u003e","pt":"① 主要表现: 1.药源性帕金森综合征；2.静坐不能；3.急性肌张力障碍；4.迟发性运动障碍。 ② 原因: 性的心率加快，对心输出量无明显影响。 ② 预防和逆转心肌与血管构形重建。 ③ 增加肾血流量，保护肾脏。 ④ 能改善胰岛素抵抗，预防和逆转肾小球基底膜糖化，不引起电解质紊乱和脂质代谢改变。","ok":true,"an":["电解质紊乱","代谢","胰岛素","逆转心肌","心率加快"]},{"id":"ef3337d174","no":5,"q":"试述普萘洛尔的抗高血压机制、临床用途及禁忌证。","a":"\u003cdiv class=\"q-ln\"\u003e抗高血压机制:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 拮抗心肌β\u003csub\u003e1\u003c/sub\u003e受体，降低心输出量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 拮抗肾小球旁器β\u003csub\u003e1\u003c/sub\u003e受体，减少肾素分泌，降低RAS系统活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 一些β受体拮抗药能通过血脑屏障进入中枢，拮抗中枢β受体，从而降低外周交感神经活性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 拮抗外周去甲肾上腺素能神经末梢突触前膜β\u003csub\u003e2\u003c/sub\u003e受体，抑制正反馈调节作用，从而减少去甲肾上腺素释放。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 促进PGI\u003csub\u003e2\u003c/sub\u003e合成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e临床应用: 高血压、心绞痛、心肌梗死、心力衰竭。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e禁忌证: 禁用于严重心动过缓、支气管哮喘患者。\u003c/div\u003e","pt":"抗高血压机制: ① 拮抗心肌β 1 受体，降低心输出量。 ② 拮抗肾小球旁器β 1 受体，减少肾素分泌，降低RAS系统活性。 ③ 一些β受体拮抗药能通过血脑屏障进入中枢，拮抗中枢β受体，从而降低外周交感神经活性。 ④ 拮抗外周去甲肾上腺素能神经末梢突触前膜β 2 受体，抑制正反馈调节作用，从而减少去甲肾上腺素释放。 ⑤ 促进PGI 2 合成。 临床应用: 高血压、心绞痛、心肌梗死、心力衰竭。 禁忌证: 禁用于严重心动过缓、支气管哮喘患者。","ok":true,"an":["去甲肾上腺素","β受体拮抗药","支气管","心力衰竭","突触前膜","心绞痛"]},{"id":"a777a63e93","no":6,"q":"血管扩张药的主要不良反应有哪些？如何纠正？","a":"\u003cdiv class=\"q-ln\"\u003e① 激活交感神经，使心肌收缩力加强、心率加快，从而增加心肌耗氧量，易诱发心绞痛；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 交感神经兴奋可致肾素释放增加，激活RAS系统，导致循环中血管紧张素含量增加，从而使血压上升，减弱其降压效果。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e防止措施：可合用利尿药或β受体拮抗药来加以纠正。\u003c/div\u003e","pt":"① 激活交感神经，使心肌收缩力加强、心率加快，从而增加心肌耗氧量，易诱发心绞痛； ② 交感神经兴奋可致肾素释放增加，激活RAS系统，导致循环中血管紧张素含量增加，从而使血压上升，减弱其降压效果。 防止措施：可合用利尿药或β受体拮抗药来加以纠正。","ok":true,"an":["β受体拮抗药","利尿药","防止措施","血管紧张素","心绞痛"]}],"count":6,"done":6},{"label":"第十八章","questions":[{"id":"fe423aa796","no":1,"q":"详述抗心律失常药物的分类，并各举一代表药。","a":"\u003cdiv class=\"q-ln\"\u003eⅠ类: 钠通道阻滞药\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① Ⅰa 类 适度阻滞钠通道。如: 奎尼丁。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② Ⅰb 类 轻度阻滞钠通道。如: 利多卡因。\u003c/div\u0 衰竭）的药物主要有哪几类？请举例代表药物。","a":"\u003cdiv class=\"q-ln\"\u003e神经-内分泌系统抑制药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003eⅠ RAS系统抑制药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① ACEI: 卡托普利\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② ARB: 缬沙坦\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 血管紧张素受体-脑啡肽酶抑制药: 沙库巴曲缬沙坦\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 醛固酮受体拮抗药: 螺内酯\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003eⅡ β受体拮抗药: 美托洛尔\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e减轻心脏负荷药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 利尿药: 氢氯噻嗪\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 血管扩张药: 硝普钠\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e正性肌力药:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 强心苷类: 地高辛\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 其他正性肌力药: 1.β受体激动药: 多巴胺；2.磷酸二酯酶抑制药: 米力农；3.钙增敏药: 左西孟旦\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e其他药物:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 钠-葡萄糖共转运蛋白2抑制药: 达格列净\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 可溶性鸟苷酸环化酶激动药: 维立西呱\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗心律失常药: 伊伐布雷定\u003c/div\u003e","pt":"神经-内分泌系统抑制药: Ⅰ RAS系统抑制药: ① ACEI: 卡托普利 ② ARB: 缬沙坦 ③ 血管紧张素受体-脑啡肽酶抑制药: 沙库巴曲缬沙坦 ④ 醛固酮受体拮抗药: 螺内酯 Ⅱ β受体拮抗药: 美托洛尔 减轻心脏负荷药: ① 利尿药: 氢氯噻嗪 ② 血管扩张药: 硝普钠 正性肌力药: ① 强心苷类: 地高辛 ② 其他正性肌力药: 1.β受体激动药: 多巴胺；2.磷酸二酯酶抑制药: 米力农；3.钙增敏药: 左西孟旦 其他药物: ① 钠-葡萄糖共转运蛋白2抑制药: 达格列净 ② 可溶性鸟苷酸环化酶激动药: 维立西呱 ③ 抗心律失常药: 伊伐布雷定","ok":true,"an":["醛固酮受体拮抗药","Ⅱ β受体拮抗药","其他正性肌力药","抗心律失常药","β受体激动药","血管扩张药"]},{"id":"8e15b95ee9","no":4,"q":"强心苷类正性肌力作用的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e强心苷类药物通过抑制心肌细胞膜上的Na\u003csup\u003e+\u003c/sup\u003e-K\u003csup\u003e+\u003c/sup\u003e-ATP酶，使Na\u003csup\u003e+\u003c/sup\u003e在细胞内积聚，促进Na\u003csup\u003e+\u003c/sup\u003e-Ca\u003csup\u003e2+\u003c/sup\u003e交换，升高细胞内Ca\u003csup\u003e2+\u003c/sup\u003e浓度而增强心肌收缩力。\u003c/div\u003e","pt":"强心苷类药物通过抑制心肌细胞膜上的Na + -K + -ATP酶，使Na + 在细胞内积聚，促进Na + -Ca 2+ 交换，升高细胞内Ca 2+ 浓度而增强心肌收缩力。","ok":true,"an":["细胞膜","抑制心肌","ATP","Na","Ca"]},{"id":"445fb8bbb2","no":5,"q":"试述强心苷治疗心房纤颤和心房扑动的药理依据。","a":"\u003cdiv class=\"q-ln\"\u003e① 心房纤颤: 强心苷类通过减慢房室传导，阻止过多冲动传入心室，从而减慢心室率，改善心室泵血功能。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 心房扑动: 缩短心房不应期，使扑动变为颤动。\u003c/div\u003e","pt":"① 心房纤颤: 强心苷类通过减慢房室传导，阻止过多冲动传入心室，从而减慢心室率，改善心室泵血功能。 ② 心房扑动: 缩短心房不应期，使扑动变为颤动。","ok":true,"an":["强心苷类","房室传导","应期"]},{"id":"cbdc94f6eb","no":6,"q":"简述强心苷的不良反应及中毒的防治措施。","a":"\u003cdiv class=\"q-ln\"\u003e不良反应:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 胃肠道反应: 为常见的早期反应，表现为厌食、恶心、呕吐、腹泻。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 中枢神经系统反应: 眩晕、头疼、疲倦、失眠、谵妄，以及视觉障碍。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 心脏反应: 1.快速型心律失常；2.房室传导阻滞；3.窦性心动过缓。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e防治措施:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 氯化钾: 快速型心律失常应及时补钾。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 苯妥英钠: 对强心苷类引起的重症快速型心律失常，常用苯妥英钠救治。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 利多卡因: 解救强心苷类引起的严重室性心动过速和心室纤颤。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 阿托品: 对强心苷类引起的房室传导阻滞、窦性心动过缓、窦性停搏等，可采用阿托品静脉注射治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 地高辛抗体: 治疗严重危及生命的地高辛中毒。\u003c/div\u003e","pt":"不良反应: ① 胃肠道反应: 为常见的早期反应，表现为厌食、恶心、呕吐、腹泻。 ② 中枢神经系统反应: 眩晕、头疼、疲倦、失眠、谵妄，以及视觉障碍。 ③ 心脏反应: 1.快速型心律失常；2.房室传导阻滞；3.窦性心动过缓。 防治措施: ① 氯化钾: 快速型心律失常应及时补钾。 ② 苯妥英钠: 对强心苷类引起的重症快速型心律失常，常用苯妥英钠救治。 ③ 利多卡因: 解救强心苷类引起的严重室性心动过速和心室纤颤。 ④ 阿托品: 对强心苷类引起的房室传导阻滞、窦性心动过缓、窦性停搏等，可采用阿托品静脉注射治疗。 ⑤ 地高辛抗体: 治疗严重危及生命的地高辛中毒。","ok":true,"an":["苯妥英钠","胃肠道反应","地高辛抗体","氯化钾","强心苷类","心脏反应"]},{"id":"b83e469ea1","no":7,"q":"治疗充血性心力衰竭选用强心苷而不用肾上腺素或异丙肾上腺素的原因是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 强心苷有正性肌力、负性频率作用，增加衰竭心脏的心肌收缩力和心输出量的同时，不增加甚至降低心肌耗氧量；心率减慢使舒张期延长，使有效回心血量升高，使心脏可以更加充分休息并获得更多的冠脉供血。因此，强心苷可有效缓解充血性心力衰竭患者的症状。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 而肾上腺素和异丙肾上腺素，虽对心脏β\u003csub\u003e1\u003c/sub\u003e受体有兴奋作用，可使心肌收缩力升高，心输出量升高，但同时心脏的兴奋性升高，心脏自律性升高，心率加快，并增加心肌耗氧量，反而导致心力衰竭加重和心律失常。\u003c/div\u003e","pt":"① 强心苷有正性肌力、负性频率作用，增加衰竭心脏的心肌收缩力和心输出量的同时，不增加甚至降低心肌耗氧量；心率减慢使舒张期延长，使有效回心血量升高，使心脏可以更加充分休息并获得更多的冠脉供血。因此，强心苷可有效缓解充血性心力衰竭患者的症状。 ② 而肾上腺素和异丙肾上腺素，虽对心脏β 1 受体有兴奋作用，可使心肌收缩力升高，心输出量升高，但同时心脏的兴奋性升高，心脏自律性升高，心率加快，并增加心肌耗氧量，反而导致心力衰竭加重和心律失常。","ok":true,"an":["心律失常","心脏","心率减慢","心率加快","兴奋性","负性"]}],"count":7,"done":7},{"label":"第二十章","questions":[{"id":"5dab4c364d","no":1,"q":"简述硝酸酯类抗心绞痛作用的主要分子机制。","a":"\u003cdiv class=\"q-ln\"\u003e硝酸酯类在血管平滑肌细胞内代谢释放NO，后者与可溶性GC的血红素Fe\u003csup\u003e2+\u003c/sup\u003e结合，激活GC催化GTP生成cGMP，激活cGMP依赖的蛋白激酶，抑制胞外Ca\u003csup\u003e2+\u003c/sup\u003e内流与胞内Ca\u003csup\u003e2+\u003c/sup\u003e释放，降低胞内游离Ca\u003csup\u003e2+\u003c/sup\u003e浓度，使得肌球蛋白轻链去磷酸化而松弛血管平滑肌。\u003c/div\u003e","pt":"硝酸酯类在血管平滑肌细胞内代谢释放NO，后者与可溶性GC的血红素Fe 2+ 结合，激活GC催化GTP生成cGMP，激活cGMP依赖的蛋白激酶，抑制胞外Ca 2+ 内流与胞内Ca 2+ 释放，降低胞内游离Ca 2+ 浓度，使得肌球蛋白轻链去磷酸化而松弛血管平滑肌。","ok":true,"an":["代谢","蛋白激酶","血管平滑肌","cGMP","GTP","GC"]},{"id":"8f6c1bef67","no":2,"q":"试述普萘洛尔与硝酸酯类或硝苯地平联合应用抗心绞痛的药理学基础。","a":"\u003cdiv class=\"q-ln\"\u003e① 普萘洛尔与硝酸酯类合用: 1.普萘洛尔可对抗硝酸甘油引起的反射性心率加快、心肌收缩力增强；2.硝酸酯类可缩小β受体拮抗药抑制心脏所致的心室容积增大、射血时间延长。3.可协同降低心肌耗氧量；4.各自用量减少，不良反应减少。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 普萘洛尔与硝苯地平合用: 1.普萘洛尔可抑制硝苯地平引起的反射性交感兴奋；2.硝苯地平可拮抗β受体拮抗药所致的血管收缩。3.可协同抗心绞痛。4.各自用量减少，不良反应减少。\u003c/div\u003e","pt":"① 普萘洛尔与硝酸酯类合用: 1.普萘洛尔可对抗硝酸甘油引起的反射性心率加快、心肌收缩力增强；2.硝酸酯类可缩小β受体拮抗药抑制心脏所致的心室容积增大、射血时间延长。3.可协同降低心肌耗氧量；4.各自用量减少，不良反应减少。 ② 普萘洛尔与硝苯地平合用: 1.普萘洛尔可抑制硝苯地平引起的反射性交感兴奋；2.硝苯地平可拮抗β受体拮抗药所致的血管收缩。3.可协同抗心绞痛。4.各自用量减少，不良反应减少。","ok":true,"an":["β受体拮抗药","心肌收缩力增强","心脏","良反应","心率加快","血管收缩"]},{"id":"404a11bcf0","no":3,"q":"简述伊伐布雷定抗心绞痛的作用机制及应用。","a":"\u003cdiv class=\"q-ln\"\u003e① 作用机制: 选择性抑制窦房结的I\u003csub\u003ef\u003c/sub\u003e起搏电流，降低窦房结节律，减慢心率，降低心肌耗氧量，从而减轻心绞痛症状、降低心绞痛发作频率。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 该药对心内传导、心肌收缩力和心室复极化无明显影响，适用于不能耐受β受体拮抗药的心绞痛患者，可降低心肌梗死的风险。\u003c/div\u003e","pt":"① 作用机制: 选择性抑制窦房结的I f 起搏电流，降低窦房结节律，减慢心率，降低心肌耗氧量，从而减轻心绞痛症状、降低心绞痛发作频率。 ② 应用: 该药对心内传导、心肌收缩力和心室复极化无明显影响，适用于不能耐受β受体拮抗药的心绞痛患者，可降低心肌梗死的风险。","ok":true,"an":["β受体拮抗药","选择性抑制","心肌梗死","复极化"]},{"id":"8285fa53dd","no":4,"q":"维拉帕米不能和β受体拮抗药合用的原因？","a":"\u003cdiv class=\"q-ln\"\u003e维拉帕米为钙通道阻滞药，对心脏的选择性大于血管，抑制窦房结自律性和房室结传导，减慢心率，抑制心肌收缩力，使心肌耗氧量降低，对心脏的抑制作用强。不宜与β受体拮抗药合用，以免诱发严重的心动过缓、房室传导阻滞及心力衰竭。\u003c/div\u003e","pt":"维拉帕米为钙通道阻滞药，对心脏的选择性大于血管，抑制窦房结自律性和房室结传导，减慢心率，抑制心肌收缩力，使心肌耗氧量降低，对心脏的抑制作用强。不宜与β受体拮抗药合用，以免诱发严重的心动过缓、房室传导阻滞及心力衰竭。","ok":true,"an":["钙通道阻滞药","房室传导阻滞","心力衰竭","心脏"]}],"count":4,"done":4},{"label":"第二十一章","questions":[{"id":"189b90a0ee","no":1,"q":"简述降血脂药主要包括哪几类？他们的代表药物。","a":"\u003cdiv class=\"q-ln\"\u003e① 他汀类: 洛伐他汀\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 胆汁酸结合树脂: 考来烯胺\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 胆固醇吸收抑制药: 依折麦布\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ PCSK9抑制药: 依洛尤单抗\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 贝特类: 非诺贝特\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 烟酸类: 烟酸\u003c/div\u003e","pt":"① 他汀类: 洛伐他汀 ② 胆汁酸结合树脂: 考来烯胺 ③ 胆固醇吸收抑制药: 依折麦布 ④ PCSK9抑制药: 依洛尤单抗 ⑤ 贝特类: 非诺贝特 ⑥ 烟酸类: 烟酸","ok":true,"an":["胆固醇吸收抑制药","胆汁酸结合树脂"]}],"count":1,"done":1},{"label":"第二十二章","questions":[{"id":"67a41781e5","no":1,"q":"为什么影响髓袢升支粗段的利尿药作用最强？而影响远曲小管及集合管重吸收的利尿药作用不强。","a":"\u003cdiv class=\"q-ln\"\u003e利尿药的作用强度大小取决于其抑制肾脏不同部位Na\u003csup\u003e+\u003c/sup\u003e重吸收程度的高低:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 髓袢升支髓质部和皮质部对肾小球滤过的Na\u003csup\u003e+\u003c/sup\u003e重吸收比例占20%\\~25%，髓袢升支皮质部占10%，但远曲小管和集合管对Na\u003csup\u003e+\u003c/sup\u003e重吸收比例仅为2%\\~5%。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抑制髓袢升支粗段髓质和皮质部Na\u003csup\u003e+\u003c/sup\u003e重吸收后，破坏了肾脏的浓缩功能和稀释功能，产生强大的利尿作用，而抑制远曲小管和集合管Na\u003csup\u003e+\u003c/sup\u003e重吸收后，则产生弱的利尿作用。\u003c/div\u003e","pt":"利尿药的作用强度大小取决于其抑制肾脏不同部位Na + 重吸收程度的高低: ① 髓袢升支髓质部和皮质部对肾小球滤过的Na + 重吸收比例占20%\\~25%，髓袢升支皮质部占10%，但远曲小管和集合管对Na + 重吸收比例仅为2%\\~5%。 ② 抑制髓袢升支粗段髓质和皮质部Na + 重吸收后，破坏了肾脏的浓缩功能和稀释功能，产生强大的利尿作用，而抑制远曲小管和集合管Na + 重吸收后，则产生弱的利尿作用。","ok":true,"an":["同部位","Na"]},{"id":"69b8c6869a","no":2,"q":"简述噻嗪类利尿药的不良反应。","a":"\u003cdiv class=\"q-ln\"\u003e① 电解质紊乱: 低血钾、低血钠、低血镁、低氯性碱血症等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 高尿酸血症: 与其在近曲小管和尿酸竞争有机酸分泌途径有关。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 影响代谢: 可致糖尿病患者血糖升高，可能与其抑制胰岛素分泌及减少组织对葡萄糖利用有关。还可使血清胆固醇升高5%\\~15%，并升高血清低密度脂蛋白含量。\u003c/ 剂量阿司匹林直接抑制血管内皮细胞合成PGI\u003csub\u003e2\u003c/sub\u003e，PGI\u003csub\u003e2\u003c/sub\u003e是TXA\u003csub\u003e2\u003c/sub\u003e拮抗药，它的合成减少促进血小板聚集和血栓形成。）\u003c/div\u003e","pt":"TXA 2 是诱发血小板聚集和血栓形成的重要内源性物质。小剂量阿司匹林不可逆的抑制血小板COX，抑制TXA 2 合成，从而抑制血栓形成。 （大剂量阿司匹林直接抑制血管内皮细胞合成PGI 2 ，PGI 2 是TXA 2 拮抗药，它的合成减少促进血小板聚集和血栓形成。）","ok":true,"an":["拮抗药","血小板","PGI"]},{"id":"6a67d6ca81","no":3,"q":"NSAID与吗啡的镇痛作用，NSAID与氯丙嗪的体温调节作用。","a":"\u003cdiv class=\"q-ln\"\u003e① NSAID与吗啡镇痛作用的比较:\u003c/div\u003e\u003cdiv class=\"q-tbl\"\u003e\u003ctable style=\"width:100%;border-collapse:collapse;text-align:center;border:2px solid #333;font-size:0.95em;\"\u003e\u003cthead\u003e\u003ctr style=\"background:#e8e8e8;\"\u003e\u003cth style=\"border:1px solid #333;padding:10px;width:18%;\"\u003e\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003eNSAID\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e吗啡\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e镇痛强度\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e中等\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e强\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e作用部位\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e外周\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e中枢\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e作用机制\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e抑制PG合成\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;\"\u003e激动阿片受体\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e成瘾性\u00 停药。\u003c/div\u003e","pt":"又叫停药反应，因长期应用某些药物（如糖皮质激素），机体对其已产生适应性改变，导致突然停药后原有疾病加剧的现象。原因可能是患者对激素产生了依赖性或症状尚未被充分控制。常需加大剂量再行治疗，待症状缓解后再缓慢减量、停药。","ok":true,"an":["糖皮质激素","依赖性","适应性","停药"]},{"id":"190a3c3a27","no":2,"q":"允许作用","a":"\u003cdiv class=\"q-ln\"\u003e糖皮质激素类药物对某些组织细胞虽无直接作用，但可给其他激素发挥作用创造有利条件，称为允许作用。如糖皮质激素类药物可增强儿茶酚胺的收缩血管作用和胰高血糖素的升高血糖作用等。\u003c/div\u003e","pt":"糖皮质激素类药物对某些组织细胞虽无直接作用，但可给其他激素发挥作用创造有利条件，称为允许作用。如糖皮质激素类药物可增强儿茶酚胺的收缩血管作用和胰高血糖素的升高血糖作用等。","ok":true,"an":["糖皮质激素类","胰高血糖素","儿茶酚胺"]},{"id":"1e76f89578","no":3,"q":"试述糖皮质激素类药物的主要药理作用。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗炎作用：具有强大的抗炎作用，能抑制各种原因引起的炎症反应；对炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 免疫抑制与抗过敏作用：对免疫反应的多个环节具有抑制作用；1.包括抑制巨噬细胞吞噬和处理抗原；2.阻碍淋巴母细胞转化，破坏淋巴细胞；3.干扰淋巴组织在抗原作用下的分裂和增殖，阻断致敏T细胞诱发的单核细胞和巨噬细胞的募集等，抑制淋巴因子所引起的炎症反应，故可抑制皮肤Ⅳ型超敏反应和异体组织脏器移植的排斥反应；4.小剂量主要抑制细胞免疫；5.大剂量可抑制B细胞转化成浆细胞，抑制体液免疫。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗休克作用：常用于严重休克，特别是中毒性休克的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 其他作用：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e1.能降低外周血单核细胞、淋巴细胞、嗜酸性和嗜碱性粒细胞数。能刺激骨髓造血功能，使血液中红细胞、血小板、中性粒细胞数增加；也能增加血红蛋白、纤维蛋白原含量和缩短凝血时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2.能使胃蛋白酶和胃酸分泌增多，增加食欲，促进消化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3.尚有退热和增强应激能力等作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e3.长期大量应用本类药物时可出现骨质疏松。允许浓度的糖皮质激素对维持肌肉的正常功能是必需的。缺乏时表现为软弱、疲劳等。过量则可致皮质类固醇肌病。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e2.可提高中枢神经系统兴奋性，偶可诱发精神失常；大剂量对儿童可致惊厥。\u003c/div\u003e","pt":"① 抗炎作用：具有强大的抗炎作用，能抑制各种原因引起的炎症反应；对炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。 ② 免疫抑制与抗过敏作用：对免疫反应的多个环节具有抑制作用；1.包括抑制巨噬细胞吞噬和处理抗原；2.阻碍淋巴母细胞转化，破坏淋巴细胞；3.干扰淋巴组织在抗原作用下的分裂和增殖，阻断致敏T细胞诱发的单核细胞和巨噬细胞的募集等，抑制淋巴因子所引起的炎症反应，故可抑制皮肤Ⅳ型超敏反应和异体组织脏器移植的排斥反应；4.小剂量主要抑制细胞免疫；5.大剂量可抑制B细胞转化成浆细胞，抑制体液免疫。 ③ 抗休克作用：常用于严重休克，特别是中毒性休克的治疗。 ④ 其他作用： 1.能降低外周血单核细胞、淋巴细胞、嗜酸性和嗜碱性粒细胞数。能刺激骨髓造血功能，使血液中红细胞、血小板、中性粒细胞数增加；也能增加血红蛋白、纤维蛋白原含量和缩短凝血时间。 2.能使胃蛋白酶和胃酸分泌增多，增加食欲，促进消化。 3.尚有退热和增强应激能力等作用。 3.长期大量应用本类药物时可出现骨质疏松。允许浓度的糖皮质激素对维持肌肉的正常功能是必需的。缺乏时表现为软弱、疲劳等。过量则可致皮质类固醇肌病。 2.可提高中枢神经系统兴奋性，偶可诱发精神失常；大剂量对儿童可致惊厥。","ok":true,"an":["特异性","中枢神经系统","抗过敏","中毒性休克","胃酸分泌","血红蛋白"]},{"id":"3849735359","no":4,"q":"试述糖皮质激素抗炎作用的基本机制。","a":"\u003cdiv class=\"q-ln\"\u003e其抗炎作用的基本机制是基因效应。糖皮质激素进入细胞后，与胞质内的糖皮质激素受体结合，受体激活，发生变构，暴露出一个DNA结合域。随之类固醇-受体复合体进入细胞核，在细胞核内与特异性DNA位点即靶基因的启动子序列的糖皮质激素反应元件（GRE）相结合，影响基因转录，相应地引起转录增加或减少，改变炎性介质相关蛋白的水平，进而对炎症细胞和分子产生影响而发挥抗炎作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e主要作用环节有：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 影响炎症抑制蛋白及某些靶酶。增加炎症抑制膜联蛋白的生成，继之抑制磷脂酶A\u003csub\u003e2\u003c/sub\u003e，影响花生四烯酸代谢的连锁反应，使具有扩血管作用的前列腺素和有趋化作用的白三烯类等炎症介质减少；抑制一氧化氮合酶和COX-2等的表达，从而阻断NO、PGE\u003csub\u003e2\u003c/sub\u003e等相关介质的产生；诱导血管紧张素转换酶的生成，以降解可引起血管舒张和致痛作用的缓激肽。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抑制细胞因子及黏附分子的表达。不仅抑制多种致炎细胞因子如TNF-α、白介素等的产生，而且可在转录水平上直接抑制某些黏附分子如E-选择素及ICAM-1的表达；此外，还影响细胞因子及黏附分子生物学效应的发挥。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 诱导炎细胞凋亡。\u003c/div\u003e","pt":"其抗炎作用的基本机制是基因效应。糖皮质激素进入细胞后，与胞质内的糖皮质激素受体结合，受体激活，发生变构，暴露出一个DNA结合域。随之类固醇-受体复合体进入细胞核，在细胞核内与特异性DNA位点即靶基因的启动子序列的糖皮质激素反应元件（GRE）相结合，影响基因转录，相应地引起转录增加或减少，改变炎性介质相关蛋白的水平，进而对炎症细胞和分子产生影响而发挥抗炎作用。 主要作用环节有： ① 影响炎症抑制蛋白及某些靶酶。增加炎症抑制膜联蛋白的生成，继之抑制磷脂酶A 2 ，影响花生四烯酸代谢的连锁反应，使具有扩血管作用的前列腺素和有趋化作用的白三烯类等炎症介质减少；抑制一氧化氮合酶和COX-2等的表达，从而阻断NO、PGE 2 等相关介质的产生；诱导血管紧张素转换酶的生成，以降解可引起血管舒张和致痛作用的缓激肽。 ② 抑制细胞因子及黏附分子的表达。不仅抑制多种致炎细胞因子如TNF-α、白介素等的产生，而且可在转录水平上直接抑制某些黏附分子如E-选择素及ICAM-1的表达；此外，还影响细胞因子及黏附分子生物学效应的发挥。 ③ 诱导炎细胞凋亡。","ok":true,"an":["特异性","血管紧张素","分子生物学","代谢","致炎细胞","ICAM-1"]},{"id":"863b8afa2b","no":5,"q":"糖皮质激素类药物的主要临床应用包括哪些方面？","a":"\u003cdiv class=\"q-ln\"\u003e① 严重感染或炎症：在同时应用足量有效的抗生素控制感染的前提下，主要用于中毒性感染或伴有休克者，一般感染不用。如果炎症发生在人体重要器官，可用糖皮质激素以减少炎性渗出，防止组织过度破坏，抑制粘连及瘢痕的形成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 自身免疫性疾病、过敏性疾病和器官移植排斥反应：如重症全身性红斑狼疮、重症肌无力、支气管哮喘、过敏性休克，可与其他免疫抑制药联合应用抑制异体皮肤或脏器移植后的排斥反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗休克治疗：感染中毒性休克时，在有效的抗菌药物治疗下，可及早、短时间突击使用大剂量皮质激素；对过敏性休克，本类药物为次选药物，可与首选药物肾上腺素合用；对低血容量性休克，在补液补电解质或输血后效果不佳者，可合用超大剂量的皮质激素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 替代疗法：用于急性或慢性肾上腺皮质功能减退症、脑垂体功能减退症和肾上腺次全切除术后。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 其他：可用于某些血液病、皮肤病、眼部疾病以及脑水肿、急性脊髓损伤等治疗。\u003c/div\u003e","pt":"① 严重感染或炎症：在同时应用足量有效的抗生素控制感染的前提下，主要用于中毒性感染或伴有休克者，一般感染不用。如果炎症发生在人体重要器官，可用糖皮质激素以减少炎性渗出，防止组织过度破坏，抑制粘连及瘢痕的形成。 ② 自身免疫性疾病、过敏性疾病和器官移植排斥反应：如重症全身性红斑狼疮、重症肌无力、支气管哮喘、过敏性休克，可与其他免疫抑制药联合应用抑制异体皮肤或脏器移植后的排斥反应。 ③ 抗休克治疗：感染中毒性休克时，在有效的抗菌药物治疗下，可及早、短时间突击使用大剂量皮质激素；对过敏性休克，本类药物为次选药物，可与首选药物肾上腺素合用；对低血容量性休克，在补液补电解质或输血后效果不佳者，可合用超大剂量的皮质激素。 ④ 替代疗法：用于急性或慢性肾上腺皮质功能减退症、脑垂体功能减退症和肾上腺次全切除术后。 ⑤ 其他：可用于某些血液病、皮肤病、眼部疾病以及脑水肿、急性脊髓损伤等治疗。","ok":true,"an":["肾上腺素","替代疗法","抗休克治疗","支气管","中毒性休克","严重感染"]},{"id":"13e48048f6","no":6,"q":"糖皮质激素抗炎作用特点（或利弊）？","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 本类药物具有强大的抗炎作用，对感染性、物理性、化学性、免疫性或缺血性组织损伤等原因引起的炎症，以及炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 在炎症发展的急性阶段，本类药物可增加血管紧张性，降低毛细血管通透性，减轻渗出和水肿；同时减少各种炎症因子的释放，抑制白细胞浸润和吞噬反应，从而改善和消除红、肿、热、痛等症状。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 在炎症后期，能抑制毛细血管和成纤维细胞的增生，延缓胶原蛋白、黏多糖的合成以及抑制肉芽组织的增生，从而防止组织粘连和瘢痕形成，减轻后遗症。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 炎症反应是机体的一种防御性反应，炎症后期的反应更是组织修复的重要过程。因此本类药物若使用不当，可致感染扩散、创面愈合延缓。\u003c/div\u003e","pt":"优点: ① 本类药物具有强大的抗炎作用，对感染性、物理性、化学性、免疫性或缺血性组织损伤等原因引起的炎症，以及炎症病理发展过程的不同阶段都有显著的非特异性抑制作用。 ② 在炎症发展的急性阶段，本类药物可增加血管紧张性，降低毛细血管通透性，减轻渗出和水肿；同时减少各种炎症因子的释放，抑制白细胞浸润和吞噬反应，从而改善和消除红、肿、热、痛等症状。 ③ 在炎症后期，能抑制毛细血管和成纤维细胞的增生，延缓胶原蛋白、黏多糖的合成以及抑制肉芽组织的增生，从而防止组织粘连和瘢痕形成，减轻后遗症。 缺点: ① 炎症反应是机体的一种防御性反应，炎症后期的反应更是组织修复的重要过程。因此本类药物若使用不当，可致感染扩散、创面愈合延缓。","ok":true,"an":["特异性","炎症反应","通透性","毛细血管","免疫性","化学性"]}],"count":6,"done":6},{"label":"第二十七章","questions":[{"id":"0be3f21b3e","no":1,"q":"试述胰岛素的主要药理作用和用途。","a":"\u003cdiv class=\"q-ln\"\u003e药理作用:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 糖代谢: 促进糖原合成与储存，加速葡萄糖的氧化和酵解，抑制糖原分解和糖异生，并能降低血糖。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 脂肪代谢: 抑制脂肪酶以及肾上腺素、生长激素和胰高血糖素的脂肪分解作用，使脂肪分解减慢；促进肝脏等部位脂肪合成。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 蛋白质代谢: 增加氨基酸转运，促进蛋白质合成；抑制蛋白质分解。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 其他: 促进钾离子进入细胞，降低血钾浓度。加速心率，加强心肌收缩力。减少肾血流量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e临床应用:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 糖尿病: 各型糖尿病，尤其是1型糖尿病。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 胰岛素加入葡萄糖注射液内静脉滴注治疗高血钾症。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 合用葡萄糖、胰岛素和氯化钾液静脉滴注，促进K\u003csup\u003e+\u003c/sup\u003e进入细胞，用于心肌梗死的早期治疗，可防治心肌病变时的心律失常，降低死亡率。\u003c/div\u003e","pt":"药理作用: ① 糖代谢: 促进糖原合成与储存，加速葡萄糖的氧化和酵解，抑制糖原分解和糖异生，并能降低血糖。 ② 脂肪代谢: 抑制脂肪酶以及肾上腺素、生长激素和胰高血糖素的脂肪分解作用，使脂肪分解减慢；促进肝脏等部位脂肪合成。 ③ 蛋白质代谢: 增加氨基酸转运，促进蛋白质合成；抑制蛋白质分解。 ④ 其他: 促进钾离子进入细胞，降低血钾浓度。加速心率，加强心肌收缩力。减少肾血流量。 临床应用: ① 糖尿病: 各型糖尿病，尤其是1型糖尿病。 ② 胰岛素加入葡萄糖注射液内静脉滴注治疗高血钾症。 ③ 合用葡萄糖、胰岛素和氯化钾液静脉滴注，促进K + 进入细胞，用于心肌梗死的早期治疗，可防治心肌病变时的心律失常，降低死亡率。","ok":true,"an":["肾上腺素","蛋白质代谢","氯化钾","糖尿病","脂肪代谢","糖代谢"]},{"id":"237231d332","no":2,"q":"简述磺酰脲类的作用机制和临床用途。","a":"\u003cdiv class=\"q-ln\"\u003e① 作用机制: 磺酰脲类与胰岛β细胞膜上磺酰脲受体结合，引起ATP敏感K\u003csup\u003e+\u003c/sup\u003e通道关闭，抑制细胞内K\u003csup\u003e+\u003c/sup\u003e外流，使细胞膜去极化，进而引起电压依赖性Ca\u003csup\u003e2+\u003c/sup\u003e通道开放，Ca\u003csup\u003e2+\u003c/sup\u003e内流，触发胰岛素的释放。本类药物降血糖作用机制可能还与增强胰岛素与靶组织及受体的结合能力，增加靶细胞膜上胰岛素受体的数目和亲和力等有关。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 临床用途: 主要用于单用饮食控制无效的胰岛功能尚存的2型糖尿病；亦可利用其与胰岛素有相加作用，用于对胰岛素有耐受性的患者，可减少胰岛素的用量。\u003c/div\u003e","pt":"① 作用机制: 磺酰脲类与胰岛β细胞膜上磺酰脲受体结合，引起ATP敏感K + 通道关闭，抑制细胞内K + 外流，使细胞膜去极化，进而引起电压依赖性Ca 2+ 通道开放，Ca 2+ 内流，触发胰岛素的释放。本类药物降血糖作用机制可能还与增强胰岛素与靶组织及受体的结合能力，增加靶细胞膜上胰岛素受体的数目和亲和力等有关。 ② 临床用途: 主要用于单用饮食控制无效的胰岛功能尚存的2型糖尿病；亦可利用其与胰岛素有相加作用，用于对胰岛素有耐受性的患者，可减少胰岛素的用量。","ok":true,"an":["糖尿病","电压依赖性","胰岛素受体","胰岛素","抑制细胞","通道关闭"]},{"id":"70b6a40fee","no":3,"q":"产生胰岛素抵抗的主要原因和防治措施？","a":"\u003cdiv class=\"q-ln\"\u003e① 急性型: 并发感染、手术、创伤、情绪激动等所致应激状态时，血中拮抗胰岛素作用物质增多；酮症酸中毒时，血中大量游离脂肪酸和酮体妨碍了葡萄糖的摄取和利用；pH降低减少胰岛素与受体的结合等诱发因素使得胰岛素的效应下降。防治措施：消除诱因，增加胰岛素用量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 慢性型: 涉及多个方面，包括体内产生了胰岛素抗体，胰岛素受体数目减少以及受体与胰岛素亲和力降低，靶细胞膜上葡萄糖转运系统失常等。防治措施：选用抗原性小的胰岛素制剂，避免间断性使用胰岛素。\u003c/div\u003e","pt":"① 急性型: 并发感染、手术、创伤、情绪激动等所致应激状态时，血中拮抗胰岛素作用物质增多；酮症酸中毒时，血中大量游离脂肪酸和酮体妨碍了葡萄糖的摄取和利用；pH降低减少胰岛素与受体的结合等诱发因素使得胰岛素的效应下降。防治措施：消除诱因，增加胰岛素用量。 ② 慢性型: 涉及多个方面，包括体内产生了胰岛素抗体，胰岛素受体数目减少以及受体与胰岛素亲和力降低，靶细胞膜上葡萄糖转运系统失常等。防治措施：选用抗原性小的胰岛素制剂，避免间断性使用胰岛素。","ok":true,"an":["胰岛素受体","急性型","慢性型","情绪激动","细胞膜","葡萄糖"]}],"count":3,"done":3},{"label":"第二十八章","questions":[{"id":"d41071dfa7","no":1,"q":"试比较丙硫氧嘧啶和大剂量碘剂的作用原理、作用特点和临床应用。","a":"\u003cdiv class=\"q-tbl\"\u003e\u003ctable style=\"width:100%;border-collapse:collapse;text-align:center;border:2px solid #333;font-size:0.95em;\"\u003e\u003cthead\u003e\u003ctr style=\"background:#e8e8e8;\"\u003e\u003cth style=\"border:1px solid #333;padding:10px;width:18%;\"\u003e\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e丙硫氧嘧啶\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e大剂量碘剂\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e作用原理\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e抑制甲状腺激素合成，抑制 T\u003csub\u003e4\u003c/sub\u003e 转化为 T\u003csub\u003e3\u003c/sub\u003e，抑制血液循环 TSI 合成\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e抑制谷胱甘肽还原酶对甲状腺球蛋白水解时二硫键的还原，抑制甲状腺激素的释放；拮抗 TSH 促进甲状腺激素释放的作用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e作用特点\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e起效慢、疗程长；甲状腺肿大、变软脆，加重突眼\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e起效快，但不持久（&gt;2 周失去作用）；对抗 TSH，腺体变小、变硬，血管减少\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd style=\"border:1px solid #333;padding:10px;background:#f5f5f5;font-weight:bold;\"\u003e临床应用\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e甲亢的内科治疗、甲状腺术前准备、甲状腺危象的辅助治疗\u003c/td\u003e\u003ctd style=\"border:1px solid #333;padding:10px;text-align:left;\"\u003e甲亢术前准备：使甲状腺组织缩小，血管减少，利于手术进行及减少出血；甲状腺危象的治疗\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e","pt":"丙硫氧嘧啶 大剂量碘剂 作用原理 抑制甲状腺激素合成，抑制 T 4 转化为 T 3 ，抑制血液循环 TSI 合成 抑制谷胱甘肽还原酶对甲状腺球蛋白水解时二硫键的还原，抑制甲状腺激素的释放；拮抗 TSH 促进甲状腺激素释放的作用 作用特点 起效慢、疗程长；甲状腺肿大、变软脆，加重突眼 起效快，但不持久（\u003e2 周失去作用）；对抗 TSH，腺体变小、变硬，血管减少 临床应用 甲亢的内科治疗、甲状腺术前准备、甲状腺危象的辅助治疗 甲亢术前准备：使甲状腺组织缩小，血管减少，利于手术进行及减少出血；甲状腺危象的治疗","ok":true,"an":["抑制甲状腺激素","甲亢术前准备","抑制血液循环","谷胱甘肽","甲状腺危象","术前准备"]},{"id":"ca63f7a521","no":2,"q":"甲状腺功能亢进治疗药物有哪几类？举例说明。","a":"\u003cdiv class=\"q-ln\"\u003e① 硫脲类：如丙硫氧嘧啶，抑制甲状腺激素合成，抑制外周血 T\u003csub\u003e4\u003c/sub\u003e 转为 T\u003csub\u003e3\u003c/sub\u003e，同时抑制血液循环 TSI 合成。可用于甲亢内科治疗、甲亢术前准备和甲亢危象辅助用药等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 碘和碘化物：如碘化钾或鲁氏碘液，小剂量用于预防单纯性甲状腺肿，大剂量碘用于甲状腺危象和甲亢术前准备。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ β 受体拮抗药：如普萘洛尔，主要通过阻断 β 受体而改善甲亢症状，并可减少甲状腺素分泌和 T\u003csub\u003e3\u003c/sub\u003e 生成。用于甲亢治疗、甲状腺危象辅助治疗及术前准备，单用作用有限，与硫脲类合用作用更显著。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 放射性碘：如 \u003csup\u003e131\u003c/sup\u003eI，利用产生 β 射线破坏甲状腺组织来治疗甲亢，γ 射线可用于甲状腺摄碘功能检查。\u003c/div\u003e","pt":"① 硫脲类：如丙硫氧嘧啶，抑制甲状腺激素合成，抑制外周血 T 4 转为 T 3 ，同时抑制血液循环 TSI 合成。可用于甲亢内科治疗、甲亢术前准备和甲亢危象辅助用药等。 ② 碘和碘化物：如碘化钾或鲁氏碘液，小剂量用于预防单纯性甲状腺肿，大剂量碘用于甲状腺危象和甲亢术前准备。 ③ β 受体拮抗药：如普萘洛尔，主要通过阻断 β 受体而改善甲亢症状，并可减少甲状腺素分泌和 T 3 生成。用于甲亢治疗、甲状腺危象辅助治疗及术前准备，单用作用有限，与硫脲类合用作用更显著。 ④ 放射性碘：如 131 I，利用产生 β 射线破坏甲状腺组织来治疗甲亢，γ 射线可用于甲状腺摄碘功能检查。","ok":true,"an":["β 受体拮抗药","放射性碘","抑制甲状腺激素","丙硫氧嘧啶","甲亢术前准备","抑制血液循环"]},{"id":"fdd6ccbe36","no":3,"q":"简述放射性碘的临床应用。","a":"\u003cdiv class=\"q-ln\"\u003e① 甲亢的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 转移性甲状腺癌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 甲状腺摄碘功能检查。\u003c/div\u003e","pt":"① 甲亢的治疗。 ② 转移性甲状腺癌。 ③ 甲状腺摄碘功能检查。","ok":true,"an":[]}],"count":3,"done":3},{"label":"第三十一章","questions":[{"id":"204871ba89","no":1,"q":"简述控制哮喘药物的分类，列举各类的主要代表药。","a":"\u003cdiv class=\"q-ln\"\u003e支气管扩张药:\u003c
