 丙谷胺 ⑤ 前列腺素EP 3 受体激动药: 米索前列醇 ⑥ 生长抑素","ok":true,"an":["质子泵抑制剂","胃泌素受体拮抗药","激动药"]},{"id":"a901dda0cd","no":2,"q":"为什么多潘立酮具有与甲氧氯普胺相似的镇吐和催乳素反应（溢乳），但却不产生锥体外系反应？","a":"\u003cdiv class=\"q-ln\"\u003e① 两药都能拮抗D\u003csub\u003e2\u003c/sub\u003e受体，但区别是多潘立酮不易透过血脑屏障而阻断黑质-纹状体通路的多巴胺D\u003csub\u003e2\u003c/sub\u003e受体，因而不产生锥体外系反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 但多潘立酮能在血脑屏障薄弱的部位，如延髓催吐化学感受区和垂体前叶拮抗D\u003csub\u003e2\u003c/sub\u003e受体发挥作用，从而产生和甲氧氯普胺相似的镇吐和催乳素反应。\u003c/div\u003e","pt":"① 两药都能拮抗D 2 受体，但区别是多潘立酮不易透过血脑屏障而阻断黑质-纹状体通路的多巴胺D 2 受体，因而不产生锥体外系反应。 ② 但多潘立酮能在血脑屏障薄弱的部位，如延髓催吐化学感受区和垂体前叶拮抗D 2 受体发挥作用，从而产生和甲氧氯普胺相似的镇吐和催乳素反应。","ok":true,"an":["多巴胺","纹状体通路","血脑屏障","阻断黑质"]}],"count":2,"done":2},{"label":"第三十三章","questions":[{"id":"b741174b0c","no":1,"q":"试比较肝素和双香豆素的异同。","a":"\u003cdiv class=\"q-ln\"\u003e肝素:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 肝素抗凝作用迅速、强大，作用时间短，静脉注射后立即起效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 肝素在体内、体外均可抗凝。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 肝素只能静脉给药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 肝素的作用机制是加速抗凝血酶Ⅲ对凝血因子Ⅱa、Ⅸa、Ⅹa、Ⅺa、Ⅻa的灭活，进而抑制凝血过程。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 肝素过量所致自发性出血可用硫酸鱼精蛋白对抗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e香豆素:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 香豆素抗凝作用缓慢但持久。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 香豆素只能体内抗凝，体外无效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 香豆素给药方式为口服给药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 香豆素抗凝机制为抑制维生素K在肝脏由环氧化物转换为氢醌型，从而妨碍肝脏合成凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 香豆素过量所引起的自发性出血可静脉滴注维生素K，或输新鲜血浆或血液抢救。\u003c/div\u003e","pt":"肝素: ① 肝素抗凝作用迅速、强大，作用时间短，静脉注射后立即起效。 ② 肝素在体内、体外均可抗凝。 ③ 肝素只能静脉给药。 ④ 肝素的作用机制是加速抗凝血酶Ⅲ对凝血因子Ⅱa、Ⅸa、Ⅹa、Ⅺa、Ⅻa的灭活，进而抑制凝血过程。 ⑤ 肝素过量所致自发性出血可用硫酸鱼精蛋白对抗。 香豆素: ① 香豆素抗凝作用缓慢但持久。 ② 香豆素只能体内抗凝，体外无效。 ③ 香豆素给药方式为口服给药。 ④ 香豆素抗凝机制为抑制维生素K在肝脏由环氧化物转换为氢醌型，从而妨碍肝脏合成凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ。 ⑤ 香豆素过量所引起的自发性出血可静脉滴注维生素K，或输新鲜血浆或血液抢救。","ok":true,"an":["口服给药","维生素","静脉滴注","体外无效"]}],"count":1,"done":1},{"label":"第三十四章","questions":[{"id":"519220580c","no":1,"q":"化学治疗","a":"\u003cdiv class=\"q-ln\"\u003e细菌和其他病原微生物、寄生虫以及癌细胞所致疾病的药物治疗统称为化学治疗，简称化疗。\u003c/div\u003e","pt":"细菌和其他病原微生物、寄生虫以及癌细胞所致疾病的药物治疗统称为化学治疗，简称化疗。","ok":true,"an":["癌细胞"]},{"id":"635687c9c6","no":2,"q":"化疗指数","a":"\u003cdiv class=\"q-ln\"\u003eLD\u003csub\u003e50\u003c/sub\u003e/ED\u003csub\u003e50\u003c/sub\u003e 或 LD\u003csub\u003e5\u003c/sub\u003e/ED\u003csub\u003e95\u003c/sub\u003e 评价化疗药物对机体毒性、疗效的重要指标。\u003c/div\u003e","pt":"LD 50 /ED 50 或 LD 5 /ED 95 评价化疗药物对机体毒性、疗效的重要指标。","ok":true,"an":[]},{"id":"a328ff2584","no":3,"q":"抗生素","a":"\u003cdiv class=\"q-ln\"\u003e是由各种微生物（包括细菌、真菌、放线菌属）产生的，能杀灭或抑制其他微生物的物质。抗生素分为天然抗生素和人工半合成抗生素，前者由微生物产生，后者是对天然抗生素进行结构改造获得的半合成产品。\u003c/div\u003e","pt":"是由各种微生物（包括细菌、真菌、放线菌属）产生的，能杀灭或抑制其他微生物的物质。抗生素分为天然抗生素和人工半合成抗生素，前者由微生物产生，后者是对天然抗生素进行结构改造获得的半合成产品。","ok":true,"an":["放线菌","真菌"]},{"id":"8a8db9079d","no":4,"q":"抗菌药物","a":"\u003cdiv class=\"q-ln\"\u003e是指能够抑制或杀灭细菌，用于防治细菌感染性疾病的药物，包括抗生素和人工合成抗菌药物。\u003c/div\u003e","pt":"是指能够抑制或杀灭细菌，用于防治细菌感染性疾病的药物，包括抗生素和人工合成抗菌药物。","ok":true,"an":["抗生素"]},{"id":"cb2e5cf31d","no":5,"q":"最低抑菌浓度 (MIC)","a":"\u003cdiv class=\"q-ln\"\u003e在体外，抗菌药物与细菌培养 18～24 小时后能抑制培养基内病原菌生长的最低药物浓度。\u003c/div\u003e","pt":"在体外，抗菌药物与细菌培养 18～24 小时后能抑制培养基内病原菌生长的最低药物浓度。","ok":true,"an":["抗菌药"]},{"id":"aa4434a348","no":6,"q":"最低杀菌浓度 (MBC)","a":"\u003cdiv class=\"q-ln\"\u003e抗菌药物能够杀灭培养基内细菌或使细菌数减少 99.9% 的最低药物浓度。\u003c/div\u003e","pt":"抗菌药物能够杀灭培养基内细菌或使细菌数减少 99.9% 的最低药物浓度。","ok":true,"an":["抗菌药"]},{"id":"fdac19ae90","no":7,"q":"抗生素后效应 (PAE)","a":"\u003cdiv class=\"q-ln\"\u003e细菌与抗生素短暂接触后，当抗生素的浓度低于最低抑菌浓度或消失后，细菌仍被持续抑制的效应。\u003c/div\u003e","pt":"细菌与抗生素短暂接触后，当抗生素的浓度低于最低抑菌浓度或消失后，细菌仍被持续抑制的效应。","ok":true,"an":["抑菌"]},{"id":"0629ed7571","no":8,"q":"抗菌谱","a":"\u003cdiv class=\"q-ln\"\u003e是指抗菌药物的抗菌范围，包括广谱和窄谱两种。广谱抗菌药指对多种病原微生物有效的抗菌药，如四环素、氯霉素，广谱青霉素等。窄谱抗菌药指仅对一种细菌或局限于某属细菌有抗菌作用的药物，如异烟肼仅对结核分枝杆菌有作用，而对其他细菌无效。抗菌药物的抗菌谱是临床选药的基础。\u003c/div\u003e","pt":"是指抗菌药物的抗菌范围，包括广谱和窄谱两种。广谱抗菌药指对多种病原微生物有效的抗菌药，如四环素、氯霉素，广谱青霉素等。窄谱抗菌药指仅对一种细菌或局限于某属细菌有抗菌作用的药物，如异烟肼仅对结核分枝杆菌有作用，而对其他细菌无效。抗菌药物的抗菌谱是临床选药的基础。","ok":true,"an":["广谱青霉素","范围","氯霉素","抗菌药","杆菌","异烟肼"]},{"id":"65c69a8ce7","no":9,"q":"耐药性","a":"\u003cdiv class=\"q-ln\"\u003e是指常规治疗剂量下，细菌对药物的敏感性下降甚至消失，导致药物对耐药菌的疗效降低或无效。\u003c/div\u003e","pt":"是指常规治疗剂量下，细菌对药物的敏感性下降甚至消失，导致药物对耐药菌的疗效降低或无效。","ok":true,"an":["耐药菌","敏感性"]},{"id":"816a927929","no":10,"q":"如何评价抗菌药物的抗菌活性。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗菌活性的强弱: 抑菌剂或杀菌剂；MIC/MBC；PAE。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗菌谱的范围: 窄谱、广谱；革兰氏阳性菌、革兰氏阴性菌；难治细菌如铜绿假单胞菌、厌氧菌。\u003c/div\u003e","pt":"① 抗菌活性的强弱: 抑菌剂或杀菌剂；MIC/MBC；PAE。 ② 抗菌谱的范围: 窄谱、广谱；革兰氏阳性菌、革兰氏阴性菌；难治细菌如铜绿假单胞菌、厌氧菌。","ok":true,"an":["铜绿假单胞菌","MIC","MBC","范围"]},{"id":"dd5af7fbb1","no":11,"q":"抗菌药物的合理使用原则是什么","a":"\u003cdiv class=\"q-ln\"\u003e① 诊断为细菌性感染者方有指征应用抗菌药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 尽早查明感染病原，根据病原种类及药物敏感试验结果选用抗菌药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗菌药物的经验治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 按照药物的抗菌作用及其体内过程特点选择用药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 综合患者病情、病原菌种类及抗菌药物特点制订抗菌治疗方案。\u003c/div\u003e","pt":"① 诊断为细菌性感染者方有指征应用抗菌药物。 ② 尽早查明感染病原，根据病原种类及药物敏感试验结果选用抗菌药物。 ③ 抗菌药物的经验治疗。 ④ 按照药物的抗菌作用及其体内过程特点选择用药。 ⑤ 综合患者病情、病原菌种类及抗菌药物特点制订抗菌治疗方案。","ok":true,"an":[]},{"id":"97dabffd7c","no":12,"q":"抗菌药物联合用药的意义是什么","a":"\u003cdiv class=\"q-ln\"\u003e① 发挥药物协同作用，提高疗效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 延迟或减少耐药菌株出现。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 扩大抗菌范围（混合感染)。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 减少毒副反应（减少个别药剂量）。\u003c/div\u003e","pt":"① 发挥药物协同作用，提高疗效。 ② 延迟或减少耐药菌株出现。 ③ 扩大抗菌范围（混合感染)。 ④ 减少毒副反应（减少个别药剂量）。","ok":true,"an":["混合感染","毒副反应","范围"]},{"id":"11053d667f","no":13,"q":"抗菌药物联合用药的指征是什么","a":"\u003cdiv class=\"q-ln\"\u003e① 病原菌尚未查明的严重感染，包括免疫缺陷者的严重感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 单一抗菌药物不能控制的严重感染，需氧菌及厌氧菌混合感染，2种及2种以上复数菌感染，以及多重耐药菌或泛耐药菌感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 需长疗程治疗，但病原菌易对某些抗菌药物产生耐药性的感染，如某些侵袭性真菌病；或病原菌含有不同生长特点的菌群，需要应用不同抗菌机制的药物联合使用，如结核和非结核分枝杆菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 毒性较大的抗菌药物，联合用药时剂量可适当减少，但需有临床资料证明其同样有效。如两性霉素B与氟胞嘧啶联合治疗隐球菌性脑膜炎时，前者的剂量可适当减少，以减少其毒性反应。\u003c/div\u003e","pt":"① 病原菌尚未查明的严重感染，包括免疫缺陷者的严重感染。 ② 单一抗菌药物不能控制的严重感染，需氧菌及厌氧菌混合感染，2种及2种以上复数菌感染，以及多重耐药菌或泛耐药菌感染。 ③ 需长疗程治疗，但病原菌易对某些抗菌药物产生耐药性的感染，如某些侵袭性真菌病；或病原菌含有不同生长特点的菌群，需要应用不同抗菌机制的药物联合使用，如结核和非结核分枝杆菌。 ④ 毒性较大的抗菌药物，联合用药时剂量可适当减少，但需有临床资料证明其同样有效。如两性霉素B与氟胞嘧啶联合治疗隐球菌性脑膜炎时，前者的剂量可适当减少，以减少其毒性反应。","ok":true,"an":["产生耐药性","严重感染","两性霉素","混合感染","抗菌机制","毒性反应"]},{"id":"6a8f89ec9d","no":14,"q":"抗菌药物抗菌机制","a":"\u003cdiv class=\"q-ln\"\u003e① 抑制细菌细胞壁的合成: 青霉素、头孢菌素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抑制核酸的复制与代谢: 1.影响核酸复制: 喹诺酮类；2.影响叶酸代谢: 磺胺类与甲氧苄啶；3.影响DNA合成: 硝基咪唑类。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抑制蛋白质合成: 氯霉素、林可霉素、四环素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 增加胞质膜的通透性: 多黏菌素类、两性霉素B。\u003c/div\u003e","pt":"① 抑制细菌细胞壁的合成: 青霉素、头孢菌素。 ② 抑制核酸的复制与代谢: 1.影响核酸复制: 喹诺酮类；2.影响叶酸代谢: 磺胺类与甲氧苄啶；3.影响DNA合成: 硝基咪唑类。 ③ 抑制蛋白质合成: 氯霉素、林可霉素、四环素。 ④ 增加胞质膜的通透性: 多黏菌素类、两性霉素B。","ok":true,"an":["抑制蛋白质合成","抑制细菌细胞壁","代谢","甲氧苄啶","两性霉素"]},{"id":"5c65b122cc","no":15,"q":"细菌耐药性的产生机制","a":"\u003cdiv class=\"q-ln\"\u003e① 产生灭活酶。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗菌药物作用靶点改变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 改变细菌外膜通透性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 影响主动外排系统。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 形成细菌生物被膜。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 改变代谢途径。\u003c/div\u003e","pt":"① 产生灭活酶。 ② 抗菌药物作用靶点改变。 ③ 改变细菌外膜通透性。 ④ 影响主动外排系统。 ⑤ 形成细菌生物被膜。 ⑥ 改变代谢途径。","ok":true,"an":["代谢","通透性","抗菌药"]}],"count":15,"done":15},{"label":"第三十五章","questions":[{"id":"dadc5e8b8c","no":1,"q":"细菌对青霉素类药物产生耐药性的机制是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 产生β-内酰胺酶，如青霉素酶，使青霉素水解失活，失去抗菌活性而耐药；或通过牵制机制抑制β-内酰胺类到达PBP靶点发挥抗菌作用而耐药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② PBP的组成与功能改变: 耐药菌株降低PBP与β-内酰胺类的亲和力或产生与β-内酰胺亲和力低的PBP，使药物抗菌活性难以发挥而耐药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 通过降低细胞外膜通透性、加强主动外排系统以及形成细菌生物膜使得细菌体内的β-内酰胺类抗生素积聚减少而耐药。\u003c/div\u003e","pt":"① 产生β-内酰胺酶，如青霉素酶，使青霉素水解失活，失去抗菌活性而耐药；或通过牵制机制抑制β-内酰胺类到达PBP靶点发挥抗菌作用而耐药。 ② PBP的组成与功能改变: 耐药菌株降低PBP与β-内酰胺类的亲和力或产生与β-内酰胺亲和力低的PBP，使药物抗菌活性难以发挥而耐药。 ③ 通过降低细胞外膜通透性、加强主动外排系统以及形成细菌生物膜使得细菌体内的β-内酰胺类抗生素积聚减少而耐药。","ok":true,"an":["失去抗菌活性","酰胺类","抗菌活性","组成","抗生素","通透性"]},{"id":"3300b02182","no":2,"q":"半合成青霉素类药物的分类以及特点是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 耐酸青霉素: 如青霉素V，可口服。抗菌谱与青霉素相似，抗菌作用略弱于青霉素，不用于严重感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 耐酸耐酶青霉素: 如甲氧西林，可口服。抗菌谱与青霉素相似，但对耐青霉素的金黄色葡萄球菌有一定作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 广谱青霉素: 如氨苄西林、阿莫西林，可口服或注射。抗菌谱较青霉素扩大，对G\u003csup\u003e-\u003c/sup\u003e杆菌有较强作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 抗铜绿假单胞菌广谱青霉素: 如羧苄西林，部分药物可口服。对G\u003csup\u003e-\u003c/sup\u003e杆菌尤其是铜绿假单胞菌有较强作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 抗G\u003csup\u003e-\u003c/sup\u003e杆菌青霉素: 如美西林、匹美西林，匹美西林可口服。对G\u003csup\u003e-\u003c/sup\u003e杆菌作用强，对G\u003csup\u003e+\u003c/sup\u003e菌作用弱，对铜绿假单胞菌无效。\u003c/div\u003e","pt":"① 耐酸青霉素: 如青霉素V，可口服。抗菌谱与青霉素相似，抗菌作用略弱于青霉素，不用于严重感染。 ② 耐酸耐酶青霉素: 如甲氧西林，可口服。抗菌谱与青霉素相似，但对耐青霉素的金黄色葡萄球菌有一定作用。 ③ 广谱青霉素: 如氨苄西林、阿莫西林，可口服或注射。抗菌谱较青霉素扩大，对G - 杆菌有较强作用。 ④ 抗铜绿假单胞菌广谱青霉素: 如羧苄西林，部分药物可口服。对G - 杆菌尤其是铜绿假单胞菌有较强作用。 ⑤ 抗G - 杆菌青霉素: 如美西林、匹美西林，匹美西林可口服。对G - 杆菌作用强，对G + 菌作用弱，对铜绿假单胞菌无效。","ok":true,"an":["耐酸青霉素","广谱青霉素","耐酸耐酶青霉素","金黄色葡萄球菌","铜绿假单胞菌","严重感染"]},{"id":"1febb4c5cb","no":3,"q":"西司他丁与亚胺培南联合应用的原理是什么？","a":"\u003cdiv class=\"q-ln\"\u003e亚胺培南具有高效、抗菌谱广、耐酶等特点，但在体内易被肾肽酶水解失活。西司他丁为肾肽酶的抑制药，使亚胺培南免受肾肽酶降解而延缓代谢，延长其半衰期。\u003c/div\u003e","pt":"亚胺培南具有高效、抗菌谱广、耐酶等特点，但在体内易被肾肽酶水解失活。西司他丁为肾肽酶的抑制药，使亚胺培南免受肾肽酶降解而延缓代谢，延长其半衰期。","ok":true,"an":["代谢","抗菌谱广","水解失活","耐酶"]},{"id":"f5b0fd2477","no":4,"q":"试比较各代头孢菌素的特点。","a":"\u003cdiv class=\"q-tbl\"\u003e\u003ctable style=\"width:100%;border-collapse:collapse;text-align:center;border:2px solid #333;font-size:0.95em;\"\u003e\u003cthead\u003e\u003ctr style=\"background:#e8e8e8;\"\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003e\u003c/th\u003e\u003cth style=\"border:1px solid #333;padding:10px;\"\u003eG\u003csup\u003e+\u003c/sup\u003e菌\u0 n\"\u003e① 耳毒性: 包括前庭功能障碍和耳蜗听神经损伤。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 肾毒性: 导致肾小管肿胀、坏死，出现蛋白尿、管型尿、血尿等，严重时可导致无尿、肾衰竭等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 神经肌肉麻痹: 可与体液中Ca\u003csup\u003e2+\u003c/sup\u003e络合，抑制节前神经末梢ACh释放，降低突触后膜对ACh的敏感性，造成神经肌肉接头处传递阻滞，引起神经肌肉麻痹。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 过敏反应: 皮疹、发热、血管神经性水肿等常见。\u003c/div\u003e","pt":"① 耳毒性: 包括前庭功能障碍和耳蜗听神经损伤。 ② 肾毒性: 导致肾小管肿胀、坏死，出现蛋白尿、管型尿、血尿等，严重时可导致无尿、肾衰竭等。 ③ 神经肌肉麻痹: 可与体液中Ca 2+ 络合，抑制节前神经末梢ACh释放，降低突触后膜对ACh的敏感性，造成神经肌肉接头处传递阻滞，引起神经肌肉麻痹。 ④ 过敏反应: 皮疹、发热、血管神经性水肿等常见。","ok":true,"an":["神经肌肉麻痹","耳毒性","肾毒性","过敏反应","神经肌肉","神经末梢"]},{"id":"1bd67bbf3a","no":2,"q":"如何预防氨基糖苷类抗生素对第八对脑神经及肾脏的损害。","a":"\u003cdiv class=\"q-ln\"\u003e① 用药过程中应密切观察耳鸣、眩晕等早期症状的出现，并进行听力检测与肾功能检查，根据情况调整剂量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 避免与有耳毒性和肾毒性的药物合用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 避免与抗组胺药合用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 老年人和肾功能不全患者减量或慎用、孕妇禁用。\u003c/div\u003e","pt":"① 用药过程中应密切观察耳鸣、眩晕等早期症状的出现，并进行听力检测与肾功能检查，根据情况调整剂量。 ② 避免与有耳毒性和肾毒性的药物合用。 ③ 避免与抗组胺药合用。 ④ 老年人和肾功能不全患者减量或慎用、孕妇禁用。","ok":true,"an":["耳毒性","肾毒性","抗组胺药"]},{"id":"b9c3c5e04f","no":3,"q":"试述氨基糖苷类抗生素的共同特点。","a":"\u003cdiv class=\"q-ln\"\u003e① 化学性质相似，都是较强的有机碱，脂溶性小，难以跨膜转运。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 体内过程相似，口服难吸收，多采用肌内注射。主要分布于细胞外液，大部分以原型经肾脏排出。不易通过血脑屏障，但可通过胎盘屏障。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 抗菌谱相似，对革兰氏阴性杆菌有杀灭作用，对某些革兰氏阳性球菌也有效。在碱性条件下抗菌作用增强，酸性条件下抗菌作用减弱。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 抗菌机制相似，均抑制细菌体蛋白质合成，为速效静止期杀菌药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 不良反应相似，均可不同程度地引起耳毒性、肾毒性及神经肌肉麻痹等反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 耐药性相似的细菌对本类药物均有交叉耐药性或单向交叉耐药性。\u003c/div\u003e","pt":"① 化学性质相似，都是较强的有机碱，脂溶性小，难以跨膜转运。 ② 体内过程相似，口服难吸收，多采用肌内注射。主要分布于细胞外液，大部分以原型经肾脏排出。不易通过血脑屏障，但可通过胎盘屏障。 ③ 抗菌谱相似，对革兰氏阴性杆菌有杀灭作用，对某些革兰氏阳性球菌也有效。在碱性条件下抗菌作用增强，酸性条件下抗菌作用减弱。 ④ 抗菌机制相似，均抑制细菌体蛋白质合成，为速效静止期杀菌药。 ⑤ 不良反应相似，均可不同程度地引起耳毒性、肾毒性及神经肌肉麻痹等反应。 ⑥ 耐药性相似的细菌对本类药物均有交叉耐药性或单向交叉耐药性。","ok":true,"an":["神经肌肉麻痹","耳毒性","肾毒性","革兰氏阴性杆菌","易通过血脑屏障","分布"]},{"id":"d6db1894f1","no":4,"q":"灰婴综合征","a":"\u003cdiv class=\"q-ln\"\u003e早产儿和新生儿肝脏缺乏葡萄糖醛酸转移酶，肾排泄功能不完善，对氯霉素解毒能力差；药物剂量过大可致中毒，表现为循环衰竭、呼吸困难、进行性血压下降、皮肤苍白和发绀，故称灰婴综合征。\u003c/div\u003e","pt":"早产儿和新生儿肝脏缺乏葡萄糖醛酸转移酶，肾排泄功能不完善，对氯霉素解毒能力差；药物剂量过大可致中毒，表现为循环衰竭、呼吸困难、进行性血压下降、皮肤苍白和发绀，故称灰婴综合征。","ok":true,"an":["排泄","氯霉素","血压下降","葡萄糖","致中毒"]},{"id":"66ba7eea7d","no":5,"q":"二重感染","a":"\u003cdiv class=\"q-ln\"\u003e长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。\u003c/div\u003e","pt":"长期口服或注射广谱抗菌药时，敏感菌被抑制，不敏感菌乘机大量繁殖，由原来的劣势菌群变为优势菌群，造成新的感染，称作二重感染。","ok":true,"an":["称作二重感染","口服","敏感菌"]}],"count":5,"done":5},{"label":"第三十八章","questions":[{"id":"799beff41d","no":1,"q":"简述氟喹诺酮类药理学共同特征。","a":"\u003cdiv class=\"q-ln\"\u003e① 抗菌谱广，抗菌活性强：对G\u003csup\u003e-\u003c/sup\u003e菌有强大的杀菌作用，对金黄色葡萄球菌及产酶金黄色葡萄球菌也有良好抗菌作用；某些品种对结核分枝杆菌、支原体、衣原体及厌氧菌也有作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药代动力学特性好: 吸收迅速而完全，体内分布广，组织体液浓度高，可达有效抑菌或杀菌水平；血浆 t\u003csub\u003e1/2\u003c/sub\u003e 相对较长。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 细菌对本类药物与其他抗菌药物间无交叉耐药性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 临床应用广泛: 适用于敏感病原菌所致的呼吸道感染、尿路感染、前列腺炎、淋病及G\u003csup\u003e-\u003c/sup\u003e杆菌所致各种感染，骨、关节、皮肤软组织感染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 不良反应少，大多轻微，常见的有恶心、呕吐、食欲减退、皮疹、头痛、眩晕。偶有抽搐精神症状，停药可消退。有些喹诺酮类药物可出现光敏性皮炎和骨关节病。\u003c/div\u003e","pt":"① 抗菌谱广，抗菌活性强：对G - 菌有强大的杀菌作用，对金黄色葡萄球菌及产酶金黄色葡萄球菌也有良好抗菌作用；某些品种对结核分枝杆菌、支原体、衣原体及厌氧菌也有作用。 ② 药代动力学特性好: 吸收迅速而完全，体内分布广，组织体液浓度高，可达有效抑菌或杀菌水平；血浆 t 1/2 相对较长。 ③ 细菌对本类药物与其他抗菌药物间无交叉耐药性。 ④ 临床应用广泛: 适用于敏感病原菌所致的呼吸道感染、尿路感染、前列腺炎、淋病及G - 杆菌所致各种感染，骨、关节、皮肤软组织感染。 ⑤ 不良反应少，大多轻微，常见的有恶心、呕吐、食欲减退、皮疹、头痛、眩晕。偶有抽搐精神症状，停药可消退。有些喹诺酮类药物可出现光敏性皮炎和骨关节病。","ok":true,"an":["药代动力学特性好","临床应用广泛","金黄色葡萄球菌","分布","抗菌活性","厌氧菌"]},{"id":"c1d8d27763","no":2,"q":"简述喹诺酮类药物的抗菌作用机制。","a":"\u003cdiv class=\"q-ln\"\u003e① 喹诺酮类药物抗G\u003csup\u003e-\u003c/sup\u003e菌的主要机制是抑制细菌DNA回旋酶，通过抑制其切口和封口功能而阻碍细菌DNA合成，最终导致细菌死亡。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抗G\u003csup\u003e+\u003c/sup\u003e菌的主要机制是抑制拓扑异构酶Ⅳ，影响子代DNA解环链而干扰DNA复制，达到杀菌作用。\u003c/div\u003e","pt":"① 喹诺酮类药物抗G - 菌的主要机制是抑制细菌DNA回旋酶，通过抑制其切口和封口功能而阻碍细菌DNA合成，最终导致细菌死亡。 ② 抗G + 菌的主要机制是抑制拓扑异构酶Ⅳ，影响子代DNA解环链而干扰DNA复制，达到杀菌作用。","ok":true,"an":["抑制细菌","DNA"]},{"id":"6bad8db74f","no":3,"q":"细菌对氟喹诺酮类药物的耐药机制有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e① 抗菌靶点突变，细菌染色质上，喹诺酮类药物耐药决定区的基因突变，是耐药性产生的最主要机制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 质粒介导的耐药性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 细菌细胞膜通透性改变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 主动外排机制。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 细菌生物被膜形成。\u003c/div\u003e","pt":"① 抗菌靶点突变，细菌染色质上，喹诺酮类药物耐药决定区的基因突变，是耐药性产生的最主要机制。 ② 质粒介导的耐药性。 ③ 细菌细胞膜通透性改变。 ④ 主动外排机制。 ⑤ 细菌生物被膜形成。","ok":true,"an":["通透性","细胞膜","耐药性"]},{"id":"94989c180b","no":4,"q":"磺胺类药物为何与甲氧苄啶合用？","a":"\u003cdiv class=\"q-ln\"\u003e磺胺类药物作用于二氢蝶酸合成酶，干扰合成叶酸的第一步，甲氧苄啶作用于叶酸合成代谢的第二步，选择性抑制二氢叶酸还原酶，两者合用可使细菌的叶酸代谢受到双重阻断，具有协同抗菌作用，其抗菌作用较单药增强，对已呈现耐药的菌株也相应减少。\u003c/div\u003e","pt":"磺胺类药物作用于二氢蝶酸合成酶，干扰合成叶酸的第一步，甲氧苄啶作用于叶酸合成代谢的第二步，选择性抑制二氢叶酸还原酶，两者合用可使细菌的叶酸代谢受到双重阻断，具有协同抗菌作用，其抗菌作用较单药增强，对已呈现耐药的菌株也相应减少。","ok":true,"an":["选择性抑制","代谢","磺胺类药物作","叶酸","第一步"]},{"id":"3788c2ea2f","no":5,"q":"简述磺胺类药物的不良反应及防治。","a":"\u003cdiv class=\"q-ln\"\u003e磺胺类药物不良反应较多，且随个体差异而不同。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 肾脏损害：提高尿液 pH，多饮水，可增加磺胺类药物尿中溶解度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 急性溶血性贫血：可因过敏或先天性葡萄糖-6-磷酸脱氢酶缺乏而引起。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 造血系统毒性：长期用药可抑制骨髓造血功能，导致血小板减少、粒细胞减少，甚至再生障碍性贫血，虽然罕见，但一旦发生可能是致命的。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 过敏反应：除溶血性贫血外，主要是皮肤、黏膜过敏反应，亦可引起血清病样过敏。药物热是常见的不良反应。由于药物的直接毒性或过敏反应造成肝坏死，伴有头痛、恶心、呕吐、肝大、黄疸、肝功能不全等。\u003c/div\u003e","pt":"磺胺类药物不良反应较多，且随个体差异而不同。 ① 肾脏损害：提高尿液 pH，多饮水，可增加磺胺类药物尿中溶解度。 ② 急性溶血性贫血：可因过敏或先天性葡萄糖-6-磷酸脱氢酶缺乏而引起。 ③ 造血系统毒性：长期用药可抑制骨髓造血功能，导致血小板减少、粒细胞减少，甚至再生障碍性贫血，虽然罕见，但一旦发生可能是致命的。 ④ 过敏反应：除溶血性贫血外，主要是皮肤、黏膜过敏反应，亦可引起血清病样过敏。药物热是常见的不良反应。由于药物的直接毒性或过敏反应造成肝坏死，伴有头痛、恶心、呕吐、肝大、黄疸、肝功能不全等。","ok":true,"an":["急性溶血性贫血","造血系统毒性","过敏反应","肾脏损害","长期用药","个体差异"]}],"count":5,"done":5},{"label":"第三十九章","questi alse,"an":[]},{"id":"e5851a1752","no":6,"q":"药物制剂的流变性质？","a":"","pt":"","ok":false,"an":[]},{"id":"b842cabeec","no":7,"q":"简述牛顿流体、塑性流体、假塑性流体和胀性流体的特点。","a":"","pt":"","ok":false,"an":[]},{"id":"fd037753e2","no":8,"q":"触变性","a":"","pt":"","ok":false,"an":[]}],"count":8,"done":0},{"label":"第七章","questions":[{"id":"0165d34f1b","no":1,"q":"液体制剂","a":"\u003cdiv class=\"q-ln\"\u003e是指药物分散在适宜的分散介质中制成的可供内服或外用的液体形态的制剂。\u003c/div\u003e","pt":"是指药物分散在适宜的分散介质中制成的可供内服或外用的液体形态的制剂。","ok":true,"an":["分散介质","供内服"]},{"id":"28638563c7","no":2,"q":"Suspensions","a":"\u003cdiv class=\"q-ln\"\u003e是指难溶性固体药物以微粒状态分散于分散介质中形成的非均相液体制剂，可供内服或外用。混悬剂中的药物微粒一般在0.5\\~10μm之间，小者可达0.1μm，大者可达50μm或更大。混悬剂属于热力学；动力学不稳定的粗分散体系。\u003c/div\u003e","pt":"是指难溶性固体药物以微粒状态分散于分散介质中形成的非均相液体制剂，可供内服或外用。混悬剂中的药物微粒一般在0.5\\~10μm之间，小者可达0.1μm，大者可达50μm或更大。混悬剂属于热力学；动力学不稳定的粗分散体系。","ok":true,"an":["非均相","液体制剂","动力学","难溶性","混悬剂","分散介质"]},{"id":"9c3085334c","no":3,"q":"Emulsions","a":"\u003cdiv class=\"q-ln\"\u003e是指互不相溶的两种液体混合，其中一种液体以液滴状分散于另一种液体中形成的非均相液体分散体系。可供内服；外用或注射。\u003c/div\u003e","pt":"是指互不相溶的两种液体混合，其中一种液体以液滴状分散于另一种液体中形成的非均相液体分散体系。可供内服；外用或注射。","ok":true,"an":["非均相","供内服"]},{"id":"e980cc35f6","no":4,"q":"增加药物溶解度的方法有哪些？举例说明。","a":"","pt":"","ok":false,"an":[]},{"id":"a60d17e19a","no":5,"q":"简述液体制剂的特点及分类。","a":"\u003cdiv class=\"q-ln\"\u003e特点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 优点: 1.药物分散度大；吸收快；发挥药效迅速；2.给药途径多；3.方便分剂量，服用方便，特别适于老人；婴幼儿等患者；4.能减少药物刺激性，如避免易溶性固体药物口服后由于局部浓度过高而引起的胃肠道刺激。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 缺点: 1.药物分散度大，容易发生化学降解，降低药效，甚至失效；2.液体制剂体积大，携带；运输；贮存等不方便。3.水性液体制剂易发生霉变，需要加入防腐剂；4.非均相液体制剂易产生物理稳定性问题。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e分类:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 按分散系统分类:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e均相: 低分子溶液剂（分散相粒径\u003c1nm）；高分子溶液剂（分散相粒径\u003c100nm）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e非均相: 溶胶剂（分散性粒径1\\~100nm）；乳剂（分散相粒径\u003e100nm）；混悬剂（分散相粒径\u003e500nm）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 按给药途径分类:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e内服液体制剂: 糖浆剂；合剂；乳剂；混悬剂；滴剂等\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e外服液体制剂: 1.皮肤用液体制剂: 搽剂；洗剂等；2.五官科用液体制剂: 含漱剂；滴鼻剂；滴耳剂等；3.直肠；阴道；尿道用液体制剂: 灌肠剂等。\u003c/div\u003e","pt":"特点: ① 优点: 1.药物分散度大；吸收快；发挥药效迅速；2.给药途径多；3.方便分剂量，服用方便，特别适于老人；婴幼儿等患者；4.能减少药物刺激性，如避免易溶性固体药物口服后由于局部浓度过高而引起的胃肠道刺激。 ② 缺点: 1.药物分散度大，容易发生化学降解，降低药效，甚至失效；2.液体制剂体积大，携带；运输；贮存等不方便。3.水性液体制剂易发生霉变，需要加入防腐剂；4.非均相液体制剂易产生物理稳定性问题。 分类: ① 按分散系统分类: 均相: 低分子溶液剂（分散相粒径 非均相: 溶胶剂（分散性粒径1\\~100nm）；乳剂（分散相粒径\u003e100nm）；混悬剂（分散相粒径\u003e500nm） ② 按给药途径分类: 内服液体制剂: 糖浆剂；合剂；乳剂；混悬剂；滴剂等 外服液体制剂: 1.皮肤用液体制剂: 搽剂；洗剂等；2.五官科用液体制剂: 含漱剂；滴鼻剂；滴耳剂等；3.直肠；阴道；尿道用液体制剂: 灌肠剂等。","ok":true,"an":["内服液体制剂","外服液体制剂","非均相","按分散系统分","胃肠道","均相"]},{"id":"fbf5739b16","no":6,"q":"写出Stokes公式并结合Stokes公式讨论延缓混悬微粒沉降速率的措施。","a":"\u003cdiv class=\"q-ln\"\u003e①\u003cp style=\"text-align:center; font-size:1.1em;\"\u003eV = 2r\u003csup\u003e2\u003c/sup\u003e(ρ\u003csub\u003e1\u003c/sub\u003e − ρ\u003csub\u003e2\u003c/sub\u003e)g / 9η\u003c/p\u003e 式中: V为沉降速度（cm/s）；r为微粒半径（cm）；ρ\u003csub\u003e1\u003c/sub\u003e为微粒密度，ρ\u003csub\u003e2\u003c/sub\u003e为分散介质密度；g为重力加速度；η为分散介质黏度（泊）。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 延缓混悬微粒沉降速率的措施:1.V和r\u003csup\u003e2\u003c/sup\u003e成正比，故可缩小粒径，可将药物粉碎或微粉化；2.V和ρ\u003csub\u003e1\u003c/sub\u003e-ρ\u003csub\u003e2\u003c/sub\u003e成正比，故可缩小微粒和分散介质的密度差，可加入助悬剂；3.V和η成反比，故可增加分散介质黏度，可加入助悬剂。等这些措施延缓混悬微粒沉降速率。\u003c/div\u003e","pt":"① V = 2r 2 (ρ 1 − ρ 2 )g / 9η 式中: V为沉降速度（cm/s）；r为微粒半径（cm）；ρ 1 为微粒密度，ρ 2 为分散介质密度；g为重力加速度；η为分散介质黏度（泊）。 ② 延缓混悬微粒沉降速率的措施:1.V和r 2 成正比，故可缩小粒径，可将药物粉碎或微粉化；2.V和ρ 1 -ρ 2 成正比，故可缩小微粒和分散介质的密度差，可加入助悬剂；3.V和η成反比，故可增加分散介质黏度，可加入助悬剂。等这些措施延缓混悬微粒沉降速率。","ok":true,"an":["助悬剂","增加分散介质","分散介质","密度差"]},{"id":"fe2af307e3","no":7,"q":"混悬剂的稳定剂包括哪几类？简述各类稳定剂在混悬剂中所起作用，并各举1\\~2例。","a":"\u003cdiv class=\"q-ln\"\u003e助悬剂: 主要是增加分散介质的黏度以及微粒的亲水性，有些还可以使混悬剂具有触变性，增加混悬剂稳定性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 低分子助悬剂: 甘油；单糖浆等；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 高分子助悬剂: 阿拉伯胶；羧甲基纤维素钠等；\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 硅酸盐类: 硅酸镁铝；白陶土等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e润湿剂: 能降低分散介质和微粒之间的界面张力，使疏水性药物易被水润湿与分散。例如: 聚山梨酯类；泊洛沙姆等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e絮凝剂与反絮凝剂: 能改变微粒ζ电位，使混悬剂处于絮凝状态或非絮凝状态的电解质。例如: 枸橼酸盐；酒石酸盐等。\u003c/div\u003e","pt":"助悬剂: 主要是增加分散介质的黏度以及微粒的亲水性，有些还可以使混悬剂具有触变性，增加混悬剂稳定性。 ① 低分子助悬剂: 甘油；单糖浆等； ② 高分子助悬剂: 阿拉伯胶；羧甲基纤维素钠等； ③ 硅酸盐类: 硅酸镁铝；白陶土等。 润湿剂: 能降低分散介质和微粒之间的界面张力，使疏水性药物易被水润湿与分散。例如: 聚山梨酯类；泊洛沙姆等。 絮凝剂与反絮凝剂: 能改变微粒ζ电位，使混悬剂处于絮凝状态或非絮凝状态的电解质。例如: 枸橼酸盐；酒石酸盐等。","ok":true,"an":["低分子助悬剂","高分子助悬剂","助悬剂","润湿剂","硅酸盐类","甲基纤维素"]},{"id":"951076b9ab","no":8,"q":"乳化剂分为哪几类？它们在乳剂的形成中起什么作用？每类乳化剂各举1\\~2例。","a":"\u003cdiv class=\"q-ln\"\u003e① 表面活性剂类: 分子中有较强的亲水亲油基，在乳滴周围形成单分子层乳化膜。例如: 十二烷基硫酸钠；司盘类；吐温类。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 天然高分子乳化剂: 可形成O/W型乳剂，常用于口服乳剂，使用时需加入防腐剂。例如: 阿拉伯胶；明胶。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 固体微粒乳化剂: 一些能够被油水两相润湿的不溶性固体微粒，可聚集在两相界面形成膜，防止分散相液滴接触合并。例如: O/W型乳化剂: 氢氧化镁；氢氧化铝；二氧化硅；W/O型乳化剂: 氢氧化钙；氢氧化锌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 助乳化剂: 本身乳化能力较弱或无乳化能力，但能提高乳剂黏度，增强乳化膜强度，防止分散相液滴合并等。例如: 甲基纤维素；西黄蓍胶。\u003c/div\u003e","pt":"① 表面活性剂类: 分子中有较强的亲水亲油基，在乳滴周围形成单分子层乳化膜。例如: 十二烷基硫酸钠；司盘类；吐温类。 ② 天然高分子乳化剂: 可形成O/W型乳剂，常用于口服乳剂，使用时需加入防腐剂。例如: 阿拉伯胶；明胶。 ③ 固体微粒乳化剂: 一些能够被油水两相润湿的不溶性固体微粒，可聚集在两相界面形成膜，防止分散相液滴接触合并。例如: O/W型乳化剂: 氢氧化镁；氢氧化铝；二氧化硅；W/O型乳化剂: 氢氧化钙；氢氧化锌。 ④ 助乳化剂: 本身乳化能力较弱或无乳化能力，但能提高乳剂黏度，增强乳化膜强度，防止分散相液滴合并等。例如: 甲基纤维素；西黄蓍胶。","ok":true,"an":["天然高分子乳化剂","固体微粒乳化剂","表面活性剂类","助乳化剂","甲基纤维素","型乳化剂"]},{"id":"4ba8c8e257","no":9,"q":"乳剂存在哪些不稳定现象？应如何解决？","a":"\u003cdiv class=\"q-ln\"\u003e① 分层:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e指乳剂放置后出现分散相粒子上浮或下沉的现象，又称为乳析。分散相和分散介质之间的密度差是引起分层的主要原因。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e解决方法: 减小分散相液滴粒径；增加分散介质的黏度；减小分散相与分散介质的密度差。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 絮凝:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e乳剂中分散相的液滴发生可逆的聚集现象称为絮凝。絮凝时仍保持液滴及其乳化膜的完整性，但乳剂的稳定性已降低，是乳剂破裂的前奏。产生絮凝的原因是电解质和离子型乳化剂的存在。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e解决方法：制备乳剂时不要加入电解质，选用非离子型乳化剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 转相：乳剂的类型发生转变的现象称为转相。转相通常是由于外加物质使乳化剂性质改变而引起，如钠肥皂→钙皂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e解决方法：避免加入引起乳化剂性质改变的物质。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 合并与破裂：乳剂中分散相液滴的乳化膜破坏导致液滴变大的过程称为合并。合并进一步发展使乳剂成为油；水两相的现象称为破裂。乳剂破裂后经振摇不能恢复到原来的状态。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e解决方法: 液滴的大小不均一易使液滴聚集而合并，因此制备乳剂时应尽可能使液滴大小均匀。另外，增加分散介质的黏度也可降低液滴合并的速度。乳化膜的牢固性是影响液滴合并最重要的因素，在制备乳剂时可考虑选用混合乳化剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 酸败：乳剂受外界因素及微生物的影响，体系中油或乳化剂等发生变质的现象称为酸败。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e解决方法: 可以通过加入抗氧剂；防腐剂等方法加以解决。\u003c/div\u003e","pt":"① 分层: 指乳剂放置后出现分散相粒子上浮或下沉的现象，又称为乳析。分散相和分散介质之间的密度差是引起分层的主要原因。 解决方法: 减小分散相液滴粒径；增加分散介质的黏度；减小分散相与分散介质的密度差。 ② 絮凝: 乳剂中分散相的液滴发生可逆的聚集现象称为絮凝。絮凝时仍保持液滴及其乳化膜的完整性，但乳剂的稳定性已降低，是乳剂破裂的前奏。产生絮凝的原因是电解质和离子型乳化剂的存在。 解决方法：制备乳剂时不要加入电解质，选用非离子型乳化剂。 ③ 转相：乳剂的类型发生转变的现象称为转相。转相通常是由于外加物质使乳化剂性质改变而引起，如钠肥皂→钙皂。 解决方法：避免加入引起乳化剂性质改变的物质。 ④ 合并与破裂：乳剂中分散相液滴的乳化膜破坏导致液滴变大的过程称为合并。合并进一步发展使乳剂成为油；水两相的现象称为破裂。乳剂破裂后经振摇不能恢复到原来的状态。 解决方法: 液滴的大小不均一易使液滴聚集而合并，因此制备乳剂时应尽可能使液滴大小均匀。另外，增加分散介质的黏度也可降低液滴合并的速度。乳化膜的牢固性是影响液滴合并最重要的因素，在制备乳剂时可考虑选用混合乳化剂。 ⑤ 酸败：乳剂受外界因素及微生物的影响，体系中油或乳化剂等发生变质的现象称为酸败。 解决方法: 可以通过加入抗氧剂；防腐剂等方法加以解决。","ok":true,"an":["转相","增加分散介质","型乳化剂","酸败","乳化膜","水两相"]},{"id":"b94b7949f4","no":10,"q":"优良乳化剂应具备的性质。","a":"\u003cdiv class=\"q-ln\"\u003e① 有较强的乳化能力，并能在分散相液滴周围形成牢固的乳化膜。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 能在液滴表面形成电屏障，以保障液滴之间具有足够的静电斥力。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 应有一定的生理适应能力，不应对机体产生近期的和远期的毒副作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 受各种因素的影响小。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 稳定性好。\u003c/div\u003e","pt":"① 有较强的乳化能力，并能在分散相液滴周围形成牢固的乳化膜。 ② 能在液滴表面形成电屏障，以保障液滴之间具有足够的静电斥力。 ③ 应有一定的生理适应能力，不应对机体产生近期的和远期的毒副作用。 ④ 受各种因素的影响小。 ⑤ 稳定性好。","ok":true,"an":["乳化膜","分散相","稳定性"]},{"id":"97581d6416","no":11,"q":"哪些情况下考虑将药物制成混悬型液体制剂？","a":"\u003cdiv class=\"q-ln\"\u003e① 将难溶性药物制成液体制剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药物剂量超过溶解度而不能制成溶液剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 两种溶液混合时药物的溶解度降低而析出固体药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 使药物产生缓释作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e但为安全起见，剧毒药或剂量小的药物不应制成混悬剂。\u003c/div\u003e","pt":"① 将难溶性药物制成液体制剂。 ② 药物剂量超过溶解度而不能制成溶液剂。 ③ 两种溶液混合时药物的溶解度降低而析出固体药物。 ④ 使药物产生缓释作用。 但为安全起见，剧毒药或剂量小的药物不应制成混悬剂。","ok":true,"an":["难溶性","混悬剂","剧毒药","两种溶液"]},{"id":"bae921004a","no":12,"q":"制药用水的分类及应用。","a":"\u003cdiv class=\"q-ln\"\u003e饮用水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 是指天然水经纯化所得的水，其质量需符合现行中华人民共和国《生活饮用水卫生标准》。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可作为药材净制时的漂洗；制药用具的粗洗用水。除另有规定外，也可作为药材的提取溶剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e纯化水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 是指饮用水经蒸馏法；反渗透法；离子交换法或其他适宜方法制得的制药用水，不含任何附加剂。其质量应符合《中国药典》（2025年版 二部）纯化水项下的规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可作为配置普通药物制剂的溶剂或试验用水；中药注射剂；滴眼剂等灭菌制剂所用饮片的提取溶剂；口服；外用药物制剂配置用的溶剂或稀释剂；非灭菌制剂用器具的精洗用水。也可用作非灭菌制剂所用饮片的提取溶剂。不得用于注射剂的配制与稀释。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e注射用水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 是指纯化水经蒸馏所得的水，应符合细菌内毒素试验的要求。注射用水必须在防止细菌内毒素产生的条件下生产；贮存及分装。其质量应符合《中国药典》（2025年版 二部）注射用水项下的规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可作为注射剂；滴眼剂等溶剂或稀释剂及容器的精洗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e灭菌注射用水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 为注射用水按注射剂生产工艺制备所得，不含任何添加剂，其质量应符合《中国药典》（2025年版 二部）灭菌注射用水项下的规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可作为注射用灭菌粉末的溶剂或注射剂的稀释剂。\u003c/div\u003e","pt":"饮用水: ① 是指天然水经纯化所得的水，其质量需符合现行中华人民共和国《生活饮用水卫生标准》。 ② 应用: 可作为药材净制时的漂洗；制药用具的粗洗用水。除另有规定外，也可作为药材的提取溶剂。 纯化水: ① 是指饮用水经蒸馏法；反渗透法；离子交换法或其他适宜方法制得的制药用水，不含任何附加剂。其质量应符合《中国药典》（2025年版 二部）纯化水项下的规定。 ② 应用: 可作为配置普通药物制剂的溶剂或试验用水；中药注射剂；滴眼剂等灭菌制剂所用饮片的提取溶剂；口服；外用药物制剂配置用的溶剂或稀释剂；非灭菌制剂用器具的精洗用水。也可用作非灭菌制剂所用饮片的提取溶剂。不得用于注射剂的配制与稀释。 注射用水: ① 是指纯化水经蒸馏所得的水，应符合细菌内毒素试验的要求。注射用水必须在防止细菌内毒素产生的条件下生产；贮存及分装。其质量应符合《中国药典》（2025年版 二部）注射用水项下的规定。 ② 应用: 可作为注射剂；滴眼剂等溶剂或稀释剂及容器的精洗。 灭菌注射用水: ① 为注射用水按注射剂生产工艺制备所得，不含任何添加剂，其质量应符合《中国药典》（2025年版 二部）灭菌注射用水项下的规定。 ② 应用: 可作为注射用灭菌粉末的溶剂或注射剂的稀释剂。","ok":true,"an":["注射用水","含任何添加剂","中药注射剂","注射用灭菌粉末","提取溶剂","质量应符合"]}],"count":12,"done":11},{"label":"第八章","questions":[{"id":"04998516e6","no":1,"q":"消毒(disinfection)","a":"\u003cdiv class=\"q-ln\"\u003e是指用物理和化学方法将病原微生物杀死或除去。\u003c/div\u003e","pt":"是指用物理和化学方法将病原微生物杀死或除去。","ok":true,"an":["化学方法"]},{"id":"b54bbcabc7","no":2,"q":"注射剂(injections)","a":"\u003cdiv class=\"q-ln\"\u003e是指原料药物或与适宜辅料制成的供注入体内的无菌制剂，可分为注射剂；注射用无菌粉末；注射用浓溶液等。\u003c/div\u003e","pt":"是指原料药物或与适宜辅料制成的供注入体内的无菌制剂，可分为注射剂；注射用无菌粉末；注射用浓溶液等。","ok":true,"an":["注射用无菌粉末"]},{"id":"3aed7d6740","no":3,"q":"热原(pyrogen)","a":"\u003cdiv class=\"q-ln\"\u003e是指能引起恒温动物和人体体温异常升高的致热物质的总称，是细菌等微生物生产的一种内毒素，以革兰氏阴性杆菌和霉菌所产致热原的致热能力最强。\u003c/div\u003e","pt":"是指能引起恒温动物和人体体温异常升高的致热物质的总称，是细菌等微生物生产的一种内毒素，以革兰氏阴性杆菌和霉菌所产致热原的致热能力最强。","ok":true,"an":["革兰氏阴性杆菌","致热原"]},{"id":"8d9bcdeb24","no":4,"q":"滤器的种类有哪些，各有何特点？","a":"\u003cdiv class=\"q-ln\"\u003e① 砂滤棒；特点: 用于大生产中的粗滤，但易脱砂，对药液的吸附性强，难于清洗，有时会改变溶液的pH。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 钛滤器；特点: 抗热性能好；强度大；重量轻；不易破碎，过滤阻力小；滤速快。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 垂熔玻璃滤器；特点: 性质稳定，除了强碱与氢氟酸外，一般不受药液影响；吸附性低，一般不影响药液pH；可热压灭菌；易洗净，不易出现裂漏；碎屑脱落等现象。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 微孔滤膜滤器；特点: 1.孔径均匀；孔隙率高；截留能力强；2.材质多样，可耐受多种不同特性的药液；3.没有滤过介质的迁移，不改变药液的pH；4.质地薄，对药液的吸附较小；5.滤膜滤器一次性使用，不会在产品之间产生交叉污染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 板框压滤器；特点: 过滤面积大，截留的固体量多，可在各种压力下过滤，缺点是装配和清洗麻烦；容易漏液。常用于过滤黏性；颗粒大的浸出液。\u003c/div\u003e","pt":"① 砂滤棒；特点: 用于大生产中的粗滤，但易脱砂，对药液的吸附性强，难于清洗，有时会改变溶液的pH。 ② 钛滤器；特点: 抗热性能好；强度大；重量轻；不易破碎，过滤阻力小；滤速快。 ③ 垂熔玻璃滤器；特点: 性质稳定，除了强碱与氢氟酸外，一般不受药液影响；吸附性低，一般不影响药液pH；可热压灭菌；易洗净，不易出现裂漏；碎屑脱落等现象。 ④ 微孔滤膜滤器；特点: 1.孔径均匀；孔隙率高；截留能力强；2.材质多样，可耐受多种不同特性的药液；3.没有滤过介质的迁移，不改变药液的pH；4.质地薄，对药液的吸附较小；5.滤膜滤器一次性使用，不会在产品之间产生交叉污染。 ⑤ 板框压滤器；特点: 过滤面积大，截留的固体量多，可在各种压力下过滤，缺点是装配和清洗麻烦；容易漏液。常用于过滤黏性；颗粒大的浸出液。","ok":true,"an":["热压灭菌","吸附性","强碱"]},{"id":"2669ae6056","no":5,"q":"过滤的机制有哪些，哪些因素会影响过滤效果？","a":"\u003cdiv class=\"q-ln\"\u003e过滤的机制:1.介质过滤（表面过滤；深层过滤）；2.滤饼过滤。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e影响过滤效果的因素: 1.操作压力，加压或减压以提高压力差，利于过滤；2.孔隙大小，设法增大颗粒粒径以减小滤饼阻力，利于过滤；3.滤液黏度，升高温度以降低滤液黏度，利于过滤；4.毛细管长度，进行预滤，以减小滤饼厚度，利于过滤。\u003c/div\u003e","pt":"过滤的机制:1.介质过滤（表面过滤；深层过滤）；2.滤饼过滤。 影响过滤效果的因素: 1.操作压力，加压或减压以提高压力差，利于过滤；2.孔隙大小，设法增大颗粒粒径以减小滤饼阻力，利于过滤；3.滤液黏度，升高温度以降低滤液黏度，利于过滤；4.毛细管长度，进行预滤，以减小滤饼厚度，利于过滤。","ok":true,"an":["毛细管"]},{"id":"13af6996ab","no":6,"q":"影响湿热灭菌的主要因素有那些？","a":"\u003cdiv class=\"q-ln\"\u003e① 微生物的种类与数量: 不同种类；不同发育阶段的微生物的耐热；耐压能力有很大差异。耐热；耐压能力的强弱顺序为芽孢\u003e繁殖体\u003e衰老体。微生物数量越少，所需灭菌时间越短。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 蒸汽性质: 饱和蒸汽的灭菌效率最高。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 药品性质和灭菌时间: 灭菌温度越高，灭菌时间越长，药品被破坏的可能性越大。因此，在达到有效灭菌的前提下，尽可能降低灭菌温度和缩短灭菌时间。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 其他: 介质的pH，通常微生物在中性环境下的耐热性最强，碱性环境次之，酸性环境则不利于微生物的生长和发育。介质中的营养成分越丰富（如含糖类；蛋白质等），微生物的抗热性越强，应适当提高灭菌温度和延长灭菌时间。\u003c/div\u003e","pt":"① 微生物的种类与数量: 不同种类；不同发育阶段的微生物的耐热；耐压能力有很大差异。耐热；耐压能力的强弱顺序为芽孢\u003e繁殖体\u003e衰老体。微生物数量越少，所需灭菌时间越短。 ② 蒸汽性质: 饱和蒸汽的灭菌效率最高。 ③ 药品性质和灭菌时间: 灭菌温度越高，灭菌时间越长，药品被破坏的可能性越大。因此，在达到有效灭菌的前提下，尽可能降低灭菌温度和缩短灭菌时间。 ④ 其他: 介质的pH，通常微生物在中性环境下的耐热性最强，碱性环境次之，酸性环境则不利于微生物的生长和发育。介质中的营养成分越丰富（如含糖类；蛋白质等），微生物的抗热性越强，应适当提高灭菌温度和延长灭菌时间。","ok":true,"an":["蒸汽性质","繁殖体","耐热性","酸性环境","含糖类","蛋白质"]},{"id":"c98e787224","no":7,"q":"什么是纯化水；注射用水；灭菌注射用水，各有何应用？","a":"\u003cdiv class=\"q-ln\"\u003e（饮用水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 是指天然水经净化处理所得的水，其质量应符合现行中华人民共和国《生活饮用水卫生标准》。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可用作药材的漂洗，制药用具的粗洗用水，除另有规定外，也可用在药材提取的溶剂。）\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e纯化水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 是指饮用水经蒸馏法；离子交换法；反渗透法或其他适宜的方法制备的制药用水，不含任何添加剂。其质量应符合《中国药典》(2025年版)二部纯化水项下的规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 1.可用作普通药物制剂的溶剂或试验用水；2.中药注射剂；滴眼剂等灭菌制剂所用饮片的提取溶剂；3.口服；外用制剂配制用溶剂或稀释剂；4.非灭菌制剂用器具的精洗用水；5.非灭菌制剂所用饮片的提取溶剂；6.不得用于注射剂的配制与稀释。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e注射用水:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 是指纯化水经蒸馏所得的水，应符合细菌内毒素试验要求。注射用水必须在防止细菌内毒素产生的设计条件下生产；贮存及分装。其质量应符合《中国药典》(2025年版)二部注射用水项下的规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可用作注射剂；滴眼剂等的溶剂或稀释剂及容器的精洗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e灭菌注射用水：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 为注射用水按注射剂生产工艺制备所得，不含任何添加剂。其质量应符合《中国药典》(2025年版)二部灭菌注射用水项下的规定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 应用: 可用作注射用灭菌粉末的溶剂或注射剂的稀释剂。\u003c/div\u003e","pt":"（饮用水: ① 是指天然水经净化处理所得的水，其质量应符合现行中华人民共和国《生活饮用水卫生标准》。 ② 应用: 可用作药材的漂洗，制药用具的粗洗用水，除另有规定外，也可用在药材提取的溶剂。） 纯化水: ① 是指饮用水经蒸馏法；离子交换法；反渗透法或其他适宜的方法制备的制药用水，不含任何添加剂。其质量应符合《中国药典》(2025年版)二部纯化水项下的规定。 ② 应用: 1.可用作普通药物制剂的溶剂或试验用水；2.中药注射剂；滴眼剂等灭菌制剂所用饮片的提取溶剂；3.口服；外用制剂配制用溶剂或稀释剂；4.非灭菌制剂用器具的精洗用水；5.非灭菌制剂所用饮片的提取溶剂；6.不得用于注射剂的配制与稀释。 注射用水: ① 是指纯化水经蒸馏所得的水，应符合细菌内毒素试验要求。注射用水必须在防止细菌内毒素产生的设计条件下生产；贮存及分装。其质量应符合《中国药典》(2025年版)二部注射用水项下的规定。 ② 应用: 可用作注射剂；滴眼剂等的溶剂或稀释剂及容器的精洗。 灭菌注射用水： ① 为注射用水按注射剂生产工艺制备所得，不含任何添加剂。其质量应符合《中国药典》(2025年版)二部灭菌注射用水项下的规定。 ② 应用: 可用作注射用灭菌粉末的溶剂或注射剂的稀释剂。","ok":true,"an":["含任何添加剂","中药注射剂","注射用灭菌粉末","提取溶剂","质量应符合","离子交换法"]},{"id":"b9bb258a7a","no":8,"q":"物理灭菌法可分为哪几类，各有何应用特点？","a":"\u003cdiv class=\"q-ln\"\u003e湿热灭菌法: 该法灭菌能力强，为热力灭菌中最有效；应用最广泛的灭菌方法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 热压灭菌法: 适用于耐高温和耐高压蒸汽的药物制剂；玻璃器械；金属容器；瓷器；胶塞；滤膜过滤器等，不适用于不耐高温和高压灭菌的药物；密度较高的固体；半固体产品（如脂肪；植物油等）。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 流通蒸汽灭菌法: 不能保证杀灭所有的芽孢，一般作为不耐热无菌产品的辅助灭菌手段。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 煮沸灭菌法: 灭菌效果较差，不能保证杀灭所有芽孢。必要时可加入适量抑菌剂，以提高灭菌效果。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 低温间歇灭菌法: 适于不耐高温；热敏感物料和制剂的灭菌。缺点是费时；灭菌效率低，必要时加入抑菌剂，可提高灭菌效率。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e干热灭菌法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 火焰灭菌法: 适用于耐火材质（如金属；玻璃等）物品与用具的灭菌，不适于药品灭菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 干热空气灭菌法: 适用于耐高温但不宜用湿热灭菌法灭菌的物品灭菌，如玻璃器具；金属容器；陶瓷制品；不允许湿气穿透的油脂类和耐高温的固体药品的灭菌，不适于橡胶；塑料器具及大部分有机药品的灭菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e射线灭菌法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 辐射灭菌法: 适用于热敏性物料和制剂；医疗器械；生产辅助用品；药用包装材料等的灭菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 紫外线灭菌法: 主要用于无菌室空气灭菌及物体表面的灭菌，不能用于安瓿中药液及固体物料深部灭菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 微波灭菌法: 适于液态和固态物料的灭菌，且对固体物料具有干燥作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e过滤除菌法: 除菌过滤广泛应用于最终灭菌产品和非最终灭菌产品。\u003c/div\u003e","pt":"湿热灭菌法: 该法灭菌能力强，为热力灭菌中最有效；应用最广泛的灭菌方法。 ① 热压灭菌法: 适用于耐高温和耐高压蒸汽的药物制剂；玻璃器械；金属容器；瓷器；胶塞；滤膜过滤器等，不适用于不耐高温和高压灭菌的药物；密度较高的固体；半固体产品（如脂肪；植物油等）。 ② 流通蒸汽灭菌法: 不能保证杀灭所有的芽孢，一般作为不耐热无菌产品的辅助灭菌手段。 ③ 煮沸灭菌法: 灭菌效果较差，不能保证杀灭所有芽孢。必要时可加入适量抑菌剂，以提高灭菌效果。 ④ 低温间歇灭菌法: 适于不耐高温；热敏感物料和制剂的灭菌。缺点是费时；灭菌效率低，必要时加入抑菌剂，可提高灭菌效率。 干热灭菌法: ① 火焰灭菌法: 适用于耐火材质（如金属；玻璃等）物品与用具的灭菌，不适于药品灭菌。 ② 干热空气灭菌法: 适用于耐高温但不宜用湿热灭菌法灭菌的物品灭菌，如玻璃器具；金属容器；陶瓷制品；不允许湿气穿透的油脂类和耐高温的固体药品的灭菌，不适于橡胶；塑料器具及大部分有机药品的灭菌。 射线灭菌法: ① 辐射灭菌法: 适用于热敏性物料和制剂；医疗器械；生产辅助用品；药用包装材料等的灭菌。 ② 紫外线灭菌法: 主要用于无菌室空气灭菌及物体表面的灭菌，不能用于安瓿中药液及固体物料深部灭菌。 ③ 微波灭菌法: 适于液态和固态物料的灭菌，且对固体物料具有干燥作用。 过滤除菌法: 除菌过滤广泛应用于最终灭菌产品和非最终灭菌产品。","ok":true,"an":["湿热灭菌法","流通蒸汽灭菌法","低温间歇灭菌法","干热空气灭菌法","紫外线灭菌法","热压灭菌法"]},{"id":"a194ec2951","no":9,"q":"什么是化学灭菌法，分为哪几类，有何应用特点？","a":"\u003cdiv class=\"q-ln\"\u003e化学灭菌法系指用化学药品直接杀灭微生物的方法。该法仅对微生物繁殖体有效，不能杀灭芽孢。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 气体灭菌法: 适用于不耐辐射；不耐高温的医疗器械；塑料制品和药品包装材料等的灭菌，干粉类产品不建议采用本法灭菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 汽相灭菌法: 适用于密闭空间的内表面灭菌。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 液相灭菌法: 适用于杀灭物品表面微生物。\u003c/div\u003e","pt":"化学灭菌法系指用化学药品直接杀灭微生物的方法。该法仅对微生物繁殖体有效，不能杀灭芽孢。 ① 气体灭菌法: 适用于不耐辐射；不耐高温的医疗器械；塑料制品和药品包装材料等的灭菌，干粉类产品不建议采用本法灭菌。 ② 汽相灭菌法: 适用于密闭空间的内表面灭菌。 ③ 液相灭菌法: 适用于杀灭物品表面微生物。","ok":true,"an":["气体灭菌法","汽相灭菌法","液相灭菌法","医疗器械","包装材料","繁殖体"]},{"id":"51abf3ffd6","no":10,"q":"注射剂有何特点？","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 药效迅速；剂量准确；作用可靠\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 适用于不宜口服的药物\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 适合于不能口服给药的患者\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 具有局部定位给药作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 可产生长效作用\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 依从性较差\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 生产成本高\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 质量要求严格\u003c/div\u003e","pt":"优点: ① 药效迅速；剂量准确；作用可靠 ② 适用于不宜口服的药物 ③ 适合于不能口服给药的患者 ④ 具有局部定位给药作用 ⑤ 可产生长效作用 缺点: ① 依从性较差 ② 生产成本高 ③ 质量要求严格","ok":true,"an":["定位给药","口服给药","口服","依从性","剂量准确"]},{"id":"0ed2fa252d","no":11,"q":"注射液配置方法有那些，各适用于何种情况？","a":"\u003cdiv class=\"q-ln\"\u003e有浓配法和稀配法。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 浓配法: 指将全部药物加入部分处方量溶剂中配制成浓溶液，加热或冷藏后过滤，然后稀释至所需浓度，适用于质量较差的原料药，此法的优点是可滤除溶解度小的一些杂质。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 稀配法: 将药物加入处方量的全部溶剂中直接配成所需浓度，然后过滤，此法操作简便，一般用于质量优良的原料药。\u003c/div\u003e","pt":"有浓配法和稀配法。 ① 浓配法: 指将全部药物加入部分处方量溶剂中配制成浓溶液，加热或冷藏后过滤，然后稀释至所需浓度，适用于质量较差的原料药，此法的优点是可滤除溶解度小的一些杂质。 ② 稀配法: 将药物加入处方量的全部溶剂中直接配成所需浓度，然后过滤，此法操作简便，一般用于质量优良的原料药。","ok":true,"an":["浓配法","稀配法","操作简便","原料药"]},{"id":"abeae152dc","no":12,"q":"注射剂常用的附加剂有哪些？各起什么作用？","a":"\u003cdiv class=\"q-ln\"\u003e① 常用的附加剂: 1.抗氧剂；2.金属离子螯合剂；3.缓冲剂；4.助悬剂；5.稳定剂；6.增溶剂；润湿剂或乳化剂；7.抑菌剂；8.局麻剂；9.等渗调节剂；10.填充剂；11.保护剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 主要作用: 1.增加药物溶解度；2.提高药物稳定性；3.抑菌；4.调节渗透压；5.调节pH；6.减轻疼痛或刺激。\u003c/div\u003e","pt":"① 常用的附加剂: 1.抗氧剂；2.金属离子螯合剂；3.缓冲剂；4.助悬剂；5.稳定剂；6.增溶剂；润湿剂或乳化剂；7.抑菌剂；8.局麻剂；9.等渗调节剂；10.填充剂；11.保护剂。 ② 主要作用: 1.增加药物溶解度；2.提高药物稳定性；3.抑菌；4.调节渗透压；5.调节pH；6.减轻疼痛或刺激。","ok":true,"an":["提高药物稳定性","助悬剂","润湿剂","金属离子螯合剂","抗氧剂","填充剂"]},{"id":"8584609b56","no":13,"q":"安瓿按玻璃化学组成分为哪几类，各自适用性如何？","a":"\u003cdiv class=\"q-ln\"\u003e分中性玻璃、含钡玻璃、含锆玻璃三类。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 中性玻璃: 化学稳定性较好，可用作近中性或弱酸性注射剂的容器，如各种输液、葡萄糖注射液、注射用水等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 含钡玻璃: 耐碱性能好，可用作碱性较强的注射剂如磺胺嘧啶钠注射液的容器。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 含锆玻璃: 有更高的化学稳定性，耐酸、耐碱性均好，不易受药液侵蚀，可用于盛装如乳酸钠、碘化钠等注射液。\u003c/div\u003e","pt":"分中性玻璃、含钡玻璃、含锆玻璃三类。 ① 中性玻璃: 化学稳定性较好，可用作近中性或弱酸性注射剂的容器，如各种输液、葡萄糖注射液、注射用水等。 ② 含钡玻璃: 耐碱性能好，可用作碱性较强的注射剂如磺胺嘧啶钠注射液的容器。 ③ 含锆玻璃: 有更高的化学稳定性，耐酸、耐碱性均好，不易受药液侵蚀，可用于盛装如乳酸钠、碘化钠等注射液。","ok":true,"an":["注射用水","含钡玻璃","含锆玻璃","化学稳定性","葡萄糖注射液","弱酸性"]},{"id":"7b9988afc8","no":14,"q":"输液剂分为几类？","a":"\u003cdiv class=\"q-ln\"\u003e① 体液平衡用输液: 1.电解质输液: 纠正患者体内水和电解质紊乱，如氯化钠注射液；2.酸碱平衡注射液: 纠正体内酸碱平衡，如碳酸氢钠注射液。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 营养输液: 提供糖、脂肪、氨基酸、维生素等营养成分，主要用于口服不能吸收营养的患者。包括糖类输液、脂肪乳输液、氨基酸输液等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 胶体输液: 又称为血容量扩张用代血浆，用于调节体内渗透压。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 含药输液: 为避免临床使用输液配制时产生污染或配伍变化，可将常需静脉滴注给药的药物直接制成输液。如替硝唑注射液、甘露醇注射液等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 透析类输液: 用于需要进行血液净化治疗的患者，包括腹膜透析液、血液滤过置换液等。\u003c/div\u003e","pt":"① 体液平衡用输液: 1.电解质输液: 纠正患者体内水和电解质紊乱，如氯化钠注射液；2.酸碱平衡注射液: 纠正体内酸碱平衡，如碳酸氢钠注射液。 ② 营养输液: 提供糖、脂肪、氨基酸、维生素等营养成分，主要用于口服不能吸收营养的患者。包括糖类输液、脂肪乳输液、氨基酸输液等。 ③ 胶体输液: 又称为血容量扩张用代血浆，用于调节体内渗透压。 ④ 含药输液: 为避免临床使用输液配制时产生污染或配伍变化，可将常需静脉滴注给药的药物直接制成输液。如替硝唑注射液、甘露醇注射液等。 ⑤ 透析类输液: 用于需要进行血液净化治疗的患者，包括腹膜透析液、血液滤过置换液等。","ok":true,"an":["电解质紊乱","体液平衡用输液","透析类输液","营养输液","胶体输液","含药输液"]},{"id":"99799873e7","no":15,"q":"简述活性炭在制备注射剂中的作用及其注意事项。","a":"\u003cdiv class=\"q-ln\"\u003e① 作用: 吸附致热原、杂质及色素，并可用作助滤剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 注意事项: 能吸附生物碱类药物，应用时应注意其对药物的吸附作用。\u003c/div\u003e","pt":"① 作用: 吸附致热原、杂质及色素，并可用作助滤剂。 ② 注意事项: 能吸附生物碱类药物，应用时应注意其对药物的吸附作用。","ok":true,"an":["助滤剂","生物碱","致热原","色素"]},{"id":"5511c42e0e","no":16,"q":"输液在生产中及使用中常出现的问题有哪些？应采取哪些措施解决？","a":"\u003cdiv class=\"q-ln\"\u003e不溶性微粒与可见异物:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 生产环境与工艺操作引起: 车间的空气洁净度不符合要求，所用容器、胶塞洗涤不干净，过滤方法、操作选择不当，工序安排不合理等。解决办法: 严格遵守操作规程，加强过程管理。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 由输液容器与附件引起: 输液中存在的小白点主要是钙、镁、铁、硅酸盐等物质，大多来源于胶塞和玻璃输液容器。解决办法: 选用合格的胶塞与输液容器贮存药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 由原料和附加剂带入: 原辅料中的不溶性杂质不仅可使输液产生乳光、小白点、浑浊，而且影响药物的稳定性。解决办法: 严格控制输液用原辅料质量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e染菌问题:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e生产过程严重污染、灭菌不彻底、瓶塞扎口不严、松动、漏气等，且输液多为营养物质，细菌容易繁殖，污染严重的即使灭菌后大量细菌尸体存在也会引起致热反应。解决办法: 减少输液制备生产过程中的污染，且严格灭菌，严密包装。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e致热原反应:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e注射用水、原辅料、生产过程、容器、输液器具、使用过程等都可能引起致热原污染。解决办法: 生产时除去致热原，使用时采用一次性全套输液器，并在输液器出厂前灭菌。\u003c/div\u003e","pt":"不溶性微粒与可见异物: ① 生产环境与工艺操作引起: 车间的空气洁净度不符合要求，所用容器、胶塞洗涤不干净，过滤方法、操作选择不当，工序安排不合理等。解决办法: 严格遵守操作规程，加强过程管理。 ② 由输液容器与附件引起: 输液中存在的小白点主要是钙、镁、铁、硅酸盐等物质，大多来源于胶塞和玻璃输液容器。解决办法: 选用合格的胶塞与输液容器贮存药物。 ③ 由原料和附加剂带入: 原辅料中的不溶性杂质不仅可使输液产生乳光、小白点、浑浊，而且影响药物的稳定性。解决办法: 严格控制输液用原辅料质量。 染菌问题: 生产过程严重污染、灭菌不彻底、瓶塞扎口不严、松动、漏气等，且输液多为营养物质，细菌容易繁殖，污染严重的即使灭菌后大量细菌尸体存在也会引起致热反应。解决办法: 减少输液制备生产过程中的污染，且严格灭菌，严密包装。 致热原反应: 注射用水、原辅料、生产过程、容器、输液器具、使用过程等都可能引起致热原污染。解决办法: 生产时除去致热原，使用时采用一次性全套输液器，并在输液器出厂前灭菌。","ok":true,"an":["输液器具","注射用水","生产过程","原辅料","致热原反应","致热原污染"]},{"id":"290a59b552","no":17,"q":"简述热原的组成、性质。","a":"\u003cdiv class=\"q-ln\"\u003e① 热原的组成: 由磷脂、脂多糖和蛋白质组成的复合物，其中脂多糖是内毒素的主要成分，大致可以认为内毒素=致热原=脂多糖。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 热原的性质: 1.耐热性；2.滤过性；3.吸附性；4.水溶性；5.不挥发性；6.能被强酸、强碱和强氧化剂所破坏，超声波和某些表面活性剂也能使其失活。\u003c/div\u003e","pt":"① 热原的组成: 由磷脂、脂多糖和蛋白质组成的复合物，其中脂多糖是内毒素的主要成分，大致可以认为内毒素=致热原=脂多糖。 ② 热原的性质: 1.耐热性；2.滤过性；3.吸附性；4.水溶性；5.不挥发性；6.能被强酸、强碱和强氧化剂所破坏，超声波和某些表面活性剂也能使其失活。","ok":true,"an":["表面活性剂","挥发性","耐热性","水溶性","吸附性","氧化剂"]},{"id":"57bd324552","no":18,"q":"热原污染的途径有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e① 注射用水: 蒸馏器结构不合理，操作不当，注射用水贮藏时间过长都会被致热原污染，故应使用新鲜注射用水。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 原辅料: 生物方法制备的药物和辅料易滋生微生物，如水解蛋白、抗生素等药物，葡萄糖、乳糖等辅料，在贮藏过程中因包装损坏而易被污染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 生产过程: 室内卫生条件差，操作时间过长，装置不密闭，均会增加细菌污染机会。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 容器、用具、管道和装置: 未按GMP要求认真清洗处理，易导致致热原的污染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 输液器具: 有时输液本身不含致热原，但输液器具污染依然能发生致热原反应。\u003c/div\u003e","pt":"① 注射用水: 蒸馏器结构不合理，操作不当，注射用水贮藏时间过长都会被致热原污染，故应使用新鲜注射用水。 ② 原辅料: 生物方法制备的药物和辅料易滋生微生物，如水解蛋白、抗生素等药物，葡萄糖、乳糖等辅料，在贮藏过程中因包装损坏而易被污染。 ③ 生产过程: 室内卫生条件差，操作时间过长，装置不密闭，均会增加细菌污染机会。 ④ 容器、用具、管道和装置: 未按GMP要求认真清洗处理，易导致致热原的污染。 ⑤ 输液器具: 有时输液本身不含致热原，但输液器具污染依然能发生致热原反应。","ok":true,"an":["输液器具","注射用水","生产过程","原辅料","致热原反应","致热原污染"]},{"id":"05d4eda553","no":19,"q":"简述热原的除去方法。","a":"\u003cdiv class=\"q-ln\"\u003e① 高温法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 酸碱法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 吸附法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 多效蒸馏法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 凝胶过滤法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 反渗透法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑦ 超滤法\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑧ 离子交换法、二次以上的湿热灭菌法\u003c/div\u003e","pt":"① 高温法 ② 酸碱法 ③ 吸附法 ④ 多效蒸馏法 ⑤ 凝胶过滤法 ⑥ 反渗透法 ⑦ 超滤法 ⑧ 离子交换法、二次以上的湿热灭菌法","ok":true,"an":["湿热灭菌法","离子交换法"]},{"id":"5f0dc6b093","no":20,"q":"什么是粉针，哪些药物宜制成粉针？","a":"\u003cdiv class=\"q-ln\"\u003e① 粉针: 即注射用无菌粉末，是指原料药物或与适宜辅料制成的供临用前用无菌溶剂配制成注射液的无菌粉末或无菌块状物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 宜制成粉针的药物: 在水溶液中不稳定的药物，如某些抗生素（青霉素类、头孢菌素类）、一些酶制品（胰蛋白、辅酶A）及血浆等生物制剂。\u003c/div\u003e","pt":"① 粉针: 即注射用无菌粉末，是指原料药物或与适宜辅料制成的供临用前用无菌溶剂配制成注射液的无菌粉末或无菌块状物。 ② 宜制成粉针的药物: 在水溶液中不稳定的药物，如某些抗生素（青霉素类、头孢菌素类）、一些酶制品（胰蛋白、辅酶A）及血浆等生物制剂。","ok":true,"an":["注射用无菌粉末","头孢菌素","指原料药","青霉素","抗生素"]},{"id":"df78871768","no":21,"q":"冷冻干燥的原理。","a":"\u003cdiv class=\"q-ln\"\u003e冷冻干燥原理可以用水的三相图说明。图中OA线是冰和水的平衡曲线；OB线是水和水蒸气的平衡曲线；OC线是冰和水蒸气的平衡曲线，在此线上冰、气共存；O点是冰、水、气的平衡点，在此温度和压力时（即温度0.01℃，压力4.6mmHg），冰、水、气共存。由图可见当压力低于4.6mmHg时，无论温度如何变化，水只能以固态和气态存在。即说明固态（冰）受热时可不经过液态（水）直接转变为气态；而气态遇冷时放热直接转变为固体冰。根据平衡曲线OC，对于固体冰，升高温度或降低压力都可打破气固平衡，使整个系统朝着冰转变为气的方向进行，最终完成干燥，冷冻干燥就是根据这个原理进行的。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e（图见p193）\u003c/div\u003e","pt":"冷冻干燥原理可以用水的三相图说明。图中OA线是冰和水的平衡曲线；OB线是水和水蒸气的平衡曲线；OC线是冰和水蒸气的平衡曲线，在此线上冰、气共存；O点是冰、水、气的平衡点，在此温度和压力时（即温度0.01℃，压力4.6mmHg），冰、水、气共存。由图可见当压力低于4.6mmHg时，无论温度如何变化，水只能以固态和气态存在。即说明固态（冰）受热时可不经过液态（水）直接转变为气态；而气态遇冷时放热直接转变为固体冰。根据平衡曲线OC，对于固体冰，升高温度或降低压力都可打破气固平衡，使整个系统朝着冰转变为气的方向进行，最终完成干燥，冷冻干燥就是根据这个原理进行的。 （图见p193）","ok":true,"an":["水蒸气","mmHg","p193"]},{"id":"b03841369b","no":22,"q":"冷冻干燥的特点有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 避免药物因高温干燥而分解，适用于热敏性药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 冷冻干燥制品质地疏松多孔，加水后迅速溶解，恢复药液原有特性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 干燥在真空下进行，药物不易氧化，还可减少微粒的污染。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 含水量低，能除去95%\\~99%水分。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 产品剂量准确，外观优良。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 对溶剂的选择范围很窄，生产设备要求高，干燥时间长，生产能耗大等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 冻干粉针制备过程中通常采用过滤除菌，不如注射液高温灭菌效果可靠。\u003c/div\u003e","pt":"优点: ① 避免药物因高温干燥而分解，适用于热敏性药物。 ② 冷冻干燥制品质地疏松多孔，加水后迅速溶解，恢复药液原有特性。 ③ 干燥在真空下进行，药物不易氧化，还可减少微粒的污染。 ④ 含水量低，能除去95%\\~99%水分。 ⑤ 产品剂量准确，外观优良。 缺点: ① 对溶剂的选择范围很窄，生产设备要求高，干燥时间长，生产能耗大等。 ② 冻干粉针制备过程中通常采用过滤除菌，不如注射液高温灭菌效果可靠。","ok":true,"an":["粉针","范围","灭菌效果","剂量准确","除菌","注射液"]},{"id":"38a560e7b7","no":23,"q":"冷冻干燥中存在的问题有哪些，如何解决？","a":"\u003cdiv class=\"q-ln\"\u003e① 含水量偏高: 药液装入过多，升华干燥过程中供热不足，冷凝器温度偏高或真空度不够，均可能导致含水量偏高。解决方法: 采用旋转冷冻机或其他相应措施。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 产品外形不饱满或萎缩: 一些黏稠药液由于结构过于致密，在冻干过程中内部水蒸气逸出不完全，冻干结束后，制品因潮解而萎缩。解决方法: 可在处方中加入适量甘露醇、氯化钠等填充剂，并采取反复预冻升华法，以改善制品的通气性，改善产品外观。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 喷瓶: 冻干过程中如预冻不完全或供热太快，受热不匀，使制品部分液化，则易在升华过程中真空减压条件下产生喷瓶。解决方法: 控制预冻温度在低共熔点以下10℃\\~20℃，同时加热升华时，温度不宜超过低共熔点。\u003c/div\u003e","pt":"① 含水量偏高: 药液装入过多，升华干燥过程中供热不足，冷凝器温度偏高或真空度不够，均可能导致含水量偏高。解决方法: 采用旋转冷冻机或其他相应措施。 ② 产品外形不饱满或萎缩: 一些黏稠药液由于结构过于致密，在冻干过程中内部水蒸气逸出不完全，冻干结束后，制品因潮解而萎缩。解决方法: 可在处方中加入适量甘露醇、氯化钠等填充剂，并采取反复预冻升华法，以改善制品的通气性，改善产品外观。 ③ 喷瓶: 冻干过程中如预冻不完全或供热太快，受热不匀，使制品部分液化，则易在升华过程中真空减压条件下产生喷瓶。解决方法: 控制预冻温度在低共熔点以下10℃\\~20℃，同时加热升华时，温度不宜超过低共熔点。","ok":true,"an":["含水量偏高","喷瓶","甘露醇","氯化钠","填充剂","解决方法"]}],"count":23,"done":23},{"label":"第九章","questions":[{"id":"a5d46a59eb","no":1,"q":"粉碎操作对制剂过程的意义有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e① 增加药物的表面积，有利于加快药物的溶出与促进吸收。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 适应多种给药途径的应用，如不同粉碎度的散剂适用于口服给药、皮肤或黏膜给药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 有利于制剂工艺的顺利进行和多种剂型的制备。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 有助于从天然药材中提取有效成分，加速药材中有效成分的浸出。\u003c/div\u003e","pt":"① 增加药物的表面积，有利于加快药物的溶出与促进吸收。 ② 适应多种给药途径的应用，如不同粉碎度的散剂适用于口服给药、皮肤或黏膜给药。 ③ 有利于制剂工艺的顺利进行和多种剂型的制备。 ④ 有助于从天然药材中提取有效成分，加速药材中有效成分的浸出。","ok":true,"an":["口服给药","表面积","散剂"]},{"id":"e2bc1cb833","no":2,"q":"混合的机制、影响因素和设备？","a":"\u003cdiv class=\"q-ln\"\u003e机制: 1.对流混合；2.剪切混合；3.扩散混合。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e影响因素:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 物料性质: 主要是物料的粉体性质包括粒径、粒度分布、粒子形状、粒子密度、黏附性、表面带电等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 设备类型: 混合机的类型、尺寸、内部结构（挡板、搅拌桨形状）、材质及表面情况等均会影响混合程度，应根据物料的性质选择适宜的混合器。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 操作条件: 物料的充填率、装料方式、混合比、混合机的转动速度及混合时间等也会影响物料的混合均匀度，此外，温度和湿度也是影响混合效率的重要因素。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e设备:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 容器旋转型混合机: 回转式混合机\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 容器固定型混合机: 搅拌槽式混合机\u003c/div\u003e","pt":"机制: 1.对流混合；2.剪切混合；3.扩散混合。 影响因素: ① 物料性质: 主要是物料的粉体性质包括粒径、粒度分布、粒子形状、粒子密度、黏附性、表面带电等。 ② 设备类型: 混合机的类型、尺寸、内部结构（挡板、搅拌桨形状）、材质及表面情况等均会影响混合程度，应根据物料的性质选择适宜的混合器。 ③ 操作条件: 物料的充填率、装料方式、混合比、混合机的转动速度及混合时间等也会影响物料的混合均匀度，此外，温度和湿度也是影响混合效率的重要因素。 设备: ① 容器旋转型混合机: 回转式混合机 ② 容器固定型混合机: 搅拌槽式混合机","ok":true,"an":["容器旋转型混合机","容器固定型混合机","操作条件","物料性质","分布","粒子"]},{"id":"f14255d948","no":3,"q":"流化制粒","a":"\u003cdiv class=\"q-ln\"\u003e利用容器中自下而上的气流使粉末悬浮，呈流态化，再喷洒黏合剂溶液，使粉末凝结成颗粒，这种制粒方法叫作流化喷雾制粒法，简称为流化制粒或沸腾制粒。由于混合、成粒、干燥等工序可在一台设备中完成，该方法也称之为“一步制粒法”。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 采用流化床方法制备的颗粒多为柔软多孔性颗粒，密度轻，粒度分布均匀，流动性好，可压性好。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 除了物料和黏合剂的性质和用量外，操作条件对最终产品的性状影响较大，如热空气的进入量和空气湿度、喷雾速度和喷雾量等。\u003c/div\u003e","pt":"利用容器中自下而上的气流使粉末悬浮，呈流态化，再喷洒黏合剂溶液，使粉末凝结成颗粒，这种制粒方法叫作流化喷雾制粒法，简称为流化制粒或沸腾制粒。由于混合、成粒、干燥等工序可在一台设备中完成，该方法也称之为“一步制粒法”。 ① 采用流化床方法制备的颗粒多为柔软多孔性颗粒，密度轻，粒度分布均匀，流动性好，可压性好。 ② 除了物料和黏合剂的性质和用量外，操作条件对最终产品的性状影响较大，如热空气的进入量和空气湿度、喷雾速度和喷雾量等。","ok":true,"an":["操作条件","流动性好","分布","黏合剂","喷雾制粒","方法制备"]},{"id":"e214aefe34","no":4,"q":"喷雾干燥制粒","a":"\u003cdiv class=\"q-ln\"\u003e喷雾干燥制粒是将物料溶液或混悬液喷雾于干燥室内，在热气流的作用下使雾滴中的水分迅速蒸发，从而直接获得干燥细颗粒的方法。该法可在数秒中完成药液的浓缩与干燥，并能连续操作。如以干燥为目的时称为喷雾干燥，以制粒为目的称为喷雾制粒。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e喷雾干燥制粒的特点是：①由液体原料直接得到固体颗粒；②物料受热时间短，适合热敏感药物；③所制得多为中空球状粒子，流动性好、溶解性好。\u003c/div\u003e","pt":"喷雾干燥制粒是将物料溶液或混悬液喷雾于干燥室内，在热气流的作用下使雾滴中的水分迅速蒸发，从而直接获得干燥细颗粒的方法。该法可在数秒中完成药液的浓缩与干燥，并能连续操作。如以干燥为目的时称为喷雾干燥，以制粒为目的称为喷雾制粒。 喷雾干燥制粒的特点是：①由液体原料直接得到固体颗粒；②物料受热时间短，适合热敏感药物；③所制得多为中空球状粒子，流动性好、溶解性好。","ok":true,"an":["流动性好","喷雾制粒","热敏感","混悬液","粒子"]}],"count":4,"done":4},{"label":"第十章","questions":[{"id":"634d9e190e","no":1,"q":"solid preparations","a":"\u003cdiv class=\"q-ln\"\u003e固体制剂，是指以固体状态存在的剂型的总称。\u003c/div\u003e","pt":"固体制剂，是指以固体状态存在的剂型的总称。","ok":true,"an":["固体制剂"]},{"id":"a80d6c27de","no":2,"q":"powders","a":"\u003cdiv class=\"q-ln\"\u003e散剂，是指原料药与适宜的辅料经粉碎、过筛、混合制成的干燥粉末状固体制剂。\u003c/div\u003e","pt":"散剂，是指原料药与适宜的辅料经粉碎、过筛、混合制成的干燥粉末状固体制剂。","ok":true,"an":["固体制剂","指原料药"]},{"id":"46db870e89","no":3,"q":"倍散","a":"\u003cdiv class=\"q-ln\"\u003e小剂量的剧毒药与数倍量的稀释剂混合制成的散剂叫倍散。制备倍散时必须采用等量递增混合法。\u003c/div\u003e","pt":"小剂量的剧毒药与数倍量的稀释剂混合制成的散剂叫倍散。制备倍散时必须采用等量递增混合法。","ok":true,"an":["量递增混合法","散剂"]},{"id":"5eeaf857c8","no":4,"q":"等量递增混合","a":"\u003cdiv class=\"q-ln\"\u003e当各组分的混合比例较大时，应采用等量递增混合法（配研法），即先称取量小的组分，再加入等量的量大组分混匀，再加入与混合物等量的量大组分混匀，如此倍量增加直至量大组分全部加完为止。\u003c/div\u003e","pt":"当各组分的混合比例较大时，应采用等量递增混合法（配研法），即先称取量小的组分，再加入等量的量大组分混匀，再加入与混合物等量的量大组分混匀，如此倍量增加直至量大组分全部加完为止。","ok":true,"an":["量递增混合法","混合比"]},{"id":"22356c158c","no":5,"q":"颗粒剂 (granules)","a":"\u003cdiv class=\"q-ln\"\u003e是指原料药与适宜辅料经粉碎、过筛、混合制成的有一定粒度的干燥颗粒状固体制剂。\u003c/div\u003e","pt":"是指原料药与适宜辅料经粉碎、过筛、混合制成的有一定粒度的干燥颗粒状固体制剂。","ok":true,"an":["固体制剂","指原料药"]},{"id":"bcca9ec99d","no":6,"q":"tablets","a":"\u003cdiv class=\"q-ln\"\u003e是指原料药粉碎后与适宜辅料经混合、制粒、干燥、压片等工序制成的圆形或异形片状固体制剂。\u003c/div\u003e","pt":"是指原料药粉碎后与适宜辅料经混合、制粒、干燥、压片等工序制成的圆形或异形片状固体制剂。","ok":true,"an":["固体制剂","指原料药"]},{"id":"6c9dd72efb","no":7,"q":"capsules","a":"\u003cdiv class=\"q-ln\"\u003e是指原料药物与适宜辅料充填于空心胶囊或密封于软质囊材中制成的固体制剂。主要供口服使用，亦可用于植入、干粉吸入、直肠和阴道等。\u003c/div\u003e","pt":"是指原料药物与适宜辅料充填于空心胶囊或密封于软质囊材中制成的固体制剂。主要供口服使用，亦可用于植入、干粉吸入、直肠和阴道等。","ok":true,"an":["固体制剂","指原料药","口服"]},{"id":"c0bf04e9bb","no":8,"q":"dripping pills","a":"\u003cdiv class=\"q-ln\"\u003e滴丸剂，是指原料药和适宜的基质加热熔融混匀，滴入不相混溶、互不作用的冷凝介质中制成的球形或类球形固体制剂。\u003c/div\u003e","pt":"滴丸剂，是指原料药和适宜的基质加热熔融混匀，滴入不相混溶、互不作用的冷凝介质中制成的球形或类球形固体制剂。","ok":true,"an":["固体制剂","指原料药"]},{"id":"8bbb2c2aff","no":9,"q":"films","a":"\u003cdiv class=\"q-ln\"\u003e膜剂，是指原料药物与适宜的成膜材料经加工制成的膜状固体制剂。主要用于口服、口含、舌下、眼结膜囊和阴道，亦可用于皮肤和黏膜创伤、烧伤或炎症表面的覆盖等。\u003c/div\u003e","pt":"膜剂，是指原料药物与适宜的成膜材料经加工制成的膜状固体制剂。主要用于口服、口含、舌下、眼结膜囊和阴道，亦可用于皮肤和黏膜创伤、烧伤或炎症表面的覆盖等。","ok":true,"an":["固体制剂","指原料药","口服"]},{"id":"a58a87f513","no":10,"q":"根据Noyes-Whitney方程，用于改善药物溶出速度的措施有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e① 增加药物的溶出面积，如通过粉碎减小粒径、崩解等措施。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 增大溶出速率常数，如提高搅拌速度以减少药物扩散边界层厚度或提高药物的扩散系数。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 提高药物溶解度，如提高温度、改变晶型、制成分散物等。\u003c/div\u003e","pt":"① 增加药物的溶出面积，如通过粉碎减小粒径、崩解等措施。 ② 增大溶出速率常数，如提高搅拌速度以减少药物扩散边界层厚度或提高药物的扩散系数。 ③ 提高药物溶解度，如提高温度、改变晶型、制成分散物等。","ok":true,"an":["溶出面积"]},{"id":"e536303405","no":11,"q":"固体制剂的共同特点是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 大多数活性药物成分以固体形式存在，制成固体制剂，制备工艺相对简单，成本相对低廉。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 固体制剂相较于液体制剂，物理、化学、生物稳定性均较好。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 固体制剂包装、运输、贮存、携带、使用等均方便。\u003c/div\u003e","pt":"① 大多数活性药物成分以固体形式存在，制成固体制剂，制备工艺相对简单，成本相对低廉。 ② 固体制剂相较于液体制剂，物理、化学、生物稳定性均较好。 ③ 固体制剂包装、运输、贮存、携带、使用等均方便。","ok":true,"an":["液体制剂","稳定性"]},{"id":"30e939d874","no":12,"q":"散剂有哪些特点？","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 散剂粒径小，比表面积大，易分散，作用迅速。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 外用覆盖面积大，可同时发挥保护和收敛的作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 包装、运输、贮存、携带和使用方便。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 制备工艺简单，剂量易调节，便于婴幼儿服用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 比表面积增大，药物的嗅味、刺激性和药理活性等相应增加。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 挥发性成分易散失。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 腐蚀性较强或遇到光、湿、热等易变质的药物一般不宜制成散剂。\u003c/div\u003e","pt":"优点: ① 散剂粒径小，比表面积大，易分散，作用迅速。 ② 外用覆盖面积大，可同时发挥保护和收敛的作用。 ③ 包装、运输、贮存、携带和使用方便。 ④ 制备工艺简单，剂量易调节，便于婴幼儿服用。 缺点: ① 比表面积增大，药物的嗅味、刺激性和药理活性等相应增加。 ② 挥发性成分易散失。 ③ 腐蚀性较强或遇到光、湿、热等易变质的药物一般不宜制成散剂。","ok":true,"an":["药理活性","工艺简单","挥发性","刺激性","婴幼儿","表面积"]},{"id":"7116d214bd","no":13,"q":"片剂中主要的四大类辅料是什么，并各举一例。","a":"\u003cdiv class=\"q-ln\"\u003e① 填充剂与吸收剂: 淀粉、糊精、蔗糖、乳糖。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 润湿剂与黏合剂: 1.润湿剂: 蒸馏水、乙醇；2.黏合剂: 淀粉浆、纤维素衍生物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 崩解剂: 干淀粉、羧甲淀粉钠、交联聚维酮。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 润滑剂: 硬脂酸镁、滑石粉、聚乙二醇类。\u003c/div\u003e","pt":"① 填充剂与吸收剂: 淀粉、糊精、蔗糖、乳糖。 ② 润湿剂与黏合剂: 1.润湿剂: 蒸馏水、乙醇；2.黏合剂: 淀粉浆、纤维素衍生物。 ③ 崩解剂: 干淀粉、羧甲淀粉钠、交联聚维酮。 ④ 润滑剂: 硬脂酸镁、滑石粉、聚乙二醇类。","ok":true,"an":["润滑剂","润湿剂","崩解剂","硬脂酸镁","黏合剂","纤维素"]},{"id":"134fdfc54b","no":14,"q":"压片过程三要素是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 流动性好: 以保证物料在冲模内均匀填充，有效减少片重差异。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 压缩成形性好: 有效防止裂片、松片，获得致密而有一定强度的片剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 润滑性好: 有效避免黏冲，获得光洁的片剂。\u003c/div\u003e","pt":"① 流动性好: 以保证物料在冲模内均匀填充，有效减少片重差异。 ② 压缩成形性好: 有效防止裂片、松片，获得致密而有一定强度的片剂。 ③ 润滑性好: 有效避免黏冲，获得光洁的片剂。","ok":true,"an":["压缩成形性好","润滑性好","流动性好","裂片"]},{"id":"d3ea034a45","no":15,"q":"简述湿法制粒压片的工艺过程。","a":"\u003cdiv class=\"q-ln\"\u003e① 原辅料的前处理。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 混合。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 加入黏合剂制软材。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 挤压或其他方法制粒。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 湿颗粒的干燥。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 干颗粒的整粒。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑦ 加入崩解剂（外加）、润滑剂，总混。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑧ 压片。\u003c/div\u003e","pt":"① 原辅料的前处理。 ② 混合。 ③ 加入黏合剂制软材。 ④ 挤压或其他方法制粒。 ⑤ 湿颗粒的干燥。 ⑥ 干颗粒的整粒。 ⑦ 加入崩解剂（外加）、润滑剂，总混。 ⑧ 压片。","ok":true,"an":["润滑剂","崩解剂","原辅料","黏合剂"]},{"id":"f541f503a1","no":16,"q":"粉末直接压片的优点是什么？","a":"\u003cdiv class=\"q-ln\"\u003e① 相较于传统制粒方法，粉末直接压片法省去了制粒的步骤，因而具有生产效率高、成本低、工艺简单和省时节能的优点。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 特别适用于对湿、热敏感的药物。\u003c/div\u003e","pt":"① 相较于传统制粒方法，粉末直接压片法省去了制粒的步骤，因而具有生产效率高、成本低、工艺简单和省时节能的优点。 ② 特别适用于对湿、热敏感的药物。","ok":true,"an":["工艺简单","热敏感"]},{"id":"9b0385d4bc","no":17,"q":"影响片剂成形的因素包括那些？","a":"\u003cdiv class=\"q-ln\"\u003e① 物料的压缩特性\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药物的熔点及结晶形态\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 黏合剂与润滑剂\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 颗粒含有的水分或结晶水\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 压片压力和时间\u003c/div\u003e","pt":"① 物料的压缩特性 ② 药物的熔点及结晶形态 ③ 黏合剂与润滑剂 ④ 颗粒含有的水分或结晶水 ⑤ 压片压力和时间","ok":true,"an":["润滑剂","黏合剂","结晶水"]},{"id":"263347dc93","no":18,"q":"片剂压片中常见的问题及原因。","a":"\u003cdiv class=\"q-ln\"\u003e① 裂片: 处方因素包括：1.物料细粉太多，导致压缩时空气不能及时排出而结合力弱；2.物料的可压性差，结合力弱。工艺因素包括：1.单冲压片机比旋转压片机易出现裂片（压力分布不均匀）；2.快速压片比慢速压片易出现裂片（塑性变形不充分）；3.凸面片剂比平面片剂易出现裂片（应力集中）；4.一次压缩比二次压缩易出现裂片（塑性变形不充分）。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 松片: 1.片剂黏合力差；2.润湿剂或黏合剂选择不当；3.压片时压力不足或受压时间过短；4.物料流动性不佳使模孔中填料不足等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 黏冲: 1.API酸性强；2.颗粒干燥不彻底；3.物料易吸湿；4.润滑剂选用不当或用量不足；5.冲头表面锈蚀、粗糙不平或刻字太深等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 片重差异超限: 1.物料的流动性差；2.物料中细粉过多或粒度大小相差悬殊；3.料斗内的物料时多时少；4.刮粉器与模孔吻合性较差等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 崩解迟缓: 1.压缩力过大，片剂内部空隙小，影响水分渗入；2.可溶性成分溶解，堵塞毛细管，影响片剂的崩解；3.物料的可压性或黏合剂使片剂内部结合力过强；4.崩解剂吸水膨胀能力弱或对结合力的瓦解能力差等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 溶出超限: 1.片剂不崩解或崩解迟缓；2.片剂崩解后形成的颗粒过硬或过大；3.未崩解的片剂比表面积小；4.活性药物成分的溶解度低或溶出速率慢等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑦ 含量不均匀: 1.粉末混合不均匀；2.可溶性成分的迁移；3.片重差异超限等。\u003c/div\u003e","pt":"① 裂片: 处方因素包括：1.物料细粉太多，导致压缩时空气不能及时排出而结合力弱；2.物料的可压性差，结合力弱。工艺因素包括：1.单冲压片机比旋转压片机易出现裂片（压力分布不均匀）；2.快速压片比慢速压片易出现裂片（塑性变形不充分）；3.凸面片剂比平面片剂易出现裂片（应力集中）；4.一次压缩比二次压缩易出现裂片（塑性变形不充分）。 ② 松片: 1.片剂黏合力差；2.润湿剂或黏合剂选择不当；3.压片时压力不足或受压时间过短；4.物料流动性不佳使模孔中填料不足等。 ③ 黏冲: 1.API酸性强；2.颗粒干燥不彻底；3.物料易吸湿；4.润滑剂选用不当或用量不足；5.冲头表面锈蚀、粗糙不平或刻字太深等。 ④ 片重差异超限: 1.物料的流动性差；2.物料中细粉过多或粒度大小相差悬殊；3.料斗内的物料时多时少；4.刮粉器与模孔吻合性较差等。 ⑤ 崩解迟缓: 1.压缩力过大，片剂内部空隙小，影响水分渗入；2.可溶性成分溶解，堵塞毛细管，影响片剂的崩解；3.物料的可压性或黏合剂使片剂内部结合力过强；4.崩解剂吸水膨胀能力弱或对结合力的瓦解能力差等。 ⑥ 溶出超限: 1.片剂不崩解或崩解迟缓；2.片剂崩解后形成的颗粒过硬或过大；3.未崩解的片剂比表面积小；4.活性药物成分的溶解度低或溶出速率慢等。 ⑦ 含量不均匀: 1.粉末混合不均匀；2.可溶性成分的迁移；3.片重差异超限等。","ok":true,"an":["润滑剂","片重差异超限","润湿剂","崩解剂","含量不均匀","崩解迟缓"]},{"id":"a893af442a","no":19,"q":"试总结可以增加片剂中难溶性药物溶出度的方法。","a":"\u003cdiv class=\"q-ln\"\u003e① 药物经粉碎减小粒径，增大药物的溶出面积。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 加入优良的崩解剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 提高药物的溶解度——改变晶型，制成固体分散物或药物的包合物，加入表面活性剂等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 在处方中加入亲水性辅料如乳糖。\u003c/div\u003e","pt":"① 药物经粉碎减小粒径，增大药物的溶出面积。 ② 加入优良的崩解剂。 ③ 提高药物的溶解度——改变晶型，制成固体分散物或药物的包合物，加入表面活性剂等。 ④ 在处方中加入亲水性辅料如乳糖。","ok":true,"an":["崩解剂","表面活性剂","溶出面积","亲水性"]},{"id":"76aa16c8b3","no":20,"q":"薄膜包衣与糖衣比较，有何优点？","a":"\u003cdiv class=\"q-ln\"\u003e① 工艺简单，工时短，生产成本较低。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 片增重小，仅增加2%\\~4%。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 对崩解及药物溶出的不良影响较糖衣小。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 可以实现药物的缓控释。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 具有良好的防潮性能。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 压在片芯上的标识，例如片剂名称、剂量等在包薄膜衣后仍清晰可见。\u003c/div\u003e","pt":"① 工艺简单，工时短，生产成本较低。 ② 片增重小，仅增加2%\\~4%。 ③ 对崩解及药物溶出的不良影响较糖衣小。 ④ 可以实现药物的缓控释。 ⑤ 具有良好的防潮性能。 ⑥ 压在片芯上的标识，例如片剂名称、剂量等在包薄膜衣后仍清晰可见。","ok":true,"an":["工艺简单","缓控释"]},{"id":"416524140e","no":21,"q":"胶囊剂有哪些特点？哪些药物不宜制成胶囊剂，并说明理由。","a":"\u003cdiv class=\"q-ln\"\u003e胶囊剂的优点包括:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 掩盖药物的苦味和不良臭味，减少药物的刺激性，增加患者顺应性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 对不稳定药物具有一定程度的掩蔽、保护和稳定作用，提高药物稳定性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 可使液态药物固体剂型化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 药物以粉末或颗粒状态存在，在胃肠道中分散快、吸收好，提高药物生物利用度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 可延缓或定位释放药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 胶囊表面可着色或印字，便于识别且外表美观。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e胶囊剂的缺点包括:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 生产成本相对较高。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 特殊群体如婴幼儿、老年患者和昏迷患者等口服用药困难。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e不宜制成胶囊剂的药物:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 以明胶为主要囊材的胶囊其囊芯物不宜为水溶液或稀乙醇溶液，以防囊壁溶化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 易风化失去结晶水的药物不宜制成胶囊剂，以防囊材软化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 易潮解而吸水的药物不宜制成胶囊剂，以防囊壁干燥脆裂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 易溶且有刺激性的药物不宜制成胶囊剂，以防在胃肠道溶解后因局部浓度过高而刺激胃肠道黏膜。\u003c/div\u003e","pt":"胶囊剂的优点包括: ① 掩盖药物的苦味和不良臭味，减少药物的刺激性，增加患者顺应性。 ② 对不稳定药物具有一定程度的掩蔽、保护和稳定作用，提高药物稳定性。 ③ 可使液态药物固体剂型化。 ④ 药物以粉末或颗粒状态存在，在胃肠道中分散快、吸收好，提高药物生物利用度。 ⑤ 可延缓或定位释放药物。 ⑥ 胶囊表面可着色或印字，便于识别且外表美观。 胶囊剂的缺点包括: ① 生产成本相对较高。 ② 特殊群体如婴幼儿、老年患者和昏迷患者等口服用药困难。 不宜制成胶囊剂的药物: ① 以明胶为主要囊材的胶囊其囊芯物不宜为水溶液或稀乙醇溶液，以防囊壁溶化。 ② 易风化失去结晶水的药物不宜制成胶囊剂，以防囊材软化。 ③ 易潮解而吸水的药物不宜制成胶囊剂，以防囊壁干燥脆裂。 ④ 易溶且有刺激性的药物不宜制成胶囊剂，以防在胃肠道溶解后因局部浓度过高而刺激胃肠道黏膜。","ok":true,"an":["提高药物稳定性","胃肠道","口服","顺应性","刺激性","定位释放"]},{"id":"3dc54b8146","no":22,"q":"胶囊剂的分类，并简述其定义。","a":"\u003cdiv class=\"q-ln\"\u003e依据胶囊剂的溶解与释放特性，可分为硬胶囊剂（通称胶囊）、软胶囊剂（胶丸）、缓释胶囊剂、控释胶囊剂和肠溶胶囊剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e各类胶囊定义如下:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 硬胶囊剂: 系指采用适宜的制剂技术，将原料药物加适宜辅料制成的均匀粉末、颗粒、小片、小丸、半固体或液体等，充填于空胶囊中的胶囊剂，如阿莫西林胶囊。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 软胶囊剂: 系指将一定量的液体原料药物直接密封，或将固体原料药物溶解或分散在适宜的辅料中制备成溶液、混悬液、乳状液或半固体，密封于软质囊材中的胶囊剂，如维生素 E 软胶囊。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 缓释胶囊剂: 系指在规定的释放介质中缓慢地非恒速释放药物的胶囊剂，如布洛芬缓释胶囊。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 控释胶囊剂: 系指在规定的释放介质中缓慢地恒速释放药物的胶囊剂，如吲哚美辛控释胶囊。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 肠溶胶囊剂: 系指用肠溶材料包衣的颗粒或小丸充填于胶囊而制成的硬胶囊，或用适宜的肠溶材料制备而得的硬胶囊或软胶囊。肠溶胶囊不溶于胃液，但能在肠液中崩解而释放活性成分，如奥美拉唑肠溶胶囊等。\u003c/div\u003e","pt":"依据胶囊剂的溶解与释放特性，可分为硬胶囊剂（通称胶囊）、软胶囊剂（胶丸）、缓释胶囊剂、控释胶囊剂和肠溶胶囊剂。 各类胶囊定义如下: ① 硬胶囊剂: 系指采用适宜的制剂技术，将原料药物加适宜辅料制成的均匀粉末、颗粒、小片、小丸、半固体或液体等，充填于空胶囊中的胶囊剂，如阿莫西林胶囊。 ② 软胶囊剂: 系指将一定量的液体原料药物直接密封，或将固体原料药物溶解或分散在适宜的辅料中制备成溶液、混悬液、乳状液或半固体，密封于软质囊材中的胶囊剂，如维生素 E 软胶囊。 ③ 缓释胶囊剂: 系指在规定的释放介质中缓慢地非恒速释放药物的胶囊剂，如布洛芬缓释胶囊。 ④ 控释胶囊剂: 系指在规定的释放介质中缓慢地恒速释放药物的胶囊剂，如吲哚美辛控释胶囊。 ⑤ 肠溶胶囊剂: 系指用肠溶材料包衣的颗粒或小丸充填于胶囊而制成的硬胶囊，或用适宜的肠溶材料制备而得的硬胶囊或软胶囊。肠溶胶囊不溶于胃液，但能在肠液中崩解而释放活性成分，如奥美拉唑肠溶胶囊等。","ok":true,"an":["缓释胶囊剂","控释胶囊剂","肠溶胶囊剂","硬胶囊剂","软胶囊剂","奥美拉唑"]},{"id":"472efb8c21","no":23,"q":"理想的膜剂成膜材料应具备哪些条件？写出常用的成膜材料。","a":"\u003cdiv class=\"q-ln\"\u003e理想的膜剂成膜材料应符合下列条件:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 生理惰性，无毒，无刺激，无臭味。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 性能稳定，不与主药作用，不干扰含量测定。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 成膜、脱膜性能好，有足够的强度和柔韧性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 口服、腔道等成膜材料应有良好的水溶性，可降解、吸收或排出体外；外用膜剂的成膜材料应能迅速、完全释放药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 来源丰富，价廉易得。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e常用的成膜材料有:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 天然高分子材料，如明胶、琼脂、淀粉、糊精、阿拉伯胶等。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 合成高分子材料，如聚乙烯醇，乙烯-醋酸乙烯共聚物，羟丙纤维素等。\u003c/div\u003e","pt":"理想的膜剂成膜材料应符合下列条件: ① 生理惰性，无毒，无刺激，无臭味。 ② 性能稳定，不与主药作用，不干扰含量测定。 ③ 成膜、脱膜性能好，有足够的强度和柔韧性。 ④ 口服、腔道等成膜材料应有良好的水溶性，可降解、吸收或排出体外；外用膜剂的成膜材料应能迅速、完全释放药物。 ⑤ 来源丰富，价廉易得。 常用的成膜材料有: ① 天然高分子材料，如明胶、琼脂、淀粉、糊精、阿拉伯胶等。 ② 合成高分子材料，如聚乙烯醇，乙烯-醋酸乙烯共聚物，羟丙纤维素等。","ok":true,"an":["口服","纤维素","阿拉伯胶","含量测定","水溶性","烯醇"]}],"count":23,"done":23},{"label":"第十一章","questions":[{"id":"8a73f75ce3","no":1,"q":"软膏剂 (ointments)","a":"\u003cdiv class=\"q-ln\"\u003e是指原料药物与油脂性或水溶性基质混合制成的均匀的半固体外用制剂。根据药物在基质中的分散状态不同，软膏剂可分为溶液型软膏剂和混悬型软膏剂。\u003c/div\u003e","pt":"是指原料药物与油脂性或水溶性基质混合制成的均匀的半固体外用制剂。根据药物在基质中的分散状态不同，软膏剂可分为溶液型软膏剂和混悬型软膏剂。","ok":true,"an":["混悬型软膏","溶液型软膏"]},{"id":"479ae98e34","no":2,"q":"乳膏剂 (creams)","a":"\u003cdiv class=\"q-ln\"\u003e药物溶解或分散于乳剂型基质中形成的均匀的半固体外用制剂，根据基质的不同，分为水包油型乳膏剂和油包水型乳膏剂。\u003c/div\u003e","pt":"药物溶解或分散于乳剂型基质中形成的均匀的半固体外用制剂，根据基质的不同，分为水包油型乳膏剂和油包水型乳膏剂。","ok":true,"an":["乳剂"]},{"id":"1d486f5c50","no":3,"q":"transdermal drug delivery system","a":"\u003cdiv class=\"q-ln\"\u003e经皮给药系统，是指药物以一定速率透过皮肤经毛细血管吸收进入体循环的一类制剂。\u003c/div\u003e","pt":"经皮给药系统，是指药物以一定速率透过皮肤经毛细血管吸收进入体循环的一类制剂。","ok":true,"an":["吸收进入体循环"]},{"id":"e9d500ad3b","no":4,"q":"经皮递药系统（TDDS）的特点。","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 直接作用于靶部位发挥药效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 避免肝脏首过效应和胃肠因素的干扰。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 避免药物对胃肠道的副作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 长时间维持恒定的血药浓度，避免峰谷现象，降低药物毒副作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 减少给药次数，而且患者可以自主用药，特别适合于婴幼儿、老年人及不宜口服给药的患者，提高患者的用药依从性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 发现副作用可以及时中断给药。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 不适合剂量大或对皮肤产生刺激性的药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 由于起效较慢，不适合要求快速起效的药物。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 药物吸收的个体差异和给药部位的差异较大等。\u003c/div\u003e","pt":"优点: ① 直接作用于靶部位发挥药效。 ② 避免肝脏首过效应和胃肠因素的干扰。 ③ 避免药物对胃肠道的副作用。 ④ 长时间维持恒定的血药浓度，避免峰谷现象，降低药物毒副作用。 ⑤ 减少给药次数，而且患者可以自主用药，特别适合于婴幼儿、老年人及不宜口服给药的患者，提高患者的用药依从性。 ⑥ 发现副作用可以及时中断给药。 缺点: ① 不适合剂量大或对皮肤产生刺激性的药物。 ② 由于起效较慢，不适合要求快速起效的药物。 ③ 药物吸收的个体差异和给药部位的差异较大等。","ok":true,"an":["避免峰谷现象","胃肠道","首过效应","口服给药","依从性","个体差异"]},{"id":"643da8b720","no":5,"q":"药物经皮吸收的促进方法。","a":"\u003cdiv class=\"q-ln\"\u003e化学方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 透皮吸收促进剂: 月桂氮䓬酮、油酸\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 离子对\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e物理方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 离子导入\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 微针\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e药剂学方法:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e借助微米或纳米药物载体，包括微乳、脂质体、传递体、醇脂体、囊泡、纳米粒等，以改善药物透过皮肤的能力。\u003c/div\u003e","pt":"化学方法: ① 透皮吸收促进剂: 月桂氮䓬酮、油酸 ② 离子对 物理方法: ① 离子导入 ② 微针 药剂学方法: 借助微米或纳米药物载体，包括微乳、脂质体、传递体、醇脂体、囊泡、纳米粒等，以改善药物透过皮肤的能力。","ok":true,"an":["透皮吸收促进剂","脂质体","透过皮肤","化学方法"]},{"id":"f8b81ca4a9","no":6,"q":"药物经皮吸收的途径？","a":"\u003cdiv class=\"q-ln\"\u003e① 经表皮途径: 是指药物透过表皮角质层进入活性表皮，扩散至真皮被毛细血管吸收进入体循环的途径。此途径是药物经皮吸收的主要途径。经表皮途径又分为细胞途径和细胞间质途径，前者系指药物穿过角质细胞达到活性表皮，而后者系指药物通过角质细胞间类脂双分子层到活性表皮。由于药物通过细胞途径时经多次亲水/亲脂环境的分配过程，所以药物的跨细胞途径占极小的一部分。药物分子主要通过细胞间质途径进入活性表皮，继而吸收进入体循环。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 经附属器途径: 药物通过毛囊、皮脂腺和汗腺吸收。药物通过附属器的渗透速度比经表皮途径快，但皮肤附属器仅占角质层面积的1%左右，因此该途径不是药物经皮吸收的主要途径。对于一些离子型药物或极性较强的药物，由于难以通过富含类脂的角质层，因此经皮肤附属器途径就成为其透过皮肤的主要途径。\u003c/div\u003e","pt":"① 经表皮途径: 是指药物透过表皮角质层进入活性表皮，扩散至真皮被毛细血管吸收进入体循环的途径。此途径是药物经皮吸收的主要途径。经表皮途径又分为细胞途径和细胞间质途径，前者系指药物穿过角质细胞达到活性表皮，而后者系指药物通过角质细胞间类脂双分子层到活性表皮。由于药物通过细胞途径时经多次亲水/亲脂环境的分配过程，所以药物的跨细胞途径占极小的一部分。药物分子主要通过细胞间质途径进入活性表皮，继而吸收进入体循环。 ② 经附属器途径: 药物通过毛囊、皮脂腺和汗腺吸收。药物通过附属器的渗透速度比经表皮途径快，但皮肤附属器仅占角质层面积的1%左右，因此该途径不是药物经皮吸收的主要途径。对于一些离子型药物或极性较强的药物，由于难以通过富含类脂的角质层，因此经皮肤附属器途径就成为其透过皮肤的主要途径。","ok":true,"an":["经附属器途径","经表皮途径","吸收进入体循环","透过皮肤","毛细血管"]},{"id":"e48cf67c69","no":7,"q":"简述软膏剂的处方组成和分类。","a":"\u003cdiv class=\"q-ln\"\u003e软膏剂由药物、基质和附加剂组成。软膏剂的分类：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 按基质类型分：油脂性基质软膏、乳状型基质软膏和水溶性基质软膏。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 按分散系统分：溶液型软膏、混悬型软膏和乳状型软膏。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 按作用不同分：局部作用软膏和全身作用软膏。\u003c/div\u003e","pt":"软膏剂由药物、基质和附加剂组成。软膏剂的分类： ① 按基质类型分：油脂性基质软膏、乳状型基质软膏和水溶性基质软膏。 ② 按分散系统分：溶液型软膏、混悬型软膏和乳状型软膏。 ③ 按作用不同分：局部作用软膏和全身作用软膏。","ok":true,"an":["按基质类型分","按作用不同分","按分散系统分"]}],"count":7,"done":7},{"label":"第十二章","questions":[{"id":"bb578d7a4b","no":1,"q":"aerosol","a":"\u003cdiv class=\"q-ln\"\u003e气雾剂，是指原料药物和附加剂与适宜的抛射剂共同封装与具有特制阀门系统的耐压容器中，使用时借助抛射剂的压力将内容物呈雾状喷出，用于肺部吸入或直接喷至腔道黏膜、皮肤的制剂。\u003c/div\u003e","pt":"气雾剂，是指原料药物和附加剂与适宜的抛射剂共同封装与具有特制阀门系统的耐压容器中，使用时借助抛射剂的压力将内容物呈雾状喷出，用于肺部吸入或直接喷至腔道黏膜、皮肤的制剂。","ok":true,"an":["阀门系统","指原料药","抛射剂","气雾剂"]},{"id":"eeaff71bb7","no":2,"q":"spray","a":"\u003cdiv class=\"q-ln\"\u003e喷雾剂，是指原料药物或与适宜辅料填充于特制的装置中，使用时借助手动泵的压力、高压气体、超声振动或其他方法将内容物呈雾状物释出，用于肺部吸入或直接喷至腔道黏膜、皮肤等的制剂。\u003c/div\u003e","pt":"喷雾剂，是指原料药物或与适宜辅料填充于特制的装置中，使用时借助手动泵的压力、高压气体、超声振动或其他方法将内容物呈雾状物释出，用于肺部吸入或直接喷至腔道黏膜、皮肤等的制剂。","ok":true,"an":["指原料药","气体"]},{"id":"1a9860164b","no":3,"q":"propellants","a":"\u003cdiv class=\"q-ln\"\u003e抛射剂，是气雾剂的动力系统，是喷射压力的来源，同时可兼作药物的溶剂或稀释剂。是在高压下液化的液体，当阀门开启时，外部压力突然降低，抛射剂带着药物以雾状喷射，并急剧汽化，同时将药物分散成微粒。\u003c/div\u003e","pt":"抛射剂，是气雾剂的动力系统，是喷射压力的来源，同时可兼作药物的溶剂或稀释剂。是在高压下液化的液体，当阀门开启时，外部压力突然降低，抛射剂带着药物以雾状喷射，并急剧汽化，同时将药物分散成微粒。","ok":true,"an":["抛射剂","气雾剂","稀释剂"]},{"id":"46d68fa507","no":4,"q":"suppository","a":"\u003cdiv class=\"q-ln\"\u003e栓剂，是指原料药物于适宜基质制成的供腔道给药的固体制剂。因施用的腔道不同可分为直肠栓、阴道栓和尿道栓。直肠栓为鱼雷形、圆锥形或圆柱形等，阴道栓为鸭嘴形、球形或卵形等，阴道栓可分为普通栓和膨胀栓。\u003c/div\u003e","pt":"栓剂，是指原料药物于适宜基质制成的供腔道给药的固体制剂。因施用的腔道不同可分为直肠栓、阴道栓和尿道栓。直肠栓为鱼雷形、圆锥形或圆柱形等，阴道栓为鸭嘴形、球形或卵形等，阴道栓可分为普通栓和膨胀栓。","ok":true,"an":["固体制剂","指原料药","栓剂"]},{"id":"4bd40a3599","no":5,"q":"试述气雾剂的组成及优点有哪些？","a":"\u003cdiv class=\"q-ln\"\u003e组成: 抛射剂、药物和附加剂、耐压容器、阀门系统。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 具有速效和定位作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 药物密闭于容器内可增加药物的稳定性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 使用方便，一揿即可。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 可避免药物在胃肠道中的破坏和肝首过效应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 可以用定量阀门准确控制剂量。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 外用气雾剂使用时对创面的机械刺激性小。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 生产成本较高。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 抛射剂高度挥发具有制冷效应，可引起不适与刺激。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 遇热和受撞击后易发生爆炸。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 抛射剂的渗漏可导致失效。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 吸入气雾剂给药时存在手钦与吸气协调问题，直接影响到达有效部位的药量，尤其是对老年人或儿童患者的影响更为显著。\u003c/div\u003e","pt":"组成: 抛射剂、药物和附加剂、耐压容器、阀门系统。 优点: ① 具有速效和定位作用。 ② 药物密闭于容器内可增加药物的稳定性。 ③ 使用方便，一揿即可。 ④ 可避免药物在胃肠道中的破坏和肝首过效应。 ⑤ 可以用定量阀门准确控制剂量。 ⑥ 外用气雾剂使用时对创面的机械刺激性小。 缺点: ① 生产成本较高。 ② 抛射剂高度挥发具有制冷效应，可引起不适与刺激。 ③ 遇热和受撞击后易发生爆炸。 ④ 抛射剂的渗漏可导致失效。 ⑤ 吸入气雾剂给药时存在手钦与吸气协调问题，直接影响到达有效部位的药量，尤其是对老年人或儿童患者的影响更为显著。","ok":true,"an":["胃肠道","阀门系统","首过效应","抛射剂","附加剂","耐压容器"]},{"id":"da89dc35c0","no":6,"q":"气雾剂按分散系统分为哪几类？","a":"\u003cdiv class=\"q-ln\"\u003e可分为溶液型、混悬型、乳剂型三类。\u003c/div\u003e","pt":"可分为溶液型、混悬型、乳剂型三类。","ok":true,"an":["乳剂"]},{"id":"3740976eab","no":7,"q":"吸入气雾剂肺部吸收的主要特点是什么？为什么？","a":"\u003cdiv class=\"q-ln\"\u003e优点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 肺部吸收面积大，总面积可达70\\~100㎡。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 肺泡表皮薄，肺泡壁或肺泡隔内有丰富的毛细血管，肺泡与周围的毛细血管衔接紧密，因此，药物可通过肺泡快速吸收直接进入血液循环，避免了肝脏的首过效应，可以提高药物的生物利用度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 肺部的化学降解和酶降解反应较低，药物被破坏的程度小。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 药物可直接到达靶部位，因此可降低给药剂量及毒副反应，这对于需要局部长期治疗的疾病极其重要。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 药物在肺部沉积重现性差。因肺部不同部位上皮细胞的厚度不同，沉积在不同部位的药物可能会出现吸收速度的差异。\u003c/div\u003e","pt":"优点: ① 肺部吸收面积大，总面积可达70\\~100㎡。 ② 肺泡表皮薄，肺泡壁或肺泡隔内有丰富的毛细血管，肺泡与周围的毛细血管衔接紧密，因此，药物可通过肺泡快速吸收直接进入血液循环，避免了肝脏的首过效应，可以提高药物的生物利用度。 ③ 肺部的化学降解和酶降解反应较低，药物被破坏的程度小。 ④ 药物可直接到达靶部位，因此可降低给药剂量及毒副反应，这对于需要局部长期治疗的疾病极其重要。 缺点: ① 药物在肺部沉积重现性差。因肺部不同部位上皮细胞的厚度不同，沉积在不同部位的药物可能会出现吸收速度的差异。","ok":true,"an":["首过效应","毒副反应","重现性","毛细血管","化学降解","同部位"]},{"id":"d66fbec527","no":8,"q":"抛射剂应具备哪些特点？","a":"\u003cdiv class=\"q-ln\"\u003e① 在常温下饱和蒸气压高于大气压。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 无毒、无致敏反应和刺激性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 惰性，不与药物等发生反应。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 不易燃、不易爆炸。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 无色、无臭、无味。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 廉价易得。\u003c/div\u003e","pt":"① 在常温下饱和蒸气压高于大气压。 ② 无毒、无致敏反应和刺激性。 ③ 惰性，不与药物等发生反应。 ④ 不易燃、不易爆炸。 ⑤ 无色、无臭、无味。 ⑥ 廉价易得。","ok":true,"an":["发生反应","刺激性","惰性","蒸气压"]},{"id":"4f581ba547","no":9,"q":"与口服制剂比较说明全身作用栓剂的意义。","a":"\u003cdiv class=\"q-ln\"\u003e与口服制剂相比，全身作用栓剂的特点是:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 药物不受胃肠道pH或酶的破坏而失活。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 避免药物对胃肠道的刺激。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 应用于距肛门口2cm处，药物通过直肠下静脉和肛门静脉进入体循环，避免肝脏首过效应，提高药物的生物利用度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 给药方便，适用于不能口服或不愿口服的病人。\u003c/div\u003e","pt":"与口服制剂相比，全身作用栓剂的特点是: ① 药物不受胃肠道pH或酶的破坏而失活。 ② 避免药物对胃肠道的刺激。 ③ 应用于距肛门口2cm处，药物通过直肠下静脉和肛门静脉进入体循环，避免肝脏首过效应，提高药物的生物利用度。 ④ 给药方便，适用于不能口服或不愿口服的病人。","ok":true,"an":["胃肠道","首过效应"]},{"id":"8c2b4a01a8","no":10,"q":"分析影响栓剂中药物在直肠部位吸收的因素。","a":"\u003cdiv class=\"q-ln\"\u003e影响药物吸收的因素包括:\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 基质的种类：药物从基质中释放常常是药物吸收的限速过程。选择与药物溶解性相反的基质，有利于药物的释放与吸收。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 基质的老化：导致药物吸收发生改变。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 栓剂的种类：某些中空栓填充药物可起速效作用。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 表面活性剂和吸收促进剂：添加适宜的表面活性剂和吸收促进剂，促进药物释放与吸收。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 生理因素：给药部位，直肠内分泌液的pH，粪便。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 药物的理化性质因素：药物的溶解度，脂溶性和解离度。\u003c/div\u003e","pt":"影响药物吸收的因素包括: ① 基质的种类：药物从基质中释放常常是药物吸收的限速过程。选择与药物溶解性相反的基质，有利于药物的释放与吸收。 ② 基质的老化：导致药物吸收发生改变。 ③ 栓剂的种类：某些中空栓填充药物可起速效作用。 ④ 表面活性剂和吸收促进剂：添加适宜的表面活性剂和吸收促进剂，促进药物释放与吸收。 ⑤ 生理因素：给药部位，直肠内分泌液的pH，粪便。 ⑥ 药物的理化性质因素：药物的溶解度，脂溶性和解离度。","ok":true,"an":["理化性质","吸收促进剂","表面活性剂","脂溶性"]},{"id":"d9e4efb1fa","no":11,"q":"置换价的定义","a":"\u003cdiv class=\"q-ln\"\u003e药物在栓剂基质中占有一定的体积，药物的重量与相同体积的基质重量之比称为置换价。\u003c/div\u003e","pt":"药物在栓剂基质中占有一定的体积，药物的重量与相同体积的基质重量之比称为置换价。","ok":true,"an":["栓剂"]}],"count":11,"done":11},{"label":"第十三章","questions":[{"id":"3544da4962","no":1,"q":"固体分散体 (solid dispersion)","a":"\u003cdiv class=\"q-ln\"\u003e是利用一定的方法（熔融法、溶剂法、溶剂-熔融法），将难溶性药物高度分散于固体分散材料中所形成的固体分散物。将药物高度均匀分散于固体载体的技术叫做固体分散技术。\u003c/div\u003e","pt":"是利用一定的方法（熔融法、溶剂法、溶剂-熔融法），将难溶性药物高度分散于固体分散材料中所形成的固体分散物。将药物高度均匀分散于固体载体的技术叫做固体分散技术。","ok":true,"an":["难溶性"]},{"id":"b4d5b9fc80","no":2,"q":"简述固体分散体如何调整药物的溶出特性。","a":"\u003cdiv class=\"q-ln\"\u003e① 以水溶性高分子材料为载体的固体分散体可增加难溶性药物溶解度和溶出速度，促进药物的吸收，提高生物利用度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 以难溶性高分子材料为载体的固体分散体，可延缓和控制水溶性药物的溶出和吸收，用于制备缓、控释制剂。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 以肠溶性材料为载体，可制备肠道定位释放而吸收的制剂。\u003c/div\u003e","pt":"① 以水溶性高分子材料为载体的固体分散体可增加难溶性药物溶解度和溶出速度，促进药物的吸收，提高生物利用度。 ② 以难溶性高分子材料为载体的固体分散体，可延缓和控制水溶性药物的溶出和吸收，用于制备缓、控释制剂。 ③ 以肠溶性材料为载体，可制备肠道定位释放而吸收的制剂。","ok":true,"an":["控释制剂","难溶性","定位释放","水溶性"]},{"id":"602cde3c2a","no":3,"q":"简述固体分散体的速效原理。","a":"\u003cdiv class=\"q-ln\"\u003e① 药物的高度分散状态：药物以分子状态、胶体状态、亚稳定态、微晶态以及无定形态在载体材料中存在，载体材料可阻止已分散的药物再聚集粗化，有利于药物溶出。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 载体材料对药物溶出的促进作用，包括: 1.载体材料提高药物的可润湿性；2.载体材料保证药物的高度分散性；3.载体材料对药物有抑晶作用。\u003c/div\u003e","pt":"① 药物的高度分散状态：药物以分子状态、胶体状态、亚稳定态、微晶态以及无定形态在载体材料中存在，载体材料可阻止已分散的药物再聚集粗化，有利于药物溶出。 ② 载体材料对药物溶出的促进作用，包括: 1.载体材料提高药物的可润湿性；2.载体材料保证药物的高度分散性；3.载体材料对药物有抑晶作用。","ok":true,"an":["载体材料","分散状态"]},{"id":"6020465241","no":4,"q":"inclusion compound","a":"\u003cdiv class=\"q-ln\"\u003e包合物，是指将一种分子全部或部分包含于另一种分子的空穴结构内形成的特殊复合物。这种包合物由主分子和客分子组成，主分子是包合材料，具空穴结构，足以将客分子容纳在内。\u003c/div\u003e","pt":"包合物，是指将一种分子全部或部分包含于另一种分子的空穴结构内形成的特殊复合物。这种包合物由主分子和客分子组成，主分子是包合材料，具空穴结构，足以将客分子容纳在内。","ok":true,"an":["组成"]},{"id":"8fba933729","no":5,"q":"简述包合物有哪些特点。","a":"\u003cdiv class=\"q-ln\"\u003e增加药物的生物利用度、提高药物的稳定性、调节释药速率、掩盖不良臭味、降低刺激性、液态药物粉末化。\u003c/div\u003e","pt":"增加药物的生物利用度、提高药物的稳定性、调节释药速率、掩盖不良臭味、降低刺激性、液态药物粉末化。","ok":true,"an":["刺激性","稳定性","良臭味"]},{"id":"1d3e91e3b4","no":6,"q":"β-环糊精在药剂学上有何应用？","a":"\u003cdiv class=\"q-ln\"\u003e① 增加难溶性药物溶解度\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 提高药物的稳定性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 液体药物粉末化。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 防止挥发性成分挥散。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑤ 掩盖药物不良臭味。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑥ 调节药物释放速率。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑦ 提高药物的生物利用度。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e⑧ 降低药物的刺激性与毒副作用。\u003c/div\u003e","pt":"① 增加难溶性药物溶解度 ② 提高药物的稳定性。 ③ 液体药物粉末化。 ④ 防止挥发性成分挥散。 ⑤ 掩盖药物不良臭味。 ⑥ 调节药物释放速率。 ⑦ 提高药物的生物利用度。 ⑧ 降低药物的刺激性与毒副作用。","ok":true,"an":["难溶性","挥发性","刺激性","稳定性","良臭味"]}],"count":6,"done":6},{"label":"第十四章","questions":[{"id":"2f49ec2232","no":1,"q":"Sustained-release preparations","a":"\u003cdiv class=\"q-ln\"\u003e缓释制剂，是指在规定的释放介质中，按要求缓慢地非恒速释放药物，与相应的普通制剂比较，给药频率比普通制剂减少一半或有所减少，且能显著增加患者依从性的制剂。\u003c/div\u003e","pt":"缓释制剂，是指在规定的释放介质中，按要求缓慢地非恒速释放药物，与相应的普通制剂比较，给药频率比普通制剂减少一半或有所减少，且能显著增加患者依从性的制剂。","ok":true,"an":["普通制剂比较","缓释制剂","依从性"]},{"id":"e31ee04a4b","no":2,"q":"Controlled-release preparations","a":"\u003cdiv class=\"q-ln\"\u003e控释制剂，是指在规定的释放介质中，按要求缓慢地恒速释放药物，与相应的普通制剂比较，给药频率比普通制剂减少一半或有所减少，血药浓度比缓释制剂更加平稳，且能显著增加患者依从性的制剂。\u003c/div\u003e","pt":"控释制剂，是指在规定的释放介质中，按要求缓慢地恒速释放药物，与相应的普通制剂比较，给药频率比普通制剂减少一半或有所减少，血药浓度比缓释制剂更加平稳，且能显著增加患者依从性的制剂。","ok":true,"an":["普通制剂比较","缓释制剂","控释制剂"]},{"id":"5710dc9c30","no":3,"q":"Delayed-release preparations","a":"\u003cdiv class=\"q-ln\"\u003e迟释制剂，是指在给药后不立即释放药物但经过一个时滞后释放药物的制剂，包括肠溶制剂、结肠定位制剂和脉冲制剂等。\u003c/div\u003e","pt":"迟释制剂，是指在给药后不立即释放药物但经过一个时滞后释放药物的制剂，包括肠溶制剂、结肠定位制剂和脉冲制剂等。","ok":true,"an":["迟释制剂"]},{"id":"2cc61b0744","no":4,"q":"脉冲制剂","a":"\u003cdiv class=\"q-ln\"\u003e是指不立即释放药物，而在某种条件下（如在体液中经过一定时间或一定pH值或某些酶作用下）一次或多次突然释放药物的制剂。\u003c/div\u003e","pt":"是指不立即释放药物，而在某种条件下（如在体液中经过一定时间或一定pH值或某些酶作用下）一次或多次突然释放药物的制剂。","ok":true,"an":[]},{"id":"ed608c7858","no":5,"q":"Oral chronopharmacologic drug delivery system","a":"\u003cdiv class=\"q-ln\"\u003e口服择时释药系统，根据人体的生物节律变化，按照生理和治疗的需要而定时定量释药的一种新型给药系统。\u003c/div\u003e","pt":"口服择时释药系统，根据人体的生物节律变化，按照生理和治疗的需要而定时定量释药的一种新型给药系统。","ok":true,"an":["口服"]},{"id":"c083cdca9f","no":6,"q":"Oral site-specific drug delivery system","a":"\u003cdiv class=\"q-ln\"\u003e口服定位释药系统，是指口服后能将药物选择性地输送到胃肠道某一特定部位，以速释或缓控释药物的剂型。\u003c/div\u003e","pt":"口服定位释药系统，是指口服后能将药物选择性地输送到胃肠道某一特定部位，以速释或缓控释药物的剂型。","ok":true,"an":["胃肠道","定位释药","口服"]},{"id":"d4f9035be1","no":7,"q":"OCDDS","a":"\u003cdiv class=\"q-ln\"\u003e口服结肠定位给药系统，是指用适当方法，使药物避免在胃、十二指肠、空肠和回肠前端释放，运送到人体回盲部后释放而发挥局部或全身治疗作用的一种给药系统，是一种定位在结肠释药的制剂。\u003c/div\u003e","pt":"口服结肠定位给药系统，是指用适当方法，使药物避免在胃、十二指肠、空肠和回肠前端释放，运送到人体回盲部后释放而发挥局部或全身治疗作用的一种给药系统，是一种定位在结肠释药的制剂。","ok":true,"an":["回肠前端释放","定位给药","口服","适当方法"]},{"id":"060d0697af","no":8,"q":"微囊 (microcapsules)","a":"\u003cdiv class=\"q-ln\"\u003e是指固态或液态药物被载体辅料包封成的微小胶囊，其粒径一般在1\\~250μm之间。\u003c/div\u003e","pt":"是指固态或液态药物被载体辅料包封成的微小胶囊，其粒径一般在1\\~250μm之间。","ok":true,"an":[]},{"id":"266e5ef25a","no":9,"q":"微球 (microspheres)","a":"\u003cdiv class=\"q-ln\"\u003e是指药物溶解或分散在载体辅料中形成的微小球状实体，其粒径一般在1\\~250μm之间。\u003c/div\u003e","pt":"是指药物溶解或分散在载体辅料中形成的微小球状实体，其粒径一般在1\\~250μm之间。","ok":true,"an":[]},{"id":"b5a7558ba2","no":10,"q":"与普通制剂相比，缓、控释制剂有何特点？","a":"\u003cdiv class=\"q-ln\"\u003e优点：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 使用方便: 减少服药次数，大大提高了病人的顺应性。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 释药缓慢: 使血药浓度平稳，避免峰谷现象，有利于降低药物的毒副作用，减少耐药性的发生。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 毒副作用小: 由于减少了血药浓度的峰谷现象，故可减少某些药物的毒副作用，减少耐药性的发生。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 疗效好: 可发挥药物的最佳治疗效果。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e④ 可定时、定位释药: 某些缓、控释制剂可以按要求定时、定位释放，更加适合疾病的治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e缺点：\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e① 临床应用中对剂量调节的灵活性降低，如出现副作用，往往不能立刻停止治疗。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 基于健康人群的平均动力学参数设计，在疾病状态的体内动力学特征有所改变时，不能灵活调节给药方案。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 制备设备和工艺费用昂贵。\u003c/div\u003e","pt":"优点： ① 使用方便: 减少服药次数，大大提高了病人的顺应性。 ② 释药缓慢: 使血药浓度平稳，避免峰谷现象，有利于降低药物的毒副作用，减少耐药性的发生。 ③ 毒副作用小: 由于减少了血药浓度的峰谷现象，故可减少某些药物的毒副作用，减少耐药性的发生。 ③ 疗效好: 可发挥药物的最佳治疗效果。 ④ 可定时、定位释药: 某些缓、控释制剂可以按要求定时、定位释放，更加适合疾病的治疗。 缺点： ① 临床应用中对剂量调节的灵活性降低，如出现副作用，往往不能立刻停止治疗。 ② 基于健康人群的平均动力学参数设计，在疾病状态的体内动力学特征有所改变时，不能灵活调节给药方案。 ③ 制备设备和工艺费用昂贵。","ok":true,"an":["毒副作用小","避免峰谷现象","释药缓慢","疗效好","峰谷现象","定位释药"]},{"id":"4ddc75c15d","no":11,"q":"简述普通、缓释、控释制剂的血药浓度经时曲线的特点。","a":"\u003cdiv class=\"q-ln\"\u003e普通制剂服用后，其血药浓度为单一的、短暂的峰形曲线，血药浓度维持在有效浓度范围的时间很短。缓释、控释制剂服用后，血药浓度维持在有效浓度范围内的时间较长，即可在较长时间内维持药效（见教材中图17-1）。\u003c/div\u003e","pt":"普通制剂服用后，其血药浓度为单一的、短暂的峰形曲线，血药浓度维持在有效浓度范围的时间很短。缓释、控释制剂服用后，血药浓度维持在有效浓度范围内的时间较长，即可在较长时间内维持药效（见教材中图17-1）。","ok":true,"an":["范围"]},{"id":"57f7fbe788","no":12,"q":"口服缓、控释制剂主要有哪些制备技术？","a":"\u003cdiv class=\"q-ln\"\u003e① 骨架型缓释制剂，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e指\u003c/span\u003e药物和一种或多种骨架材料\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e通过\u003c/span\u003e压制、融合等技术手段\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e制成\u003c/span\u003e的片状、粒状或其他形式的制剂。它们在水或生理体液中\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e能够维持或转变成\u003c/span\u003e整体式骨架结构，药物以分子或微细结晶状态均匀分散在骨架中，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e起着\u003c/span\u003e贮库和控制药物释放的作用。\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e包括\u003c/span\u003e亲水凝胶骨架片、蜡质类骨架片、不溶性骨架片、骨架型小丸。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e② 膜控型缓控释制剂，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e指\u003c/span\u003e将一种或多种包衣材料对颗粒、片剂、小丸等\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e进行\u003c/span\u003e包衣处理，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e以控制\u003c/span\u003e药物的溶出和扩散而\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e制成\u003c/span\u003e的缓控释制剂。控释膜\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e通常为\u003c/span\u003e一种半透膜或微孔膜，控释原理\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e属于\u003c/span\u003e控制扩散，释放动力\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e是基于\u003c/span\u003e膜内外的渗透压，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e或者\u003c/span\u003e药物分子在聚合物中溶出和扩散行为。\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e大致有\u003c/span\u003e微孔膜包衣片、膜控释小片、膜控释小丸。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e③ 渗透泵型控释制剂，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e是利用\u003c/span\u003e渗透压原理\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e制成\u003c/span\u003e，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e主要由\u003c/span\u003e药物、半透膜材料、渗透压活性物质和推动剂\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e组成\u003c/span\u003e。渗透泵片\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e是在\u003c/span\u003e片芯外包一层半透性的聚合物衣膜，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e用\u003c/span\u003e激光在片剂衣膜层上开一个或一个以上适宜大小的释药小孔制成。口服后胃肠道的水分\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e通过\u003c/span\u003e半透膜进入片芯，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003c/span\u003e药物溶解成饱和溶液，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e因\u003c/span\u003e渗透压活性物质\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003c/span\u003e膜内溶液成为高渗溶液，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e从而\u003c/span\u003e使水分继续进入膜内，药物溶液从小孔泵出。口服渗透泵片剂\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e是目前\u003c/span\u003e应用最多的渗透泵制剂，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e根据\u003c/span\u003e结构特点分为单室渗透泵片、多室渗透泵片，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e还有\u003c/span\u003e一种拟渗透泵的液体渗透泵系统。\u003c/div\u003e","pt":"① 骨架型缓释制剂， 指 药物和一种或多种骨架材料 通过 压制、融合等技术手段 制成 的片状、粒状或其他形式的制剂。它们在水或生理体液中 能够维持或转变成 整体式骨架结构，药物以分子或微细结晶状态均匀分散在骨架中， 起着 贮库和控制药物释放的作用。 包括 亲水凝胶骨架片、蜡质类骨架片、不溶性骨架片、骨架型小丸。 ② 膜控型缓控释制剂， 指 将一种或多种包衣材料对颗粒、片剂、小丸等 进行 包衣处理， 以控制 药物的溶出和扩散而 制成 的缓控释制剂。控释膜 通常为 一种半透膜或微孔膜，控释原理 属于 控制扩散，释放动力 是基于 膜内外的渗透压， 或者 药物分子在聚合物中溶出和扩散行为。 大致有 微孔膜包衣片、膜控释小片、膜控释小丸。 ③ 渗透泵型控释制剂， 是利用 渗透压原理 制成 ， 主要由 药物、半透膜材料、渗透压活性物质和推动剂 组成 。渗透泵片 是在 片芯外包一层半透性的聚合物衣膜， 用 激光在片剂衣膜层上开一个或一个以上适宜大小的释药小孔制成。口服后胃肠道的水分 通过 半透膜进入片芯， 使 药物溶解成饱和溶液， 因 渗透压活性物质 使 膜内溶液成为高渗溶液， 从而 使水分继续进入膜内，药物溶液从小孔泵出。口服渗透泵片剂 是目前 应用最多的渗透泵制剂， 根据 结构特点分为单室渗透泵片、多室渗透泵片， 还有 一种拟渗透泵的液体渗透泵系统。","ok":true,"an":["胃肠道","缓控释制剂","缓释制剂","组成","结构特点","渗透压"]},{"id":"e2715d8ece","no":13,"q":"为何要对缓、控释制剂的体外释放和体内吸收进行相关性评价？哪种水平的相关性才能用体外实验代替体内实验，以控制制剂的质量？","a":"\u003cdiv class=\"q-ln\"\u003e① 体内外相关性是由制剂产生的生物学性质或由生物学性质衍生的参数（如t\u003csub\u003emax\u003c/sub\u003e、C\u003csub\u003emax\u003c/sub\u003e或AUC)，与同一制剂的物理化学性质（如体外释放行为）之间建立的合理的定量关系。缓控释制剂要求进行体内外相关性试验，它应反映整个体外释放曲线与血药浓度-时间曲线之间的关系。只有当体内外具有相关性，才能通过体外释放曲线预测体内情况。\u003c/div\u003e\u003cdiv class=\"q-ln\"\u003e②《中国药典》2025年版缓释、控释和迟释制剂指导原则规定，缓释、控释和迟释制剂体内外相关性，系指体内吸收相的吸收曲线与体外释放曲线之间对应的各个时间点回归，得到直线回归方程的相关系数符合要求，即可认为具有相关性。\u003c/div\u003e","pt":"① 体内外相关性是由制剂产生的生物学性质或由生物学性质衍生的参数（如t max 、C max 或AUC)，与同一制剂的物理化学性质（如体外释放行为）之间建立的合理的定量关系。缓控释制剂要求进行体内外相关性试验，它应反映整个体外释放曲线与血药浓度-时间曲线之间的关系。只有当体内外具有相关性，才能通过体外释放曲线预测体内情况。 ②《中国药典》2025年版缓释、控释和迟释制剂指导原则规定，缓释、控释和迟释制剂体内外相关性，系指体内吸收相的吸收曲线与体外释放曲线之间对应的各个时间点回归，得到直线回归方程的相关系数符合要求，即可认为具有相关性。","ok":true,"an":["缓控释制剂","迟释制剂","符合要求","吸收曲线","生物学","中国药典"]},{"id":"d2adf4c28c","no":14,"q":"如何根据结肠的生理特点设计结肠定位给药系统？","a":"\u003cdiv class=\"q-ln\"\u003e口服结肠定位给药系统\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e是指\u003c/span\u003e用适当方法，\u003cspan style=\"font-weight:700;color:#4f7ddf\"\u003e使\u003
