<script>
/* 药学考研 · 沉浸式刷题 */
(function () {
  'use strict';

  var DATA = window.QUIZ_DATA;
  var KEY = 'pharm-quiz-v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ------------------------------------------------------------------ */
  /* 存储                                                                */
  /* ------------------------------------------------------------------ */
  var DEF = {
    prog: {},   // id -> {s:0未掌握/1模糊/2掌握, n:次数, t:时间, d:到期}
    set: { count: 20, order: 'rand', mask: 'anchor', answered: true, weak: false },
    sel: {},    // 学科 -> [章节]
    theme: 'dark'
  };
  // 老版本字段兼容
  var LEGACY_MASK = { kw: 'anchor', kwnum: 'anchornum', block: 'blur' };
  var MASK_NAME = { anchor: '记忆锚点', anchornum: '锚点＋数字', blur: '整段模糊', off: '不遮盖' };

  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  S = Object.assign({}, DEF, S);
  S.set = Object.assign({}, DEF.set, S.set);
  if (LEGACY_MASK[S.set.mask]) S.set.mask = LEGACY_MASK[S.set.mask];
  if (!MASK_NAME[S.set.mask]) S.set.mask = DEF.set.mask;
  if (!S.sel) S.sel = {};
  if (!S.prog) S.prog = {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // 预处理：为每题挂上所属学科 / 章节
  DATA.subjects.forEach(function (s) {
    s.chapters.forEach(function (c) {
      c.questions.forEach(function (q) { q._s = s.subject; q._c = c.label; });
    });
  });

  var curSubj = 0;
  var SE = null;      // 当前练习
  var IDLE = null;

  /* ------------------------------------------------------------------ */
  /* 工具                                                                */
  /* ------------------------------------------------------------------ */
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function selOf(name) {
    if (!S.sel[name]) {
      var subj = DATA.subjects.filter(function (x) { return x.subject === name; })[0];
      S.sel[name] = subj ? subj.chapters.map(function (c) { return c.label; }) : [];
    }
    return new Set(S.sel[name]);
  }
  function setSel(name, set) { S.sel[name] = Array.from(set); save(); }
  function prog(id) { return S.prog[id]; }
  function isWeak(q) { var p = prog(q.id); return !!p && p.s < 2; }

  /** 记忆评分：1 忘记 / 2 模糊 / 3 掌握 */
  function memorize(id, r) {
    var p = S.prog[id] || (S.prog[id] = { s: 0, n: 0, t: 0, d: 0 });
    p.n++; p.t = Date.now();
    if (r === 3) { p.s = Math.min(2, p.s + 1); p.d = Date.now() + (p.s >= 2 ? 4 : 1) * 864e5; }
    else if (r === 2) { p.s = 1; p.d = Date.now() + 12 * 36e5; }
    else { p.s = 0; p.d = Date.now(); }
    save();
  }

  /* ------------------------------------------------------------------ */
  /* 记忆锚点遮盖                                                        */
  /* ------------------------------------------------------------------ */
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hasCJK(s) { return /[\u4e00-\u9fa5]/.test(s); }

  /**
   * 只遮「记忆锚点」，且每个锚点只遮第一处出现：
   *  - 答案仍然读得通，不像随机打洞；
   *  - 同一个词反复被遮会让整段答案变成马赛克。
   * 点击被遮的部分可单独揭晓。
   */
  function maskAnchors(root, terms, withNum) {
    var parts = terms.slice()
      .sort(function (a, b) { return b.length - a.length; })
      .map(escRe);
    if (withNum) parts.push('\\d+(?:[.．]\\d+)?\\s*[%％]?');
    if (!parts.length) return 0;

    var re = new RegExp(parts.join('|'), 'g');
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = n.parentElement;
        if (!p || p.closest('.q-tbl') || p.classList.contains('mask')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    var budget = Math.max(8, Math.round(root.textContent.length * 0.3));
    var used = 0;
    var done = Object.create(null);   // 已遮过的锚点文本（每个只遮一次）

    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i], txt = node.nodeValue, m, frag, last = 0, hit = false;
      re.lastIndex = 0;
      frag = document.createDocumentFragment();
      while ((m = re.exec(txt)) !== null) {
        var hitTxt = m[0];
        var prev = txt.charAt(m.index - 1);
        var next = txt.charAt(m.index + m[0].length);

        if (!hasCJK(hitTxt)) {
          // 拉丁字母 / 数字：不要从更长的 token 中间切开（如 5-HT、pH4）
          if (/[A-Za-z0-9]/.test(prev) && /[A-Za-z0-9]/.test(hitTxt.charAt(0))) continue;
          if (/[A-Za-z0-9]/.test(next) && /[A-Za-z0-9]/.test(hitTxt.charAt(hitTxt.length - 1))) continue;
        }
        if (withNum && /^\d/.test(hitTxt)) {
          if (/[.．、,，]/.test(next)) continue;                                 // 1. 2、 这类序号
          if (prev === '第' || prev === 'P' || prev === 'p') continue;           // 第一章、P123
          if ((prev === '（' && next === '）') || (prev === '(' && next === ')')) continue;
        }
        if (done[hitTxt]) continue;
        if (used + hitTxt.length > budget) continue;

        if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var sp = document.createElement('span');
        sp.className = 'mask';
        sp.textContent = hitTxt;
        sp.title = '点击揭晓';
        frag.appendChild(sp);
        last = m.index + hitTxt.length;
        hit = true;
        done[hitTxt] = 1;
        used += hitTxt.length;
      }
      if (hit) {
        if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
        node.parentNode.replaceChild(frag, node);
      }
    }
    return Object.keys(done).length;
  }

  /** 渲染答案并按当前设置遮盖 */
  function renderAnswer(box, q, wrap) {
    var mode = SE ? (SE.maskOn ? S.set.mask : 'off') : S.set.mask;
    box.innerHTML = q.a || '';
    box.classList.remove('reveal-all');
    wrap.classList.remove('blur');
    if (mode === 'off' || !q.ok) return { n: 0, total: 0 };
    if (mode === 'blur') { wrap.classList.add('blur'); return { n: 0, total: 0 }; }
    var total = (q.an || []).length;
    return { n: maskAnchors(box, q.an || [], mode === 'anchornum'), total: total };
  }

  function maskTipText(r, q) {
    if (S.set.mask === 'off') return '已关闭遮盖';
    if (!q.ok) return '';
    if (S.set.mask === 'blur') return '整段模糊，点击答案揭晓';
    if (!(q.an || []).length) return '本题没有可遮盖的记忆锚点';
    if (!r.n) return '锚点已在题干中给出，本题不遮盖';
    return '遮住 ' + r.n + ' 个记忆锚点 · 点击词语可单独揭晓';
  }

  /* ------------------------------------------------------------------ */
  /* 屏幕切换                                                            */
  /* ------------------------------------------------------------------ */
  function showScreen(name) {
    $$('.screen').forEach(function (el) { el.classList.toggle('is-on', el.id === 'screen-' + name); });
    $$('.tab').forEach(function (b) { b.classList.toggle('is-on', b.dataset.screen === name); });
    document.body.style.overflow = name === 'quiz' ? 'hidden' : '';
    if (name !== 'quiz') { clearTimeout(IDLE); showChrome(true); }
    if (name === 'browse') renderBrowse();
    if (name === 'stats') renderStats();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ------------------------------------------------------------------ */
  /* 设置页                                                              */
  /* ------------------------------------------------------------------ */
  function renderSubjects() {
    var box = $('#subjGrid');
    box.innerHTML = '';
    DATA.subjects.forEach(function (s, i) {
      var all = 0, ok = 0, learned = 0;
      s.chapters.forEach(function (c) {
        c.questions.forEach(function (q) {
          all++; if (q.ok) ok++;
          if (S.prog[q.id]) learned++;
        });
      });
      var el = document.createElement('button');
      el.className = 'subj' + (i === curSubj ? ' is-on' : '');
      el.innerHTML =
        '<div class="nm">' + s.subject + '</div>' +
        '<div class="sub">' + s.chapters.length + ' 章 · ' + all + ' 题 · 有答案 ' + ok + '</div>' +
        '<div class="bar"><i style="width:' + (ok ? Math.round(learned / ok * 100) : 0) + '%"></i></div>';
      el.onclick = function () { curSubj = i; renderSetup(); };
      box.appendChild(el);
    });
  }

  function renderChapters() {
    var s = DATA.subjects[curSubj];
    var sel = selOf(s.subject);
    $('#chapTitle').textContent = s.subject + ' · 章节';
    var box = $('#chapGrid');
    box.innerHTML = '';
    s.chapters.forEach(function (c) {
      var weak = c.questions.filter(isWeak).length;
      var el = document.createElement('div');
      el.className = 'chap' + (sel.has(c.label) ? ' is-on' : '');
      el.innerHTML = '<i class="cbox">✓</i><span>' + c.label + '</span>' +
        '<span class="cnt">' + (weak ? '<b>' + weak + '</b><i class="w">待巩固</i>' : '') +
        c.done + '/' + c.count + '</span>';
      el.onclick = function () {
        if (sel.has(c.label)) sel.delete(c.label); else sel.add(c.label);
        setSel(s.subject, sel);
        el.classList.toggle('is-on', sel.has(c.label));
        refreshStart();
      };
      box.appendChild(el);
    });
    $('#chapCount').textContent = '已选 ' + sel.size + ' / ' + s.chapters.length + ' 章';
  }

  function buildPool() {
    var s = DATA.subjects[curSubj];
    var sel = selOf(s.subject);
    var out = [];
    s.chapters.forEach(function (c) {
      if (!sel.has(c.label)) return;
      c.questions.forEach(function (q) {
        if (S.set.answered && !q.ok) return;
        if (S.set.weak && !isWeak(q)) return;
        out.push(q);
      });
    });
    return out;
  }

  function refreshStart() {
    var pool = buildPool();
    var n = S.set.count > 0 ? Math.min(S.set.count, pool.length) : pool.length;
    $('#startInfo').innerHTML = '共 <b>' + pool.length + '</b> 道可选题目，本组将练习 <b>' + n + '</b> 题。' +
      (S.set.mask === 'off' ? '（答案直接显示）' : '（答案按「' + MASK_NAME[S.set.mask] + '」遮盖）');
    $('#startBtn').disabled = pool.length === 0;
    $('#startBtn').textContent = pool.length ? '开始刷题 · ' + n + ' 题' : '没有可练的题目';
  }

  function renderSetup() {
    renderSubjects();
    renderChapters();
    $$('.segbar').forEach(function (bar) {
      var v = S.set[bar.dataset.opt];
      $$('button', bar).forEach(function (b) { b.classList.toggle('is-on', b.dataset.v === String(v)); });
    });
    $('#optAnswered').checked = S.set.answered;
    $('#optWeak').checked = S.set.weak;
    refreshStart();
  }

  /* ------------------------------------------------------------------ */
  /* 刷题                                                                */
  /* ------------------------------------------------------------------ */
  function startSession() {
    var pool = buildPool();
    if (!pool.length) { toast('没有符合条件的题目'); return; }
    if (S.set.order === 'rand') shuffle(pool);
    var target = S.set.count > 0 ? Math.min(S.set.count, pool.length) : pool.length;
    SE = {
      pool: pool, ni: 0, target: target, picked: 0,
      queue: [], history: [], cur: null, revealed: false, maskOn: true,
      res: { 1: 0, 2: 0, 3: 0 }, seen: new Set(), t0: Date.now(), requeue: {}
    };
    showScreen('quiz');
    nextQuestion();
  }

  function pullNew() {
    while (SE.ni < SE.pool.length && SE.picked < SE.target) {
      SE.queue.push(SE.pool[SE.ni++]);
      SE.picked++;
    }
  }

  function nextQuestion() {
    if (!SE.queue.length) pullNew();
    if (!SE.queue.length) return finish();
    var q = SE.queue.shift();
    if (SE.cur) SE.history.push(SE.cur);
    SE.cur = q;
    SE.revealed = false;
    renderQuestion();
  }

  function prevQuestion() {
    if (!SE.history.length) { toast('已经是第一题'); return; }
    var q = SE.history.pop();
    SE.queue.unshift(SE.cur);
    SE.cur = q;
    SE.revealed = false;
    renderQuestion();
  }

  function renderQuestion() {
    var q = SE.cur;
    var p = prog(q.id);
    var tag = ['新题', '未掌握', '模糊', '已掌握'][p ? p.s + 1 : 0];
    $('#qTag').innerHTML = q._s + ' · ' + q._c + ' · 第 ' + q.no + ' 题' +
      '<span class="tag">' + tag + '</span>';
    $('#qText').innerHTML = q.q;

    var wrap = $('#ansBox'), box = $('#ansInner');
    wrap.classList.remove('show');
    $('#revealHint').hidden = false;
    $('#ansTools').hidden = true;
    $('#rateRow').hidden = true;
    $('#revealAllBtn').textContent = '全部揭晓';
    $('#ansEmpty').hidden = q.ok;
    box.hidden = !q.ok;
    if (q.ok) {
      var r = renderAnswer(box, q, wrap);
      $('#maskTip').textContent = maskTipText(r, q);
    } else {
      $('#maskTip').textContent = '';
    }

    var total = SE.target;
    var done = Math.min(SE.seen.size, total);
    $('#qzCount').textContent = done + ' / ' + total;
    $('#qzBar').style.width = (total ? done / total * 100 : 0) + '%';
    $('#qzPath').textContent = q._s + ' · ' + q._c;
    updateMaskBtn();
    $('.qz-body').scrollTop = 0;
  }

  function reveal() {
    if (!SE || SE.revealed) return;
    SE.revealed = true;
    $('#ansBox').classList.add('show');
    $('#revealHint').hidden = true;
    if (SE.cur.ok) {
      $('#ansTools').hidden = false;
      $('#rateRow').hidden = false;
    }
  }

  function requeue(q, at) {
    var n = SE.requeue[q.id] || 0;
    if (n >= 3) return;
    SE.requeue[q.id] = n + 1;
    SE.queue.splice(Math.min(at, SE.queue.length), 0, q);
  }

  function rate(r) {
    if (!SE || !SE.cur) return;
    var q = SE.cur;
    memorize(q.id, r);
    SE.res[r]++;
    SE.seen.add(q.id);
    if (r === 1) requeue(q, 3);
    else if (r === 2) requeue(q, 6);
    nextQuestion();
  }

  function skip() {
    if (!SE || !SE.cur) return;
    if (SE.cur.ok) SE.seen.add(SE.cur.id);
    nextQuestion();
  }

  /** 左滑 = 下一题（未揭晓时等同跳过） */
  function swipeNext() {
    if (!SE) return;
    if (!SE.revealed) skip(); else nextQuestion();
  }

  function finish() {
    var min = Math.max(1, Math.round((Date.now() - SE.t0) / 60000));
    $('#doneTitle').textContent = '本组完成 · ' + SE.seen.size + ' 题 / ' + min + ' 分钟';
    $('#doneGrid').innerHTML =
      cell(SE.res[3], '掌握', 'var(--accent2)') +
      cell(SE.res[2], '模糊', 'var(--warn)') +
      cell(SE.res[1], '忘记', 'var(--bad)');
    SE = null;
    showScreen('done');
  }
  function cell(n, label, color) {
    return '<div class="done-cell"><b style="color:' + color + '">' + n + '</b><span>' + label + '</span></div>';
  }

  function updateMaskBtn() {
    var on = !SE || SE.maskOn;
    $('#maskBtn').textContent = '遮盖：' + (on ? MASK_NAME[S.set.mask] : '关');
  }

  function toggleMask() {
    if (!SE) return;
    SE.maskOn = !SE.maskOn;
    var r = { n: 0 };
    if (SE.cur && SE.cur.ok) r = renderAnswer($('#ansInner'), SE.cur, $('#ansBox'));
    if (SE.cur) $('#maskTip').textContent = maskTipText(r, SE.cur);
    updateMaskBtn();
    toast(SE.maskOn ? '已开启遮盖' : '已关闭遮盖');
  }

  function revealAll() {
    var box = $('#ansInner'), wrap = $('#ansBox');
    if (wrap.classList.contains('blur')) {
      wrap.classList.remove('blur');
      $('#revealAllBtn').textContent = '全部揭晓';
      return;
    }
    var on = box.classList.toggle('reveal-all');
    $('#revealAllBtn').textContent = on ? '恢复遮盖' : '全部揭晓';
  }

  /* ------------------------------------------------------------------ */
  /* 浏览                                                                */
  /* ------------------------------------------------------------------ */
  var browseOpen = new Set();
  function renderBrowse() {
    var box = $('#browseList');
    var kw = ($('#searchInput').value || '').trim().toLowerCase();
    var list = [];
    DATA.subjects.forEach(function (s) {
      var sel = selOf(s.subject);
      s.chapters.forEach(function (c) {
        if (!sel.has(c.label)) return;
        c.questions.forEach(function (q) { list.push(q); });
      });
    });
    if (kw) {
      list = list.filter(function (q) {
        return q.q.toLowerCase().indexOf(kw) >= 0 || q.pt.toLowerCase().indexOf(kw) >= 0;
      });
    }
    $('#browseInfo').textContent = '共 ' + list.length + ' 题' + (kw ? '（搜索：' + kw + '）' : '') +
      ' · 点击题干展开答案，被遮住的锚点可单独点击查看';
    box.innerHTML = '';
    list.slice(0, 300).forEach(function (q) {
      var p = prog(q.id);
      var badge = !q.ok ? '<span class="item-badge no">暂无答案</span>'
        : (p && p.s < 2) ? '<span class="item-badge weak">待巩固</span>'
          : (p ? '<span class="item-badge ok">已掌握</span>' : '');
      var el = document.createElement('div');
      el.className = 'item' + (browseOpen.has(q.id) ? ' open' : '');
      el.innerHTML =
        '<div class="item-hd"><span class="item-no">' + q.no + '</span>' +
        '<span class="item-q">' + q.q + '</span>' + badge + '</div>' +
        '<div class="item-a"><div class="ans-inner"></div></div>';
      var inner = $('.ans-inner', el);
      $('.item-hd', el).onclick = function () {
        el.classList.toggle('open');
        if (el.classList.contains('open')) {
          browseOpen.add(q.id);
          if (!inner.dataset.done) {
            inner.innerHTML = q.a || '<span class="muted">暂无答案</span>';
            if (q.ok && S.set.mask !== 'off' && S.set.mask !== 'blur') {
              maskAnchors(inner, q.an || [], S.set.mask === 'anchornum');
            }
            inner.dataset.done = '1';
          }
        } else browseOpen.delete(q.id);
      };
      inner.addEventListener('click', function (e) {
        if (e.target.classList.contains('mask')) e.target.classList.toggle('on');
      });
      box.appendChild(el);
    });
    if (list.length > 300) {
      var more = document.createElement('div');
      more.className = 'muted tiny';
      more.style.padding = '8px 4px';
      more.textContent = '仅显示前 300 条，请用搜索缩小范围。';
      box.appendChild(more);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 统计                                                                */
  /* ------------------------------------------------------------------ */
  function renderStats() {
    var box = $('#statsBox');
    var html = '<div class="legend">' +
      '<span><i style="background:var(--accent2)"></i>已掌握</span>' +
      '<span><i style="background:var(--warn)"></i>模糊</span>' +
      '<span><i style="background:var(--bad)"></i>忘记</span>' +
      '<span><i style="background:var(--line)"></i>未练</span></div>';
    var grand = { ok: 0, a: 0, b: 0, c: 0 };
    DATA.subjects.forEach(function (s) {
      var ok = 0, mastered = 0, fuzzy = 0, forgot = 0, none = 0;
      s.chapters.forEach(function (c) {
        c.questions.forEach(function (q) {
          if (!q.ok) return;
          ok++;
          var p = prog(q.id);
          if (!p) none++;
          else if (p.s >= 2) mastered++;
          else if (p.s === 1) fuzzy++;
          else forgot++;
        });
      });
      grand.ok += ok; grand.a += mastered; grand.b += fuzzy; grand.c += forgot;
      var pct = ok ? Math.round((mastered + fuzzy + forgot) / ok * 100) : 0;
      html += '<div class="stat-row"><span class="nm">' + s.subject + '</span>' +
        '<span class="stat-bar">' +
        '<i class="i-ok" style="width:' + (ok ? mastered / ok * 100 : 0) + '%"></i>' +
        '<i class="i-warn" style="width:' + (ok ? fuzzy / ok * 100 : 0) + '%"></i>' +
        '<i class="i-bad" style="width:' + (ok ? forgot / ok * 100 : 0) + '%"></i>' +
        '</span>' +
        '<span class="num">掌握 ' + mastered + ' · 模糊 ' + fuzzy + ' · 忘记 ' + forgot +
        ' · 未练 ' + none + '（已练 ' + pct + '%）</span></div>';
    });
    var ids = Object.keys(S.prog);
    var times = ids.reduce(function (n, k) { return n + (S.prog[k].n || 0); }, 0);
    html += '<div class="muted tiny">合计有答案 ' + grand.ok + ' 题 · 已掌握 ' + grand.a +
      ' · 模糊 ' + grand.b + ' · 忘记 ' + grand.c +
      '；累计答题 ' + times + ' 次，涉及 ' + ids.length + ' 道题。<br>进度保存在本机浏览器，换设备不会同步。</div>';
    box.innerHTML = html;
  }

  /* ------------------------------------------------------------------ */
  /* 沉浸：空闲时隐藏界面元素                                             */
  /* ------------------------------------------------------------------ */
  function showChrome(on) {
    $('#topbar').classList.toggle('hide', !on);
    $('.qz-top').classList.toggle('hide', !on);
    $('#qzFoot').classList.toggle('hide', !on);
  }
  function kickIdle() {
    if (!SE) return;
    showChrome(true);
    clearTimeout(IDLE);
    IDLE = setTimeout(function () { if (SE) showChrome(false); }, 6000);
  }

  /* ------------------------------------------------------------------ */
  /* 事件                                                                */
  /* ------------------------------------------------------------------ */
  function bind() {
    $$('.tab').forEach(function (b) {
      b.onclick = function () {
        if (SE && b.dataset.screen !== 'quiz') { SE = null; }
        showScreen(b.dataset.screen);
      };
    });

    $$('.segbar').forEach(function (bar) {
      var opt = bar.dataset.opt;
      $$('button', bar).forEach(function (b) {
        b.onclick = function () {
          S.set[opt] = opt === 'count' ? Number(b.dataset.v) : b.dataset.v;
          save();
          renderSetup();
        };
      });
    });

    $('#optAnswered').onchange = function () { S.set.answered = this.checked; save(); refreshStart(); };
    $('#optWeak').onchange = function () { S.set.weak = this.checked; save(); refreshStart(); };

    $$('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var s = DATA.subjects[curSubj], sel = selOf(s.subject);
        var act = b.dataset.act;
        if (act === 'skip') { skip(); return; }
        if (act === 'sel-all') s.chapters.forEach(function (c) { sel.add(c.label); });
        if (act === 'sel-none') sel.clear();
        if (act === 'sel-weak') {
          sel.clear();
          s.chapters.forEach(function (c) {
            if (c.questions.some(isWeak)) sel.add(c.label);
          });
        }
        setSel(s.subject, sel);
        renderChapters();
        refreshStart();
      };
    });

    $('#startBtn').onclick = startSession;
    $('#againBtn').onclick = function () { showScreen('setup'); renderSetup(); startSession(); };
    $('#backBtn').onclick = function () { showScreen('setup'); renderSetup(); };

    $('#quitBtn').onclick = function () {
      if (SE && SE.seen.size && !confirm('结束本组练习？已答 ' + SE.seen.size + ' 题。')) return;
      SE = null;
      showScreen('setup');
      renderSetup();
    };

    $('#showBtn').onclick = reveal;
    $('#maskBtn').onclick = toggleMask;
    $('#revealAllBtn').onclick = revealAll;
    $('#ansBox').addEventListener('click', function (e) {
      if (e.target.classList.contains('mask')) e.target.classList.toggle('on');
      else if (this.classList.contains('blur')) revealAll();
    });
    $$('.rate-btn').forEach(function (b) {
      b.onclick = function () { rate(Number(b.dataset.rate)); };
    });

    $('#fsBtn').onclick = function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        else toast('当前浏览器不支持全屏');
      } catch (e) { toast('当前浏览器不支持全屏'); }
    };

    $('#searchInput').oninput = renderBrowse;
    $('#browseReveal').onclick = function () {
      $$('#browseList .item').forEach(function (it) {
        if (!it.classList.contains('open')) $('.item-hd', it).click();
      });
    };

    $('#resetBtn').onclick = function () {
      if (!confirm('确定清空全部学习进度？该操作不可撤销。')) return;
      S.prog = {};
      save();
      renderStats();
      toast('进度已清空');
    };

    $('#themeBtn').onclick = function () {
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      save();
      applyTheme();
    };

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (!$('#screen-quiz').classList.contains('is-on') || !SE) return;
      var k = e.key;
      if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!SE.revealed) reveal(); else rate(3); }
      else if (k === '1') rate(1);
      else if (k === '2') rate(2);
      else if (k === '3') rate(3);
      else if (k === 'ArrowLeft') prevQuestion();
      else if (k === 'ArrowRight') { if (SE.revealed) rate(3); else skip(); }
      else if (k === 'h' || k === 'H') toggleMask();
      else if (k === 's' || k === 'S') skip();
      else if (k === 'f' || k === 'F') $('#fsBtn').click();
      else if (k === 'Escape') $('#quitBtn').click();
      kickIdle();
    });

    document.addEventListener('mousemove', kickIdle);
    document.addEventListener('touchstart', function () { if (SE) kickIdle(); }, { passive: true });

    /* 移动端左右滑动翻题 */
    var touch = null;
    $('#qz').addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { touch = null; return; }
      touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    }, { passive: true });
    $('#qz').addEventListener('touchend', function (e) {
      if (!touch || !SE) { touch = null; return; }
      var t = e.changedTouches[0];
      var dx = t.clientX - touch.x, dy = t.clientY - touch.y, dt = Date.now() - touch.t;
      touch = null;
      if (dt > 800 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      if (e.target.classList.contains('mask')) return;      // 点锚点不算滑动
      if (dx < 0) swipeNext(); else prevQuestion();
    }, { passive: true });
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', S.theme);
    $('#themeBtn').textContent = S.theme === 'dark' ? '日间' : '夜间';
  }

  /* ------------------------------------------------------------------ */
  applyTheme();
  bind();
  renderSetup();
  $('#metaVer').textContent = '题库 ' + DATA.generatedAt;
  $('#buildDate').textContent = DATA.generatedAt + '（锚点词 ' + DATA.anchors + ' 个）';
})();

</script>
</body>
</html>
